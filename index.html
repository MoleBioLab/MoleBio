<style>
:root{--bg:#0a0e17;--surface:#111827;--surface2:#1a2235;--border:#1e2d45;--accent:#3b82f6;--accent2:#06b6d4;--text:#e2e8f0;--text-muted:#64748b;--text-dim:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;overflow:hidden;height:100vh;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(59,130,246,.07) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 80% 80%,rgba(139,92,246,.06) 0%,transparent 60%);pointer-events:none;z-index:0;}
header{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;border-bottom:1px solid var(--border);background:rgba(10,14,23,.9);backdrop-filter:blur(12px);height:52px;}
.logo{display:flex;align-items:baseline;gap:.5rem;}
.logo-word{font-family:"DM Serif Display",serif;font-size:1.4rem;letter-spacing:-.02em;}
.logo-word span{color:var(--accent);}
.logo-tag{font-family:"DM Mono",monospace;font-size:.58rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;padding:.2em .5em;border:1px solid var(--border);border-radius:3px;}
.header-right{display:flex;align-items:center;gap:.75rem;}
.pdb-badge{font-family:"DM Sans",sans-serif;font-size:.6rem;color:var(--accent2);padding:.28em .65em;border:1px solid rgba(255,255,255,.08);border-radius:6px;background:rgba(255,255,255,.03);transition:all .2s;backdrop-filter:blur(4px);}
.rcsb-link{font-family:"DM Sans",sans-serif;font-size:.6rem;color:var(--text-dim);padding:.3em .7em;border:1px solid rgba(255,255,255,.08);border-radius:6px;text-decoration:none;background:rgba(255,255,255,.03);transition:all .2s;backdrop-filter:blur(4px);}
.rcsb-link:hover{color:var(--accent2);border-color:rgba(6,182,212,.35);background:rgba(6,182,212,.06);}
.app{position:relative;z-index:auto;display:grid;grid-template-columns:230px 1fr auto 480px;grid-template-rows:1fr;height:calc(100vh - 76px);}
.panel-tabs,.drag-handle{display:none;}
.sidebar{grid-column:1;grid-row:1;border-right:1px solid var(--border);background:rgba(17,24,39,.7);overflow-y:auto;padding:1rem 0;}
.lesson-panel{grid-column:2;grid-row:1;overflow-y:auto;padding:1.8rem 2rem;background:rgba(10,14,23,.3);}
.v-splitter{grid-column:3;grid-row:1;width:6px;cursor:col-resize;background:var(--border);position:relative;z-index:5;touch-action:none;transition:background .15s;}
.v-splitter::before{content:'';position:absolute;top:0;bottom:0;left:-4px;right:-4px;z-index:6;}
.v-splitter::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:3px;height:32px;background:var(--text-muted);border-radius:2px;opacity:.3;transition:opacity .15s;}
.v-splitter:hover::after,.v-splitter:active::after{opacity:1;background:var(--accent);}
.v-splitter:hover,.v-splitter:active{background:var(--accent);}
.sidebar-label{font-family:"DM Mono",monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);padding:0 1rem;margin:.8rem 0 .35rem;}
.topic-btn{display:flex;align-items:center;gap:.65rem;width:100%;padding:.6rem 1rem;background:none;border:none;cursor:pointer;text-align:left;transition:background .13s;position:relative;}
.topic-btn:hover{background:rgba(255,255,255,.04);}
.topic-btn.active{background:rgba(59,130,246,.1);}
.topic-btn.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);}
.topic-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;}
.topic-name{font-size:.78rem;font-weight:500;color:var(--text);line-height:1.3;}
.topic-btn.active .topic-name{color:#93c5fd;}
.topic-sub{font-size:.64rem;color:var(--text-muted);margin-top:.1rem;}
.subtopics{padding:.15rem 1rem .35rem 3.3rem;display:none;flex-direction:column;gap:.18rem;}
.topic-btn.active+.subtopics{display:flex;}
.subtopic-btn{background:none;border:none;cursor:pointer;text-align:left;padding:.28rem .5rem;border-radius:4px;font-size:.7rem;color:var(--text-muted);transition:all .12s;}
.subtopic-btn:hover{background:rgba(255,255,255,.05);color:var(--text-dim);}
.subtopic-btn.active{background:rgba(59,130,246,.15);color:#93c5fd;}
.lesson-eyebrow{font-family:"DM Mono",monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent2);margin-bottom:.5rem;}
.lesson-title{font-family:"DM Serif Display",serif;font-size:1.7rem;line-height:1.2;letter-spacing:-.02em;margin-bottom:1rem;}
.lesson-intro{font-size:.86rem;line-height:1.7;color:var(--text-dim);margin-bottom:1.5rem;border-left:2px solid var(--accent);padding-left:.9rem;}
.concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:1.5rem;}
.concept-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.8rem .9rem;transition:border-color .2s;}
.concept-card:hover{border-color:rgba(59,130,246,.35);}
.concept-card-label{font-family:"DM Mono",monospace;font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:.25rem;}
.concept-card-title{font-size:.8rem;font-weight:600;color:var(--text);margin-bottom:.25rem;}
.concept-card-desc{font-size:.73rem;line-height:1.5;color:var(--text-muted);}
.section-heading{font-family:"DM Serif Display",serif;font-size:.95rem;color:var(--text);margin:1.4rem 0 .5rem;padding-bottom:.35rem;border-bottom:1px solid var(--border);}
.prose{font-size:.82rem;line-height:1.75;color:var(--text-dim);margin-bottom:.8rem;}
.key-points{list-style:none;display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem;}
.key-points li{display:flex;align-items:flex-start;gap:.5rem;font-size:.79rem;color:var(--text-dim);line-height:1.55;}
.key-points li::before{content:"->";color:var(--accent);flex-shrink:0;font-family:"DM Mono",monospace;}
.highlight-box{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.05));border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:.8rem 1rem;margin-top:1rem;}
.highlight-box-label{font-family:"DM Mono",monospace;font-size:.56rem;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:.3rem;}
.highlight-box p{font-size:.78rem;line-height:1.6;color:var(--text-dim);}
/* RIGHT PANEL */
.viewer-panel{grid-column:4;grid-row:1;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.vp-header{padding:.65rem .9rem .5rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.vp-title{font-family:"DM Serif Display",serif;font-size:.9rem;color:var(--text);margin-bottom:.2rem;}
.vp-desc{font-size:.67rem;color:var(--text-muted);line-height:1.4;}
.vp-controls{display:flex;gap:.35rem;padding:.4rem .8rem;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;align-items:center;}
.vp-btn{font-family:"DM Sans",sans-serif;font-size:.58rem;padding:.28em .6em;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:var(--text-dim);cursor:pointer;transition:all .2s;backdrop-filter:blur(4px);}
.vp-btn:hover{border-color:rgba(59,130,246,.35);color:var(--accent);background:rgba(59,130,246,.06);}
.vp-btn.active{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);color:#93c5fd;}
.color-btn{font-family:"DM Sans",sans-serif;font-size:.48rem;padding:.15em .35em;border-radius:4px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:var(--text-dim);cursor:pointer;transition:all .2s;}
.color-btn:hover{border-color:rgba(59,130,246,.3);color:var(--accent);}
.color-btn.active{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);color:#93c5fd;}
.rep-btn{font-family:"DM Sans",sans-serif;font-size:.58rem;padding:.28em .6em;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:var(--text-dim);cursor:pointer;transition:all .2s;}
.rep-btn:hover{border-color:rgba(59,130,246,.35);color:var(--accent);background:rgba(59,130,246,.06);}
.rep-btn.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.35);color:#93c5fd;}
/* 3D viewer */
#mol-viewport{flex:1;position:relative;min-height:0;cursor:grab;}
#mol-viewport:active{cursor:grabbing;}
#mol-canvas{width:100%;height:100%;display:block;}
.viewer-hint{position:absolute;bottom:.5rem;left:50%;transform:translateX(-50%);font-family:"DM Mono",monospace;font-size:.55rem;color:rgba(100,116,139,.45);pointer-events:none;white-space:nowrap;}
.structure-list{padding:.4rem .8rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.2rem;flex-shrink:0;max-height:110px;overflow-y:auto;}
.structure-item{display:flex;align-items:center;gap:.5rem;padding:.3rem .45rem;border-radius:5px;cursor:pointer;border:1px solid transparent;transition:background .12s;}
.structure-item:hover{background:rgba(255,255,255,.04);}
.structure-item.active{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.2);}
.structure-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.structure-item-name{font-size:.7rem;font-weight:500;color:var(--text);flex:1;}
.structure-item.active .structure-item-name{color:#93c5fd;}
.structure-item-pdb{font-family:"DM Mono",monospace;font-size:.57rem;color:var(--text-muted);}
/* AA Gallery */
.aa-legend{display:flex;gap:8px;flex-wrap:wrap;}
.aa-leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-muted);}
.aa-leg-dot{width:10px;height:10px;border-radius:50%;}
.aa-grid-small{padding:.4rem .8rem;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;overflow-y:auto;}
.aa-chip{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:.2rem .28rem;cursor:pointer;text-align:center;transition:all .12s;}
.aa-chip:hover{border-color:var(--accent2);}
.aa-chip.active{border-color:var(--accent);background:rgba(59,130,246,.12);}
.aa-chip-c1{font-family:"DM Mono",monospace;font-size:13px;font-weight:500;color:var(--text);display:block;}
.aa-chip.active .aa-chip-c1{color:#93c5fd;}
.aa-chip-nm{font-size:9px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.aa-mol-area{flex:1 1 auto;padding:.6rem;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--border);background:rgba(10,14,23,.4);min-height:220px;}
/* Peptide */
.pep-step-title{font-size:.75rem;font-weight:500;color:var(--text);padding:.35rem .9rem .18rem;flex-shrink:0;}
.pep-step-desc{font-size:.67rem;color:var(--text-muted);padding:0 .9rem .35rem;line-height:1.55;flex-shrink:0;}
.pep-svg-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:.6rem;overflow:hidden;min-height:200px;}
.pep-fact-strip{display:flex;gap:5px;padding:.4rem .8rem;border-top:1px solid var(--border);flex-shrink:0;}
.pep-fact{background:var(--surface2);border-radius:4px;padding:.25rem .4rem;flex:1;}
.pep-fact-l{font-size:9px;color:var(--text-muted);}
.pep-fact-v{font-size:10px;font-weight:500;color:var(--text);}
.pep-dots{display:flex;gap:5px;align-items:center;}
.pep-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:background .2s;}
.pep-dot.on{background:var(--accent2);}
/* ===== METABOLIC PATHWAY ===== */
.pathway-step-num{font-family:"DM Mono",monospace;font-size:.6rem;color:var(--accent2);margin-bottom:.15rem;}
.pathway-step-name{font-size:.8rem;font-weight:500;color:var(--text);margin-bottom:.12rem;}
.pathway-enzyme{font-family:"DM Mono",monospace;font-size:.62rem;color:var(--text-muted);}
.energy-pill{display:inline-block;font-family:"DM Mono",monospace;font-size:.58rem;padding:.15em .5em;border-radius:3px;margin-left:.5rem;}
.ep-consume{background:rgba(224,80,80,.15);color:#f87171;}
.ep-produce{background:rgba(16,185,129,.15);color:#34d399;}
.ep-neutral{background:rgba(100,116,139,.15);color:#94a3b8;}
.pathway-mol-area{flex:1;display:flex;align-items:center;justify-content:center;padding:.6rem;min-height:140px;overflow:hidden;}
.pathway-desc{font-size:.67rem;color:var(--text-muted);padding:.35rem .9rem;border-top:1px solid var(--border);line-height:1.55;flex-shrink:0;min-height:52px;}
.pathway-nav{display:flex;align-items:center;gap:6px;padding:.45rem .8rem;border-top:1px solid var(--border);flex-shrink:0;}
.nav-arr{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .13s;}
.nav-arr:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.nav-arr:disabled{opacity:.3;cursor:default;}
.pathway-prog{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.pathway-prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}
/* ===== SECONDARY STRUCTURE BUILDER ===== */
.ss-seq-area{padding:.5rem .8rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.ss-seq-lbl{font-size:.62rem;color:var(--text-muted);margin-bottom:.25rem;font-family:"DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em;}
.ss-residues{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:.3rem;min-height:28px;}
.ss-res{width:22px;height:22px;border-radius:3px;border:1px solid;display:flex;align-items:center;justify-content:center;font-family:"DM Mono",monospace;font-size:11px;font-weight:600;cursor:pointer;transition:all .12s;position:relative;}
.ss-res.sel{outline:2px solid var(--accent2);outline-offset:1px;}
.ss-add-row{display:flex;gap:3px;flex-wrap:wrap;}

.ss-legend-row{display:flex;gap:10px;padding:.35rem .8rem;border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}

#dna-canvas{width:100%;height:100%;display:block;cursor:grab;}
/* LEGAL MODAL */
.legal-modal-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);}
.legal-modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:92%;max-width:560px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.5);}
.legal-modal-header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.legal-modal-title{font-family:"DM Serif Display",serif;font-size:1rem;color:var(--text);}
.legal-modal-close{background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;padding:.2rem .4rem;border-radius:4px;transition:color .15s;}

.legal-modal-body{overflow-y:auto;padding:1rem;font-size:.76rem;line-height:1.7;color:var(--text-dim);}

.legal-modal-body h3:first-child{margin-top:0;}
.legal-modal-body p{margin-bottom:.6rem;}
.legal-modal-body strong{color:var(--text);font-weight:600;}
.legal-modal-body a{color:var(--accent);text-decoration:none;}

.app-footer{position:fixed;bottom:0;left:0;right:0;z-index:15;display:flex;align-items:center;justify-content:center;gap:1rem;padding:.3rem .8rem;background:rgba(10,14,23,.92);border-top:1px solid var(--border);backdrop-filter:blur(8px);font-family:"DM Mono",monospace;font-size:.52rem;}

// ── Haworth pyranose ring ─────────────────────────────────
// cx,cy = ring centre; pCount = number of phosphates (0,1,2)
function haworth(s,cx,cy,col,label,pCount){
  const R=30;
  const pts=Array.from({length:6},(_,i)=>{const a=(i*60-90)*Math.PI/180;return[cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  for(let i=0;i<6;i++){const j=(i+1)%6;bnd(s,pts[i][0],pts[i][1],pts[j][0],pts[j][1],col,i===4?3.5:2);}
  // ring O between C1(pts[0]) and C5(pts[5])
  atm(s,(pts[0][0]+pts[5][0])/2-6,(pts[0][1]+pts[5][1])/2,'O','',10);
  [0,1,2,3,4].forEach(i=>atm(s,pts[i][0],pts[i][1],'C','',10));
  // CH2 arm at C5 (pts[4]) going up
  const ax=pts[4][0]-20,ay=pts[4][1]-30;
  bnd(s,pts[4][0],pts[4][1],ax,ay); atm(s,ax,ay,'C','',10);
  if(pCount>=1){// phosphate on CH2 arm
    bnd(s,ax,ay,ax-22,ay-22); pAtom(s,ax-22,ay-22);
    bnd(s,ax-22,ay-22,ax-22,ay-40); atm(s,ax-22,ay-40,'O');
    dblB(s,ax-22,ay-22,ax-40,ay-14,ax-22,ay-36); atm(s,ax-40,ay-14,'O');
  }
  if(pCount>=2){// second phosphate at C1 (pts[0]) going left-down
    const bx=pts[0][0]-28,by=pts[0][1]+20;
    bnd(s,pts[0][0],pts[0][1],bx,by); pAtom(s,bx,by);
    bnd(s,bx,by,bx-22,by-14); atm(s,bx-22,by-14,'O');
    dblB(s,bx,by,bx-14,by+18,bx+8,by); atm(s,bx-14,by+18,'O');
  }
  lbl(s,cx,cy+R+18,label,col,9);
}

// ── G3P (glyceraldehyde-3-phosphate) ─────────────────────
// vertical 3C chain; C1 aldehyde top, C3-OPO3 bottom
// ox,oy = C1 position
function drawG3P(s,ox,oy){
  const dy=36;
  // backbone
  bnd(s,ox,oy,ox,oy+dy); bnd(s,ox,oy+dy,ox,oy+2*dy);
  // C1 aldehyde — double bond left-up, H right-up
  dblB(s,ox,oy,ox-32,oy-22,ox+10,oy); atm(s,ox-32,oy-22,'O');
  bnd(s,ox,oy,ox+26,oy-18,'#444',2.2); atm(s,ox+26,oy-18,'H');
  // C2 OH — right, H away
  bnd(s,ox,oy+dy,ox+32,oy+dy+10); atm(s,ox+32,oy+dy+10,'O');
  bnd(s,ox+32,oy+dy+10,ox+52,oy+dy+22,'#444',2); atm(s,ox+52,oy+dy+22,'H');
  bnd(s,ox,oy+dy,ox-22,oy+dy+26,'#444',2.2); atm(s,ox-22,oy+dy+26,'H');// H down-left
  // C3 OPO3 — phosphate group going left
  bnd(s,ox,oy+2*dy,ox-28,oy+2*dy+18); atm(s,ox-28,oy+2*dy+18,'O');
  bnd(s,ox-28,oy+2*dy+18,ox-56,oy+2*dy+10); pAtom(s,ox-56,oy+2*dy+10);
  bnd(s,ox-56,oy+2*dy+10,ox-78,oy+2*dy-4); atm(s,ox-78,oy+2*dy-4,'O');
  dblB(s,ox-56,oy+2*dy+10,ox-56,oy+2*dy+32,ox-66,oy+2*dy+20); atm(s,ox-56,oy+2*dy+32,'O');
  bnd(s,ox,oy+2*dy,ox+22,oy+2*dy+26,'#444',2.2); atm(s,ox+22,oy+2*dy+26,'H');// H down-right
  atm(s,ox,oy,'C','',11); atm(s,ox,oy+dy,'C','',11); atm(s,ox,oy+2*dy,'C','',11);
}

// ── 1,3-BPG ──────────────────────────────────────────────

function draw13BPG(s,ox,oy){
  const dy=36;
  bnd(s,ox,oy,ox,oy+dy); bnd(s,ox,oy+dy,ox,oy+2*dy);
  // C1 acyl-phosphate: C=O right-up, O-P left-up
  dblB(s,ox,oy,ox+28,oy-22,ox-8,oy+6); atm(s,ox+28,oy-22,'O');// carbonyl O
  bnd(s,ox,oy,ox-28,oy-22); atm(s,ox-28,oy-22,'O');

  dblB(s,ox-54,oy-14,ox-54,oy+8,ox-64,oy-6); atm(s,ox-54,oy+8,'O');
  // C2 OH
  bnd(s,ox,oy+dy,ox+32,oy+dy+10); atm(s,ox+32,oy+dy+10,'O');
  bnd(s,ox+32,oy+dy+10,ox+52,oy+dy+22,'#444',2); atm(s,ox+52,oy+dy+22,'H');
  bnd(s,ox,oy+dy,ox-22,oy+dy+26,'#444',2.2); atm(s,ox-22,oy+dy+26,'H');
  // C3 OPO3
  bnd(s,ox,oy+2*dy,ox-28,oy+2*dy+18); atm(s,ox-28,oy+2*dy+18,'O');
  bnd(s,ox-28,oy+2*dy+18,ox-56,oy+2*dy+10); pAtom(s,ox-56,oy+2*dy+10);
  bnd(s,ox-56,oy+2*dy+10,ox-78,oy+2*dy-4); atm(s,ox-78,oy+2*dy-4,'O');
  dblB(s,ox-56,oy+2*dy+10,ox-56,oy+2*dy+32,ox-66,oy+2*dy+20); atm(s,ox-56,oy+2*dy+32,'O');
  bnd(s,ox,oy+2*dy,ox+22,oy+2*dy+26,'#444',2.2); atm(s,ox+22,oy+2*dy+26,'H');
  atm(s,ox,oy,'C','',11); atm(s,ox,oy+dy,'C','',11); atm(s,ox,oy+2*dy,'C','',11);
}

// ── 3-Phosphoglycerate ───────────────────────────────────
// horizontal C1-C2-C3; C1 carboxylate left, C3 phosphate right-up, C2 OH down
function draw3PG(s,ox,oy){
  const dx=44;
  const xs=[ox,ox+dx,ox+2*dx];
  bnd(s,xs[0],oy,xs[1],oy); bnd(s,xs[1],oy,xs[2],oy);
  // C1 carboxylate — double O up, single O left-down
  dblB(s,xs[0],oy,xs[0],oy-30,xs[0]+8,oy); atm(s,xs[0],oy-30,'O');
  bnd(s,xs[0],oy,xs[0]-26,oy+16); atm(s,xs[0]-26,oy+16,'O');
  // C2 CHOH — OH right-down, H left-down
  bnd(s,xs[1],oy,xs[1]+26,oy+22); atm(s,xs[1]+26,oy+22,'O');
  bnd(s,xs[1]+26,oy+22,xs[1]+44,oy+34,'#444',2); atm(s,xs[1]+44,oy+34,'H');
  bnd(s,xs[1],oy,xs[1]-16,oy+26,'#444',2.2); atm(s,xs[1]-16,oy+26,'H');
  // C3 CH2-OPO3 — 2 H down, O-P up-right
  bnd(s,xs[2],oy,xs[2]-14,oy+28,'#444',2.2); atm(s,xs[2]-14,oy+28,'H');
  bnd(s,xs[2],oy,xs[2]+14,oy+28,'#444',2.2); atm(s,xs[2]+14,oy+28,'H');
  bnd(s,xs[2],oy,xs[2]+26,oy-22); atm(s,xs[2]+26,oy-22,'O');
  bnd(s,xs[2]+26,oy-22,xs[2]+52,oy-12); pAtom(s,xs[2]+52,oy-12);
  bnd(s,xs[2]+52,oy-12,xs[2]+72,oy-28); atm(s,xs[2]+72,oy-28,'O');
  dblB(s,xs[2]+52,oy-12,xs[2]+68,oy+6,xs[2]+52,oy-26); atm(s,xs[2]+68,oy+6,'O');
  xs.forEach(x=>atm(s,x,oy,'C','',11));
}

// ── PEP (phosphoenolpyruvate) ────────────────────────────
// horizontal: COO- — C=CH2 with O-P on central C
// C1(carboxylate) — C2(enol-O-P, =) — C3(=CH2)
function drawPEP(s,ox,oy){
  const dx=46;
  const x1=ox, x2=ox+dx, x3=ox+2*dx;
  bnd(s,x1,oy,x2,oy);
  dblB(s,x2,oy,x3,oy,x2,oy+12);// C2=C3 double bond
  // C1 carboxylate
  dblB(s,x1,oy,x1,oy-32,x1+8,oy); atm(s,x1,oy-32,'O');
  bnd(s,x1,oy,x1-26,oy+16); atm(s,x1-26,oy+16,'O');
  // C2 enol-O-P going up
  bnd(s,x2,oy,x2,oy-30); atm(s,x2,oy-30,'O');
  bnd(s,x2,oy-30,x2+24,oy-52); pAtom(s,x2+24,oy-52);
  bnd(s,x2+24,oy-52,x2+46,oy-64); atm(s,x2+46,oy-64,'O');
  dblB(s,x2+24,oy-52,x2+10,oy-70,x2+24,oy-38); atm(s,x2+10,oy-70,'O');
  // C3 =CH2 — two H's down
  bnd(s,x3,oy,x3-14,oy+28,'#444',2.2); atm(s,x3-14,oy+28,'H');
  bnd(s,x3,oy,x3+14,oy+28,'#444',2.2); atm(s,x3+14,oy+28,'H');
  [x1,x2,x3].forEach(x=>atm(s,x,oy,'C','',11));
}

// ── Pyruvate ─────────────────────────────────────────────
// horizontal CH3 — C=O — COO-
function drawPyruvate(s,ox,oy){
  const dx=46;
  const x1=ox,x2=ox+dx,x3=ox+2*dx;
  bnd(s,x1,oy,x2,oy); bnd(s,x2,oy,x3,oy);
  // C1 methyl — 3 H's
  bnd(s,x1,oy,x1-14,oy-28,'#444',2.2); atm(s,x1-14,oy-28,'H');
  bnd(s,x1,oy,x1-26,oy+12,'#444',2.2); atm(s,x1-26,oy+12,'H');
  bnd(s,x1,oy,x1+8,oy+28,'#444',2.2);  atm(s,x1+8,oy+28,'H');
  // C2 ketone — double O up
  dblB(s,x2,oy,x2,oy-34,x2-10,oy); atm(s,x2,oy-34,'O');

  dblB(s,x3,oy,x3,oy-34,x3-10,oy); atm(s,x3,oy-34,'O');
  bnd(s,x3,oy,x3+26,oy+16); atm(s,x3+26,oy+16,'O');
  [x1,x2,x3].forEach(x=>atm(s,x,oy,'C','',11));
}

// ── Acetyl-CoA ───────────────────────────────────────────

function drawOAA(s,ox,oy){

// ── Citrate ──────────────────────────────────────────────
// Branched: central C3 has OH, upward COOH arm, and two -CH2-COO- arms left/right
// Drawn as T-shape: horizontal left-C1-C2-C3-C4-C5-right and C3 arm going up to C6
function drawCitrate(s,ox,oy){
  const dx=38;
  // horizontal spine: C1-C2-C3-C4-C5
  const xs=[ox-2*dx,ox-dx,ox,ox+dx,ox+2*dx];
  for(let i=0;i<4;i++) bnd(s,xs[i],oy,xs[i+1],oy);
  // C1 carboxylate (far left)
  dblB(s,xs[0],oy,xs[0],oy-30,xs[0]+8,oy); atm(s,xs[0],oy-30,'O');
  bnd(s,xs[0],oy,xs[0]-24,oy+18); atm(s,xs[0]-24,oy+18,'O');
  // C2 CH2 — H's down
  bnd(s,xs[1],oy,xs[1]-10,oy+26,'#444',2.2); atm(s,xs[1]-10,oy+26,'H');
  bnd(s,xs[1],oy,xs[1]+10,oy+26,'#444',2.2); atm(s,xs[1]+10,oy+26,'H');
  // C3 (central, quaternary): OH right-down, upward arm to C6-COOH
  bnd(s,xs[2],oy,xs[2]+26,oy+20); atm(s,xs[2]+26,oy+20,'O');
  bnd(s,xs[2]+26,oy+20,xs[2]+46,oy+32,'#444',2); atm(s,xs[2]+46,oy+32,'H');
  // C3 arm up: C6-COOH
  bnd(s,xs[2],oy,xs[2],oy-36); atm(s,xs[2],oy-36,'C','',11);
  dblB(s,xs[2],oy-36,xs[2]+24,oy-54,xs[2]+8,oy-36); atm(s,xs[2]+24,oy-54,'O');
  bnd(s,xs[2],oy-36,xs[2]-24,oy-54); atm(s,xs[2]-24,oy-54,'O');
  // C4 CH2 — H's down
  bnd(s,xs[3],oy,xs[3]-10,oy+26,'#444',2.2); atm(s,xs[3]-10,oy+26,'H');
  bnd(s,xs[3],oy,xs[3]+10,oy+26,'#444',2.2); atm(s,xs[3]+10,oy+26,'H');
  // C5 carboxylate (far right)
  dblB(s,xs[4],oy,xs[4],oy-30,xs[4]-8,oy); atm(s,xs[4],oy-30,'O');
  bnd(s,xs[4],oy,xs[4]+24,oy+18); atm(s,xs[4]+24,oy+18,'O');
  xs.forEach(x=>atm(s,x,oy,'C','',11));
}

// ── Isocitrate ───────────────────────────────────────────
// Linear 6C: COO--CH2-C(COO-)(H)-CHOH-CH2-COO-
// C3 branch carboxylate goes UP; C4 OH goes DOWN
function drawIsocitrate(s,ox,oy){
  const dx=36;
  const xs=[ox-2.5*dx,ox-1.5*dx,ox-0.5*dx,ox+0.5*dx,ox+1.5*dx,ox+2.5*dx];
  for(let i=0;i<5;i++) bnd(s,xs[i],oy,xs[i+1],oy);
  // C1 carboxylate
  dblB(s,xs[0],oy,xs[0],oy-28,xs[0]+8,oy); atm(s,xs[0],oy-28,'O');
  bnd(s,xs[0],oy,xs[0]-22,oy+16); atm(s,xs[0]-22,oy+16,'O');
  // C2 CH2
  bnd(s,xs[1],oy,xs[1]-10,oy+24,'#444',2.2); atm(s,xs[1]-10,oy+24,'H');
  bnd(s,xs[1],oy,xs[1]+10,oy+24,'#444',2.2); atm(s,xs[1]+10,oy+24,'H');
  // C3 branch COOH goes UP, H goes DOWN
  bnd(s,xs[2],oy,xs[2],oy-36); atm(s,xs[2],oy-36,'C','',11);
  dblB(s,xs[2],oy-36,xs[2]+22,oy-52,xs[2]+8,oy-36); atm(s,xs[2]+22,oy-52,'O');
  bnd(s,xs[2],oy-36,xs[2]-22,oy-52); atm(s,xs[2]-22,oy-52,'O');
  bnd(s,xs[2],oy,xs[2],oy+24,'#444',2.2); atm(s,xs[2],oy+24,'H');
  // C4 CHOH — OH DOWN-right, H DOWN-left
  bnd(s,xs[3],oy,xs[3]+24,oy+20); atm(s,xs[3]+24,oy+20,'O');
  bnd(s,xs[3]+24,oy+20,xs[3]+44,oy+32,'#444',2); atm(s,xs[3]+44,oy+32,'H');
  bnd(s,xs[3],oy,xs[3]-14,oy+24,'#444',2.2); atm(s,xs[3]-14,oy+24,'H');
  // C5 CH2
  bnd(s,xs[4],oy,xs[4]-10,oy+24,'#444',2.2); atm(s,xs[4]-10,oy+24,'H');
  bnd(s,xs[4],oy,xs[4]+10,oy+24,'#444',2.2); atm(s,xs[4]+10,oy+24,'H');
  // C6 carboxylate
  dblB(s,xs[5],oy,xs[5],oy-28,xs[5]-8,oy); atm(s,xs[5],oy-28,'O');
  bnd(s,xs[5],oy,xs[5]+22,oy+16); atm(s,xs[5]+22,oy+16,'O');
  xs.forEach(x=>atm(s,x,oy,'C','',11));
}

// ── Fumarate ─────────────────────────────────────────────

// ── NADH ─────────────────────────────────────────────────
function drawNADH(s,cx,cy){
  const r=22;
  for(let i=0;i<6;i++){const a=i*60*Math.PI/180,b=(i+1)*60*Math.PI/180;bnd(s,cx+r*Math.cos(a),cy+r*Math.sin(a),cx+r*Math.cos(b),cy+r*Math.sin(b),'#94a3b8',2);}
  atm(s,cx,cy+r,'N','',12);// N at bottom
  // CONH2 substituent at top
  const tx=cx,ty=cy-r;
  bnd(s,tx,ty,tx,ty-26); atm(s,tx,ty-26,'C','',10);
  dblB(s,tx,ty-26,tx+22,ty-40,tx+6,ty-26); atm(s,tx+22,ty-40,'O');
  bnd(s,tx,ty-26,tx,ty-50); atm(s,tx,ty-50,'N','',12);
  // 2H badge
  lbl(s,cx-r-16,cy,'2H','#34d399',9);
  lbl(s,cx,cy+r+16,'NADH','#34d399',8);
}

// ── CoQ / CoQH2 ──────────────────────────────────────────
function drawCoQ(s,cx,cy,reduced){
  const col=reduced?'#60a5fa':'#f59e0b';
  const r=24;
  // benzoquinone ring (hexagon)
  const V=Array.from({length:6},(_,i)=>{const a=(i*60-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];});
  for(let i=0;i<6;i++){const j=(i+1)%6;bnd(s,V[i][0],V[i][1],V[j][0],V[j][1],'#94a3b8',2);}
  V.forEach(v=>atm(s,v[0],v[1],'C','',9));
  // methoxy groups at C1, C4 (omitted for space; show two C=O or C-OH at C1,C2)
  const top1=V[0],top2=V[1];// topmost two carbons
  if(!reduced){
    // oxidized: two carbonyls at top, pointing up-left and up-right
    dblB(s,top1[0],top1[1],top1[0]-20,top1[1]-18,top1[0]+6,top1[1]); atm(s,top1[0]-20,top1[1]-18,'O');
    dblB(s,top2[0],top2[1],top2[0]+20,top2[1]-18,top2[0]-6,top2[1]); atm(s,top2[0]+20,top2[1]-18,'O');
    lbl(s,cx,cy+r+16,'CoQ (oxidized)',col,8);
  } else {
    // reduced: two C-OH
    bnd(s,top1[0],top1[1],top1[0]-22,top1[1]-16); atm(s,top1[0]-22,top1[1]-16,'O');
    bnd(s,top1[0]-22,top1[1]-16,top1[0]-40,top1[1]-8,'#444',2); atm(s,top1[0]-40,top1[1]-8,'H');
    bnd(s,top2[0],top2[1],top2[0]+22,top2[1]-16); atm(s,top2[0]+22,top2[1]-16,'O');
    bnd(s,top2[0]+22,top2[1]-16,top2[0]+40,top2[1]-8,'#444',2); atm(s,top2[0]+40,top2[1]-8,'H');
    lbl(s,cx,cy+r+16,'CoQH2 (reduced)',col,8);
  }
}

// ── Cytochrome c ─────────────────────────────────────────
function drawCytC(s,cx,cy){
  const r=26;
  const pts=Array.from({length:4},(_,i)=>{const a=(i*90+45)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];});

function drawRamachandran(canvas){
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const bg='#0a0e17';ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // Plot area margins
  const ml=42,mr=12,mt=12,mb=36;
  const pw=W-ml-mr,ph=H-mt-mb;
  function toX(phi){return ml+(phi+180)/360*pw;}
  function toY(psi){return mt+(180-psi)/360*ph;}
  // Allowed regions (approximate literature boundaries)
  const regions=[
    {name:'Alpha helix',phi:[-90,-30],psi:[-60,0],color:'rgba(59,130,246,0.25)',border:'#3b82f6',label:'\u03b1-helix',corner:'bl',ss:'helix'},
    {name:'Left-handed helix',phi:[30,90],psi:[20,80],color:'rgba(139,92,246,0.18)',border:'#8b5cf6',label:'L-\u03b1 helix',corner:'tr',ss:'lhelix'},
    {name:'Beta sheet (anti\u2225)',phi:[-160,-60],psi:[100,180],color:'rgba(245,158,11,0.22)',border:'#f59e0b',label:'\u03b2 anti\u2225',corner:'tl',ss:'sheet'},
    {name:'Beta sheet (\u2225)',phi:[-150,-90],psi:[100,170],color:'rgba(245,158,11,0.15)',border:'#f59e0b',label:'\u03b2 \u2225',corner:'bl',ss:'sheet'},
    {name:'3/10 helix',phi:[-90,-50],psi:[-30,20],color:'rgba(6,182,212,0.18)',border:'#06b6d4',label:'3\u2081\u2080',corner:'tl',ss:'helix'},
    {name:'Polyproline II',phi:[-90,-50],psi:[120,180],color:'rgba(16,185,129,0.18)',border:'#10b981',label:'PPII',corner:'tr',ss:'coil'},
    {name:'Turns',phi:[-90,0],psi:[-80,-10],color:'rgba(100,116,139,0.12)',border:'#475569',label:'turns',corner:'br',ss:'coil'},
  ];
  // Draw regions
  regions.forEach(r=>{
    const x1=toX(r.phi[0]),x2=toX(r.phi[1]),y1=toY(r.psi[1]),y2=toY(r.psi[0]);
    ctx.fillStyle=r.color;ctx.strokeStyle=r.border;ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1),3);
    ctx.fill();ctx.stroke();
    if(r.label){
      const x1=toX(r.phi[0]),x2=toX(r.phi[1]),y1=toY(r.psi[1]),y2=toY(r.psi[0]);
      const bxL=Math.min(x1,x2),bxR=Math.max(x1,x2),byT=Math.min(y1,y2),byB=Math.max(y1,y2);
      ctx.font='bold 7px DM Mono, monospace';
      const tw=ctx.measureText(r.label).width;
      const pad=3,pillH=12;
      let lx,ly;
      if(r.corner==='tl'){lx=bxL+2;ly=byT+2;}
      else if(r.corner==='tr'){lx=bxR-tw-pad*2-2;ly=byT+2;}
      else if(r.corner==='bl'){lx=bxL+2;ly=byB-pillH-2;}
      else{lx=bxR-tw-pad*2-2;ly=byB-pillH-2;}
      ctx.fillStyle='rgba(10,14,23,.75)';
      ctx.beginPath();ctx.roundRect(lx,ly,tw+pad*2,pillH,3);ctx.fill();
      ctx.fillStyle=r.border;ctx.textAlign='left';
      ctx.fillText(r.label,lx+pad,ly+9);
    }
  });
  // Grid
  ctx.strokeStyle='rgba(30,45,69,0.8)';ctx.lineWidth=0.5;
  for(let phi=-180;phi<=180;phi+=60){const x=toX(phi);ctx.beginPath();ctx.moveTo(x,mt);ctx.lineTo(x,mt+ph);ctx.stroke();}
  for(let psi=-180;psi<=180;psi+=60){const y=toY(psi);ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(ml+pw,y);ctx.stroke();}
  // Axes
  ctx.strokeStyle='#475569';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ml,mt);ctx.lineTo(ml,mt+ph);ctx.lineTo(ml+pw,mt+ph);ctx.stroke();
  // Center lines
  ctx.strokeStyle='rgba(100,116,139,0.5)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(toX(0),mt);ctx.lineTo(toX(0),mt+ph);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ml,toY(0));ctx.lineTo(ml+pw,toY(0));ctx.stroke();
  ctx.setLineDash([]);
  // Axis labels
  ctx.fillStyle='#64748b';ctx.font='10px DM Sans, sans-serif';ctx.textAlign='center';
  [-180,-120,-60,0,60,120,180].forEach(v=>{ctx.fillText(v,toX(v),mt+ph+14);});
  ctx.textAlign='right';
  [-180,-120,-60,0,60,120,180].forEach(v=>{ctx.fillText(v,ml-4,toY(v)+3);});
  ctx.fillStyle='#94a3b8';ctx.font='11px DM Sans, sans-serif';ctx.textAlign='center';
  ctx.fillText('phi (deg)',ml+pw/2,H-4);
  ctx.save();ctx.translate(12,mt+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText('psi (deg)',0,0);ctx.restore();
  // Famous protein data points
  const pts=[{phi:-57,psi:-47,col:'#93c5fd'},{phi:-119,psi:113,col:'#fcd34d'},{phi:-60,psi:-30,col:'#67e8f9'},{phi:57,psi:47,col:'#c4b5fd'},{phi:-80,psi:150,col:'#6ee7b7'}];
  pts.forEach(p=>{
    ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(toX(p.phi),toY(p.psi),4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.stroke();
  });
  canvas.ramaRegions=regions;canvas.ramaToX=toX;canvas.ramaToY=toY;
  canvas.ramaFromX=phi=>((phi-ml)/pw)*360-180;
  canvas.ramaFromY=psi=>180-((psi-mt)/ph)*360;
}
function ramaHitTest(canvas,ex,ey){
  if(!canvas.ramaRegions)return null;
  const fromX=canvas.ramaFromX,fromY=canvas.ramaFromY;
  const phi=fromX(ex),psi=fromY(ey);
  for(const r of canvas.ramaRegions){
    if(phi>=r.phi[0]&&phi<=r.phi[1]&&psi>=r.psi[0]&&psi<=r.psi[1])return{region:r,phi:Math.round(phi),psi:Math.round(psi)};
  }
  return{region:null,phi:Math.round(phi),psi:Math.round(psi)};
}

function sphM(color,r){return new THREE.Mesh(new THREE.SphereGeometry(r||0.6,8,6),new THREE.MeshPhongMaterial({color,shininess:70}));}

  }catch(e){if(loader)loader.remove();const isTimeout=e.name==='AbortError';showPDBStatus(isTimeout?'Connection timed out — click Fetch to retry':'Could not load '+pdbId+' — check ID or connection','#f87171');}
}

function showPDBStatus(msg,col){const el=document.getElementById('pdb-status');if(el){el.style.display='block';el.style.color=col||'var(--text-muted)';el.textContent=msg;}}

function renderAnnotationBadges(pdbId){
  const el=document.getElementById('pdb-annotations');if(!el)return;
  const annots=PDB_ANNOTATIONS[pdbId];
  if(!annots||annots.length===0){el.innerHTML='';el.style.display='none';return;}
  el.style.display='flex';
  el.innerHTML=annots.map(a=>{const hex='#'+a.color.toString(16).padStart(6,'0');const r=(a.color>>16)&255,g=(a.color>>8)&255,b=a.color&255;return`<span class="annot-badge" style="border-left:3px solid ${hex};background:rgba(${r},${g},${b},.1);padding:.1rem .35rem;font-size:.48rem;border-radius:0 3px 3px 0;color:var(--text-muted);cursor:default;line-height:1.3;" title="${a.label}">${a.label.length>30?a.label.substring(0,28)+'…':a.label}</span>`;}).join('');
}

function parsePDB(text){
  const atoms=[],helices=[],sheets=[];
  const meta={title:'',resolution:'',method:'',organism:''};
  text.split('\n').forEach(line=>{
    if(line.startsWith('TITLE')){meta.title=(meta.title+' '+line.substring(10)).trim();}
    else if(line.startsWith('EXPDTA')){const m=line.substring(10).trim();if(m.includes('X-RAY'))meta.method='X-ray';else if(m.includes('ELECTRON MICROSCOPY'))meta.method='Cryo-EM';else if(m.includes('NMR'))meta.method='NMR';else meta.method=m.substring(0,15);}
    else if(line.startsWith('REMARK   2 ')&&line.includes('RESOLUTION')&&!meta.resolution){const rm=line.match(/([\d.]+)\s*ANGSTROM/);if(rm)meta.resolution=rm[1]+' Å';}
    else if(line.startsWith('SOURCE')&&line.includes('ORGANISM_SCIENTIFIC')&&!meta.organism){const om=line.match(/ORGANISM_SCIENTIFIC:\s*([^;]+)/);if(om)meta.organism=om[1].trim().split(/\s+/).slice(0,2).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');}
    else if(line.startsWith('HELIX ')){helices.push({chain:line[19],start:parseInt(line.substring(21,25)),end:parseInt(line.substring(33,37))});}
    else if(line.startsWith('SHEET ')){sheets.push({chain:line[21],start:parseInt(line.substring(22,26)),end:parseInt(line.substring(33,37))});}
    else if(line.startsWith('ATOM  ')||line.startsWith('HETATM')){
      const x=parseFloat(line.substring(30,38)),y=parseFloat(line.substring(38,46)),z=parseFloat(line.substring(46,54));
      const bfactor=parseFloat(line.substring(60,66))||0;
      const element=line.substring(76,78).trim()||line.substring(12,14).trim().replace(/[0-9]/g,'');
      const resName=line.substring(17,20).trim(),chain=line.substring(21,22),resSeq=parseInt(line.substring(22,26)),atomName=line.substring(12,16).trim();
      const isHet=line.startsWith('HETATM');
      if(!isNaN(x)&&!isNaN(y)&&!isNaN(z))atoms.push({x,y,z,element:element||'C',resName,chain,resSeq,atomName,isCA:atomName==='CA',isHet,bfactor});
    }
  });
  atoms.forEach(a=>{a.ss='loop';for(const h of helices){if(a.chain===h.chain&&a.resSeq>=h.start&&a.resSeq<=h.end){a.ss='helix';break;}}if(a.ss==='loop'){for(const s of sheets){if(a.chain===s.chain&&a.resSeq>=s.start&&a.resSeq<=s.end){a.ss='sheet';break;}}}});
  return{atoms,meta};
}

function getResidueColor(a,ci,cols){
  if(_colorMode==='ss'){return a.ss==='helix'?0x3b82f6:a.ss==='sheet'?0xf59e0b:0x94a3b8;}
  if(_colorMode==='hydro'){const h=HYDRO_SCALE[a.resName];if(h===undefined)return 0x888888;const t=(h+4.5)/9;const r=Math.round(59+(245-59)*t),g=Math.round(130+(158-130)*t*(1-t)*4+130*(1-t)),b=Math.round(246+(11-246)*t);return(r<<16)|(Math.min(255,g)<<8)|Math.max(0,b);}
  if(_colorMode==='charge'){const c=CHARGE_MAP[a.resName]||0;if(c>0.5)return 0x3b82f6;if(c<-0.5)return 0xef4444;if(Math.abs(c)>0)return 0x818cf8;return 0x94a3b8;}
  return cols[ci%cols.length];
}

function renderPDBAtoms(atoms){
  if(!renderer3d)init3D();if(!scene3d)return;
  if(!molGroup3d){molGroup3d=new THREE.Group();scene3d.add(molGroup3d);}
  while(molGroup3d.children.length){disposeObject3D(molGroup3d.children[0]);molGroup3d.remove(molGroup3d.children[0]);}
  _atomMeshes=[];_distLines=[];_distFirst=null;
  // Non-ligand HETATM: selenomet, modified residues, buffers, cryoprotectants, common ions/salts
  const IGNORE_HET=new Set(['HOH','DOD','WAT','MSE','CSE','SEP','TPO','PTR','HYP','MLY','M3L','ALY','CGU','CSO','OCS','CME','CSD','MEN','FME','KCX','LLP','SAH','EDO','GOL','PEG','PGE','MPD','DMS','ACT','FMT','BME','SO4','PO4','CL','NA','MG','ZN','CA','MN','FE','CU','NI','CO','K','BR','IOD','NO3','SCN','ACE','NH2','FOR','UNX','UNL']);
  const protAtoms=atoms.filter(a=>!a.isHet||IGNORE_HET.has(a.resName)),ligAtoms=atoms.filter(a=>a.isHet&&!IGNORE_HET.has(a.resName));
  const allDisplay=protAtoms.length>0?protAtoms:atoms;
  let cx=0,cy=0,cz=0;allDisplay.forEach(a=>{cx+=a.x;cy+=a.y;cz+=a.z;});cx/=allDisplay.length;cy/=allDisplay.length;cz/=allDisplay.length;
  _pdbCenter={x:cx,y:cy,z:cz};
  const elemCol={C:0x888888,N:0x4a90d9,O:0xe05050,S:0xe8c840,P:0xf59e0b,H:0xcccccc,FE:0xd97706,MG:0x22c55e,ZN:0x8b5cf6,CA:0x10b981};
  const chainCols=[0x3b82f6,0x10b981,0xf59e0b,0x8b5cf6,0xef4444,0x06b6d4,0xec4899,0x84cc16,0xf97316,0x14b8a6,0xa855f7,0xe11d48,0x0ea5e9,0xd946ef,0xeab308,0x64748b];
  const caAtoms=protAtoms.filter(a=>a.isCA);
  const chains=[...new Set(caAtoms.map(a=>a.chain))];

  if(curMode==='ribbon'&&caAtoms.length>3){
    chains.forEach(ch=>{const chainCA=caAtoms.filter(a=>a.chain===ch);const ci=chains.indexOf(ch);let seg=[chainCA[0]];for(let i=1;i<chainCA.length;i++){const prev=chainCA[i-1],cur=chainCA[i];const dist=Math.sqrt((cur.x-prev.x)**2+(cur.y-prev.y)**2+(cur.z-prev.z)**2);if(dist>5||cur.resSeq-prev.resSeq>2){if(seg.length>=2)addRibbonSeg(seg,ci,chainCols,cx,cy,cz);seg=[];}seg.push(cur);}if(seg.length>=2)addRibbonSeg(seg,ci,chainCols,cx,cy,cz);});
  } else if(curMode==='ball'){
    const displayAtoms=protAtoms.length>5000?protAtoms.filter((_,i)=>i%Math.ceil(protAtoms.length/5000)===0):protAtoms;
    const radii={C:1.2,N:1.1,O:1.0,S:1.4,P:1.3,H:0.6};
    displayAtoms.forEach(a=>{if(a.element==='H')return;const r=(radii[a.element]||1.0)*0.4;const geo=new THREE.SphereGeometry(r,8,8);const col=elemCol[a.element.toUpperCase()]||0x888888;const mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:col}));mesh.position.set(a.x-cx,a.y-cy,a.z-cz);mesh.userData=a;molGroup3d.add(mesh);_atomMeshes.push(mesh);});
  } else {
    const sample=caAtoms.length>0?caAtoms:allDisplay.filter((_,i)=>i%3===0);
    sample.forEach(a=>{const ci=chains.indexOf(a.chain);const col=getResidueColor(a,ci>=0?ci:0,chainCols);const geo=new THREE.SphereGeometry(1.8,8,8);const mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:col,transparent:true,opacity:0.5}));mesh.position.set(a.x-cx,a.y-cy,a.z-cz);mesh.userData=a;molGroup3d.add(mesh);_atomMeshes.push(mesh);});
  }

  // Ligand overlay (all modes)
  if(ligAtoms.length>0&&ligAtoms.length<2000){
    const ls=ligAtoms.filter(a=>a.element!=='H');
    // Draw atom spheres
    const ligDisplay=ls.length>500?ls.filter((_,i)=>i%Math.ceil(ls.length/500)===0):ls;
    ligDisplay.forEach(a=>{const geo=new THREE.SphereGeometry(0.55,8,8);const mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0x22d3ee,emissive:0x064e3b,shininess:90}));mesh.position.set(a.x-cx,a.y-cy,a.z-cz);mesh.userData={...a,isLigand:true};molGroup3d.add(mesh);_atomMeshes.push(mesh);});
    // Draw bonds: connect atoms in same residue+chain within bonding distance
    const bondCutoff=1.9;
    const residueGroups={};
    ls.forEach(a=>{const key=a.chain+'_'+a.resName+'_'+a.resSeq;if(!residueGroups[key])residueGroups[key]=[];residueGroups[key].push(a);});
    Object.values(residueGroups).forEach(group=>{
      for(let i=0;i<group.length;i++){
        for(let j=i+1;j<group.length;j++){
          const a=group[i],b=group[j];
          const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;
          const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
          if(dist>0.4&&dist<bondCutoff){
            const p1=new THREE.Vector3(a.x-cx,a.y-cy,a.z-cz),p2=new THREE.Vector3(b.x-cx,b.y-cy,b.z-cz);
            const dir=new THREE.Vector3().subVectors(p2,p1);const len=dir.length();
            const mid=new THREE.Vector3().addVectors(p1,p2).multiplyScalar(.5);
            const geo=new THREE.CylinderGeometry(0.12,0.12,len,4);
            const mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0x22d3ee,shininess:60}));
            mesh.position.copy(mid);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
            molGroup3d.add(mesh);
          }
        }
      }
    });
  }

  // Annotation highlights (ribbon mode)
  if(_lastPDBId&&PDB_ANNOTATIONS[_lastPDBId]&&curMode==='ribbon'){
    PDB_ANNOTATIONS[_lastPDBId].forEach(ann=>{
      let hl;
      if(ann.resRange)hl=caAtoms.filter(a=>a.chain===ann.chain&&a.resSeq>=ann.resRange[0]&&a.resSeq<=ann.resRange[1]);
      else if(ann.res!==undefined)hl=caAtoms.filter(a=>a.chain===ann.chain&&a.resSeq===ann.res);
      if(hl&&hl.length>0)hl.forEach(a=>{const r=ann.res!==undefined?1.4:0.9;const geo=new THREE.SphereGeometry(r,10,10);const mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:ann.color,transparent:true,opacity:0.55,emissive:ann.color,emissiveIntensity:0.25}));mesh.position.set(a.x-cx,a.y-cy,a.z-cz);mesh.userData={...a,annotation:ann.label};molGroup3d.add(mesh);_atomMeshes.push(mesh);});
    });
  }

  let maxDist=0;allDisplay.forEach(a=>{const d=Math.sqrt((a.x-cx)**2+(a.y-cy)**2+(a.z-cz)**2);if(d>maxDist)maxDist=d;});
  if(camera3d)camera3d.position.z=Math.max(20,maxDist*2.5);
  setupViewportClick();
}

function addRibbonSeg(seg,ci,cols,cx,cy,cz){
  if(_colorMode==='chain'){
    const col=cols[ci%cols.length];const pts=seg.map(a=>new THREE.Vector3(a.x-cx,a.y-cy,a.z-cz));
    const curve=new THREE.CatmullRomCurve3(pts);molGroup3d.add(new THREE.Mesh(new THREE.TubeGeometry(curve,seg.length*3,0.5,6,false),new THREE.MeshPhongMaterial({color:col,shininess:60})));
  } else {
    // Batch consecutive residues with the same color into single tubes
    let runStart=0,runCol=getResidueColor(seg[0],ci,cols);
    for(let i=1;i<=seg.length;i++){
      const col=i<seg.length?getResidueColor(seg[i],ci,cols):null;
      if(col!==runCol||i===seg.length){
        // Flush run from runStart to i-1
        const slice=seg.slice(Math.max(0,runStart-1),Math.min(seg.length,i+1));
        if(slice.length>=2){
          const pts=slice.map(a=>new THREE.Vector3(a.x-cx,a.y-cy,a.z-cz));
          const curve=new THREE.CatmullRomCurve3(pts);
          molGroup3d.add(new THREE.Mesh(new THREE.TubeGeometry(curve,slice.length*3,0.5,6,false),new THREE.MeshPhongMaterial({color:runCol,shininess:60})));
        }
        runStart=i;runCol=col;
      }
    }
  }
  // Invisible CA spheres for raycasting
  seg.forEach(a=>{const geo=new THREE.SphereGeometry(0.8,6,6);const mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({visible:false}));mesh.position.set(a.x-_pdbCenter.x,a.y-_pdbCenter.y,a.z-_pdbCenter.z);mesh.userData=a;molGroup3d.add(mesh);_atomMeshes.push(mesh);});
}

let _vpClickBound=false;
function setupViewportClick(){
  const vp=document.getElementById('mol-viewport');if(!vp||_vpClickBound)return;_vpClickBound=true;
  const raycaster=new THREE.Raycaster();const mouse=new THREE.Vector2();
  vp.addEventListener('click',e=>{
    if(!camera3d||!molGroup3d||_atomMeshes.length===0)return;
    if(Math.abs(e.clientX-(lastX3d||0))>4||Math.abs(e.clientY-(lastY3d||0))>4)return;
    const rect=vp.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouse,camera3d);const hits=raycaster.intersectObjects(_atomMeshes);
    if(hits.length>0){const a=hits[0].object.userData;if(!a)return;if(_distMode)handleDistClick(a);else showAtomTooltip(a,e);}
    else{const tip=document.getElementById('pdb-tooltip');if(tip)tip.style.display='none';}
  });
}

function showAtomTooltip(a,e){
  let tip=document.getElementById('pdb-tooltip');
  if(!tip){tip=document.createElement('div');tip.id='pdb-tooltip';tip.style.cssText='position:fixed;z-index:999;background:rgba(10,14,23,.92);border:1px solid var(--border);border-radius:6px;padding:.3rem .5rem;font-family:DM Mono,monospace;font-size:.55rem;color:var(--text);pointer-events:none;line-height:1.5;backdrop-filter:blur(4px);max-width:220px;';document.body.appendChild(tip);}
  let h='';
  if(a.annotation)h+=`<div style="color:#fbbf24;font-weight:600;">⭐ ${a.annotation}</div>`;
  if(a.isLigand)h+=`<div style="color:#22d3ee;font-weight:500;">Ligand: ${a.resName}</div>`;
  h+=`<div>${a.resName} ${a.resSeq} · Chain ${a.chain}</div>`;
  h+=`<div>${a.atomName} (${a.element})</div>`;
  if(a.ss&&a.ss!=='loop')h+=`<div style="color:${a.ss==='helix'?'#60a5fa':'#fbbf24'}">${a.ss==='helix'?'α-helix':'β-sheet'}</div>`;
  if(HYDRO_SCALE[a.resName]!==undefined)h+=`<div>Hydrophobicity: ${HYDRO_SCALE[a.resName]>0?'+':''}${HYDRO_SCALE[a.resName].toFixed(1)}</div>`;
  if(CHARGE_MAP[a.resName])h+=`<div>Charge: ${CHARGE_MAP[a.resName]>0?'+':''}${CHARGE_MAP[a.resName]}</div>`;
  tip.innerHTML=h;tip.style.display='block';
  tip.style.left=Math.min(e.clientX+12,window.innerWidth-230)+'px';tip.style.top=Math.min(e.clientY-10,window.innerHeight-100)+'px';
  clearTimeout(tip._timer);tip._timer=setTimeout(()=>{tip.style.display='none';},4000);
}

function handleDistClick(a){
  if(!_distFirst){_distFirst=a;showPDBStatus(`First: ${a.resName}${a.resSeq}.${a.atomName} — click second atom`,'#60a5fa');}
  else{
    const dx=a.x-_distFirst.x,dy=a.y-_distFirst.y,dz=a.z-_distFirst.z;const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
    showPDBStatus(`${_distFirst.resName}${_distFirst.resSeq}.${_distFirst.atomName} ↔ ${a.resName}${a.resSeq}.${a.atomName} = ${dist.toFixed(1)} Å`,'#34d399');
    const cx=_pdbCenter.x,cy=_pdbCenter.y,cz=_pdbCenter.z;
    const p1=new THREE.Vector3(_distFirst.x-cx,_distFirst.y-cy,_distFirst.z-cz),p2=new THREE.Vector3(a.x-cx,a.y-cy,a.z-cz);
    const geo=new THREE.BufferGeometry().setFromPoints([p1,p2]);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xfbbf24}));molGroup3d.add(line);_distLines.push(line);
    [p1,p2].forEach(p=>{const sg=new THREE.SphereGeometry(0.4,6,6);const sm=new THREE.Mesh(sg,new THREE.MeshPhongMaterial({color:0xfbbf24,emissive:0x7c2d12}));sm.position.copy(p);molGroup3d.add(sm);_distLines.push(sm);});
    _distFirst=null;
  }
}

function renderRamaPanel(){
  const p=document.getElementById('right-panel');
  p.innerHTML=`<div class="vp-header"><div class="vp-title">Ramachandran Plot Explorer</div><div class="vp-desc">Click any region to see which secondary structure it encodes</div></div>
<div class="rama-canvas-wrap" id="rama-wrap">
  <canvas id="rama-canvas" width="340" height="290" style="display:block;cursor:crosshair;border-radius:6px;"></canvas>
  <div class="rama-tooltip" id="rama-tip"><span style="color:var(--text-muted);font-size:.65rem">Click the plot to explore phi/psi angles</span></div>
</div>
<div class="rama-info" id="rama-info">The Ramachandran plot shows allowed backbone conformations. Shaded regions are energetically favored. Alpha-helices cluster around phi=-57, psi=-47. Beta-strands around phi=-120, psi=+113.</div>`;
  setTimeout(()=>{
    const canvas=document.getElementById('rama-canvas');if(!canvas)return;
    canvas.width=canvas.clientWidth||340;
    canvas.height=canvas.clientHeight||290;
    drawRamachandran(canvas);
    canvas.addEventListener('click',e=>{
      const rect=canvas.getBoundingClientRect();
      const ex=e.clientX-rect.left,ey=e.clientY-rect.top;
      const hit=ramaHitTest(canvas,ex,ey);
      const tip=document.getElementById('rama-tip');
      const info=document.getElementById('rama-info');
      if(hit){
        const desc=hit.region?`<b style="color:${hit.region.border}">${hit.region.name}</b><br>phi: ${hit.phi}°, psi: ${hit.psi}°`:`<span style="color:var(--text-muted)">Disallowed region</span><br>phi: ${hit.phi}°, psi: ${hit.psi}°`;
        tip.innerHTML=desc;
        const ss=hit.region?hit.region.ss:'none';
        const ssDescs={helix:'Alpha-helices: phi ~-57, psi ~-47. The backbone NH and C=O of residue i forms a hydrogen bond with residue i+4, creating a right-handed coil with 3.6 residues per turn.',sheet:'Beta-strands: phi ~-120, psi ~+113. Extended backbone conformation. Hydrogen bonds form between strands (parallel or antiparallel) to form beta-sheets.',lhelix:'Left-handed alpha-helix: phi ~+57, psi ~+47. Rarely found in proteins -- energetically less favorable. Only glycine commonly adopts this conformation.',coil:'Random coil / loops: this region allows flexible backbone conformations used in turns and loops connecting secondary structure elements.',none:'Disallowed region: steric clashes between backbone atoms make these phi/psi combinations energetically prohibitive. Very few residues (except Gly) are found here.'};
        if(info)info.textContent=ssDescs[ss]||ssDescs.none;
      }
    });
    canvas.addEventListener('mousemove',e=>{
      const rect=canvas.getBoundingClientRect();
      const hit=ramaHitTest(canvas,e.clientX-rect.left,e.clientY-rect.top);
      canvas.style.cursor=hit&&hit.region?'crosshair':'default';
    });
  },60);
}

const LESSONS={
intro_macromolecules:{eyebrow:'Biochemistry Fundamentals',title:'Biological Scale & Macromolecules',intro:'Life is built from four major classes of macromolecules: proteins, nucleic acids, carbohydrates, and lipids. These molecules span an enormous range of sizes — from small metabolites measured in angstroms to chromosome-scale DNA molecules meters long. Understanding their scale and basic properties is the foundation of biochemistry.',concepts:[{label:'Proteins',title:'Polymers of Amino Acids',desc:'Chains of amino acids (typically 50-30,000+ residues) folded into precise 3D structures. They catalyze reactions (enzymes), provide structure (collagen, keratin), signal (hormones, receptors), and transport molecules (hemoglobin).'},{label:'Nucleic Acids',title:'Polymers of Nucleotides',desc:'DNA stores genetic information as a double helix; RNA transmits and regulates it. The human genome is ~3.2 billion base pairs (~2 meters of DNA per cell), packed into a nucleus ~6 µm across.'},{label:'Carbohydrates',title:'Sugars & Polysaccharides',desc:'From simple sugars (glucose, 180 Da) to massive polysaccharides (glycogen, starch, cellulose). Serve as energy sources, structural components (cell walls), and recognition signals (glycoproteins).'},{label:'Lipids',title:'Hydrophobic & Amphipathic',desc:'Not true polymers but essential macromolecules. Fatty acids, phospholipids (membranes), steroids (cholesterol, hormones), and triglycerides (energy storage). Defined by hydrophobicity.'}],body:"Biological molecules span roughly 10 orders of magnitude in size. A water molecule is ~2.75 Å across. Glucose is ~7 Å. A typical globular protein like hemoglobin is ~55 Å (5.5 nm). A ribosome is ~250 Å (25 nm). A mitochondrion is ~1,000 nm (1 µm). A typical animal cell is ~10-30 µm.\nAll four macromolecule classes are built from simple monomers linked by condensation (dehydration) reactions: amino acids → proteins, nucleotides → nucleic acids, monosaccharides → polysaccharides. Lipids are the exception — they assemble through non-covalent hydrophobic interactions rather than polymerization. Each class has distinct structural and functional roles, but they constantly interact: enzymes (proteins) replicate DNA (nucleic acids), glycolipids (carbohydrates + lipids) stud cell surfaces, and ribonucleoprotein complexes (RNA + protein) carry out translation.",points:['Proteins: 20 amino acid monomers, linked by peptide bonds, MW typically 10-300 kDa','Nucleic acids: 4 nucleotide monomers (A, G, C, T/U), linked by phosphodiester bonds, DNA can be billions of Da','Carbohydrates: monosaccharide monomers (glucose, galactose, fructose), linked by glycosidic bonds','Lipids: not polymers — assemble via hydrophobic effect; phospholipids form bilayer membranes spontaneously','1 Å = 0.1 nm = 10⁻¹⁰ m. Proteins are measured in nm, organelles in µm, cells in µm to mm'],highlight:{label:'The Central Theme',text:'Biochemistry is ultimately about how these four classes of macromolecules are synthesized, modified, interact, and are degraded — and how these processes are regulated. Every topic in MoleBio connects back to the chemistry and biology of proteins, nucleic acids, carbohydrates, and lipids.'},viewerType:'scale_viewer'},
intro_aminoacids:{eyebrow:'Biochemistry Fundamentals',title:'Amino Acids',intro:'Amino acids are the monomeric building blocks of proteins. All 20 standard amino acids share a common backbone but differ in their R-groups, which determine their chemical properties and roles in protein structure and function.',concepts:[{label:'Backbone',title:'Common Core Structure',desc:'Every amino acid has an alpha-carbon bonded to an amino group (-NH2), a carboxyl group (-COOH), a hydrogen, and a variable R-group side chain.'},{label:'Classification',title:'By R-group Chemistry',desc:'Side chains are classified as nonpolar/hydrophobic, polar uncharged, positively charged, negatively charged, or special cases (Gly, Pro, Cys).'},{label:'Peptide Bond',title:'Backbone Linkage',desc:'Amino acids are connected via peptide bonds -- a covalent bond between the carboxyl of one and the amino of the next, releasing water.'},{label:'Chirality',title:'L-Configuration',desc:'All amino acids in proteins are L-enantiomers. The alpha-carbon is a chiral center in all amino acids except glycine.'}],body:"The peptide bond has partial double-bond character due to resonance delocalization of the carbonyl pi electrons onto the nitrogen, making the O-C-N-H unit planar and rigid.\n\nThe phi and psi dihedral angles describe backbone conformation around the alpha-carbon. Allowed phi-psi combinations are visualized in the Ramachandran plot.",points:['Glycine has no chiral center due to two H substituents on Calpha -- exceptional conformational flexibility','Proline contains a cyclic pyrrolidine side chain that constrains phi to ~-60 degrees and disrupts regular secondary structure','Cysteine can form disulfide bonds (-S-S-) under oxidizing conditions, crosslinking polypeptide chains','Histidine has a pKa near physiological pH (~6.0), making it ideal for enzyme active site acid-base catalysis'],highlight:{label:'Essential Knowledge',text:'The 20 standard amino acids are encoded by the genetic code. Their one- and three-letter codes are fundamental biochemistry vocabulary. The gallery on the right shows every amino acid as an interactive ball-and-stick model.'},viewerType:'aa_gallery'},
intro_peptide:{eyebrow:'Biochemistry Fundamentals',title:'Peptide Bond Formation',intro:'Proteins are formed by linking amino acids together via peptide bonds through condensation reactions. Each peptide bond is planar and rigid due to resonance, and the sequence of amino acids encodes all information needed for folding.',concepts:[{label:'Condensation',title:'Dehydration Reaction',desc:'Formation of a peptide bond releases one water molecule (H2O) per bond formed -- a condensation reaction thermodynamically driven by ribosome-coupled synthesis.'},{label:'Planarity',title:'Resonance Rigidity',desc:'The C-N peptide bond has ~40% double-bond character. The O-C-N-H unit is planar, restricting rotation and constraining backbone geometry.'},{label:'Polarity',title:'N to C Directionality',desc:'Polypeptide chains have directionality: a free amino terminus (N-terminus) and a free carboxyl terminus (C-terminus). Chains are read N to C.'},{label:'Hydrolysis',title:'Reverse Reaction',desc:'Peptide bonds can be broken by hydrolysis -- catalysed by proteases. Thermodynamically favorable but kinetically slow without enzyme.'}],body:"The ribosome catalyses peptide bond formation by positioning the aminoacyl-tRNA in the A site adjacent to the peptidyl-tRNA in the P site. The nucleophilic attack by the A-site amino acid's alpha-amino group on the P-site carbonyl carbon is the key chemical step.\n\nUnder standard conditions, peptide bond hydrolysis is thermodynamically favorable (delta-G ~ -8 to -16 kJ/mol), meaning formation requires energy input. The ribosome couples peptide bond formation to aminoacyl-tRNA hydrolysis to drive the reaction forward.",points:['Each peptide bond formation releases H2O and requires approximately 4 ATP equivalents via aminoacyl-tRNA synthetases','The peptide bond omega angle is ~180 degrees (trans) in >99.9% of cases -- cis bonds occur mainly before proline','A chain of fewer than ~50 amino acids is a peptide; longer chains are polypeptides or proteins','Peptide bonds have a half-life of ~1000 years at pH 7 but are hydrolysed rapidly by proteases'],highlight:{label:'Key Concept',text:'The rigid planarity of the peptide bond, combined with restricted phi/psi angles at Calpha, limits the conformational space available to the polypeptide backbone -- explaining why only a few secondary structure types (alpha-helix, beta-sheet, turns) predominate in all known protein structures.'},viewerType:'peptide_anim'},
intro_nucleotides:{eyebrow:'Biochemistry Fundamentals',title:'Nucleotides & Bases',intro:'Nucleotides are the monomeric building blocks of DNA and RNA. Each consists of three components: a nitrogenous base, a pentose sugar, and one to three phosphate groups. Their chemistry determines base pairing, stacking, and the directionality of nucleic acid synthesis.',concepts:[{label:'Purines',title:'Adenine & Guanine',desc:'Two-ring (bicyclic) bases. Adenine pairs with thymine (DNA) or uracil (RNA) via 2 H-bonds; guanine pairs with cytosine via 3 H-bonds.'},{label:'Pyrimidines',title:'Cytosine, Thymine & Uracil',desc:'Single-ring bases. Cytosine is in both DNA and RNA; thymine only in DNA (methyl group at C5); uracil only in RNA.'},{label:'Sugars',title:"2'-Deoxyribose vs Ribose",desc:"DNA uses 2'-deoxyribose (no OH at C2'); RNA uses ribose. The extra 2'-OH in RNA makes it far more reactive and capable of complex folding."},{label:'Phosphates',title:'Energy Currency & Backbone',desc:'The triphosphate (ATP, GTP etc.) is the activated monomer for synthesis. Hydrolysis of the pyrophosphate drives polymerization forward.'}],body:"Watson-Crick base pairing follows strict complementarity: A-T (2 H-bonds), G-C (3 H-bonds). G-C pairs are more thermodynamically stable, explaining why GC-rich sequences have higher melting temperatures.\n\nBase stacking -- hydrophobic pi-pi interactions between adjacent planar bases -- contributes more to helix stability than hydrogen bonding alone. This is why single-stranded oligomers can still adopt ordered conformations in solution.",points:["Purines (A, G): double-ring; pyrimidines (C, T, U): single-ring -- Chargaff's rules: %A=%T and %G=%C in double-stranded DNA","The 5' to 3' directionality of synthesis is enforced by the geometry of DNA/RNA polymerase active sites","Nucleoside = base + sugar only; nucleotide = base + sugar + phosphate(s)",'Modified bases (e.g., 5-methylcytosine, pseudouridine) play key roles in epigenetics and RNA function'],highlight:{label:'Therapeutic Relevance',text:'Nucleoside analogs are some of the most successful drugs in medicine. Acyclovir (herpes), AZT (HIV), gemcitabine (cancer), and remdesivir (COVID-19) all work by mimicking natural nucleotides but blocking chain extension once incorporated by viral or cellular polymerases.'},viewerType:'nucleotides_viewer'},
intro_basepairs_ctx:{eyebrow:'Biochemistry Fundamentals',title:'Base Pairs in Context',intro:'Watson-Crick base pairs do not exist in isolation -- they are embedded in the sugar-phosphate backbone of the DNA double helix. This view shows each canonical base pair with its full nucleoside context, including the deoxyribose sugars, phosphodiester linkages, and groove annotations.',concepts:[{label:'Major Groove',title:'Wide & Deep (22 A)',desc:'Exposes unique H-bond donor/acceptor patterns for each base pair. Most transcription factors read DNA sequence through major groove contacts.'},{label:'Minor Groove',title:'Narrow & Deep (12 A)',desc:'Less sequence information is exposed. AT-rich minor grooves are narrower and preferred by minor groove binders like netropsin and DAPI.'},{label:'Donors & Acceptors',title:'H-bond Specificity',desc:'Each base presents a unique pattern of H-bond donors (D, pink) and acceptors (A, green) in the grooves, enabling sequence-specific recognition.'},{label:'Backbone',title:'Sugar-Phosphate Chain',desc:"The 5' to 3' directionality of each strand is defined by the phosphodiester bonds linking C3' of one sugar to C5' of the next via phosphate."}],body:"The asymmetry of the double helix creates two distinct grooves. In the major groove, each of the four base pairs (AT, TA, GC, CG) presents a unique combination of H-bond donors, acceptors, and hydrophobic groups -- a 'code' that proteins can read without unwinding the DNA.\n\nThe minor groove contains less discriminatory information: AT and TA pairs both present two acceptors, while GC and CG differ by the presence of the guanine N2 amino group. This is why most sequence-specific DNA-binding proteins use major groove contacts.",points:['A-T: 2 H-bonds, major groove shows donor(N6-H) + acceptor(N7) + acceptor(O4); minor groove shows acceptor(N3) + hydrophobic(C2-H)','G-C: 3 H-bonds, major groove shows acceptor(O6) + acceptor(N7) + donor(N4-H); minor groove shows donor(N2-H) + acceptor(N3) + acceptor(O2)','The glycosidic bond connects N9 (purines) or N1 (pyrimidines) to C1\u2032 of deoxyribose','Phosphodiester bonds link the 3\u2032-OH of one nucleotide to the 5\u2032-phosphate of the next'],highlight:{label:'Drug Design',text:'Understanding groove geometry is critical for drug design. Cisplatin crosslinks adjacent guanines in the major groove. Minor groove binders like Hoechst 33258 and distamycin preferentially bind AT-rich sequences due to the narrower minor groove width and favorable van der Waals contacts.'},viewerType:'basepair_context'},
intro_dna_rna:{eyebrow:'Biochemistry Fundamentals',title:'DNA & RNA Structure',intro:'DNA and RNA are polynucleotides that store and transmit genetic information. Their three-dimensional structures -- the double helix and diverse RNA folds -- are directly linked to their biological functions.',concepts:[{label:'B-form DNA',title:'The Double Helix',desc:'Right-handed, ~10.5 bp/turn, 3.4 A rise/bp. Major groove (22A wide, deep) is where most transcription factors bind. Minor groove (12A wide) is where minor groove binders like drugs intercalate.'},{label:'A-form',title:'RNA:DNA Hybrid',desc:'Found in RNA:DNA hybrids during transcription and in dehydrated DNA. 11 bp/turn, 2.6 A rise, wider and shorter than B-form. Minor groove becomes deep and narrow.'},{label:'RNA Hairpin',title:'Secondary Structure',desc:'Single-stranded RNA folds via intramolecular base pairing. Hairpin loops are the most common RNA secondary structure motif, critical for ribozymes, riboswitches, and miRNAs.'},{label:'Grooves',title:'Protein Recognition',desc:'The major groove exposes base-specific H-bond donors and acceptors. Transcription factors read sequence information primarily through major groove contacts without unwinding DNA.'}],body:"The DNA double helix exists primarily in B-form under physiological conditions: a right-handed helix with ~10.5 base pairs per turn, a rise of 3.4 Å per base pair, and a diameter of ~20 Å. The two antiparallel strands wrap around a common axis, but because the glycosidic bonds connecting bases to sugars are not diametrically opposite, the helix has asymmetric grooves. The major groove (22 Å wide, 8.5 Å deep) exposes a unique pattern of hydrogen bond donors and acceptors for each base pair, allowing proteins to read the DNA sequence without unwinding it. The minor groove (12 Å wide, 7.5 Å deep) provides less sequence information but is the binding site for many drugs.\n\nRNA forms diverse structures because of its 2'-OH: ribose pucker, local A-form helices, and tertiary contacts through 2'-OH hydrogen bonds enable RNA to fold into complex 3D architectures like the ribosome active site.",points:['The DNA double helix has a thermodynamic stability of ~0.5-2 kJ/mol per base pair from base stacking and hydrogen bonding','G-C base pairs form 3 hydrogen bonds; A-T/A-U pairs form 2 -- explaining higher melting temperatures of GC-rich DNA','The ribosome active site (peptidyl transferase center) is composed entirely of rRNA -- establishing it as a ribozyme','Z-form DNA (left-handed) forms under negative supercoiling and at CpG repeats -- its biological role is still debated'],highlight:{label:'Structural Biology',text:'Cryo-EM has resolved ribosome structures at near-atomic resolution, revealing how RNA and protein work together. Watson and Crick built their 1953 double helix model from X-ray fiber diffraction data of Rosalind Franklin -- a landmark moment in structural biology.'},viewerType:'dna_viewer'},
intro_units:{eyebrow:'Biochemistry Fundamentals',title:'Units, Molarity & Conversions',intro:'Working in the lab requires fluency in unit conversions — between mass and moles, concentration units, and metric prefixes. Molarity (M = mol/L) is the standard concentration unit, but researchers constantly convert between M, mM, µM, nM, mg/mL, and µg/µL.',concepts:[{label:'Molarity',title:'M = mol/L',desc:'Moles of solute per liter of solution. A 1 M NaCl solution contains 58.44 g NaCl per liter (MW = 58.44 g/mol).'},{label:'Mass ↔ Moles',title:'n = mass / MW',desc:'Moles = mass (g) / molecular weight (g/mol). For a 66.5 kDa protein like BSA: 66.5 mg = 1 µmol.'},{label:'mg/mL ↔ µM',title:'Concentration Conversion',desc:'mg/mL = (µM × MW) / 1000. For BSA (66.5 kDa): 1 mg/mL = 15.04 µM. For a small molecule (MW 500): 1 mg/mL = 2000 µM = 2 mM.'},{label:'Dilutions',title:'C₁V₁ = C₂V₂',desc:'The dilution equation. To make 100 mL of 10 mM from a 1 M stock: V₁ = (10 mM × 100 mL) / 1000 mM = 1 mL.'}],body:"Metric prefixes in biochemistry span an enormous range: molar (M, 10⁰), millimolar (mM, 10⁻³), micromolar (µM, 10⁻⁶), nanomolar (nM, 10⁻⁹), picomolar (pM, 10⁻¹²), femtomolar (fM, 10⁻¹⁵). Drug affinities are typically nM-µM; enzyme Km values are µM-mM; physiological ion concentrations are mM.\n\nProtein concentrations are often reported in mg/mL because absorbance at 280 nm gives mg/mL directly via Beer-Lambert law: A₂₈₀ = ε × c × l. Converting to molar requires knowing the molecular weight. For antibodies (~150 kDa): 1 mg/mL ≈ 6.67 µM.",points:['1 Dalton (Da) = 1 g/mol. A 50 kDa protein has MW = 50,000 g/mol','To convert mg/mL to µM: multiply by 1,000,000 and divide by MW (in Da)','Beer-Lambert: A = εcl. For proteins: ε₂₈₀ depends on Trp/Tyr content','Common stock concentrations: 1 M NaCl, 1 M Tris, 0.5 M EDTA, 10% SDS (w/v = g/100mL)','C₁V₁ = C₂V₂ assumes volumes are additive (valid for dilute aqueous solutions)'],highlight:{label:'Lab Essentials',text:'The most common mistake in the lab is unit errors. Always write out your units at every step of a calculation. 1 mg/mL of a 10 kDa protein is 100 µM, but 1 mg/mL of a 100 kDa protein is only 10 µM — a 10-fold difference from the same mass concentration. The interactive calculator on the right handles all of these conversions.'},viewerType:'unit_converter'},
protein_levels:{eyebrow:'Protein Structure & Folding',title:'Levels of Protein Structure',intro:'Proteins are organized into four hierarchical levels of structure. Understanding these levels is fundamental to grasping how a linear amino acid sequence becomes a functional three-dimensional molecular machine.',concepts:[{label:'Primary',title:'Amino Acid Sequence',desc:'The linear sequence of amino acids linked by covalent peptide bonds, encoded directly by the gene and read N to C terminus.'},{label:'Secondary',title:'Alpha-Helices & Beta-Sheets',desc:'Local backbone folding stabilized by H-bonds between backbone NH and C=O groups -- no side-chain involvement required.'},{label:'Tertiary',title:'3D Fold',desc:'Overall 3D shape of a single polypeptide, stabilized by hydrophobic, ionic, H-bond, and disulfide interactions between side chains.'},{label:'Quaternary',title:'Multi-subunit Assembly',desc:'Multiple polypeptide chains assembled into a functional complex, e.g. hemoglobin alpha-2 beta-2 tetramer.'}],body:"The primary structure is the most fundamental level -- a specific sequence of amino acids held together by covalent peptide bonds. Anfinsen's classic experiment demonstrated that this sequence encodes all information necessary to fold into the native conformation.\n\nSecondary structure refers to regular local substructures stabilized by backbone H-bonding. The alpha-helix has 3.6 residues per turn, with a pitch of 5.4 A. Beta-sheets can be parallel or antiparallel.",points:["Anfinsen's ribonuclease experiment showed that a denatured protein refolds spontaneously — primary sequence alone encodes all folding information",'Alpha-helices repeat every 3.6 residues with a pitch of 5.4 A per turn','Hydrophobic collapse of the core is a major thermodynamic driver of tertiary structure','Quaternary assemblies enable cooperativity, allostery, and compartmentalization'],highlight:{label:'Clinical Relevance',text:'Sickle cell disease results from a single amino acid substitution (Glu to Val) at position 6 of beta-globin. This surface change causes pathological quaternary assembly into fibers under low-oxygen conditions, deforming red blood cells.'},viewerType:'3d_viewer',structures:[{pdb:'4HHB',name:'Hemoglobin',desc:'Classic alpha-2 beta-2 quaternary tetramer',color:'#3b82f6'},{pdb:'1VII',name:'Villin Headpiece',desc:'Ultra-fast folding alpha-helix bundle',color:'#8b5cf6'},{pdb:'2LZM',name:'T4 Lysozyme',desc:'Mixed alpha/beta fold',color:'#06b6d4'}]},
protein_ss_builder:{eyebrow:'Protein Structure & Folding',title:'Secondary Structure Builder',intro:'Use the interactive builder on the right to design your own polypeptide sequence and watch it fold into helices, sheets, and loops in real time. Secondary structure predictions are based on Chou-Fasman propensity values.',concepts:[{label:'Helix propensity',title:'Helix-favoring residues',desc:'Ala, Glu, Leu, Met have high helix propensities (H-values > 1.2). Their side chains do not clash with the helix backbone.'},{label:'Sheet propensity',title:'Strand-favoring residues',desc:'Val, Ile, Tyr, Phe have high sheet propensities. Their branched or flat side chains pack well into beta-sheet cores.'},{label:'Breakers',title:'Helix/sheet disruptors',desc:"Gly provides too much flexibility (no helix H-bonding anchor). Pro's rigid ring disrupts both helices and sheets."},{label:'Amphipathic helices',title:'Membrane-active sequences',desc:'Alternating hydrophobic/hydrophilic residues every 3-4 residues form amphipathic helices that interact with membranes.'}],body:"The Chou-Fasman method uses empirical propensities derived from known protein structures. Each amino acid has a helix propensity (P-alpha) and sheet propensity (P-beta) derived from its frequency in each structure type.\n\nIn the builder: click any amino acid button to add it to the sequence. The predicted secondary structure updates in real time. Click a residue in the sequence to remove it. Try sequences like AAAAAAAAA (all alanine = strong helix) or VIVIVI (alternating Val-Ile = beta strand).",points:['Try AAAAAAAAA -- alanine is the strongest helix-forming amino acid (P-alpha = 1.45)','Try VIVIVI -- beta-branched residues strongly favor extended beta-strand conformation','Try GPGPGP -- glycine and proline break both helices and sheets, forcing coil conformation','Real proteins require context-dependent prediction -- simple propensity methods have ~65% accuracy'],highlight:{label:'Try It',text:'Build a 10-15 residue sequence using mostly Ala and Glu to see a strong alpha-helix prediction. Then swap in 3-4 Val and Ile residues to see the strand propensity kick in.'},viewerType:'ss_builder'},
protein_ramachandran:{eyebrow:'Protein Structure & Folding',title:'Ramachandran Plot Explorer',intro:'The Ramachandran plot maps the allowed backbone dihedral angles of amino acid residues. It reveals the geometric constraints that determine which secondary structures are possible and which are forbidden by steric clashes.',concepts:[{label:'Phi angle',title:'N-Calpha bond rotation',desc:'Phi describes rotation around the N-Calpha bond. Most values are restricted to -180 to -30 degrees by steric clashes with the carbonyl oxygen of the preceding residue.'},{label:'Psi angle',title:'Calpha-C bond rotation',desc:'Psi describes rotation around the Calpha-C bond. Together phi and psi fully define the backbone conformation at each residue.'},{label:'Forbidden regions',title:'Steric exclusion',desc:"Most of the Ramachandran plot is disallowed due to steric collisions between backbone atoms. Only ~10% of phi/psi space is accessible for most amino acids."},{label:'Glycine exception',title:'No chiral center',desc:'Glycine has two H atoms instead of an R-group, allowing access to all four quadrants of the Ramachandran plot -- enabling tight turns inaccessible to other residues.'}],body:"The original Ramachandran plot was calculated by G.N. Ramachandran and colleagues in 1963 by computing steric clashes between hard-sphere representations of backbone atoms. Modern calculations use energy functions.\n\nClick any region of the plot on the right to see which secondary structure it corresponds to and why those phi/psi values are favored. The colored dots represent canonical secondary structure conformations.",points:['Alpha-helix: phi ~-57, psi ~-47 (upper left cluster)','Beta-strand: phi ~-120, psi ~+113 (upper right cluster)','Left-handed helix: phi ~+57, psi ~+47 -- only Gly commonly adopts this','PROCHECK and MolProbity use Ramachandran analysis to validate protein crystal structures'],highlight:{label:'Structure Validation',text:'The Ramachandran plot is used to validate protein structures from X-ray crystallography and cryo-EM. In a well-refined structure, >98% of non-Gly/Pro residues should fall in the core allowed regions. Outliers indicate potential modeling errors.'},viewerType:'ramachandran'},
protein_folding:{eyebrow:'Protein Structure & Folding',title:'Protein Folding Mechanisms',intro:"How does a random coil reliably fold into a precise three-dimensional structure in milliseconds? The folding process is guided by thermodynamics, shaped by the energy landscape, and described by Levinthal's paradox.",concepts:[{label:'Thermodynamics',title:'Free Energy Minimization',desc:'Folding is driven by the decrease in free energy. The native state is the thermodynamic minimum accessible under physiological conditions.'},{label:'Kinetics',title:'Folding Funnels',desc:"The energy landscape is funnel-shaped. Many unfolded conformations converge to the native state, resolving Levinthal's paradox of astronomical search times."},{label:'Hydrophobic Effect',title:'Core Burial',desc:'Hydrophobic residues are sequestered in the protein interior, reducing unfavorable contact with water. This is the primary thermodynamic driver.'},{label:'Disulfide Bonds',title:'Covalent Stabilization',desc:'Oxidative crosslinking of cysteine pairs provides additional stabilization in extracellular proteins.'}],body:"Levinthal's paradox illustrates why protein folding cannot be a random search: a 100-residue protein with just 3 conformations per residue has 3^100 (~5×10^47) possible states. Even sampling one per picosecond, searching all of them would take longer than the age of the universe. Yet most proteins fold in milliseconds to seconds.\n\nThe resolution is that proteins fold along guided pathways on a funnel-shaped energy landscape. Early in folding, a nucleus of native-like contacts forms (often involving hydrophobic residues that will become the protein core). The chain then condenses around this nucleus in a process called nucleation-condensation. Many proteins pass through a molten globule intermediate — a state that is compact and has native-like secondary structure, but lacks the fixed tertiary contacts of the native state.",points:["Levinthal's paradox: random search would take ~10^300 years; folding occurs in milliseconds to seconds","phi-value analysis maps which residues form native contacts in the folding transition state",'Molten globules have defined secondary but not fixed tertiary structure','The native state is the lowest free energy state accessible, not necessarily the global minimum'],highlight:{label:'Key Insight',text:'The distinction between thermodynamic stability and kinetic accessibility is crucial. Some sequences can access alternative low-energy conformations (e.g., amyloid) that may be more stable than the functional native state -- with dire pathological consequences.'},viewerType:'3d_viewer',structures:[{pdb:'1UBQ',name:'Ubiquitin',desc:'Classic small beta-grasp fold',color:'#3b82f6'},{pdb:'1L2Y',name:'Trp-cage',desc:'Smallest designed miniprotein',color:'#10b981'}]},
protein_chaperones:{eyebrow:'Protein Structure & Folding',title:'Molecular Chaperones',intro:'Not all proteins fold spontaneously in the crowded cellular environment. Molecular chaperones prevent premature aggregation and provide protected environments where folding can proceed correctly.',concepts:[{label:'Hsp70',title:'Holdases',desc:'Bind exposed hydrophobic patches on newly synthesized chains, preventing aggregation co-translationally.'},{label:'GroEL/ES',title:'Foldases',desc:"Barrel-shaped cage (Anfinsen cage) providing an isolated hydrophilic environment for a single protein molecule to fold."},{label:'Hsp90',title:'Conformational Regulators',desc:'Stabilize metastable signaling proteins including kinases and hormone receptors. Upregulated in many cancers.'},{label:'TRiC/CCT',title:'Eukaryotic Chaperonin',desc:'Eukaryotic equivalent of GroEL/ES. Essential for folding actin, tubulin, and other cytoskeletal proteins.'}],body:"The GroEL/GroES system is the best-characterized chaperonin. GroEL forms a double-ring barrel. Substrates bind in the central cavity. GroES caps the ring, enclosing the substrate in a hydrophilic environment. ATP hydrolysis drives large allosteric conformational changes.\n\nIn E. coli, ~10-15% of newly synthesized proteins require GroEL/GroES for proper folding. Obligate clients are enriched in TIM-barrel topologies prone to kinetic trapping.",points:['Hsp70 (DnaK) binds hydrophobic segments of nascent chains emerging from the ribosome','GroEL undergoes dramatic ATP-driven allosteric conformational changes upon GroES binding','Many cancer cells are addicted to Hsp90 because their mutated oncoproteins require it for stability','The heat shock response (HSF1) upregulates chaperones when unfolded proteins accumulate'],highlight:{label:'Cancer Dependency',text:'Many cancer cells are addicted to Hsp90 because their mutated, unstable oncoproteins (mutant kinases, HER2, EGFR) require constant chaperone support. Hsp90 inhibitors (geldanamycin, ganetespib) have been extensively tested as cancer therapeutics.'},viewerType:'3d_viewer',structures:[{pdb:'1AON',name:'GroEL-GroES',desc:'Double-ring chaperonin barrel',color:'#3b82f6'},{pdb:'4B9Q',name:'Hsp90 dimer',desc:'Eukaryotic Hsp90 closed conformation',color:'#f59e0b'}]},
