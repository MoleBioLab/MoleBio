// CENTRAL DOGMA FLOW — DNA → mRNA → Protein with live mutation tracking
// ============================================================
const DOGMA_CODON=CODON_TABLE;// reuse existing codon table
const DOGMA_3TO1=AA3TO1;
const DOGMA_COLORS={A:'#3b82f6',T:'#10b981',G:'#8b5cf6',C:'#f59e0b',U:'#ef4444'};
const DOGMA_AA_COL=AA_COLORS;

let dogmaSeq='ATGGTGCACCTGACTCCTGAGGAGAAGTCTGCCGTTACTGCCCTGTGGGGCAAGGTG';// HBB start
let dogmaOrigSeq='';
let dogmaMutPos=-1;

function renderDogmaPanel(){
  dogmaOrigSeq=dogmaSeq;
  dogmaMutPos=-1;
  const p=document.getElementById('right-panel');
  p.innerHTML=`
<div class="vp-header"><div class="vp-title">Central Dogma Flow</div><div class="vp-desc">Edit DNA to see mutations propagate through transcription &amp; translation</div></div>
<div style="padding:.5rem .8rem;border-bottom:1px solid var(--border);flex-shrink:0;">
  <div style="display:flex;gap:.3rem;margin-bottom:.3rem;flex-wrap:wrap;">
    <button class="vp-btn" onclick="setDogmaSeq('ATGGTGCACCTGACTCCTGAGGAGAAGTCTGCCGTTACTGCCCTGTGGGGCAAGGTG')">HBB (normal)</button>
    <button class="vp-btn" onclick="setDogmaSeq('ATGGTGCACCTGACTCCTGTGGAGAAGTCTGCCGTTACTGCCCTGTGGGGCAAGGTG')">HBB (sickle cell)</button>
    <button class="vp-btn" onclick="setDogmaSeq('ATGGCTAGCGATTTTCAGTGGAAATAG')">Short demo</button>
  </div>
  <label style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--text-muted);display:block;margin-bottom:.2rem;">DNA coding strand (5'→3') — click any base to mutate it</label>
</div>
<div style="flex:1;overflow-y:auto;padding:.5rem .8rem;" id="dogma-display"></div>`;
  renderDogmaFlow();
}

function setDogmaSeq(seq){
  dogmaSeq=seq;dogmaOrigSeq=seq;dogmaMutPos=-1;
  renderDogmaFlow();
}

function renderDogmaFlow(){
  const el=document.getElementById('dogma-display');if(!el)return;
  const dna=dogmaSeq.toUpperCase().replace(/[^ATGC]/g,'');
  // Transcribe: coding strand T→U
  const mrna=dna.replace(/T/g,'U');
  // Template strand (complement, shown 3'→5')
  const template=dna.split('').map(c=>({A:'T',T:'A',G:'C',C:'G'}[c])).join('');
  // Translate from first AUG
  let startIdx=-1;
  for(let i=0;i<=mrna.length-3;i++){if(mrna.substring(i,i+3)==='AUG'){startIdx=i;break;}}

  const codons=[];
  if(startIdx>=0){
    for(let i=startIdx;i<=mrna.length-3;i+=3){
      const codon=mrna.substring(i,i+3);
      const aa=DOGMA_CODON[codon]||'?';
      codons.push({codon,aa,c1:DOGMA_3TO1[aa]||'?',dnaIdx:i});
      if(aa==='Stop')break;
    }
  }

  // Compare with original to find mutations
  const origMrna=dogmaOrigSeq.toUpperCase().replace(/[^ATGC]/g,'').replace(/T/g,'U');
  const origCodons=[];
  if(startIdx>=0){
    for(let i=startIdx;i<=origMrna.length-3;i+=3){
      const codon=origMrna.substring(i,i+3);
      const aa=DOGMA_CODON[codon]||'?';
      origCodons.push({codon,aa,c1:DOGMA_3TO1[aa]||'?'});
      if(aa==='Stop')break;
    }
  }

  let html='';

  // ── 1. DNA CODING STRAND ──
  html+=`<div style="margin-bottom:.6rem;">
    <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;">
      <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:#3b82f6;font-weight:700;">DNA</span>
      <span style="font-size:.55rem;color:var(--text-muted);">coding strand 5'→3'</span>
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:.8rem;line-height:2;word-break:break-all;">`;
  for(let i=0;i<dna.length;i++){
    const b=dna[i];
    const origB=dogmaOrigSeq[i]||'';
    const isMut=(b!==origB&&dogmaOrigSeq.length>0&&i<dogmaOrigSeq.length);
    const col=DOGMA_COLORS[b]||'#94a3b8';
    const bg=isMut?'rgba(239,68,68,.2)':'transparent';
    const outline=isMut?'outline:2px solid #ef4444;outline-offset:1px;':'';
    html+=`<span onclick="mutateDogmaBase(${i})" style="cursor:pointer;color:${col};padding:0 1px;border-radius:2px;background:${bg};${outline}transition:all .1s;" title="Position ${i+1}: ${b}${isMut?' (mutated from '+origB+')':''}">${b}</span>`;
    // Codon spacing
    if(startIdx>=0&&i>=startIdx&&(i-startIdx)%3===2)html+='<span style="color:var(--border)"> </span>';
  }
  html+=`</div></div>`;

  // ── 2. TEMPLATE STRAND ──
  html+=`<div style="margin-bottom:.6rem;">
    <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;">
      <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:#ef4444;font-weight:700;">Template</span>
      <span style="font-size:.55rem;color:var(--text-muted);">3'→5'</span>
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text-muted);word-break:break-all;">`;
  for(let i=0;i<template.length;i++){
    html+=template[i];
    if(startIdx>=0&&i>=startIdx&&(i-startIdx)%3===2)html+=' ';
  }
  html+=`</div></div>`;

  // ── Arrow: Transcription ──
  html+=`<div style="display:flex;align-items:center;gap:.4rem;margin:.3rem 0;padding:.3rem .5rem;background:rgba(139,92,246,.06);border-radius:4px;border-left:3px solid #8b5cf6;">
    <span style="font-size:.9rem;">↓</span>
    <span style="font-family:'DM Mono',monospace;font-size:.65rem;color:#a78bfa;font-weight:600;">TRANSCRIPTION</span>
    <span style="font-size:.55rem;color:var(--text-muted);">RNA Polymerase · T→U</span>
  </div>`;

  // ── 3. mRNA ──
  html+=`<div style="margin-bottom:.6rem;">
    <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;">
      <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:#f59e0b;font-weight:700;">mRNA</span>
      <span style="font-size:.55rem;color:var(--text-muted);">5'→3'</span>
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:.8rem;line-height:2;word-break:break-all;">`;
  for(let i=0;i<mrna.length;i++){
    const b=mrna[i];
    const origB=origMrna[i]||'';
    const isMut=(b!==origB&&origMrna.length>0&&i<origMrna.length);
    const col=DOGMA_COLORS[b]||'#94a3b8';
    const bg=isMut?'rgba(239,68,68,.2)':'transparent';
    html+=`<span style="color:${col};background:${bg};padding:0 1px;border-radius:2px;">${b}</span>`;
    if(startIdx>=0&&i>=startIdx&&(i-startIdx)%3===2)html+='<span style="color:var(--border)"> </span>';
  }
  html+=`</div></div>`;

  // ── Arrow: Translation ──
  html+=`<div style="display:flex;align-items:center;gap:.4rem;margin:.3rem 0;padding:.3rem .5rem;background:rgba(16,185,129,.06);border-radius:4px;border-left:3px solid #10b981;">
    <span style="font-size:.9rem;">↓</span>
    <span style="font-family:'DM Mono',monospace;font-size:.65rem;color:#34d399;font-weight:600;">TRANSLATION</span>
    <span style="font-size:.55rem;color:var(--text-muted);">Ribosome · Codons → Amino Acids</span>
  </div>`;

  // ── 4. CODONS → AMINO ACIDS ──
  html+=`<div style="margin-bottom:.6rem;">
    <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;">
      <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:#10b981;font-weight:700;">Protein</span>
    </div>
    <div style="display:flex;gap:3px;flex-wrap:wrap;">`;
  codons.forEach((c,i)=>{
    const orig=origCodons[i];
    const isMut=orig&&(c.codon!==orig.codon);
    const aaMut=orig&&(c.c1!==orig.c1);
    const col=DOGMA_AA_COL[c.c1]||'#94a3b8';

    let mutType='';
    if(isMut&&!aaMut)mutType='silent';
    else if(isMut&&c.aa==='Stop'&&orig.aa!=='Stop')mutType='nonsense';
    else if(aaMut)mutType='missense';

    const borderCol=mutType==='nonsense'?'#ef4444':mutType==='missense'?'#f59e0b':mutType==='silent'?'#10b981':col;
    const bg=mutType?borderCol+'22':'transparent';

    html+=`<div style="display:flex;flex-direction:column;align-items:center;padding:2px 4px;border-radius:4px;border:1px solid ${mutType?borderCol:col+'33'};background:${bg};min-width:32px;" title="${c.codon} → ${c.aa} (${c.c1})${mutType?' — '+mutType+' mutation':''}">
      <span style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--text-muted);">${c.codon}</span>
      <span style="font-size:.85rem;font-weight:700;color:${col};">${c.aa==='Stop'?'■':c.c1}</span>
      <span style="font-family:'DM Mono',monospace;font-size:.5rem;color:var(--text-muted);">${c.aa}</span>
      ${mutType?`<span style="font-family:'DM Mono',monospace;font-size:.45rem;color:${borderCol};font-weight:700;">${mutType}</span>`:''}
    </div>`;
  });
  if(startIdx<0)html+=`<span style="font-size:.7rem;color:#f87171;">No AUG start codon found</span>`;
  html+=`</div></div>`;

  // ── Mutation summary ──
  const mutations=[];
  for(let i=0;i<Math.max(dna.length,dogmaOrigSeq.length);i++){
    if(dna[i]!==dogmaOrigSeq[i]&&dogmaOrigSeq[i])mutations.push({pos:i+1,from:dogmaOrigSeq[i],to:dna[i]||'del'});
  }
  if(mutations.length>0){
    html+=`<div style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:6px;padding:.5rem .7rem;margin-top:.3rem;">
      <div style="font-family:'DM Mono',monospace;font-size:.6rem;color:#f87171;margin-bottom:.2rem;">MUTATIONS (${mutations.length})</div>`;
    mutations.forEach(m=>{
      html+=`<div style="font-family:'DM Mono',monospace;font-size:.62rem;color:var(--text-dim);">pos ${m.pos}: ${m.from}→${m.to}</div>`;
    });
    // Count mutation types in protein
    let silent=0,missense=0,nonsense=0;
    codons.forEach((c,i)=>{
      const orig=origCodons[i];
      if(!orig||c.codon===orig.codon)return;
      if(c.c1===orig.c1)silent++;
      else if(c.aa==='Stop'&&orig.aa!=='Stop')nonsense++;
      else missense++;
    });
    html+=`<div style="font-size:.6rem;color:var(--text-muted);margin-top:.2rem;">Effect: ${silent} silent · ${missense} missense · ${nonsense} nonsense</div>`;
    html+=`</div>`;
    html+=`<button class="vp-btn" style="margin-top:.3rem;" onclick="dogmaSeq=dogmaOrigSeq;renderDogmaFlow()">Reset to original</button>`;
  }

  el.innerHTML=html;
}

function mutateDogmaBase(idx){
  const bases=['A','T','G','C'];
  const current=dogmaSeq[idx];
  const options=bases.filter(b=>b!==current);
  // Cycle to next base
  const next=options[0];
  dogmaSeq=dogmaSeq.substring(0,idx)+next+dogmaSeq.substring(idx+1);
  dogmaMutPos=idx;
  renderDogmaFlow();
}

function renderSeqConvPanel(){

function updateSeqConv(){
  const res=document.getElementById('seqconv-results');if(!res)return;
  const raw=seqConvInput||'';

  let dna='',rna='',protein='';
  const cleanDNA=raw.toUpperCase().replace(/[^ATGC]/g,'');
  const cleanRNA=raw.toUpperCase().replace(/[^AUGC]/g,'');
  const cleanProtein=raw.toUpperCase().replace(/[^ACDEFGHIKLMNPQRSTVWY*]/g,'');

  if(seqConvType==='dna'){
    dna=cleanDNA;
    rna=dna.replace(/T/g,'U');
  } else if(seqConvType==='rna'){
    rna=cleanRNA;
    dna=rna.replace(/U/g,'T');
  } else {
    protein=cleanProtein;
  }

  if(seqConvType!=='protein'&&dna.length<1){
    res.innerHTML='<div style="font-size:.75rem;color:var(--text-muted)">Enter a sequence above...</div>';
    return;
  }
  if(seqConvType==='protein'&&protein.length<1){
    res.innerHTML='<div style="font-size:.75rem;color:var(--text-muted)">Enter a protein sequence above...</div>';
    return;
  }

  function outBox(title,seq,col,mono){
    const formatted=seq.match(/.{1,60}/g)?.join('\n')||seq;
    return `<div style="margin-bottom:.6rem;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.2rem;">
        <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:${col};font-weight:700;">${title}</span>
        <button class="vp-btn" style="font-size:.55rem;padding:.1em .4em;" onclick="navigator.clipboard?.writeText('${seq.replace(/'/g,"\\'")}')?.then(()=>this.textContent='Copied!');setTimeout(()=>this.textContent='Copy',1000)">Copy</button>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:.4rem .5rem;font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text);word-break:break-all;white-space:pre-wrap;max-height:100px;overflow-y:auto;line-height:1.6;">${formatted}</div>
      <div style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--text-muted);margin-top:.15rem;">${seq.length} ${mono||'nt'}</div>
    </div>`;
  }

  let html='';

  if(seqConvType!=='protein'){
    // DNA output
    html+=outBox('DNA (5\'→3\')',dna,'#3b82f6','nt');

    // Complement
    const comp=dna.split('').map(c=>({A:'T',T:'A',G:'C',C:'G'}[c]||c)).join('');
    html+=outBox('Complement (3\'→5\')',comp,'#64748b','nt');

    // Reverse complement
    const revcomp=comp.split('').reverse().join('');
    html+=outBox('Reverse Complement (5\'→3\')',revcomp,'#ef4444','nt');

    // RNA
    html+=outBox('mRNA (5\'→3\')',rna,'#f59e0b','nt');

    // Translate all 3 reading frames
    html+=`<div style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-muted);margin-bottom:.3rem;margin-top:.3rem;">READING FRAMES (forward strand)</div>`;
    for(let frame=0;frame<3;frame++){
      let prot='';
      for(let i=frame;i<=rna.length-3;i+=3){
        const codon=rna.substring(i,i+3);
        const aa=CODON_TABLE[codon];
        prot+=aa==='Stop'?'*':(AA3TO1[aa]||'?');
      }
      const hasORF=prot.includes('M');
      html+=`<div style="margin-bottom:.3rem;">
        <span style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--accent2);">Frame +${frame+1}</span>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:.3rem .4rem;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text);word-break:break-all;max-height:50px;overflow-y:auto;">${
          prot.split('').map(c=>{
            const col=c==='*'?'#ef4444':c==='M'?'#10b981':DOGMA_AA_COL[c]||'#94a3b8';
            return `<span style="color:${col}">${c}</span>`;
          }).join('')
        }</div>
      </div>`;
    }

    // FASTA format
    const fastaHeader='>sequence_'+dna.length+'nt';
    const fastaBody=dna.match(/.{1,60}/g)?.join('\n')||dna;
    html+=outBox('FASTA',fastaHeader+'\n'+fastaBody,'#8b5cf6','nt');

    // Stats
    const A=dna.split('').filter(c=>c==='A').length;
    const T=dna.split('').filter(c=>c==='T').length;
    const G=dna.split('').filter(c=>c==='G').length;
    const C=dna.split('').filter(c=>c==='C').length;
    const gc=((G+C)/dna.length*100).toFixed(1);
    html+=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin-top:.3rem;">
      <div style="background:var(--surface2);border-radius:3px;padding:.3rem;text-align:center;"><div style="font-size:.55rem;color:var(--text-muted);">A</div><div style="font-size:.8rem;font-weight:600;color:#3b82f6;">${A}</div></div>
      <div style="background:var(--surface2);border-radius:3px;padding:.3rem;text-align:center;"><div style="font-size:.55rem;color:var(--text-muted);">T</div><div style="font-size:.8rem;font-weight:600;color:#10b981;">${T}</div></div>
      <div style="background:var(--surface2);border-radius:3px;padding:.3rem;text-align:center;"><div style="font-size:.55rem;color:var(--text-muted);">G</div><div style="font-size:.8rem;font-weight:600;color:#8b5cf6;">${G}</div></div>
      <div style="background:var(--surface2);border-radius:3px;padding:.3rem;text-align:center;"><div style="font-size:.55rem;color:var(--text-muted);">C</div><div style="font-size:.8rem;font-weight:600;color:#f59e0b;">${C}</div></div>
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-muted);margin-top:.2rem;">GC content: ${gc}% · Length: ${dna.length} nt · MW: ~${(dna.length*330).toLocaleString()} Da</div>`;

  } else {
    // Protein mode
    html+=outBox('Protein Sequence',protein,'#10b981','aa');
    // Back-translate (most common codons)
    const COMMON_CODONS={F:'UUU',L:'CUG',I:'AUU',M:'AUG',V:'GUG',S:'UCU',P:'CCG',T:'ACC',A:'GCG',Y:'UAU',H:'CAU',Q:'CAG',N:'AAU',K:'AAA',D:'GAU',E:'GAA',C:'UGU',W:'UGG',R:'CGU',G:'GGC','*':'UAA'};
    let backRNA='';
    for(const c of protein){backRNA+=(COMMON_CODONS[c]||'NNN');}
    const backDNA=backRNA.replace(/U/g,'T');
    html+=outBox('Back-translation (most common E. coli codons)',backDNA,'#3b82f6','nt');
    // FASTA
    html+=outBox('FASTA','>protein_'+protein.length+'aa\n'+(protein.match(/.{1,60}/g)?.join('\n')||protein),'#8b5cf6','aa');
    // Stats
    const N=protein.length;
    let mw=18.02;for(const c of protein){mw+=(AA_MW_FULL[c]||110);}
    html+=`<div style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-muted);margin-top:.3rem;">Length: ${N} aa · MW: ~${mw>=10000?(mw/1000).toFixed(1)+'k':mw.toFixed(0)} Da</div>`;
  }

  res.innerHTML=html;
}

const MM_DEMO_DATA='0.5\t12.1\n1.0\t20.5\n2.0\t32.8\n5.0\t49.2\n10.0\t60.1\n20.0\t68.3\n50.0\t74.8\n100.0\t78.2';

function renderMMFitterPanel(){
  const p=document.getElementById('right-panel');
  p.innerHTML=`
<div class="vp-header"><div class="vp-title">MM Curve Fitter</div><div class="vp-desc">Paste [S] and v data to fit Michaelis-Menten equation</div></div>
<div style="padding:.5rem .8rem;border-bottom:1px solid var(--border);flex-shrink:0;">
  <div style="display:flex;gap:.3rem;margin-bottom:.3rem;">
    <button class="vp-btn" onclick="document.getElementById('mmfit-data').value=MM_DEMO_DATA;fitMM()">Demo data</button>
    <button class="vp-btn" onclick="document.getElementById('mmfit-data').value='';fitMM()">Clear</button>
  </div>
  <label style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--text-muted);display:block;margin-bottom:.2rem;">[S] (tab or comma) v — one pair per line</label>
  <textarea id="mmfit-data" rows="4" placeholder="0.5&#9;12.1&#10;1.0&#9;20.5&#10;2.0&#9;32.8&#10;..." style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:.35rem .5rem;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text);outline:none;resize:vertical;" oninput="fitMM()">${MM_DEMO_DATA}</textarea>
</div>
<div style="flex:1;overflow-y:auto;padding:.5rem .8rem;" id="mmfit-results"></div>`;
  fitMM();

function fitMM(){
  const raw=document.getElementById('mmfit-data')?.value||'';
  const res=document.getElementById('mmfit-results');if(!res)return;
  
  // Parse data
  const data=[];
  raw.split('\n').forEach(line=>{
    const parts=line.trim().split(/[\t,;\s]+/).map(Number);
    if(parts.length>=2&&!isNaN(parts[0])&&!isNaN(parts[1])&&parts[0]>0&&parts[1]>0)
      data.push({s:parts[0],v:parts[1]});
  });
  
  if(data.length<3){
    res.innerHTML='<div style="font-size:.75rem;color:var(--text-muted)">Enter at least 3 data points ([S] v pairs, one per line)...</div>';
    return;
  }

  // Nonlinear least-squares fit using iterative Gauss-Newton
  // Initial estimates from Lineweaver-Burk
  const lbData=data.map(d=>({x:1/d.s,y:1/d.v}));
  const n=lbData.length;
  let sx=0,sy=0,sxx=0,sxy=0;
  lbData.forEach(d=>{sx+=d.x;sy+=d.y;sxx+=d.x*d.x;sxy+=d.x*d.y;});
  const lbSlope=(n*sxy-sx*sy)/(n*sxx-sx*sx);
  const lbInt=(sy-lbSlope*sx)/n;
  let Vmax=Math.max(1,1/lbInt);
  let Km=Math.max(0.01,lbSlope*Vmax);

  // Gauss-Newton iterations
  for(let iter=0;iter<200;iter++){
    let J00=0,J01=0,J10=0,J11=0,r0=0,r1=0;
    data.forEach(d=>{
      const denom=Km+d.s;
      const pred=Vmax*d.s/denom;
      const residual=d.v-pred;
      const dVmax=d.s/denom;
      const dKm=-Vmax*d.s/(denom*denom);
      J00+=dVmax*dVmax;J01+=dVmax*dKm;J10+=dKm*dVmax;J11+=dKm*dKm;
      r0+=dVmax*residual;r1+=dKm*residual;
    });
    const det=J00*J11-J01*J10;
    if(Math.abs(det)<1e-15)break;
    const dVmax=(J11*r0-J01*r1)/det;
    const dKm=(J00*r1-J10*r0)/det;
    Vmax+=dVmax;Km+=dKm;
    if(Vmax<0.01)Vmax=0.01;if(Km<0.001)Km=0.001;
    if(Math.abs(dVmax)<1e-8&&Math.abs(dKm)<1e-8)break;
  }

  // Calculate R²
  const meanV=data.reduce((s,d)=>s+d.v,0)/data.length;
  let ssTot=0,ssRes=0;
  data.forEach(d=>{
    const pred=Vmax*d.s/(Km+d.s);
    ssTot+=(d.v-meanV)**2;
    ssRes+=(d.v-pred)**2;
  });
  const r2=1-ssRes/ssTot;

  // Render results
  let html=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.5rem;">
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;border-left:3px solid #3b82f6;">
      <div style="font-family:'DM Mono',monospace;font-size:.55rem;color:#3b82f6;text-transform:uppercase;">Vmax</div>
      <div style="font-size:1.2rem;font-weight:600;color:var(--text);">${Vmax.toFixed(2)}</div>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;border-left:3px solid #8b5cf6;">
      <div style="font-family:'DM Mono',monospace;font-size:.55rem;color:#8b5cf6;text-transform:uppercase;">Km</div>
      <div style="font-size:1.2rem;font-weight:600;color:var(--text);">${Km.toFixed(2)}</div>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;border-left:3px solid #10b981;">
      <div style="font-family:'DM Mono',monospace;font-size:.55rem;color:#10b981;text-transform:uppercase;">R²</div>
      <div style="font-size:1.2rem;font-weight:600;color:${r2>.95?'#34d399':r2>.9?'#f59e0b':'#ef4444'};">${r2.toFixed(4)}</div>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;border-left:3px solid #f59e0b;">
      <div style="font-family:'DM Mono',monospace;font-size:.55rem;color:#f59e0b;text-transform:uppercase;">Data points</div>
      <div style="font-size:1.2rem;font-weight:600;color:var(--text);">${data.length}</div>
    </div>
  </div>`;

  // Canvas plot
  html+=`<canvas id="mmfit-plot" style="width:100%;height:180px;border-radius:6px;"></canvas>`;

  // Equation
  html+=`<div style="font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text-dim);margin-top:.4rem;padding:.4rem;background:var(--surface2);border-radius:4px;text-align:center;">
    v = ${Vmax.toFixed(2)} · [S] / (${Km.toFixed(2)} + [S])
  </div>`;

  // Residuals table
  html+=`<div style="margin-top:.4rem;font-family:'DM Mono',monospace;font-size:.55rem;color:var(--text-muted);">RESIDUALS</div>
  <div style="max-height:80px;overflow-y:auto;font-family:'DM Mono',monospace;font-size:.6rem;">`;
  data.forEach(d=>{
    const pred=Vmax*d.s/(Km+d.s);
    const resid=d.v-pred;
    const col=Math.abs(resid)<meanV*0.1?'#34d399':'#f59e0b';
    html+=`<div style="display:flex;gap:.5rem;padding:1px 0;color:var(--text-dim);">[S]=${d.s} v=${d.v} pred=${pred.toFixed(2)} <span style="color:${col}">Δ=${resid>=0?'+':''}${resid.toFixed(2)}</span></div>`;
  });
  html+=`</div>`;

  res.innerHTML=html;

  // Draw plot
  setTimeout(()=>{
    const canvas=document.getElementById('mmfit-plot');if(!canvas)return;
    const dpr=window.devicePixelRatio||1;
    const w=canvas.clientWidth,h=canvas.clientHeight;
    canvas.width=w*dpr;canvas.height=h*dpr;
    const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
    ctx.fillStyle='rgba(17,24,39,.5)';ctx.beginPath();ctx.roundRect(0,0,w,h,4);ctx.fill();
    
    const ml=40,mr=10,mt=10,mb=24;
    const pw=w-ml-mr,ph=h-mt-mb;
    const maxS=Math.max(...data.map(d=>d.s))*1.2;
    const maxV=Math.max(Vmax*1.1,Math.max(...data.map(d=>d.v))*1.1);

    // Grid
    ctx.strokeStyle='rgba(100,116,139,.1)';ctx.lineWidth=1;
    for(let i=0;i<=4;i++){const y=mt+i*ph/4;ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(ml+pw,y);ctx.stroke();}

    // Fitted curve
    ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<=200;i++){
      const s=i/200*maxS;const v=Vmax*s/(Km+s);
      const x=ml+s/maxS*pw,y=mt+(1-v/maxV)*ph;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();

    // Vmax asymptote
    const vmaxY=mt+(1-Vmax/maxV)*ph;
    ctx.strokeStyle='rgba(59,130,246,.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(ml,vmaxY);ctx.lineTo(ml+pw,vmaxY);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#3b82f6';ctx.font='bold 8px DM Mono,monospace';ctx.textAlign='left';
    ctx.fillText('Vmax',ml+2,vmaxY-3);

    // Km marker
    const kmX=ml+Km/maxS*pw,halfVy=mt+(1-Vmax/2/maxV)*ph;
    ctx.strokeStyle='rgba(139,92,246,.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(kmX,mt);ctx.lineTo(kmX,mt+ph);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#8b5cf6';ctx.textAlign='center';
    ctx.fillText('Km',kmX,mt+ph+14);

    // Data points
    data.forEach(d=>{
      const x=ml+d.s/maxS*pw,y=mt+(1-d.v/maxV)*ph;
      ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#f59e0b';ctx.fill();
      ctx.strokeStyle='#b45309';ctx.lineWidth=1.5;ctx.stroke();
    });

    // Axes
    ctx.fillStyle='#64748b';ctx.font='8px DM Mono,monospace';ctx.textAlign='center';
    ctx.fillText('[S]',ml+pw/2,mt+ph+18);
    ctx.textAlign='right';
    for(let i=0;i<=4;i++){const v=maxV*(4-i)/4;ctx.fillText(v.toFixed(0),ml-4,mt+i*ph/4+3);}
    ctx.save();ctx.translate(8,mt+ph/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('v',0,0);ctx.restore();
  },50);
}

// Focus trap for modals (WCAG 2.4.3)
function trapFocus(modal){
  const focusable=modal.querySelectorAll('button,a,[href],input,textarea,select,[tabindex]:not([tabindex="-1"])');
  if(!focusable.length)return;
  const first=focusable[0],last=focusable[focusable.length-1];
  first.focus();
  modal._trapHandler=function(e){
    if(e.key==='Tab'){
      if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus();}}
      else{if(document.activeElement===last){e.preventDefault();first.focus();}}
    }
    if(e.key==='Escape'){modal.remove();}
  };
  modal.addEventListener('keydown',modal._trapHandler);
}

function getMW(){return parseFloat(document.getElementById('uc-mw')?.value)||0;}

const MASS_FACTORS={g:1,mg:1e-3,ug:1e-6,ng:1e-9};
const MOLE_FACTORS={mol:1,mmol:1e-3,umol:1e-6,nmol:1e-9,pmol:1e-12};
const CONC_FACTORS={M:1,mM:1e-3,uM:1e-6,nM:1e-9};
const VOL_FACTORS={L:1,mL:1e-3,uL:1e-6};

function fmtNum(n){
  if(n===0)return '0';
  if(Math.abs(n)>=1e6)return n.toExponential(2);
  if(Math.abs(n)>=1000)return n.toLocaleString(undefined,{maximumFractionDigits:1});
  if(Math.abs(n)>=1)return n.toFixed(3);
  if(Math.abs(n)>=0.001)return n.toFixed(4);
  return n.toExponential(2);
}

function bestUnit(valInBase,factors,units){
  // Find the unit that gives a value between 0.1 and 9999
  for(const u of units){
    const v=valInBase/factors[u];
    if(v>=0.1&&v<10000)return {val:v,unit:u};
  }
  return {val:valInBase/factors[units[0]],unit:units[0]};
}

function calcFromMass(){
  const mw=getMW();if(mw<=0)return;
  const mass=Math.max(0,parseFloat(document.getElementById('uc-mass')?.value)||0);
  const unit=document.getElementById('uc-mass-unit')?.value||'mg';
  const massG=mass*MASS_FACTORS[unit];
  const moles=massG/mw;// in mol
  const r=document.getElementById('uc-mass-result');if(!r)return;
  const b1=bestUnit(moles,MOLE_FACTORS,['mol','mmol','umol','nmol','pmol']);
  r.innerHTML=`= <span style="color:var(--accent)">${fmtNum(b1.val)} ${b1.unit}</span>`;
}

function calcFromMoles(){
  const mw=getMW();if(mw<=0)return;
  const moles=Math.max(0,parseFloat(document.getElementById('uc-moles')?.value)||0);
  const unit=document.getElementById('uc-moles-unit')?.value||'umol';
  const molesBase=moles*MOLE_FACTORS[unit];
  const massG=molesBase*mw;
  const r=document.getElementById('uc-moles-result');if(!r)return;
  const b1=bestUnit(massG,MASS_FACTORS,['g','mg','ug','ng']);
  r.innerHTML=`= <span style="color:var(--accent)">${fmtNum(b1.val)} ${b1.unit}</span>`;
}

function calcMgMl(){
  const mw=getMW();if(mw<=0)return;
  const mgml=Math.max(0,parseFloat(document.getElementById('uc-mgml')?.value)||0);
  const molar=mgml/mw*1e6;// mg/mL → µM: (mg/mL * 1e6) / MW(Da)
  const molarM=mgml/(mw*1e-3);// in M
  const r=document.getElementById('uc-mgml-result');if(!r)return;
  const b=bestUnit(molarM,CONC_FACTORS,['M','mM','uM','nM']);
  r.innerHTML=`= <span style="color:var(--accent)">${fmtNum(b.val)} ${b.unit}</span>`;
}

function calcMolar(){
  const mw=getMW();if(mw<=0)return;
  const conc=Math.max(0,parseFloat(document.getElementById('uc-molar')?.value)||0);
  const unit=document.getElementById('uc-molar-unit')?.value||'uM';
  const concM=conc*CONC_FACTORS[unit];
  const mgml=concM*mw/1000;// M * g/mol / 1000 = g/mL → /1000 = mg/mL... wait
  // M * MW(g/mol) = g/L = mg/mL
  const mgmlVal=concM*mw/1000;// g/L = mg/mL when MW is in Da
  const r=document.getElementById('uc-molar-result');if(!r)return;
  const b=bestUnit(mgmlVal,{['mg/mL']:1,['µg/mL']:1e-3,['µg/µL']:1,['ng/µL']:1e-3},['mg/mL']);
  // Simpler: just show mg/mL and µg/µL
  const mgml2=concM*mw/1000;
  if(mgml2>=0.001){
    r.innerHTML=`= <span style="color:var(--accent)">${fmtNum(mgml2)} mg/mL</span> <span style="color:var(--text-muted);">= ${fmtNum(mgml2)} µg/µL</span>`;
  } else {
    r.innerHTML=`= <span style="color:var(--accent)">${fmtNum(mgml2*1000)} µg/mL</span>`;
  }
}

function calcDilution(){
  const c1=parseFloat(document.getElementById('uc-c1')?.value)||0;
  const c1u=document.getElementById('uc-c1u')?.value||'mM';
  const c2=parseFloat(document.getElementById('uc-c2')?.value)||0;
  const c2u=document.getElementById('uc-c2u')?.value||'uM';
  const v2=parseFloat(document.getElementById('uc-v2')?.value)||0;
  const v2u=document.getElementById('uc-v2u')?.value||'uL';
  const c1M=c1*CONC_FACTORS[c1u];
  const c2M=c2*CONC_FACTORS[c2u];
  const v2L=v2*VOL_FACTORS[v2u];
  const r=document.getElementById('uc-v1-result');if(!r)return;
  if(c1M<=0||c2M<=0||v2L<=0||c2M>c1M){
    r.textContent=c2M>c1M?'C₂ must be < C₁':'—';return;
  }
  const v1L=c2M*v2L/c1M;
  const b=bestUnit(v1L,VOL_FACTORS,['L','mL','uL']);
  r.innerHTML=`<span style="color:var(--accent);font-weight:600;">${fmtNum(b.val)} ${b.unit}</span>`;
}

function calcUnits(){calcFromMass();calcFromMoles();calcMgMl();calcMolar();calcDilution();}

function calcTm(){
  const raw=document.getElementById('tm-seq')?.value||'';
  const seq=raw.toUpperCase().replace(/[^ATGC]/g,'');
  const salt=(+document.getElementById('tm-salt-v')?.value||500)/1000;// convert mM to M
  const res=document.getElementById('tm-results');if(!res)return;

  if(seq.length<2){res.innerHTML='<div style="font-size:.75rem;color:var(--text-muted)">Enter at least 2 bases...</div>';return;}

  const A=seq.split('').filter(c=>c==='A').length;
  const T=seq.split('').filter(c=>c==='T').length;
  const G=seq.split('').filter(c=>c==='G').length;
  const C=seq.split('').filter(c=>c==='C').length;
  const N=seq.length;
  const gc=(G+C)/N*100;

  // Wallace rule (short oligos)
  const tmWallace=2*(A+T)+4*(G+C);
  // Basic salt-adjusted
  const tmBasic=81.5+16.6*Math.log10(salt)+41*(G+C)/N-675/N;
  // Owczarzy salt correction (more accurate)
  const tmOwczarzy=81.5+16.6*Math.log10(salt)+41*gc/100-675/N-0.65;

  // SantaLucia nearest-neighbor (1998 unified parameters)
  // ΔH and ΔS in cal/mol and cal/mol·K for each dinucleotide pair
  const NN_H={AA:-7900,AT:-7200,TA:-7200,CA:-8500,GT:-8400,CT:-7800,GA:-8200,CG:-10600,GC:-9800,GG:-8000,
              TT:-7900,AC:-8400,TG:-8500,AG:-7800,TC:-8200,CC:-8000
              };
  const NN_S={AA:-22.2,AT:-20.4,TA:-21.3,CA:-22.7,GT:-22.4,CT:-21.0,GA:-22.2,CG:-27.2,GC:-24.4,GG:-19.9,
              TT:-22.2,AC:-22.4,TG:-22.7,AG:-21.0,TC:-22.2,CC:-19.9,
              };
  // Initiation parameters
  let dH=0, dS=0;
  // Initiation: +0.1 kcal/mol (100 cal) for GC init, +2.3 kcal for AT init
  const first=seq[0], last=seq[N-1];
  if(first==='G'||first==='C'){dH+=100;dS-=2.8;}else{dH+=2300;dS+=4.1;}
  if(last==='G'||last==='C'){dH+=100;dS-=2.8;}else{dH+=2300;dS+=4.1;}

  let nnValid=true;
  for(let i=0;i<N-1;i++){
    const pair=seq[i]+seq[i+1];
    if(NN_H[pair]!==undefined&&NN_S[pair]!==undefined){
      dH+=NN_H[pair]; dS+=NN_S[pair];
    } else {
      nnValid=false;break;
    }
  }
  // Salt correction for NN: ΔS = ΔS + 0.368 × (N-1) × ln[Na+]
  const dS_salt=dS+0.368*(N-1)*Math.log(salt);
  // Tm = ΔH / (ΔS + R·ln(Ct/4)) - 273.15, where Ct = total strand concentration
  // For self-complementary: Ct/1, else Ct/4. Assume 250 nM oligo (typical PCR primer)
  const Ct=250e-9;// 250 nM
  const R=1.987;// cal/mol·K
  const tmNN=nnValid? dH/(dS_salt+R*Math.log(Ct/4))-273.15 : null;

  function card(title,value,unit,formula,note,col){
    return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.6rem .8rem;border-left:3px solid ${col};">
      <div style="font-family:'DM Mono',monospace;font-size:.58rem;color:${col};text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem;">${title}</div>
      <div style="font-size:1.3rem;font-weight:600;color:var(--text);margin-bottom:.2rem;">${value}<span style="font-size:.7rem;color:var(--text-muted);margin-left:.2rem;">${unit}</span></div>
      <div style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-muted);margin-bottom:.15rem;">${formula}</div>
      <div style="font-size:.62rem;color:var(--text-dim);">${note}</div>
    </div>`;
  }

  let html=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.5rem;">
    <div style="background:var(--surface2);border-radius:4px;padding:.4rem .6rem;text-align:center;"><div style="font-size:.58rem;color:var(--text-muted);">Length</div><div style="font-size:.9rem;font-weight:600;color:var(--text);">${N} nt</div></div>
    <div style="background:var(--surface2);border-radius:4px;padding:.4rem .6rem;text-align:center;"><div style="font-size:.58rem;color:var(--text-muted);">GC Content</div><div style="font-size:.9rem;font-weight:600;color:var(--text);">${gc.toFixed(1)}%</div></div>
    <div style="background:var(--surface2);border-radius:4px;padding:.4rem .6rem;text-align:center;"><div style="font-size:.58rem;color:var(--text-muted);">A/T</div><div style="font-size:.9rem;font-weight:600;color:var(--text);">${A}/${T}</div></div>
    <div style="background:var(--surface2);border-radius:4px;padding:.4rem .6rem;text-align:center;"><div style="font-size:.58rem;color:var(--text-muted);">G/C</div><div style="font-size:.9rem;font-weight:600;color:var(--text);">${G}/${C}</div></div>
  </div>`;

  // Nearest-neighbor first (most accurate for primers)
  if(tmNN!==null&&N>=8&&N<=60){
    html+=card('SantaLucia Nearest-Neighbor (recommended)',''+tmNN.toFixed(1),'°C','Tm = ΔH / (ΔS + R·ln(Ct/4)) − 273.15','SantaLucia 1998 unified params. [Na⁺]='+(salt*1000).toFixed(0)+'mM, [oligo]=250nM. ΔH='+((dH/1000).toFixed(1))+'kcal, ΔS='+(dS_salt.toFixed(1))+'cal/K','#ec4899');
  }

  if(N<=14){
    html+=card('Wallace Rule (short oligos)',''+tmWallace,'°C','Tm = 2(A+T) + 4(G+C)','Best for oligos ≤14 nt. Simple but approximate.','#10b981');
  }
  html+=card('Basic Salt-adjusted',''+tmBasic.toFixed(1),'°C','Tm = 81.5 + 16.6·log[Na⁺] + 41·(G+C)/N - 675/N','Standard formula. [Na⁺] = '+salt.toFixed(3)+' M','#3b82f6');
  html+=card('Owczarzy (salt-corrected)',''+tmOwczarzy.toFixed(1),'°C','+ salt correction factor','More accurate for varying salt conditions.','#8b5cf6');

  // PCR primer assessment (use NN if available, else basic)
  const tmForPrimer=tmNN!==null?tmNN:tmBasic;
  if(N>=15&&N<=30){
    const ok=tmForPrimer>=55&&tmForPrimer<=65&&gc>=40&&gc<=60;
    html+=`<div style="background:${ok?'rgba(16,185,129,.08)':'rgba(245,158,11,.08)'};border:1px solid ${ok?'#10b981':'#f59e0b'};border-radius:6px;padding:.5rem .7rem;margin-top:.3rem;">
      <div style="font-family:'DM Mono',monospace;font-size:.6rem;color:${ok?'#10b981':'#f59e0b'};margin-bottom:.2rem;">${ok?'✓ GOOD PCR PRIMER':'⚠ PCR PRIMER CHECK'}</div>
      <div style="font-size:.62rem;color:var(--text-dim);">
        Length: ${N} nt ${N>=18&&N<=25?'✓':'⚠ (ideal 18-25)'} · 
        GC: ${gc.toFixed(0)}% ${gc>=40&&gc<=60?'✓':'⚠ (ideal 40-60%)'} · 
        Tm: ${tmForPrimer.toFixed(1)}°C ${tmForPrimer>=55&&tmForPrimer<=65?'✓':'⚠ (ideal 55-65°C)'}
      </div>
    </div>`;
  }

  // Complement
  const comp=seq.split('').map(c=>({A:'T',T:'A',G:'C',C:'G'}[c])).join('');
  html+=`<div style="margin-top:.4rem;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--text-muted);">
    <div>5' ${seq} 3'</div>
    <div>3' ${comp} 5'</div>
  </div>`;

  res.innerHTML=html;
}

const AA_PKA={
  Nterm:9.69, Cterm:2.34,
  D:{pKa:3.65,charge:-1}, E:{pKa:4.25,charge:-1}, C:{pKa:8.18,charge:-1}, Y:{pKa:10.07,charge:-1},
  H:{pKa:6.00,charge:1}, K:{pKa:10.53,charge:1}, R:{pKa:12.48,charge:1}
};
const AA_MW_FULL={G:57.05,A:71.08,V:99.13,L:113.16,I:113.16,P:97.12,F:147.18,W:186.21,M:131.20,S:87.08,T:101.10,C:103.14,Y:163.18,N:114.10,Q:128.13,D:115.09,E:129.12,K:128.17,R:156.19,H:137.14};
const AA_EXT={W:5500,Y:1490};// molar extinction coefficients at 280nm

function calcMwPi(){
  const raw=document.getElementById('mwpi-seq')?.value||'';
  const seq=raw.toUpperCase().replace(/[^ACDEFGHIKLMNPQRSTVWY]/g,'');
  const res=document.getElementById('mwpi-results');if(!res)return;
  if(seq.length<1){res.innerHTML='<div style="font-size:.75rem;color:var(--text-muted)">Enter amino acid sequence...</div>';return;}

  // Count residues
  const counts={};
  for(const c of seq){counts[c]=(counts[c]||0)+1;}
  const N=seq.length;

  // MW calculation
  let mw=18.02;// water
  for(const [aa,cnt] of Object.entries(counts)){mw+=(AA_MW_FULL[aa]||110)*cnt;}

  // pI calculation (bisection method)
  function netCharge(pH){
    let charge=0;
    // N-terminus
    charge+=1/(1+Math.pow(10,pH-AA_PKA.Nterm));
    // C-terminus
    charge-=1/(1+Math.pow(10,AA_PKA.Cterm-pH));
    // Side chains
    for(const [aa,props] of Object.entries(AA_PKA)){
      if(aa==='Nterm'||aa==='Cterm')continue;
      const cnt=counts[aa]||0;
      if(cnt===0)continue;
      if(props.charge>0){charge+=cnt/(1+Math.pow(10,pH-props.pKa));}
      else{charge-=cnt/(1+Math.pow(10,props.pKa-pH));}
    }
    return charge;
  }
  let lo=0,hi=14;
  for(let i=0;i<100;i++){
    const mid=(lo+hi)/2;
    if(netCharge(mid)>0)lo=mid;else hi=mid;
  }
  const pI=(lo+hi)/2;

  // Extinction coefficient at 280nm (Pace et al. 1995 method)
  const nW=counts['W']||0, nY=counts['Y']||0, nC=counts['C']||0;
  const nCystine=Math.floor(nC/2);// max possible disulfide bonds
  const ext280_ox=nW*5500+nY*1490+nCystine*125;// all Cys paired
  const ext280_red=nW*5500+nY*1490;// no disulfides (reduced)
  const abs01_ox=ext280_ox>0?(ext280_ox/mw).toFixed(3):'N/A';
  const abs01_red=ext280_red>0?(ext280_red/mw).toFixed(3):'N/A';

  // Charge at pH 7
  const chargeAt7=netCharge(7);

  // Amino acid composition
  const groups={
    nonpolar:['G','A','V','L','I','P','F','W','M'],
    polar:['S','T','C','Y','N','Q'],
    positive:['K','R','H'],
    negative:['D','E']
  };

  function card(title,value,unit,note,col){
    return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;border-left:3px solid ${col};">
      <div style="font-family:'DM Mono',monospace;font-size:.58rem;color:${col};text-transform:uppercase;letter-spacing:.08em;margin-bottom:.2rem;">${title}</div>
      <div style="font-size:1.2rem;font-weight:600;color:var(--text);">${value}<span style="font-size:.65rem;color:var(--text-muted);margin-left:.25rem;">${unit}</span></div>
      <div style="font-size:.6rem;color:var(--text-dim);">${note}</div>
    </div>`;
  }

  let html=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;">
    ${card('Molecular Weight',mw>=10000?(mw/1000).toFixed(2)+'k':''+mw.toFixed(1),'Da',''+N+' residues · Avg MW/residue: '+(mw/N).toFixed(1)+' Da','#3b82f6')}
    ${card('Isoelectric Point (pI)',pI.toFixed(2),'','Net charge at pH 7: '+(chargeAt7>=0?'+':'')+chargeAt7.toFixed(1),'#8b5cf6')}
  </div>`;

  // Extinction coefficient detail section
  html+=`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;margin-top:.4rem;border-left:3px solid #f59e0b;">
    <div style="font-family:'DM Mono',monospace;font-size:.58rem;color:#f59e0b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem;">Extinction Coefficient (ε₂₈₀)</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.3rem;">
      <div>
        <div style="font-size:.55rem;color:var(--text-muted);margin-bottom:.1rem;">Oxidized (all Cys paired)</div>
        <div style="font-size:1rem;font-weight:600;color:var(--text);">${ext280_ox>0?ext280_ox:'—'}<span style="font-size:.6rem;color:var(--text-muted);margin-left:.2rem;">M⁻¹cm⁻¹</span></div>
        <div style="font-size:.55rem;color:var(--text-dim);">Abs 0.1% = ${abs01_ox}</div>
      </div>
      <div>
        <div style="font-size:.55rem;color:var(--text-muted);margin-bottom:.1rem;">Reduced (no disulfides)</div>
        <div style="font-size:1rem;font-weight:600;color:var(--text);">${ext280_red>0?ext280_red:'—'}<span style="font-size:.6rem;color:var(--text-muted);margin-left:.2rem;">M⁻¹cm⁻¹</span></div>
        <div style="font-size:.55rem;color:var(--text-dim);">Abs 0.1% = ${abs01_red}</div>
      </div>
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--text-muted);line-height:1.6;">
      Trp(W) × ${nW} = ${nW*5500} · Tyr(Y) × ${nY} = ${nY*1490} · Cystine × ${nCystine} = ${nCystine*125}<br>
      Pace et al. (1995). Abs 0.1% = ε / MW (for 1 mg/mL in 1 cm path)
    </div>
  </div>`;

  html+=`<div style="display:grid;grid-template-columns:1fr;gap:.4rem;margin-top:.4rem;">
    ${card('Length',''+N,'aa','~'+(N*0.11).toFixed(1)+' kDa estimated','#10b981')}
  </div>`;

  // Charge vs pH plot (canvas)
  html+=`<div style="margin-top:.5rem;"><canvas id="charge-plot" style="width:100%;height:120px;border-radius:6px;"></canvas></div>`;

  // Composition bars
  html+=`<div style="margin-top:.5rem;">
    <div style="font-family:'DM Mono',monospace;font-size:.58rem;color:var(--text-muted);margin-bottom:.3rem;">COMPOSITION</div>`;
  const compCols={nonpolar:'#3b82f6',polar:'#10b981',positive:'#8b5cf6',negative:'#ef4444'};
  for(const [group,aas] of Object.entries(groups)){
    const cnt=aas.reduce((s,a)=>s+(counts[a]||0),0);
    const pct=(cnt/N*100).toFixed(1);
    html+=`<div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.2rem;">
      <span style="font-size:.6rem;color:var(--text-muted);width:58px;">${group}</span>
      <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${compCols[group]};border-radius:3px;"></div></div>
      <span style="font-family:'DM Mono',monospace;font-size:.58rem;color:var(--text);width:40px;text-align:right;">${pct}%</span>
    </div>`;
  }
  html+=`</div>`;

  res.innerHTML=html;

  // Draw charge vs pH plot
  setTimeout(()=>{
    const canvas=document.getElementById('charge-plot');if(!canvas)return;
    const dpr=window.devicePixelRatio||1;
    const w=canvas.clientWidth,h=canvas.clientHeight;
    canvas.width=w*dpr;canvas.height=h*dpr;
    const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
    ctx.fillStyle='rgba(17,24,39,.5)';ctx.beginPath();ctx.roundRect(0,0,w,h,4);ctx.fill();
    const ml=36,mr=10,mt=12,mb=20;
    const pw=w-ml-mr,ph=h-mt-mb;
    // Grid
    ctx.strokeStyle='rgba(100,116,139,.1)';ctx.lineWidth=1;
    for(let i=0;i<=14;i+=2){const x=ml+i/14*pw;ctx.beginPath();ctx.moveTo(x,mt);ctx.lineTo(x,mt+ph);ctx.stroke();}
    // Zero line
    const charges=[];for(let pH=0;pH<=14;pH+=0.1)charges.push(netCharge(pH));
    const maxC=Math.max(...charges.map(Math.abs),1);
    const zeroY=mt+ph/2;
    ctx.strokeStyle='rgba(148,163,184,.2)';ctx.beginPath();ctx.moveTo(ml,zeroY);ctx.lineTo(ml+pw,zeroY);ctx.stroke();
    // Curve
    ctx.strokeStyle='#8b5cf6';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<=140;i++){
      const pH=i/10;const c=netCharge(pH);
      const x=ml+pH/14*pw,y=zeroY-c/maxC*(ph/2);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    // pI marker
    const pIx=ml+pI/14*pw;
    ctx.strokeStyle='#f59e0b';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(pIx,mt);ctx.lineTo(pIx,mt+ph);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#f59e0b';ctx.font='bold 8px DM Mono,monospace';ctx.textAlign='center';
    ctx.fillText('pI='+pI.toFixed(1),pIx,mt+ph+14);
    // Axis labels
    ctx.fillStyle='#64748b';ctx.font='8px DM Mono,monospace';ctx.textAlign='center';
    for(let i=0;i<=14;i+=2)ctx.fillText(''+i,ml+i/14*pw,mt+ph+14);
    ctx.textAlign='right';ctx.fillText('+',ml-4,mt+8);ctx.fillText('0',ml-4,zeroY+3);ctx.fillText('−',ml-4,mt+ph-2);
    ctx.save();ctx.translate(8,mt+ph/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('Charge',0,0);ctx.restore();
  },50);
}

      document.querySelectorAll('#right-panel svg').forEach(svg=>{

          if(title)svg.setAttribute('aria-label','Diagram: '+title.textContent);
        }
      });
    },150);
  };

  document.addEventListener('lessonRendered',labelViewerControls);

  labelViewerControls();

}

const MOLE_EMOTES=['!','?','♥','★','💡','🧬','⚗','🎯','✓','💤'];

// Reduced motion preference
let prefersReducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(window.matchMedia){
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{
    prefersReducedMotion=e.matches;
    if(prefersReducedMotion){
      // Stop animations, clear particles, freeze mole
      moleState='idle';moleParticles=[];moleFrame=0;
      if(moleAnimInterval){clearInterval(moleAnimInterval);moleAnimInterval=null;}
      if(moleTipInterval){clearInterval(moleTipInterval);moleTipInterval=null;}
      drawMole();// draw static frame
      const pc=document.getElementById('mole-particles');if(pc){const ctx2=pc.getContext('2d');ctx2.clearRect(0,0,pc.width,pc.height);}
    } else {
      // Restart animation
      if(!moleAnimInterval)moleAnimInterval=setInterval(updateMole,80);
      if(!moleTipInterval)moleTipInterval=setInterval(showMoleIdleTip,20000);
    }
  });
}

// Particle system for mole effects
function spawnMoleParticle(type,x,y,count){
  if(prefersReducedMotion)return;// respect reduced motion
  for(let i=0;i<(count||3);i++){
    const p={type,x:x||moleX+16,y:y||28,vx:(Math.random()-.5)*2,vy:-Math.random()*2-1,life:1,maxLife:30+Math.random()*20};
    if(type==='dirt'){p.vy=Math.random()*-3-1;p.vx=(Math.random()-.5)*4;p.color='#8b7355';p.size=2+Math.random()*2;}
    else if(type==='sparkle'){p.vy=-Math.random()*1.5;p.vx=(Math.random()-.5)*3;p.color=['#fbbf24','#f59e0b','#10b981','#3b82f6'][Math.floor(Math.random()*4)];p.size=2+Math.random()*2;}
    else if(type==='zzz'){p.vy=-0.5-Math.random()*.5;p.vx=0.3+Math.random()*.3;p.color='#94a3b8';p.size=6+Math.random()*4;p.char='z';}
    else if(type==='heart'){p.vy=-1-Math.random();p.vx=(Math.random()-.5)*1.5;p.color='#E8A0A0';p.size=6;p.char='♥';}
    else if(type==='note'){p.vy=-1.2;p.vx=(Math.random()-.5)*2;p.color='#10b981';p.size=7;p.char=['♪','♫'][Math.floor(Math.random()*2)];}
    else if(type==='sniff'){p.vy=0;p.vx=moleDir*2;p.color='rgba(148,163,184,.4)';p.size=3;p.maxLife=15;p.life=1;}
    else if(type==='trail'){p.vx=0;p.vy=0;p.color='rgba(74,78,84,.15)';p.size=2;p.maxLife=20;p.life=1;p.y=30;}
    moleParticles.push(p);
  }
}

function updateMoleParticles(){
  for(let i=moleParticles.length-1;i>=0;i--){
    const p=moleParticles[i];
    p.x+=p.vx;p.y+=p.vy;
    p.life-=1/p.maxLife;
    if(p.type==='dirt')p.vy+=0.15; // gravity
    if(p.life<=0)moleParticles.splice(i,1);
  }
}

function drawMoleParticles(){
  const zone=document.getElementById('mole-zone');if(!zone)return;
  let canvas=document.getElementById('mole-particles');
  if(!canvas){
    canvas=document.createElement('canvas');canvas.id='mole-particles';
    canvas.width=zone.offsetWidth;canvas.height=50;
    canvas.style.cssText='position:absolute;bottom:0;left:0;width:100%;height:50px;pointer-events:none;z-index:4;';
    zone.appendChild(canvas);
  }
  if(canvas.width!==zone.offsetWidth)canvas.width=zone.offsetWidth;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  moleParticles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.char){
      ctx.font=`${p.size}px "DM Sans",sans-serif`;ctx.fillStyle=p.color;
      ctx.fillText(p.char,p.x,p.y);
    } else {
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
    }
  });
  ctx.globalAlpha=1;
}

// Mole reacts to user actions
function moleReact(action){
  if(moleHidden)return;
  // In reduced motion: show emote only, no animation state changes
  if(prefersReducedMotion){
    const emoteMap={correct:'✓',wrong:'!',navigate:'🧬',complete:'★',search:'?',tool:'💡'};
    if(emoteMap[action]){moleEmote=emoteMap[action];moleEmoteTick=50;drawMole();}
    return;
  }
  if(action==='correct'){
    moleActionQueue.push({state:'celebrate',duration:80,emote:'✓'});
  } else if(action==='wrong'){
    moleActionQueue.push({state:'nod',duration:40,emote:'!'});
  } else if(action==='navigate'){
    moleActionQueue.push({state:'sniff',duration:50,emote:'🧬'});
  } else if(action==='complete'){
    moleActionQueue.push({state:'celebrate',duration:100,emote:'★'});
    setTimeout(()=>spawnMoleParticle('sparkle',moleX+16,20,8),200);
  } else if(action==='search'){
    moleActionQueue.push({state:'peek',duration:40,emote:'?'});
  } else if(action==='tool'){
    moleActionQueue.push({state:'wave',duration:50,emote:'💡'});
  }
}

function processActionQueue(){
  if(moleActionQueue.length===0||moleSearchOpen)return false;
  if(moleState!=='idle'&&moleState!=='walk')return false;
  const action=moleActionQueue.shift();
  moleState=action.state;moleStateTimer=action.duration;
  if(action.emote){moleEmote=action.emote;moleEmoteTick=50;}
  moleFrame=0;
  return true;
}

    html+=`<div style="padding:.2rem .65rem .15rem;font-family:'DM Mono',monospace;font-size:.5rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.15rem;">${sec.section}</div>`;
    sec.items.forEach(item=>{
      html+=`<button onclick="navigateToLesson('${item.key}');toolSwitcherOpen=false;document.getElementById('tool-switcher').style.display='none'" style="display:flex;align-items:center;gap:.4rem;width:100%;padding:.3rem .65rem;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.68rem;color:var(--text-dim);text-align:left;transition:background .1s;" onmouseenter="this.style.background='rgba(6,182,212,.06)';this.style.color='var(--text)'" onmouseleave="this.style.background='none';this.style.color='var(--text-dim)'">${item.icon} ${item.label}</button>`;
    });
  });
  menu.innerHTML=html;
}

function initMole(){
  const zone=document.getElementById('mole-zone');
  if(!zone)return;

  // Mole character (canvas-based pixel art)
  const moleEl=document.createElement('div');
  moleEl.id='mole-char';
  moleEl.style.cssText='position:absolute;bottom:4px;left:60px;cursor:pointer;z-index:5;transition:none;';
  moleEl.innerHTML=`<canvas id="mole-canvas" width="32" height="44" style="width:32px;height:44px;image-rendering:pixelated;margin-top:-12px;"></canvas>`;
  moleEl.onclick=toggleMoleSearch;
  moleEl.title='Click me to search!';
  zone.appendChild(moleEl);

  // Speech bubble with search
  const bubble=document.createElement('div');
  bubble.id='mole-bubble';
  bubble.style.cssText='position:absolute;top:48px;left:40px;display:none;background:var(--surface);border:1.5px solid var(--accent);border-radius:2px 10px 10px 10px;padding:.35rem .5rem;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap;transition:opacity .15s;';
  bubble.innerHTML=`<input id="lesson-search" type="text" placeholder="Ask me anything..." autocomplete="off" style="width:160px;background:transparent;border:none;font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text);outline:none;" oninput="filterSearch(this.value)" onfocus="showSearchResults()" onblur="setTimeout(hideSearchResults,200)"><div id="search-results" style="display:none;position:absolute;top:100%;left:0;width:260px;max-height:280px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-top:4px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4);"></div>`;
  zone.appendChild(bubble);

  // Idle text bubbles (shown when not searching)
  const idleBubble=document.createElement('div');
  idleBubble.id='mole-idle-bubble';
  idleBubble.style.cssText='position:absolute;top:48px;left:40px;display:none;background:var(--surface);border:1px solid var(--border);border-radius:2px 8px 8px 8px;padding:.2rem .45rem;z-index:25;font-family:"DM Mono",monospace;font-size:.55rem;color:var(--text-muted);pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;';
  zone.appendChild(idleBubble);

  // Start animation loop (respect reduced motion)
  drawMole();
  if(!prefersReducedMotion){
    moleAnimInterval=setInterval(updateMole,80);
    moleTipInterval=setInterval(showMoleIdleTip,20000);
    setTimeout(()=>showMoleIdleTip(),2000);
  } else {
    // Static mole — just draw once, show one tip
    setTimeout(()=>showMoleIdleTip(),2000);
  }

  // Resize particle canvas on window resize
  window.addEventListener('resize',()=>{
    const pc=document.getElementById('mole-particles');
    const z=document.getElementById('mole-zone');
    if(pc&&z)pc.width=z.offsetWidth;
  });

  // Load mole visibility preference
  (async()=>{
    try{const r=await _store.get('molebio-mole-hidden');if(r&&r.value==='true'){moleHidden=true;applyMoleVisibility();}}catch(e){}
  })();
}

const MOLE_TIPS=['Click me to search!','Try the practice!','Drag the divider','Ask me about the modules!','☀ Try light mode!','Check your progress!','I can dig for info!','Proteins are fascinating!','Try the tools menu!','Check the codon wheel!','I love biochemistry!','I love molecular biology!'];

function applyMoleVisibility(){
  const moleEl=document.getElementById('mole-char');
  const bubble=document.getElementById('mole-bubble');
  const idleBub=document.getElementById('mole-idle-bubble');
  if(moleEl)moleEl.style.display=moleHidden?'none':'';
  if(moleHidden){
    if(bubble)bubble.style.display='none';
    if(idleBub)idleBub.style.display='none';
    moleSearchOpen=false;
  }
}

function toggleMoleHidden(){
  moleHidden=!moleHidden;
  applyMoleVisibility();
  // Clear/restart intervals to save CPU when mole is hidden
  if(moleHidden){
    if(moleAnimInterval){clearInterval(moleAnimInterval);moleAnimInterval=null;}
    if(moleTipInterval){clearInterval(moleTipInterval);moleTipInterval=null;}
    moleParticles=[];
    const pc=document.getElementById('mole-particles');if(pc){const ctx2=pc.getContext('2d');ctx2.clearRect(0,0,pc.width,pc.height);}
  } else if(!prefersReducedMotion){
    if(!moleAnimInterval)moleAnimInterval=setInterval(updateMole,80);
    if(!moleTipInterval)moleTipInterval=setInterval(showMoleIdleTip,20000);
    drawMole();
  }
  try{_store.set('molebio-mole-hidden',moleHidden?'true':'false');}catch(e){}
  renderSettingsMenu();
}
let moleTipIdx=0;

function showMoleIdleTip(){
  if(moleSearchOpen||moleHidden||moleState==='sleep')return;
  const b=document.getElementById('mole-idle-bubble');if(!b)return;
  b.textContent=MOLE_TIPS[moleTipIdx%MOLE_TIPS.length];
  moleTipIdx++;
  // Position near mole
  b.style.left=(moleX-10)+'px';
  b.style.display='block';
  b.style.opacity='1';
  setTimeout(()=>{b.style.opacity='0';setTimeout(()=>{b.style.display='none';},300);},3000);
}

function toggleMoleSearch(){
  moleSearchOpen=!moleSearchOpen;
  if(moleSearchOpen&&typeof moleReact==='function')moleReact('search');
  const bubble=document.getElementById('mole-bubble');
  const idleBub=document.getElementById('mole-idle-bubble');
  if(moleSearchOpen){
    if(bubble){
      bubble.style.display='block';
      bubble.style.left=(moleX-10)+'px';
      setTimeout(()=>document.getElementById('lesson-search')?.focus(),50);
    }
    if(idleBub){idleBub.style.display='none';}
    moleState='idle';// stop walking when searching
  } else {
    if(bubble)bubble.style.display='none';
    document.getElementById('lesson-search')&&(document.getElementById('lesson-search').value='');
    hideSearchResults();
  }
}

function drawMole(){
  const c=document.getElementById('mole-canvas');if(!c)return;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,32,44);
  ctx.imageSmoothingEnabled=false;

  // Offset all drawing down 12px to leave emote space at top
  ctx.save();
  ctx.translate(0,12);

  const f=moleFrame%4;
  const flip=(moleDir<0);
  if(flip){ctx.save();ctx.translate(32,0);ctx.scale(-1,1);}

  // Breathing animation (subtle Y oscillation)
  moleBreathPhase=(moleBreathPhase+0.04)%(Math.PI*2);
  const breathOff=(moleState==='sleep')?Math.sin(moleBreathPhase)*1.5:Math.sin(moleBreathPhase)*0.4;

  // Base bounce for walking
  const walkBounce=(moleState==='walk'&&f%2===0)?-1:0;
  // Dig bob
  const digBob=(moleState==='dig')?(f%2===0?-2:1):0;
  // Celebrate jump
  const celebJump=(moleState==='celebrate')?(f%2===0?-3:0):0;
  // Yawn stretch
  const yawnStretch=(moleState==='yawn'&&f<2)?-1:0;
  // Sleep sink
  const sleepSink=(moleState==='sleep')?2:0;
  // Peek crouch
  const peekCrouch=(moleState==='peek')?2:0;
  // Wave bounce
  const waveBob=(moleState==='wave'&&f%2===0)?-1:0;

  const bounce=walkBounce+digBob+celebJump+yawnStretch+sleepSink+peekCrouch+waveBob+Math.round(breathOff);

  // Shadow (bigger during jump)
  const shadowW=(moleState==='celebrate'&&f%2===0)?14:18;
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.fillRect(16-shadowW/2,28,(shadowW),2);

  // Body (round, chunky)
  ctx.fillStyle='#4a4e54';
  ctx.fillRect(8,16+bounce,16,10);
  ctx.fillRect(7,18+bounce,18,6);
  ctx.fillRect(10,15+bounce,12,1);
  // Belly
  ctx.fillStyle='#8b9199';
  ctx.fillRect(11,19+bounce,10,6);
  ctx.fillRect(12,18+bounce,8,1);
  // Sleep belly rise
  if(moleState==='sleep'){
    const bellyPulse=Math.sin(moleBreathPhase)*1;
    ctx.fillStyle='#8b9199';
    ctx.fillRect(11,19+bounce-Math.round(bellyPulse),10,7);
  }

  // Head (big, round)
  ctx.fillStyle='#5c6370';
  ctx.fillRect(6,4+bounce,20,12);
  ctx.fillRect(8,3+bounce,16,1);
  ctx.fillRect(5,6+bounce,22,8);
  ctx.fillRect(8,15+bounce,16,2);
  // Forehead highlight
  ctx.fillStyle='#6b7280';
  ctx.fillRect(10,5+bounce,12,2);

  // Ears
  ctx.fillStyle='#5c6370';
  ctx.fillRect(5,2+bounce,4,4);ctx.fillRect(23,2+bounce,4,4);
  ctx.fillRect(6,1+bounce,2,2);ctx.fillRect(24,1+bounce,2,2);
  // Ear perk for sniff/peek
  if(moleState==='sniff'||moleState==='peek'){
    ctx.fillRect(5,0+bounce,4,3);ctx.fillRect(23,0+bounce,4,3);
  }
  // Inner ear (pink)
  ctx.fillStyle='#E8A0A0';
  ctx.fillRect(6,3+bounce,2,2);ctx.fillRect(24,3+bounce,2,2);

  // Snout (big pink oval)
  ctx.fillStyle='#E8A0A0';
  // Sniff: snout bobs forward
  const snoutXOff=(moleState==='sniff'&&f%2===0)?1:0;
  ctx.fillRect(12+snoutXOff,9+bounce,8,5);
  ctx.fillRect(11+snoutXOff,10+bounce,10,3);
  // Nose (dark, star-shaped)
  ctx.fillStyle='#2a2a3e';
  ctx.fillRect(14+snoutXOff,9+bounce,4,3);
  ctx.fillRect(15+snoutXOff,8+bounce,2,1);
  ctx.fillRect(13+snoutXOff,10+bounce,1,1);ctx.fillRect(18+snoutXOff,10+bounce,1,1);
  // Nose shine
  ctx.fillStyle='#555';
  ctx.fillRect(15+snoutXOff,9+bounce,1,1);
  // Sniff wiggle: small dots near nose
  if(moleState==='sniff'&&f%3===0){
    ctx.fillStyle='rgba(148,163,184,.4)';
    ctx.fillRect(20+snoutXOff,9+bounce,2,1);ctx.fillRect(22+snoutXOff,10+bounce,1,1);
  }

  // Eyes
  if(moleState==='sleep'){
    // Sleeping: closed eyes with curved line
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(8,9+bounce,4,1);ctx.fillRect(20,9+bounce,4,1);
    ctx.fillRect(9,10+bounce,2,1);ctx.fillRect(21,10+bounce,2,1);
  } else if(moleState==='yawn'&&f>=1&&f<=2){
    // Yawn: squinty eyes
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(8,9+bounce,4,1);ctx.fillRect(20,9+bounce,4,1);
  } else if(moleState==='celebrate'){
    // Celebrate: happy squint eyes (^ ^)
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(8,8+bounce,1,1);ctx.fillRect(11,8+bounce,1,1);ctx.fillRect(9,7+bounce,2,1);
    ctx.fillRect(20,8+bounce,1,1);ctx.fillRect(23,8+bounce,1,1);ctx.fillRect(21,7+bounce,2,1);
  } else if(moleState==='peek'){
    // Peek: wide eyes (bigger pupils)
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(7,6+bounce,5,5);ctx.fillRect(20,6+bounce,5,5);
    ctx.fillStyle='#111';
    ctx.fillRect(9,7+bounce,3,3);ctx.fillRect(21,7+bounce,3,3);
    ctx.fillStyle='#fff';
    ctx.fillRect(8,6+bounce,2,2);ctx.fillRect(20,6+bounce,2,2);
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.fillRect(10,9+bounce,1,1);ctx.fillRect(22,9+bounce,1,1);
  } else {
    // Normal eyes
    const blinking=(moleState==='idle'&&f===3)||(moleState==='nod'&&f%2===0);
    if(blinking){
      ctx.fillStyle='#5c6370';
      ctx.fillRect(8,7+bounce,4,4);ctx.fillRect(20,7+bounce,4,4);
      ctx.fillStyle='#1a1a2e';
      ctx.fillRect(8,9+bounce,4,1);ctx.fillRect(20,9+bounce,4,1);
    } else {
      // Left eye
      ctx.fillStyle='#1a1a2e';
      ctx.fillRect(8,7+bounce,4,4);
      ctx.fillStyle='#111';
      ctx.fillRect(9,8+bounce,2,2);
      ctx.fillStyle='#fff';
      ctx.fillRect(8,7+bounce,1,1);
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.fillRect(10,9+bounce,1,1);
      // Right eye
      ctx.fillStyle='#1a1a2e';
      ctx.fillRect(20,7+bounce,4,4);
      ctx.fillStyle='#111';
      ctx.fillRect(21,8+bounce,2,2);
      ctx.fillStyle='#fff';
      ctx.fillRect(20,7+bounce,1,1);
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.fillRect(22,9+bounce,1,1);
    }
  }

  // Mouth variations
  if(moleState==='yawn'&&f>=1&&f<=2){
    // Yawn: open mouth
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(13,13+bounce,6,3);
    ctx.fillStyle='#E8A0A0';
    ctx.fillRect(14,14+bounce,4,1);
  } else if(moleState==='celebrate'){
    // Happy mouth (smile)
    ctx.fillStyle='#2a2a3e';
    ctx.fillRect(13,14+bounce,6,1);
    ctx.fillRect(12,13+bounce,1,1);ctx.fillRect(19,13+bounce,1,1);
  } else {
    // Tiny teeth
    ctx.fillStyle='#e8e8e8';
    ctx.fillRect(14,14+bounce,2,1);ctx.fillRect(16,14+bounce,2,1);
  }

  // Whiskers
  ctx.fillStyle='#8b9199';
  ctx.fillRect(4,11+bounce,4,1);ctx.fillRect(24,11+bounce,4,1);
  ctx.fillRect(3,9+bounce,4,1);ctx.fillRect(25,9+bounce,4,1);

  // Arms/claws
  ctx.fillStyle='#4a4e54';
  if(moleState==='walk'){
    if(f<2){ctx.fillRect(4,16+bounce,4,5);ctx.fillRect(24,18+bounce,4,5);}
    else{ctx.fillRect(4,18+bounce,4,5);ctx.fillRect(24,16+bounce,4,5);}
  } else if(moleState==='dig'){
    // Digging: arms flail fast
    if(f%2===0){ctx.fillRect(3,14+bounce,4,4);ctx.fillRect(25,17+bounce,4,4);}
    else{ctx.fillRect(3,17+bounce,4,4);ctx.fillRect(25,14+bounce,4,4);}
  } else if(moleState==='wave'){
    // Wave: one arm up, one normal
    ctx.fillRect(4,17+bounce,4,5);
    // Right arm raised and waving
    if(f%2===0){ctx.fillRect(25,10+bounce,4,5);}
    else{ctx.fillRect(26,8+bounce,4,5);}
  } else if(moleState==='celebrate'){
    // Both arms up!
    if(f%2===0){ctx.fillRect(3,10+bounce,4,5);ctx.fillRect(25,10+bounce,4,5);}
    else{ctx.fillRect(2,8+bounce,4,5);ctx.fillRect(26,8+bounce,4,5);}
  } else {
    ctx.fillRect(4,17+bounce,4,5);ctx.fillRect(24,17+bounce,4,5);
  }

  // Claw fingers
  ctx.fillStyle='#c8ccd2';
  if(moleState==='dig'){
    const clY=f%2===0?18:21;
    ctx.fillRect(1,clY+bounce,3,2);ctx.fillRect(3,clY+1+bounce,2,2);ctx.fillRect(5,clY+bounce,2,2);
    ctx.fillRect(24,clY+bounce+2,2,2);ctx.fillRect(26,clY+1+bounce+2,2,2);ctx.fillRect(28,clY+bounce+2,2,2);
  } else if(moleState==='wave'||moleState==='celebrate'){
    // Claws on raised arms
    const armY=f%2===0?10:8;
    ctx.fillRect(25,armY+bounce,2,2);ctx.fillRect(27,armY+1+bounce,2,2);ctx.fillRect(29,armY+bounce,1,2);
    // Left normal claws for wave, raised for celebrate
    if(moleState==='celebrate'){
      ctx.fillRect(1,armY+bounce,2,2);ctx.fillRect(3,armY+1+bounce,2,2);ctx.fillRect(5,armY+bounce,1,2);
    } else {
      const clawY=22;
      ctx.fillRect(3,clawY+bounce,2,2);ctx.fillRect(5,clawY+1+bounce,2,2);ctx.fillRect(7,clawY+bounce,1,2);
    }
  } else {
    const clawY=moleState==='walk'?(f<2?21:23):22;
    ctx.fillRect(3,clawY+bounce,2,2);ctx.fillRect(5,clawY+1+bounce,2,2);ctx.fillRect(7,clawY+bounce,1,2);
    ctx.fillRect(24,clawY+bounce,1,2);ctx.fillRect(25,clawY+1+bounce,2,2);ctx.fillRect(27,clawY+bounce,2,2);
  }

  // Feet
  ctx.fillStyle='#4a4e54';
  if(moleState==='walk'){
    if(f<2){ctx.fillRect(10,26,4,2);ctx.fillRect(19,27,4,1);}
    else{ctx.fillRect(10,27,4,1);ctx.fillRect(19,26,4,2);}
  } else if(moleState==='dig'){
    // Dig: feet spread wide for stability
    ctx.fillRect(8,26,5,2);ctx.fillRect(20,26,5,2);
  } else if(moleState==='celebrate'){
    // Celebrate: little hops
    if(f%2===0){ctx.fillRect(10,27,4,1);ctx.fillRect(19,27,4,1);}
    else{ctx.fillRect(10,26,4,2);ctx.fillRect(19,26,4,2);}
  } else if(moleState==='sleep'){
    // Sleep: feet tucked
    ctx.fillRect(11,27,3,1);ctx.fillRect(19,27,3,1);
  } else {
    ctx.fillRect(10,26,4,2);ctx.fillRect(19,26,4,2);
  }
  // Toe claws
  ctx.fillStyle='#c8ccd2';
  ctx.fillRect(9,27,2,1);ctx.fillRect(22,27,2,1);

  // Tail
  ctx.fillStyle='#5c6370';
  if(moleState==='celebrate'){
    // Wagging tail
    const tailX=f%2===0?5:7;
    ctx.fillRect(tailX,19+bounce,2,2);ctx.fillRect(tailX-1,18+bounce,1,2);
  } else if(moleState==='sleep'){
    // Curled tail
    ctx.fillRect(6,22+bounce,2,2);ctx.fillRect(5,21+bounce,2,1);
  } else {
    ctx.fillRect(6,20+bounce,2,2);
    ctx.fillRect(5,19+bounce,1,2);
  }

  // Hard hat for dig state
  if(moleState==='dig'){
    ctx.fillStyle='#f59e0b';
    ctx.fillRect(7,1+bounce,18,3);ctx.fillRect(9,0+bounce,14,2);
    ctx.fillStyle='#d97706';
    ctx.fillRect(13,0+bounce,6,1);
  }

  // Sleep cap
  if(moleState==='sleep'){
    ctx.fillStyle='#6366f1';
    ctx.fillRect(8,1+bounce,16,4);ctx.fillRect(10,0+bounce,12,2);
    // Bobble
    ctx.fillStyle='#a5b4fc';
    ctx.fillRect(22,0+bounce,3,3);
  }

  if(flip)ctx.restore();
  ctx.restore(); // restore the translate(0,12)

  // Emote bubble (drawn in top 12px space above mole)
  if(moleEmote&&moleEmoteTick>0){
    const emoteAlpha=Math.min(1,moleEmoteTick/10);
    ctx.globalAlpha=emoteAlpha;
    // Small bubble
    ctx.fillStyle='rgba(30,41,59,.85)';
    const emW=12,emH=10;
    const emX=16-emW/2,emY=1;
    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(emX,emY,emW,emH,3);ctx.fill();}
    else{ctx.fillRect(emX,emY,emW,emH);}
    // Tiny pointer
    ctx.fillRect(15,emY+emH,2,2);
    // Emote character
    ctx.fillStyle='#fbbf24';
    ctx.font='7px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(moleEmote,16,emY+emH/2+1);
    ctx.globalAlpha=1;
  }
}

function updateMole(){
  if(moleHidden)return;
  moleTick++;
  const zone=document.getElementById('mole-zone');
  const moleEl=document.getElementById('mole-char');
  if(!zone||!moleEl)return;
  const maxX=zone.offsetWidth-40;

  // Emote countdown
  if(moleEmoteTick>0)moleEmoteTick--;
  if(moleEmoteTick<=0)moleEmote='';

  // Process queued actions
  processActionQueue();

  // State timer for timed states
  if(moleStateTimer>0){
    moleStateTimer--;
    if(moleStateTimer<=0&&moleState!=='idle'&&moleState!=='walk'){
      moleState='idle';moleIdleSince=moleTick;
    }
  }

  if(moleState==='idle'){
    // Idle: blink every ~2s, occasionally start other behaviors
    if(moleTick%4===0)moleFrame++;
    moleIdleSince++;
    if(moleTick%80===0&&!moleSearchOpen&&Math.random()>0.3){
      // Pick a random behavior weighted by context
      const r=Math.random();
      if(r<0.45){
        moleState='walk';moleDir=Math.random()>0.5?1:-1;
      } else if(r<0.55){
        moleState='sniff';moleStateTimer=60;moleFrame=0;
      } else if(r<0.62){
        moleState='dig';moleStateTimer=50;moleFrame=0;
      } else if(r<0.68){
        moleState='peek';moleStateTimer=35;moleFrame=0;
      } else if(r<0.73){
        moleState='yawn';moleStateTimer=45;moleFrame=0;
      } else if(r<0.78){
        moleState='wave';moleStateTimer=40;moleFrame=0;
      } else if(r<0.82){
        moleState='nod';moleStateTimer=30;moleFrame=0;
      }
    }
    // After long idle, fall asleep
    if(moleIdleSince>600&&!moleSearchOpen){
      moleState='sleep';moleStateTimer=0;moleFrame=0;moleIdleSince=0;
    }
  } else if(moleState==='walk'){
    if(moleTick%3===0)moleFrame++;
    moleX+=moleDir*1.2;
    if(moleX>maxX){moleX=maxX;moleDir=-1;}
    if(moleX<20){moleX=20;moleDir=1;}
    // Walking trail particles
    if(moleTick%8===0)spawnMoleParticle('trail',moleX+16,0,1);
    // Stop walking after a bit
    if(moleTick%120===0){moleState='idle';moleIdleSince=0;}
  } else if(moleState==='dig'){
    if(moleTick%2===0)moleFrame++;
    // Dirt particles while digging
    if(moleTick%6===0)spawnMoleParticle('dirt',moleX+16,25,2);
  } else if(moleState==='sniff'){
    if(moleTick%4===0)moleFrame++;
    // Sniff particles
    if(moleTick%8===0)spawnMoleParticle('sniff',moleX+(moleDir>0?28:4),20,1);
  } else if(moleState==='celebrate'){
    if(moleTick%3===0)moleFrame++;
    // Sparkle particles
    if(moleTick%10===0)spawnMoleParticle('sparkle',moleX+16,10,2);
  } else if(moleState==='yawn'){
    if(moleTick%5===0)moleFrame++;
  } else if(moleState==='sleep'){
    if(moleTick%6===0)moleFrame++;
    // Zzz particles
    if(moleTick%25===0)spawnMoleParticle('zzz',moleX+24,8,1);
    // Wake up on interaction
    if(moleSearchOpen){moleState='idle';moleIdleSince=0;}
  } else if(moleState==='peek'){
    if(moleTick%4===0)moleFrame++;
  } else if(moleState==='wave'){
    if(moleTick%4===0)moleFrame++;
  } else if(moleState==='nod'){
    if(moleTick%3===0)moleFrame++;
  }

  moleEl.style.left=moleX+'px';
  // Update speech bubble position too
  const bubble=document.getElementById('mole-bubble');
  if(bubble&&moleSearchOpen)bubble.style.left=(moleX-10)+'px';

  // Update particles
  updateMoleParticles();
  drawMoleParticles();
  drawMole();
}

function filterSearch(query){
  const results=document.getElementById('search-results');
  if(!results)return;
  if(!query||query.length<2){results.innerHTML='<div style="padding:.6rem;font-size:.7rem;color:var(--text-muted)">Type 2+ characters to search...</div>';return;}
  const q=query.toLowerCase();
  const matches=[];
  Object.entries(LESSONS).forEach(([key,lesson])=>{
    const haystack=(lesson.title+' '+lesson.eyebrow+' '+lesson.intro+' '+lesson.points.join(' ')+' '+lesson.concepts.map(c=>c.title+' '+c.desc).join(' ')).toLowerCase();
    if(haystack.includes(q)){
      // Score: title match > eyebrow match > body match
      let score=0;
      if(lesson.title.toLowerCase().includes(q))score+=10;
      if(lesson.eyebrow.toLowerCase().includes(q))score+=5;
      score+=1;
      matches.push({key,lesson,score});
    }
  });
  matches.sort((a,b)=>b.score-a.score);
  if(matches.length===0){
    results.innerHTML='<div style="padding:.6rem;font-size:.7rem;color:var(--text-muted)">No results found</div>';
    return;
  }
  results.innerHTML=matches.slice(0,10).map(m=>`<div onclick="navigateToLesson('${m.key}');moleSearchOpen=false;document.getElementById('mole-bubble').style.display='none';document.getElementById('lesson-search').value='';hideSearchResults()" style="padding:.45rem .7rem;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;" onmouseenter="this.style.background='rgba(59,130,246,.08)'" onmouseleave="this.style.background='none'"><div style="font-size:.72rem;color:var(--text);font-weight:500;">${m.lesson.title}</div><div style="font-size:.6rem;color:var(--text-muted)">${m.lesson.eyebrow}</div></div>`).join('');
}

// ============================================================
let srCards={};// {cardId: {interval, repetitions, easeFactor, nextReview, question, options, answer, lessonKey}}
let srDue=[];
let srMode=false;// true = spaced repetition mode instead of regular quiz

async function loadSRData(){
  try{
    const r=await _store.get('molebio-sr');
    if(r&&r.value)srCards=JSON.parse(r.value);
  }catch(e){}
}
async function saveSRData(){
  try{await _store.set('molebio-sr',JSON.stringify(srCards));}catch(e){}
}

function initSRCards(){
  // Generate cards from all curated quizzes + auto-generated
  const allKeys=Object.keys(LESSONS);
  allKeys.forEach(key=>{
    const questions=CURATED_QUIZZES[key]||getQuizForLesson(key);
    questions.forEach((q,i)=>{
      const id=key+'_q'+i;
      if(!srCards[id]){
        srCards[id]={interval:0,repetitions:0,easeFactor:2.5,nextReview:0,question:q.q,options:q.options,answer:q.answer,lessonKey:key};
      } else {
        // Update question text in case it changed but keep SR data
        srCards[id].question=q.q;srCards[id].options=q.options;srCards[id].answer=q.answer;
      }
    });
  });
  saveSRData();
}

function getDueCards(){
  const now=Date.now();
  return Object.entries(srCards).filter(([id,c])=>c.nextReview<=now).sort((a,b)=>a[1].nextReview-b[1].nextReview);
}

function sm2(card,quality){
  // quality: 0=complete fail, 3=correct with difficulty, 4=correct, 5=perfect
  let {interval,repetitions,easeFactor}=card;
  if(quality>=3){
    if(repetitions===0)interval=1;
    else if(repetitions===1)interval=6;
    else interval=Math.round(interval*easeFactor);
    repetitions++;
  } else {
    repetitions=0;interval=1;
  }
  easeFactor=Math.max(1.3,easeFactor+0.1-(5-quality)*(0.08+(5-quality)*0.02));
  const nextReview=Date.now()+interval*24*60*60*1000;// interval in days
  return {...card,interval,repetitions,easeFactor,nextReview};
}

let srCurrentCard=null, srAnswered=false;

function renderSRPanel(){
  const qp=document.getElementById('quiz-panel');if(!qp)return;
  const due=getDueCards();
  if(due.length===0){
    qp.innerHTML=`<div style="padding:1rem;text-align:center;">
      <div style="font-family:'DM Serif Display',serif;font-size:1rem;color:var(--text);margin-bottom:.3rem;">All caught up!</div>
      <div style="font-size:.75rem;color:var(--text-muted);margin-bottom:.5rem;">No cards due for review. Come back later or add new modules.</div>
      <div style="font-size:.65rem;color:var(--accent2);">${Object.keys(srCards).length} total cards · ${due.length} due</div>
      <button class="vp-btn" style="margin-top:.4rem;" onclick="toggleQuiz()">Close</button>
    </div>`;
    return;
  }
  const [id,card]=due[0];
  srCurrentCard={id,card};srAnswered=false;
  qp.innerHTML=`<div style="padding:.6rem .8rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;">
      <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--accent2);">${due.length} cards due</span>
      <span style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--text-muted);">Interval: ${card.interval}d · EF: ${card.easeFactor.toFixed(1)}</span>
    </div>
    <div style="font-size:.75rem;color:var(--text);line-height:1.5;margin-bottom:.5rem;">${card.question}</div>
    <div style="display:flex;flex-direction:column;gap:.25rem;" id="sr-options">
      ${card.options.map((opt,i)=>`<button class="quiz-opt" data-opt="${i}" onclick="answerSR(this,'${opt.replace(/'/g,"\\'")}')" style="text-align:left;padding:.35rem .6rem;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text-dim);font-size:.7rem;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;line-height:1.4;">${opt}</button>`).join('')}
    </div>
    <div id="sr-feedback" style="margin-top:.4rem;font-size:.7rem;min-height:1.2rem;"></div>
  </div>`;
}

function answerSR(btn,selected){
  if(srAnswered||!srCurrentCard)return;
  srAnswered=true;
  const {id,card}=srCurrentCard;
  const correct=(selected===card.answer);
  const quality=correct?4:1;// 4=correct, 1=fail
  // Mole reacts to SR answers
  if(typeof moleReact==='function')moleReact(correct?'correct':'wrong');

  // Update card with SM-2
  srCards[id]=sm2(card,quality);
  saveSRData();

  // Visual feedback
  document.querySelectorAll('#sr-options .quiz-opt').forEach(b=>{
    const opt=card.options[+b.dataset.opt];
    if(opt===card.answer){b.style.background='rgba(16,185,129,.15)';b.style.borderColor='#10b981';b.style.color='#34d399';}
    else if(b===btn&&!correct){b.style.background='rgba(239,68,68,.15)';b.style.borderColor='#ef4444';b.style.color='#f87171';}
    b.style.cursor='default';
  });

  const fb=document.getElementById('sr-feedback');
  if(fb){
    fb.innerHTML=correct
      ?`<span style="color:#34d399">Correct!</span> <span style="color:var(--text-muted);">Next review in ${srCards[id].interval} day(s)</span>`
      :`<span style="color:#f87171">Incorrect.</span> <span style="color:var(--text-dim)">Answer: ${card.answer}</span> <span style="color:var(--text-muted);">Will review again soon</span>`;
    fb.innerHTML+=` <button class="vp-btn" style="margin-left:.5rem;font-size:.6rem;" onclick="renderSRPanel()">Next card →</button>`;
  }
}

let tourStep=0;
const TOUR_STEPS=[
  {target:'.sidebar',pos:'right',title:'Module Navigation',desc:'Browse 8 topic sections with dozens of modules. Click any topic to expand its subtopics.'},
  {target:'.lesson-panel',pos:'center',title:'Lesson Content',desc:'Each lesson has an introduction, concept cards, deep dive text, and key takeaways.'},
