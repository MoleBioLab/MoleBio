signaling_gpcr:{eyebrow:'Signal Transduction',title:'GPCR & cAMP/PKA Cascade',intro:'G protein-coupled receptors (GPCRs) are the largest family of cell-surface receptors (~800 in humans). Ligand binding triggers a conserved signaling cascade: GPCR → heterotrimeric G protein → adenylyl cyclase → cAMP → PKA → phosphorylation of downstream targets.',concepts:[{label:'GPCRs',title:'7-Transmembrane Receptors',desc:'Seven alpha-helices span the membrane. Ligand binding to the extracellular face causes a conformational change in the cytoplasmic face that activates the G protein.'},{label:'G Proteins',title:'Heterotrimeric GTPases',desc:'Gα (GTPase), Gβ, Gγ subunits. GDP-bound Gα is inactive; GTP exchange activates Gα. Gα-GTP and Gβγ each signal to effectors.'},{label:'cAMP',title:'Second Messenger',desc:'Adenylyl cyclase converts ATP → cAMP. cAMP activates PKA by binding its regulatory subunits. Phosphodiesterase (PDE) degrades cAMP to terminate the signal.'},{label:'PKA',title:'Protein Kinase A',desc:'Tetrameric (R₂C₂). 4 cAMP molecules bind 2 R subunits, releasing 2 active C subunits. PKA phosphorylates Ser/Thr residues on CREB, glycogen phosphorylase kinase, and others.'}],body:"The GPCR-Gs-AC-cAMP-PKA pathway is one of the best-understood signaling cascades in biology. When a ligand (e.g., epinephrine) binds the receptor, a conformational change in the 7-TM bundle is transmitted to the cytoplasmic face, catalyzing GDP-to-GTP exchange on Gα. The activated Gα-GTP dissociates from Gβγ and stimulates adenylyl cyclase, which converts ATP to the second messenger cAMP.\n\nSignal amplification occurs at multiple steps: one GPCR activates many G proteins; each Gα-GTP activates AC continuously; each AC produces many cAMP; each PKA phosphorylates many substrates. A single epinephrine molecule can mobilize millions of glucose molecules from glycogen.",points:['~800 GPCRs in humans — targets of ~35% of all FDA-approved drugs','Gs stimulates AC (β-adrenergic); Gi inhibits AC (muscarinic M2); Gq activates PLC-β → IP3/DAG','β-blockers (propranolol), antihistamines (loratadine), and opioids (morphine) all target GPCRs','Cholera toxin permanently activates Gs by ADP-ribosylating Gα, locking it in GTP-bound state'],highlight:{label:'Pharmacology',text:'GPCRs are the single most important drug target class. Beta-agonists (albuterol for asthma), beta-blockers (metoprolol for hypertension), opioid agonists (morphine), and dopamine antagonists (haloperidol for psychosis) all work through GPCRs. Understanding the cascade is essential for pharmacology.'},pdbStructures:[{pdb:'2RH1',name:'Beta-2 Adrenergic',desc:'Beta-2 adrenergic receptor — GPCR',color:'#3b82f6'},{pdb:'1F88',name:'Rhodopsin',desc:'Visual GPCR — light receptor',color:'#8b5cf6'}],viewerType:'signaling_animator',signalingKey:'gpcr'},
signaling_rtk:{eyebrow:'Signal Transduction',title:'Receptor Tyrosine Kinases',intro:'Receptor tyrosine kinases (RTKs) are single-pass transmembrane receptors that transduce extracellular growth factor signals into intracellular phosphorylation cascades. Ligand binding induces dimerization and cross-phosphorylation, recruiting adaptor proteins that activate Ras → Raf → MEK → ERK (MAPK pathway).',concepts:[{label:'RTK Activation',title:'Dimerization & Autophosphorylation',desc:'Ligand (EGF, insulin, PDGF) induces receptor dimerization. Kinase domains cross-phosphorylate each other on cytoplasmic Tyr residues.'},{label:'Ras',title:'Small GTPase Switch',desc:'Grb2-SOS complex activates Ras (GDP→GTP). Ras-GTP recruits Raf to the membrane. Ras mutations (G12V, G13D, Q61L) are found in ~30% of cancers.'},{label:'MAPK Cascade',title:'Raf → MEK → ERK',desc:'A three-tiered kinase cascade that amplifies and diversifies the signal. ERK phosphorylates >200 substrates including transcription factors (Elk-1, Myc).'},{label:'PI3K/Akt',title:'Survival Pathway',desc:'RTKs also activate PI3K → PIP3 → Akt. Akt promotes survival (inhibits Bad, activates mTOR). PTEN antagonizes PI3K. Both are frequently mutated in cancer.'}],body:"The Ras-MAPK pathway is central to cell proliferation. Gain-of-function mutations in Ras (KRAS G12C in lung adenocarcinoma) or Raf (BRAF V600E in melanoma) drive constitutive signaling independent of ligand. These are among the most common oncogenic mutations.\n\nImatinib (Gleevec) was the first successful targeted therapy, inhibiting the BCR-ABL fusion tyrosine kinase in CML. Subsequent RTK inhibitors include gefitinib/erlotinib (EGFR), trastuzumab (HER2), and sotorasib (KRAS G12C).",points:['~58 RTKs in humans grouped into ~20 subfamilies (EGFR, PDGFR, VEGFR, InsR, etc.)','KRAS mutations found in ~90% of pancreatic, ~40% of colorectal, ~30% of lung adenocarcinomas','Sotorasib (2021) was the first approved KRAS inhibitor — targeting the G12C mutant specifically','Negative regulators: Ras-GAPs accelerate GTP hydrolysis; Sprouty inhibits Raf; PTEN dephosphorylates PIP3'],highlight:{label:'Precision Oncology',text:'Molecular profiling of tumors to identify specific RTK/Ras pathway mutations now guides therapy selection. BRAF V600E → vemurafenib; HER2 amplification → trastuzumab; EGFR L858R → osimertinib; KRAS G12C → sotorasib. This is the foundation of precision oncology.'},pdbStructures:[{pdb:'1M17',name:'EGFR Kinase',desc:'EGF receptor kinase domain',color:'#ef4444'},{pdb:'1IRK',name:'Insulin Receptor',desc:'Insulin receptor kinase domain',color:'#3b82f6'}],viewerType:'signaling_animator',signalingKey:'rtk'},
signaling_jakstat:{eyebrow:'Signal Transduction',title:'JAK-STAT Pathway',intro:'The JAK-STAT pathway is the principal signaling mechanism for cytokines and interferons. Ligand binding activates receptor-associated Janus kinases (JAKs), which phosphorylate STAT transcription factors that dimerize and translocate to the nucleus to drive gene expression.',concepts:[{label:'JAKs',title:'Janus Kinases',desc:'Four JAKs (JAK1, JAK2, JAK3, TYK2) are constitutively associated with cytokine receptor intracellular domains. Ligand-induced receptor dimerization brings JAKs into proximity for trans-phosphorylation and activation.'},{label:'STATs',title:'Signal Transducers',desc:'Seven STATs (1-4, 5a, 5b, 6) are recruited to phosphorylated receptors via SH2 domains. JAKs phosphorylate STATs on a critical tyrosine, enabling dimerization.'},{label:'Nuclear Translocation',title:'Transcription Activation',desc:'Phosphorylated STAT dimers translocate to the nucleus via importin-alpha/beta, bind GAS (gamma-activated sequence) elements, and activate target gene transcription.'},{label:'Negative Regulators',title:'SOCS, PIAS, PTPs',desc:'SOCS proteins (feedback inhibitors induced by STATs), PIAS (protein inhibitors of activated STATs), and phosphatases (SHP1/2) terminate signaling.'}],body:"The JAK-STAT pathway is remarkably direct: receptor to transcription factor in just a few steps, with no second messengers or kinase cascades. This directness enables rapid transcriptional responses to cytokines within minutes.\nJAK2 V617F is a gain-of-function mutation found in >95% of polycythemia vera and ~50% of essential thrombocythemia and primary myelofibrosis (myeloproliferative neoplasms). This single mutation drives constitutive JAK2 activation independent of cytokine binding.\nThe pathway is critical for immune function: JAK3 mutations cause severe combined immunodeficiency (SCID) because IL-2, IL-4, IL-7, IL-9, IL-15, and IL-21 all signal through JAK3-containing receptors.",points:['JAK-STAT is the primary signaling pathway for ~60 cytokines, interferons, and growth factors','JAK2 V617F mutation: >95% of polycythemia vera, ~50% of ET and PMF','Ruxolitinib (JAK1/2 inhibitor) is FDA-approved for myelofibrosis and polycythemia vera','Tofacitinib (JAK1/3 inhibitor) is approved for rheumatoid arthritis, ulcerative colitis, and psoriatic arthritis','JAK3 deficiency causes T-B+NK- SCID due to loss of gamma-chain cytokine signaling'],highlight:{label:'JAK Inhibitors in Medicine',text:'JAK inhibitors (jakinibs) are transforming treatment of autoimmune diseases and myeloproliferative neoplasms. Ruxolitinib (JAK1/2) for myelofibrosis, tofacitinib (JAK1/3) for RA, baricitinib (JAK1/2) for RA and COVID-19, and upadacitinib (JAK1-selective) for RA represent an expanding class. Selectivity matters: pan-JAK inhibition increases infection risk, driving development of more selective inhibitors.'},pdbStructures:[{pdb:'3FUP',name:'JAK2 Kinase',desc:'JAK2 kinase domain',color:'#8b5cf6'},{pdb:'1BG1',name:'STAT3',desc:'STAT3 dimer on DNA',color:'#3b82f6'}],viewerType:'signaling_animator',signalingKey:'jakstat'},
signaling_nfkb:{eyebrow:'Signal Transduction',title:'NF-\u03baB Pathway',intro:'Nuclear factor kappa-B (NF-\u03baB) is the master transcription factor of innate immunity and inflammation. It is activated by pathogen-associated molecular patterns (PAMPs), pro-inflammatory cytokines (TNF-\u03b1, IL-1), and cellular stress signals.',concepts:[{label:'NF-\u03baB Family',title:'Rel Homology Domain',desc:'Five subunits: RelA (p65), RelB, c-Rel, p50 (from p105), p52 (from p100). The canonical p65/p50 heterodimer is the most common active form.'},{label:'I\u03baB Inhibitors',title:'Cytoplasmic Sequestration',desc:'In resting cells, I\u03baB\u03b1 masks the nuclear localization signal (NLS) of NF-\u03baB, retaining it in the cytoplasm. Signal-induced I\u03baB phosphorylation triggers its ubiquitination and proteasomal degradation.'},{label:'IKK Complex',title:'I\u03baB Kinase',desc:'The IKK complex (IKK\u03b1, IKK\u03b2, NEMO/IKK\u03b3) phosphorylates I\u03baB\u03b1 on Ser32/Ser36, marking it for K48-linked ubiquitination and 26S proteasome degradation.'},{label:'Target Genes',title:'Inflammation & Survival',desc:'NF-\u03baB activates genes for cytokines (TNF, IL-6, IL-8), anti-apoptotic proteins (Bcl-xL, cIAP), adhesion molecules (ICAM-1), and enzymes (COX-2, iNOS).'}],body:"The canonical NF-\u03baB pathway is activated by TNF receptors, IL-1 receptors, and Toll-like receptors (TLRs). Signal transduction converges on the IKK complex, which phosphorylates I\u03baB\u03b1, leading to its ubiquitin-dependent degradation and release of NF-\u03baB to the nucleus.\nConstitutive NF-\u03baB activation is a hallmark of many cancers, particularly lymphomas. The anti-apoptotic gene program driven by NF-\u03baB (Bcl-xL, survivin, cIAP1/2) promotes tumor cell survival. Bortezomib (Velcade), a proteasome inhibitor used in multiple myeloma, works in part by preventing I\u03baB degradation and thus inhibiting NF-\u03baB.\nAspirin and glucocorticoids both inhibit NF-\u03baB signaling by different mechanisms: aspirin inhibits IKK\u03b2 directly, while glucocorticoids induce I\u03baB\u03b1 expression and compete for coactivators.",points:['NF-\u03baB is sequestered in the cytoplasm by I\u03baB; IKK-mediated I\u03baB phosphorylation releases it','Canonical pathway: TNF/IL-1/TLR \u2192 IKK \u2192 I\u03baB degradation \u2192 p65/p50 nuclear translocation','Non-canonical pathway: BAFF/CD40L \u2192 NIK \u2192 IKK\u03b1 \u2192 p100 processing to p52/RelB','NF-\u03baB target genes include TNF-\u03b1, IL-6, COX-2, Bcl-xL, and ICAM-1','Bortezomib blocks proteasomal I\u03baB degradation, indirectly inhibiting NF-\u03baB in myeloma'],highlight:{label:'Therapeutic Targeting',text:'NF-\u03baB is one of the most sought-after drug targets in inflammation and cancer. Glucocorticoids (dexamethasone) are the most widely used NF-\u03baB inhibitors in clinical practice. NSAIDs including aspirin inhibit IKK\u03b2 at high doses. Bortezomib and newer proteasome inhibitors (carfilzomib, ixazomib) block I\u03baB degradation. Direct IKK inhibitors are in clinical development for inflammatory diseases and cancer.'},pdbStructures:[{pdb:'1VKX',name:'NF-kB p50/p65',desc:'NF-kB heterodimer on DNA',color:'#ef4444'},{pdb:'3RZF',name:'IKKbeta',desc:'IkB kinase beta',color:'#f59e0b'}],viewerType:'signaling_animator',signalingKey:'nfkb'},
tools_tm:{eyebrow:'Calculators',title:'DNA Melting Temperature (Tm)',intro:'The melting temperature (Tm) is the temperature at which 50% of a DNA duplex is denatured into single strands. Tm depends on sequence length, GC content, salt concentration, and mismatches. It is essential for designing PCR primers, hybridization probes, and understanding DNA stability.',concepts:[{label:'GC Content',title:'Higher GC = Higher Tm',desc:'G-C base pairs have 3 H-bonds vs 2 for A-T. Higher GC content increases Tm by ~2-4°C per percent GC.'},{label:'Salt',title:'Cation Stabilization',desc:'Monovalent cations (Na⁺, K⁺) neutralize phosphate backbone charge repulsion, stabilizing the duplex. Higher [Na⁺] = higher Tm.'},{label:'Length',title:'Short vs Long',desc:'For oligonucleotides (<14 nt), use the Wallace rule: Tm = 2(A+T) + 4(G+C). For longer sequences, use the nearest-neighbor or salt-adjusted formulas.'},{label:'Mismatches',title:'Destabilization',desc:'Each mismatch reduces Tm by ~1-5°C depending on type and position. Internal mismatches are more destabilizing than terminal ones.'}],body:"Three common Tm formulas: (1) Wallace rule for short oligos: Tm = 2(A+T) + 4(G+C). (2) Basic formula: Tm = 81.5 + 16.6·log10[Na⁺] + 41·(G+C)/(A+T+G+C) - 675/N. (3) Nearest-neighbor thermodynamics for accurate primer design.\n\nFor PCR primer design, optimal Tm is typically 55-65°C. Primer pairs should have Tm within 2-3°C of each other. The GC clamp (G or C at the 3' end) improves priming efficiency.",points:['Wallace rule (oligos <14 nt): Tm = 2(A+T) + 4(G+C)°C','Salt-adjusted: Tm = 81.5 + 16.6·log₁₀[Na⁺] + 41·(%GC) - 675/N','Optimal PCR primer Tm: 55-65°C, primer pair ΔTm < 3°C','DMSO (5%) lowers Tm by ~5°C; formamide by ~0.72°C per 1%'],highlight:{label:'Lab Tip',text:'When designing PCR primers, aim for 18-25 nt, 40-60% GC, Tm 58-62°C, no self-complementarity, and a GC clamp at the 3\' end. Use the calculator on the right to check your primer designs.'},viewerType:'tm_calculator'},
tools_mwpi:{eyebrow:'Calculators',title:'Protein MW & Isoelectric Point',intro:'Molecular weight (MW) and isoelectric point (pI) are fundamental physicochemical properties of proteins. MW determines migration in SDS-PAGE, while pI determines behavior in ion-exchange chromatography and isoelectric focusing. Both can be calculated from the amino acid sequence.',concepts:[{label:'MW',title:'Sum of Residue Masses',desc:'MW = Σ(residue masses) + 18.02 Da (water). Average MW of an amino acid is ~110 Da. A 300-residue protein ≈ 33 kDa.'},{label:'pI',title:'Net Charge = 0',desc:'The pH at which the protein has zero net charge. Determined by the pKa values of all ionizable groups (N-term, C-term, D, E, C, Y, H, K, R).'},{label:'SDS-PAGE',title:'MW Estimation',desc:'SDS denatures and coats proteins uniformly, so migration distance is proportional to log(MW). Compare to standards for MW estimation.'},{label:'IEX',title:'Ion Exchange',desc:'At pH < pI, protein is positively charged (binds cation exchanger). At pH > pI, protein is negatively charged (binds anion exchanger).'}],body:"The pI is calculated by finding the pH where the sum of all positive and negative charges equals zero. Each ionizable group contributes according to the Henderson-Hasselbalch equation.\n\nTypical pI values: most intracellular proteins have pI 5-8. Histones are highly basic (pI ~11, rich in K and R). Pepsin is highly acidic (pI ~1, rich in D and E).",points:['Average amino acid MW: ~110 Da (ranges from Gly 57 to Trp 186 Da)','MW from sequence: sum residue masses + 18.02 (terminal H₂O)','pI determined by: N-terminus (pKa 9.69), C-terminus (pKa 2.34), and side chains of D, E, C, Y, H, K, R','Extinction coefficient at 280 nm depends on Trp, Tyr, and disulfide content'],highlight:{label:'Lab Application',text:'ExPASy ProtParam is the standard online tool for computing these parameters. The calculator here uses the same pKa values. For SDS-PAGE, remember that glycosylation, extreme pI, and membrane proteins can cause anomalous migration.'},viewerType:'mwpi_calculator'},
tools_dogma:{eyebrow:'Tools',title:'Central Dogma Flow',intro:'The central dogma of molecular biology describes the flow of genetic information: DNA → RNA → Protein. This interactive tool lets you edit a DNA sequence and watch mutations propagate through transcription and translation in real time, showing how a single base change can alter the resulting protein.',concepts:[{label:'Transcription',title:'DNA → mRNA',desc:'RNA polymerase reads the template strand (3\'→5\') and synthesizes mRNA (5\'→3\') using complementary base pairing. T in DNA becomes U in RNA.'},{label:'Translation',title:'mRNA → Protein',desc:'Ribosomes read mRNA codons (5\'→3\') and assemble amino acids into a polypeptide. AUG initiates; UAA/UAG/UGA terminate.'},{label:'Mutations',title:'Point Changes',desc:'Silent: codon changes but same AA (degeneracy). Missense: different AA. Nonsense: premature stop. Frameshift: insertion/deletion shifts reading frame.'},{label:'Wobble',title:'3rd Position Tolerance',desc:'The 3rd codon position is most tolerant of mutations due to wobble base pairing. ~70% of 3rd-position mutations are silent.'}],body:"The central dogma was articulated by Francis Crick in 1958. Information flows DNA → RNA → protein, but never protein → nucleic acid. Reverse transcriptase (RNA → DNA) is a notable exception but does not violate the core principle.\n\nPoint mutations are classified by their effect on the protein: synonymous (silent) mutations change the codon but not the amino acid due to genetic code degeneracy. Nonsynonymous mutations change the amino acid (missense) or create a premature stop (nonsense).",points:['Template strand is read 3\'→5\'; mRNA is synthesized 5\'→3\'','The coding (sense) strand has the same sequence as mRNA (with T instead of U)','~25% of random point mutations are synonymous due to 3rd-position degeneracy','Sickle cell: GAG→GTG in HBB gene → Glu→Val at position 6 → HbS polymerization'],highlight:{label:'Try It',text:'Use the interactive viewer to introduce the sickle cell mutation: change the A in GAG to T (making GTG). Watch the mRNA change from GAG to GUG, and the amino acid change from Glu (E) to Val (V). This single nucleotide change causes one of the most common genetic diseases worldwide.'},viewerType:'central_dogma'},
tools_seqconv:{eyebrow:'Tools',title:'Sequence Converter',intro:'A utility for converting between common sequence formats used in molecular biology. Supports DNA ↔ RNA conversion, reverse complement, protein translation, and FASTA formatting.',concepts:[{label:'Complement',title:'Watson-Crick Pairing',desc:'A↔T (DNA) or A↔U (RNA), G↔C. The complement is the sequence of the opposing strand.'},{label:'Reverse Complement',title:'Antiparallel Convention',desc:'DNA strands are antiparallel. The reverse complement of 5\'-ATGC-3\' is 5\'-GCAT-3\' (complement read 5\'→3\').'},{label:'Reading Frames',title:'Three per Strand',desc:'Any sequence has 3 possible reading frames on each strand (6 total). ORF finding identifies the longest AUG-to-stop stretch.'},{label:'FASTA',title:'Standard Format',desc:'>header line followed by sequence lines. The most common format for sequence databases (NCBI, UniProt).'}],body:"The reverse complement is one of the most common operations in molecular biology — needed every time you design a reverse PCR primer, read a sequence from the opposite strand, or analyze restriction sites.\n\nReading frame matters: the same mRNA sequence encodes completely different proteins depending on where translation starts. A frameshift mutation (insertion or deletion of 1-2 bases) scrambles every downstream codon.",points:['Reverse complement: reverse the sequence, then complement each base','DNA→RNA: replace T with U. RNA→DNA: replace U with T','FASTA format: >header on first line, sequence on subsequent lines (typically 60-80 chars per line)','All 6 reading frames (3 per strand) should be checked when analyzing an unknown sequence'],highlight:{label:'Daily Lab Use',text:'Designing a reverse primer? Take your target sequence, find the reverse complement, and that is your primer sequence. This tool does it instantly. Also useful for verifying sequencing results by comparing forward and reverse reads.'},viewerType:'seq_converter'},
tools_mmfit:{eyebrow:'Tools',title:'Michaelis-Menten Curve Fitter',intro:'Paste experimental kinetics data (substrate concentrations and reaction velocities) and this tool will fit the Michaelis-Menten equation by nonlinear least-squares regression, extract Km and Vmax, and overlay the fitted curve on your data points.',concepts:[{label:'Input Data',title:'[S] and v Pairs',desc:'Enter substrate concentrations and corresponding measured velocities. At least 5 data points recommended for reliable fitting.'},{label:'Nonlinear Fit',title:'Least-squares Regression',desc:'Iteratively minimizes the sum of squared residuals between measured and predicted velocities. More accurate than Lineweaver-Burk linearization.'},{label:'Km & Vmax',title:'Extracted Parameters',desc:'The fitted curve yields Km (half-maximal [S]) and Vmax (asymptotic maximum velocity) with R² goodness-of-fit.'},{label:'Residuals',title:'Quality Assessment',desc:'Residual plot shows systematic deviations. Random scatter = good fit. Systematic pattern = model may not apply (e.g., substrate inhibition or cooperativity).'}],body:"Nonlinear regression is the gold standard for fitting enzyme kinetics data. The Lineweaver-Burk double-reciprocal plot distorts experimental error by giving excessive weight to low-[S] points. Modern software fits v = Vmax·[S]/(Km+[S]) directly.\n\nGood experimental design: measure at 6-8 [S] values spanning 0.2×Km to 5×Km. Include duplicates. Use initial velocities only (< 10% substrate consumed).",points:['Nonlinear regression > Lineweaver-Burk for parameter estimation','R² > 0.95 indicates a good fit; examine residuals for systematic deviations','Substrate inhibition (decreasing v at high [S]) indicates the MM model is insufficient','kcat = Vmax/[E]total requires knowing the enzyme concentration'],highlight:{label:'Lab Tip',text:'If your data shows a sigmoidal curve instead of hyperbolic, the enzyme may be allosteric — try the Hill equation instead. If v decreases at high [S], substrate inhibition is occurring. This tool assumes simple Michaelis-Menten kinetics.'},viewerType:'mm_fitter'},
protein_ss_anim:{eyebrow:'Protein Structure & Folding',title:'Secondary Structure Animator',intro:'Step through the four major types of protein secondary structure: alpha-helix, beta-sheet, beta-turn, and random coil. Each panel shows the backbone geometry, hydrogen bonding pattern, and key structural parameters.',concepts:[{label:'α-Helix',title:'3.6 Residues/Turn',desc:'Right-handed helix stabilized by i→i+4 backbone H-bonds between C=O of residue i and N-H of residue i+4. Rise of 1.5 Å per residue, pitch of 5.4 Å per turn.'},{label:'β-Sheet',title:'Extended Strands',desc:'Extended backbone strands connected by H-bonds between adjacent strands. Parallel sheets have same-direction strands; antiparallel sheets alternate direction.'},{label:'β-Turn',title:'Tight Reversal',desc:'A 4-residue motif that reverses chain direction. Stabilized by an H-bond from C=O of residue i to N-H of residue i+3. Gly and Pro are common at turn positions.'},{label:'Random Coil',title:'No Regular Structure',desc:'Regions without repeating backbone angles. Not truly random — they adopt specific conformations but lack the regularity of helices or sheets.'}],body:"The alpha-helix is the most common secondary structure element, found in ~30% of residues in known protein structures. Each peptide C=O group hydrogen-bonds to the N-H group four residues ahead (i→i+4), creating a stable, rod-like structure with 3.6 residues per turn. Side chains project outward from the helix surface. Ala, Glu, Leu, and Met have the highest helix propensity.\n\nBeta-sheets are the second most common element. Extended strands are arranged side-by-side, connected by backbone H-bonds between strands. In antiparallel sheets, adjacent strands run in opposite directions with straight, strong H-bonds. In parallel sheets, strands run in the same direction with angled, slightly weaker H-bonds. Beta-sheets form the core of many protein structures including immunoglobulin domains and TIM barrels.\n\nBeta-turns reverse the direction of the polypeptide chain in just 4 residues. Type I and Type II turns differ in the phi/psi angles of the second and third residues. Glycine is common at position 3 (flexibility) and proline at position 2 (its fixed phi angle suits the turn geometry). Turns are typically found on protein surfaces connecting elements of secondary structure.",points:['Alpha-helix: 3.6 residues/turn, pitch 5.4 Å, i→i+4 H-bonds, side chains point outward','Beta-sheet: extended strands, inter-strand H-bonds, antiparallel sheets have stronger H-bonds than parallel','Beta-turns: 4 residues, reverse chain direction, i→i+3 H-bond, Gly and Pro favored','~30% helix, ~20% sheet, ~25% turns, ~25% coil in average globular proteins'],highlight:{label:'Structure Prediction',text:'Modern AI tools (AlphaFold, RoseTTAFold) predict secondary structure with >90% accuracy by leveraging evolutionary covariance patterns in multiple sequence alignments. The classical Chou-Fasman method (~65% accuracy) and GOR method (~70%) have been largely superseded by deep learning approaches.'},viewerType:'ss_animator'},
lab_pipettes:{eyebrow:'Lab Techniques',title:'Micropipettes',intro:'Micropipettes are precision liquid-handling instruments essential for every molecular biology and biochemistry lab. Understanding how to set volumes correctly and choose the right pipette size is a fundamental skill. Use the interactive viewer to practice setting volumes on P20, P200, and P1000 pipettes.',concepts:[{label:'P20',title:'2–20 µL',desc:'For small volumes. The top dial digit is tens, middle is units, bottom is tenths of µL. Max volume: 20.0 µL.'},{label:'P200',title:'20–200 µL',desc:'Mid-range volumes. Top digit is hundreds, middle is tens, bottom is units of µL. Max volume: 200 µL.'},{label:'P1000',title:'100–1000 µL',desc:'Large volumes. Top digit is thousands, middle is hundreds, bottom is tens of µL. Max volume: 1000 µL.'},{label:'Technique',title:'Forward Pipetting',desc:'Press to first stop → immerse tip → slowly release → move to target → press to first stop → press to second stop (blow-out) → release outside liquid.'}],body:"Each pipette has a volume window showing three digits that correspond to different decimal places depending on the pipette size. The P20 reads in µL with one decimal place (e.g., 15.0 µL). The P200 reads in whole µL (e.g., 150 µL). The P1000 reads in µL with the top digit as thousands (e.g., 1000 µL = 1 mL).\n\nNever set a pipette above its maximum or below ~10% of its maximum — accuracy drops significantly outside the rated range. Always use the correct pipette for your volume: use a P20 for 5 µL, not a P200 (which would be at only 2.5% of its range and highly inaccurate).\n\nPre-wet the tip by aspirating and dispensing the liquid 2-3 times before the actual transfer, especially for viscous solutions or volatile solvents. This equilibrates the air cushion inside the tip and improves accuracy.",points:['Always use the smallest pipette that covers your volume for best accuracy','P20: 0.5–20 µL (±1% at max), P200: 20–200 µL (±0.8%), P1000: 100–1000 µL (±0.6%)','Never exceed the maximum volume — it damages the piston seal','Pre-wet tips for viscous solutions; use filter tips for PCR to prevent contamination','Reverse pipetting (start at second stop) is more accurate for viscous or foamy liquids'],highlight:{label:'Common Mistakes',text:'The most common pipetting error is using the wrong size pipette. A P1000 set to 100 µL is at only 10% of its range and will be far less accurate than a P200 at 100 µL. Other common errors: pipetting too fast (causes aerosols), not keeping the pipette vertical during aspiration, and touching the tip to the container walls during blow-out.'},viewerType:'pipette_viewer'},
lab_gels:{eyebrow:'Lab Techniques',title:'Gel Electrophoresis',intro:'Gel electrophoresis separates macromolecules by size (and sometimes charge) as they migrate through a porous matrix under an electric field. SDS-PAGE separates proteins by molecular weight; agarose gel electrophoresis separates DNA/RNA by size.',concepts:[{label:'SDS-PAGE',title:'Protein Separation',desc:'SDS denatures proteins and coats them with uniform negative charge (~1.4 g SDS/g protein). Migration is proportional to log(MW). Typical gels: 10-15% acrylamide.'},{label:'Agarose Gel',title:'DNA/RNA Separation',desc:'Agarose (0.5-2%) separates DNA fragments by size. DNA is negatively charged (phosphate backbone) and migrates toward the anode (+). Visualized with intercalating dyes.'},{label:'Staining',title:'Detection Methods',desc:'Proteins: Coomassie Brilliant Blue (~50 ng sensitivity) or silver stain (~1 ng). DNA: ethidium bromide (UV), SYBR Safe (blue light), or SYBR Green.'},{label:'MW Ladder',title:'Size Standards',desc:'Pre-stained or unstained protein ladders (10-250 kDa range) or DNA ladders (100 bp, 1 kb) run alongside samples for MW estimation.'}],body:"SDS-PAGE (sodium dodecyl sulfate polyacrylamide gel electrophoresis) is the standard method for analyzing protein mixtures. SDS is an anionic detergent that denatures proteins and binds at a constant ratio, giving all proteins a uniform charge-to-mass ratio. Adding beta-mercaptoethanol or DTT reduces disulfide bonds. In the gel, smaller proteins migrate faster through the acrylamide pores, separating by molecular weight.\n\nAgarose gel electrophoresis separates DNA fragments from ~100 bp to ~25 kb depending on agarose concentration. Lower percentage gels (0.5-0.8%) resolve larger fragments; higher percentage (1.5-2%) resolve smaller fragments. Supercoiled, linear, and nicked circular forms of the same plasmid migrate differently. Pulse-field gel electrophoresis (PFGE) can resolve chromosomal DNA up to several megabases.\n\nAfter running the gel, proteins are visualized by staining (Coomassie or silver) or transferred to a membrane for Western blotting. DNA is typically visualized by staining with an intercalating dye and imaging under UV or blue light.",points:['SDS-PAGE: SDS gives ~1.4 g SDS per g protein, creating uniform charge-to-mass ratio','Acrylamide percentage determines resolution range: 8% for large proteins, 15% for small proteins','Agarose gel: DNA migrates toward + electrode (anode); run at ~5 V/cm for best resolution','Coomassie: ~50 ng detection limit; Silver stain: ~1 ng; fluorescent stains offer better dynamic range','Always run a molecular weight ladder alongside samples for size estimation'],highlight:{label:'Troubleshooting',text:'Smiley bands indicate too much sample or too-high voltage (generates heat). Fuzzy bands suggest protein degradation — add protease inhibitors to your lysis buffer. No bands? Check sample loading, staining time, and that the gel ran in the correct direction (DNA runs to +, proteins run to + in SDS-PAGE).'},viewerType:'gel_viewer'},
lab_western:{eyebrow:'Lab Techniques',title:'Western Blot',intro:'Western blotting combines SDS-PAGE protein separation with antibody-based detection to identify and quantify specific proteins in complex mixtures. It is one of the most widely used techniques in molecular biology and biochemistry research.',concepts:[{label:'Transfer',title:'Gel → Membrane',desc:'Proteins are transferred from the gel to a PVDF or nitrocellulose membrane by applying an electric field perpendicular to the gel. Wet, semi-dry, and turbo transfer systems are available.'},{label:'Blocking',title:'Prevent Nonspecific Binding',desc:'The membrane is incubated with blocking agent (5% non-fat milk or BSA in TBST) to saturate unoccupied binding sites and reduce background.'},{label:'Antibodies',title:'Primary + Secondary',desc:'Primary antibody binds the target protein. HRP- or AP-conjugated secondary antibody binds the primary and provides the detection signal.'},{label:'Detection',title:'Chemiluminescence or Fluorescence',desc:'HRP cleaves luminol substrate (ECL) producing light captured on film or CCD. Fluorescent secondaries enable multiplexed detection on the same blot.'}],body:"The Western blot workflow has five main steps: (1) SDS-PAGE separation of proteins by molecular weight, (2) transfer to a membrane (PVDF or nitrocellulose), (3) blocking to prevent nonspecific antibody binding, (4) incubation with primary antibody specific to the target protein, followed by HRP- or fluorophore-conjugated secondary antibody, and (5) detection by chemiluminescence, fluorescence, or chromogenic substrate.\n\nAntibody selection is critical. Monoclonal antibodies recognize a single epitope and provide high specificity. Polyclonal antibodies recognize multiple epitopes and may give stronger signals but can have higher background. Always validate antibodies with appropriate positive and negative controls.\n\nQuantification requires careful attention to loading controls (beta-actin, GAPDH, total protein stain), linear range of detection, and proper normalization. Housekeeping gene controls can vary between conditions — total protein normalization (Ponceau S or stain-free gels) is increasingly preferred.",points:['PVDF membranes have higher protein-binding capacity and are more durable than nitrocellulose','Block with 5% milk in TBST for most applications; use BSA for phospho-specific antibodies (milk contains casein phosphoproteins)','Primary antibody: typically 1:500–1:5000 dilution, incubate overnight at 4°C','Secondary antibody: 1:5000–1:20000 dilution, 1 hour at room temperature','Stripping and reprobing allows detection of multiple targets on the same membrane'],highlight:{label:'Controls Matter',text:'Every Western blot needs: (1) a positive control (lysate known to express the target), (2) a negative control (knockout or knockdown lysate), (3) a loading control (housekeeping protein or total protein stain), and (4) a molecular weight marker. Without these, results are uninterpretable. Many high-profile paper retractions have involved fabricated or improperly controlled Western blots.'},viewerType:'western_viewer'},
};

function selectTopic(btn,topic){document.querySelectorAll('.topic-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const firstKey=Object.keys(LESSONS).find(k=>k.startsWith(topic+'_'));if(firstKey){document.querySelectorAll('.subtopic-btn').forEach(b=>b.classList.remove('active'));btn.nextElementSibling?.querySelector('.subtopic-btn')?.classList.add('active');navigateToLesson(firstKey);}}
function selectSubtopic(btn,key){document.querySelectorAll('.subtopic-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');navigateToLesson(key);}

function renderLesson(key){
  const d=LESSONS[key];if(!d)return;
  // Show skeleton placeholders immediately for perceived performance
  const lp=document.getElementById('lesson-panel');

// ============================================================
// VIEWER ZOOM SYSTEM with click-drag panning
// ============================================================
let viewerZoom=1, viewerPanX=0, viewerPanY=0;
let vbOriginals=new Map();
let panState={active:false,startX:0,startY:0,startPanX:0,startPanY:0,target:null};
let zoomAbort=null;// AbortController for cleanup

function initViewerZoom(){
  const panel=document.getElementById('right-panel');if(!panel)return;
  viewerZoom=1;viewerPanX=0;viewerPanY=0;
  vbOriginals.clear();

  // Clean up previous listeners
  if(zoomAbort)zoomAbort.abort();
  zoomAbort=new AbortController();
  const sig={signal:zoomAbort.signal};

  // Remove old zoom controls
  panel.querySelectorAll('.zoom-controls').forEach(el=>el.remove());

  // Find all SVGs in the panel (not inside controls)
  const svgs=Array.from(panel.querySelectorAll('svg')).filter(s=>!s.closest('.zoom-controls')&&!s.closest('.vp-controls'));
  if(svgs.length===0)return;

  // Store original viewBox for each SVG
  svgs.forEach(s=>{
    const vb=s.getAttribute('viewBox');
    if(vb){
      const parts=vb.split(/[\s,]+/).map(Number);
      if(parts.length===4)vbOriginals.set(s,{x:parts[0],y:parts[1],w:parts[2],h:parts[3]});
    }
    s.style.cursor='default';
    s.dataset.zoomTarget='1';
  });

  if(vbOriginals.size===0)return;

  // Add zoom controls inside the SVG's parent container (not the outer panel)
  const controls=document.createElement('div');
  controls.className='zoom-controls';
  controls.innerHTML=`
    <button class="zoom-btn" onclick="zoomViewer(-1)" title="Zoom out" aria-label="Zoom out">−</button>
    <span class="zoom-level" id="zoom-level">100%</span>
    <button class="zoom-btn" onclick="zoomViewer(1)" title="Zoom in" aria-label="Zoom in">+</button>
    <button class="zoom-btn" onclick="zoomViewer(0)" title="Reset zoom" aria-label="Reset zoom" style="font-size:.55rem;">↺</button>`;
  // Find the best container: the direct parent of the first SVG
  const firstSvg=svgs[0];
  const svgParent=firstSvg.parentElement;
  if(svgParent&&svgParent!==panel){
    // Attach inside the SVG's container so zoom floats over the diagram area only
    svgParent.style.position='relative';
    svgParent.appendChild(controls);
  } else {
    // Fallback: attach to panel but position above any bottom chrome
    panel.style.position='relative';
    panel.appendChild(controls);
  }

  // Ctrl/Cmd + scroll to zoom
  panel.addEventListener('wheel',function(e){
    if(!e.ctrlKey&&!e.metaKey)return;
    e.preventDefault();
    zoomViewer(e.deltaY>0?-1:1);
  },{passive:false,...sig});

  // Click-drag to pan
  panel.addEventListener('mousedown',function(e){
    if(viewerZoom<=1)return;
    const svg=e.target.closest('svg[data-zoom-target]');
    if(!svg)return;
    e.preventDefault();
    panState={active:true,startX:e.clientX,startY:e.clientY,startPanX:viewerPanX,startPanY:viewerPanY,target:svg};
    svg.style.cursor='grabbing';
  },sig);
  document.addEventListener('mousemove',function(e){
    if(!panState.active)return;
    viewerPanX=panState.startPanX-(e.clientX-panState.startX)/viewerZoom;
    viewerPanY=panState.startPanY-(e.clientY-panState.startY)/viewerZoom;
    applyZoomPan();
  },sig);
  document.addEventListener('mouseup',function(){
    if(!panState.active)return;
    if(panState.target)panState.target.style.cursor=viewerZoom>1?'grab':'default';
    panState.active=false;
  },sig);

  // Touch: one-finger pan + two-finger pinch
  let touchStart=null,lastPinch=0;
  panel.addEventListener('touchstart',function(e){
    if(e.touches.length===1&&viewerZoom>1){
      const svg=e.target.closest('svg[data-zoom-target]');
      if(svg)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,px:viewerPanX,py:viewerPanY};
    }
    if(e.touches.length===2){touchStart=null;lastPinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  },{passive:true,...sig});
  panel.addEventListener('touchmove',function(e){
    if(touchStart&&e.touches.length===1){
      e.preventDefault();
      viewerPanX=touchStart.px-(e.touches[0].clientX-touchStart.x)/viewerZoom;
      viewerPanY=touchStart.py-(e.touches[0].clientY-touchStart.y)/viewerZoom;
      applyZoomPan();
    }
    if(e.touches.length===2){
      e.preventDefault();
      const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(lastPinch>0&&Math.abs(dist-lastPinch)>8){zoomViewer(dist>lastPinch?1:-1);lastPinch=dist;}
    }
  },{passive:false,...sig});
  panel.addEventListener('touchend',function(){touchStart=null;lastPinch=0;},{passive:true,...sig});
}

function applyZoomPan(){
  vbOriginals.forEach((orig,svg)=>{
    const w=orig.w/viewerZoom, h=orig.h/viewerZoom;
    // Center the zoom, then offset by pan
    const cx=orig.x+orig.w/2, cy=orig.y+orig.h/2;
    const x=cx-w/2+viewerPanX;
    const y=cy-h/2+viewerPanY;
    svg.setAttribute('viewBox',`${x} ${y} ${w} ${h}`);
  });
}

function zoomViewer(dir){
  const levelEl=document.getElementById('zoom-level');
  if(dir===0){viewerZoom=1;viewerPanX=0;viewerPanY=0;}
  else viewerZoom=Math.max(0.5,Math.min(6,viewerZoom+dir*0.25));

  applyZoomPan();
  if(levelEl)levelEl.textContent=Math.round(viewerZoom*100)+'%';
  // Update cursors
  vbOriginals.forEach((orig,svg)=>{svg.style.cursor=viewerZoom>1?'grab':'default';});
}

// ── Shared SVG helpers ──
function memSvgH(s){
  const NS2='http://www.w3.org/2000/svg';
  function el(tag,attrs){const n=document.createElementNS(NS2,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));s.appendChild(n);return n;}
  function line(x1,y1,x2,y2,c,w,da){const a={x1,y1,x2,y2,stroke:c||'#586e85','stroke-width':w||1.8,'stroke-linecap':'round'};if(da)a['stroke-dasharray']=da;el('line',a);}
  function txt(x,y,str,c,fs,anc,fw){const t=el('text',{x,y,'text-anchor':anc||'middle','font-size':fs||9,fill:c||'#94a3b8','font-family':'DM Sans,sans-serif','font-weight':fw||'600'});t.textContent=str;}
  function mono(x,y,str,c,fs){const t=el('text',{x,y,'text-anchor':'middle','font-size':fs||8,fill:c||'#64748b','font-family':'DM Mono,monospace','font-weight':'500'});t.textContent=str;}
  function rect(x,y,w,h,fill,stroke,rx){el('rect',{x,y,width:w,height:h,fill:fill||'none',stroke:stroke||'none',rx:rx||4,'stroke-width':1.5});}
  function circ(cx,cy,r,fill,stroke){el('circle',{cx,cy,r,fill:fill||'#334155',stroke:stroke||'none','stroke-width':1.5});}
  function path(d,fill,stroke,w){el('path',{d,fill:fill||'none',stroke:stroke||'#586e85','stroke-width':w||1.8,'stroke-linecap':'round'});}
  function arrow(x1,y1,x2,y2,c){
    const id='ma'+Math.round(Math.random()*9999);
    const d=el('defs',{});const mk=document.createElementNS(NS2,'marker');
    Object.entries({id,markerWidth:'7',markerHeight:'7',refX:'5',refY:'3.5',orient:'auto'}).forEach(([k,v])=>mk.setAttribute(k,v));
    const p=document.createElementNS(NS2,'path');p.setAttribute('d','M0,0 L0,7 L7,3.5 z');p.setAttribute('fill',c||'#94a3b8');
    mk.appendChild(p);d.appendChild(mk);s.appendChild(d);
    el('line',{x1,y1,x2,y2,stroke:c||'#94a3b8','stroke-width':1.8,'marker-end':`url(#${id})`});
  }
  // Phospholipid glyph: head circle + two wavy tails
  function phospholipid(hx,hy,tailLen,angle,headCol,hasTailKink){
    const a=angle*Math.PI/180;
    const dx=Math.sin(a),dy=Math.cos(a);
    // Head
    circ(hx,hy,7,headCol||'#60a5fa',headCol?headCol.replace('0.','0.').replace(')',')'):'#3b82f6');
    // Tail 1 (straight or with kink)
    const t1sx=hx+dx*10-3*dy, t1sy=hy+dy*10+3*dx;
    if(hasTailKink){
      const mx=t1sx+dx*tailLen*0.4-5*dy, my=t1sy+dy*tailLen*0.4+5*dx;
      const ex=t1sx+dx*tailLen, ey=t1sy+dy*tailLen;
      path(`M${t1sx},${t1sy} Q${mx},${my} ${ex},${ey}`,'none','#f59e0b',2);
    } else {
      line(t1sx,t1sy,t1sx+dx*tailLen,t1sy+dy*tailLen,'#94a3b8',2);
    }
    // Tail 2 (straight)
    const t2sx=hx+dx*10+3*dy, t2sy=hy+dy*10-3*dx;
    line(t2sx,t2sy,t2sx+dx*tailLen,t2sy+dy*tailLen,'#94a3b8',2);
  }
  // Cholesterol: small rigid body
  function cholesterol(cx,cy,angle){
    const a=angle*Math.PI/180;
    const dx=Math.sin(a)*0.8,dy=Math.cos(a)*0.8;
    // Ring system (rect)
    const rx=cx+dx*6,ry=cy+dy*6;
    el('rect',{x:rx-4,y:ry-3,width:8,height:22,rx:2,fill:'rgba(245,158,11,.3)',stroke:'#f59e0b','stroke-width':1,transform:`rotate(${angle},${rx},${ry+8})`});
    // OH head
    circ(cx,cy,4,'rgba(245,158,11,.6)','#f59e0b');
    mono(cx,cy+2.5,'OH','#f59e0b',5);
  }
  return {el,line,txt,mono,rect,circ,path,arrow,phospholipid,cholesterol};
}

  <button class="vp-btn${memLipidType==='CHOL'?' active':''}" data-lt onclick="memLipidType='CHOL';drawLipidStruct();document.querySelectorAll('[data-lt]').forEach(b=>b.classList.remove('active'));this.classList.add('active')">Cholesterol</button>
  <button class="vp-btn${memLipidType==='SM'?' active':''}" data-lt onclick="memLipidType='SM';drawLipidStruct();document.querySelectorAll('[data-lt]').forEach(b=>b.classList.remove('active'));this.classList.add('active')">Sphingomyelin</button>
</div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem;min-height:0;overflow:hidden;">
  <svg id="lipid-svg" style="max-width:100%;max-height:100%;display:block;"></svg>
</div>
<div id="lipid-info" style="padding:.4rem .8rem;border-top:1px solid var(--border);flex-shrink:0;font-size:.66rem;line-height:1.55;color:var(--text-muted);"></div>`;
  drawLipidStruct();
}

function drawLipidStruct(){
  const svg=document.getElementById('lipid-svg');const info=document.getElementById('lipid-info');
  if(!svg||!info)return;svg.innerHTML='';
  // Use the shared ball-and-stick primitives from the AA viewer
  const s=svg;
  // Local atom/bond helpers (smaller radii for compact lipid structures)
  function B(x1,y1,x2,y2,c,w){bnd(s,x1,y1,x2,y2,c||'#444',w||2);}
  function DB(x1,y1,x2,y2,cx,cy){dblB(s,x1,y1,x2,y2,cx,cy);}
  function A(x,y,type,label,r){atm(s,x,y,type,label,r||9);}
  function LBL(x,y,txt,col,fs){const t=svgE('text',{x,y,'text-anchor':'middle','font-size':fs||8,fill:col||'#94a3b8','font-family':'DM Mono,monospace','font-weight':'600'},s);t.textContent=txt;}
  function TLBL(x,y,txt,col,fs){const t=svgE('text',{x,y,'text-anchor':'middle','font-size':fs||10,fill:col||'#e2e8f0','font-family':'DM Serif Display,serif'},s);t.textContent=txt;}
  // Zigzag chain: draws n carbons in a zigzag going downward from (sx,sy), returns endpoint
  function zigChain(sx,sy,n,dx,dy,col){
    let px=sx,py=sy;
    for(let i=0;i<n;i++){
      const nx=px+(i%2===0?dx:-dx), ny=py+dy;
      B(px,py,nx,ny,col||'#555',1.8);
      A(nx,ny,'C','',6);
      px=nx;py=ny;
    }
    return [px,py];
  }

  if(memLipidType==='PC'||memLipidType==='PE'||memLipidType==='PS'){
    s.setAttribute('viewBox','120 0 360 520');
    const headCol=memLipidType==='PC'?'#60a5fa':memLipidType==='PE'?'#34d399':'#f87171';

    // ── HEAD GROUP ──
    let hx=240,hy=32;
    if(memLipidType==='PC'){
      // Choline: (CH3)3-N+-CH2-CH2-O-
      A(hx,hy,'N','N⁺',10);
      // Three methyl groups on N
      B(hx,hy,hx-22,hy-16,'#555',1.6);A(hx-22,hy-16,'C','',6);LBL(hx-22,hy-28,'CH₃','#64748b',6);
      B(hx,hy,hx+22,hy-16,'#555',1.6);A(hx+22,hy-16,'C','',6);LBL(hx+22,hy-28,'CH₃','#64748b',6);
      B(hx,hy,hx-28,hy+8,'#555',1.6);A(hx-28,hy+8,'C','',6);LBL(hx-38,hy+8,'CH₃','#64748b',6);
      // N-CH2-CH2-O
      B(hx,hy,hx+8,hy+22);A(hx+8,hy+22,'C','',7);
      B(hx+8,hy+22,hx-6,hy+42);A(hx-6,hy+42,'C','',7);
      B(hx-6,hy+42,hx+8,hy+60);A(hx+8,hy+60,'O','',9);
      hy=hy+60;hx=hx+8;
      TLBL(340,40,'Choline',headCol,11);
    } else if(memLipidType==='PE'){
      // Ethanolamine: H2N-CH2-CH2-O-
      A(hx,hy,'N','NH₂',10);
      B(hx,hy,hx+10,hy-18,'#555',1.5);A(hx+10,hy-18,'H','',5);
      B(hx,hy,hx-14,hy-16,'#555',1.5);A(hx-14,hy-16,'H','',5);
      B(hx,hy,hx+6,hy+22);A(hx+6,hy+22,'C','',7);
      B(hx+6,hy+22,hx-6,hy+42);A(hx-6,hy+42,'C','',7);
      B(hx-6,hy+42,hx+6,hy+60);A(hx+6,hy+60,'O','',9);
      hy=hy+60;hx=hx+6;
      TLBL(340,40,'Ethanolamine',headCol,11);
    } else {
      // Serine: H2N-CH(-COO⁻)-CH2-O-
      A(hx,hy,'N','NH₂',10);
      B(hx,hy,hx+12,hy-18,'#555',1.5);A(hx+12,hy-18,'H','',5);
      B(hx,hy,hx-12,hy-18,'#555',1.5);A(hx-12,hy-18,'H','',5);
      // CH
      B(hx,hy,hx+6,hy+22);A(hx+6,hy+22,'C','',7);
      // COO- branch
      B(hx+6,hy+22,hx+30,hy+14);A(hx+30,hy+14,'C','',7);
      DB(hx+30,hy+14,hx+50,hy+4,'#555',hx+30,hy+24);A(hx+50,hy+4,'O','',8);
      B(hx+30,hy+14,hx+44,hy+30);A(hx+44,hy+30,'O','',8);
      LBL(hx+58,hy+30,'⁻','#f87171',10);
      // CH2-O
      B(hx+6,hy+22,hx-8,hy+42);A(hx-8,hy+42,'C','',7);
      B(hx-8,hy+42,hx+4,hy+60);A(hx+4,hy+60,'O','',9);
      hy=hy+60;hx=hx+4;
      TLBL(350,40,'Serine',headCol,11);
    }

    // ── PHOSPHATE GROUP ──
    B(hx,hy,hx-4,hy+22);
    const px=hx-4,py=hy+22;
    A(px,py,'N','P',10); // use N color placeholder, override:
    // Manually draw phosphorus
    svgE('circle',{cx:px,cy:py,r:10,fill:'#EF9F27',stroke:'#b07010','stroke-width':1.5},s);
    svgE('text',{x:px,y:py+4,'text-anchor':'middle','font-size':9,fill:'#fff','font-family':'sans-serif','font-weight':'700'},s).textContent='P';
    // =O on phosphate (left)
    DB(px,py,px-22,py-6,'#555',px+4,py);A(px-22,py-6,'O','',8);
    // -O⁻ on phosphate (right)
    B(px,py,px+22,py-4,'#555',1.5);A(px+22,py-4,'O','',8);LBL(px+36,py-4,'⁻','#f87171',10);
    // O down to glycerol
    B(px,py,px+4,py+22);A(px+4,py+22,'O','',8);

    LBL(px-40,py+4,'Phosphate','#f59e0b',8);

    // ── GLYCEROL BACKBONE ──
    const gx=px+4,gy=py+22;
    // sn-1 carbon
    B(gx,gy,gx-4,gy+20);const g1x=gx-4,g1y=gy+20;A(g1x,g1y,'C','',7);
    // sn-2 carbon
    B(g1x,g1y,g1x+8,g1y+20);const g2x=g1x+8,g2y=g1y+20;A(g2x,g2y,'C','',7);
    // sn-3 carbon
    B(g2x,g2y,g2x-6,g2y+20);const g3x=g2x-6,g3y=g2y+20;A(g3x,g3y,'C','',7);

    LBL(gx+36,g1y+10,'Glycerol','#94a3b8',8);

    // ── ESTER BOND → sn-1 FATTY ACID (saturated, palmitate C16) ──
    // sn-1: ester O-C=O then chain
    B(g1x,g1y,g1x-24,g1y+12);A(g1x-24,g1y+12,'O','',8);
    B(g1x-24,g1y+12,g1x-40,g1y+26);A(g1x-40,g1y+26,'C','',7);
    DB(g1x-40,g1y+26,g1x-58,g1y+16,'#555',g1x-38,g1y+36);A(g1x-58,g1y+16,'O','',8);
    LBL(g1x-70,g1y+10,'Ester','#64748b',6);
    // Saturated zigzag chain (palmitate ~8 visible carbons)
    const [e1x,e1y]=zigChain(g1x-40,g1y+26,8,12,18,'#555');
    LBL(e1x,e1y+14,'sn-1: Palmitate','#94a3b8',7);LBL(e1x,e1y+24,'(C16:0, saturated)','#64748b',6);

    // ── ESTER BOND → sn-2 FATTY ACID (unsaturated, oleate C18) ──
    B(g2x,g2y,g2x+24,g2y+14);A(g2x+24,g2y+14,'O','',8);
    B(g2x+24,g2y+14,g2x+40,g2y+28);A(g2x+40,g2y+28,'C','',7);
    DB(g2x+40,g2y+28,g2x+58,g2y+18,'#555',g2x+38,g2y+38);A(g2x+58,g2y+18,'O','',8);
    // Unsaturated chain: 4 carbons, then cis-double (kink), then 4 more
    let [cx2,cy2]=zigChain(g2x+40,g2y+28,4,12,18,'#555');
    // cis double bond = shorter bond at an angle (kink)
    const dkx=cx2+18,dky=cy2+8;
    DB(cx2,cy2,dkx,dky,'#f59e0b',cx2-6,cy2+10);A(dkx,dky,'C','',6);
    LBL(dkx+20,dky,'cis Δ9','#f59e0b',6);
    // Continue chain after kink
    const [e2x,e2y]=zigChain(dkx,dky,4,12,18,'#555');
    LBL(e2x,e2y+14,'sn-2: Oleate','#f59e0b',7);LBL(e2x,e2y+24,'(C18:1, unsaturated)','#64748b',6);

    // Title & region labels — boxes encompass full structures
    // Head group box (choline/ethanolamine/serine + phosphate)
    svgE('rect',{x:170,y:2,width:180,height:py+30,rx:6,fill:'none',stroke:headCol,'stroke-width':1,'stroke-dasharray':'4 3'},s);
    LBL(370,py/2,'Head group',headCol,7);
    // Glycerol backbone box
    svgE('rect',{x:gx-30,y:gy-14,width:90,height:g3y-gy+30,rx:6,fill:'none',stroke:'#94a3b8','stroke-width':1,'stroke-dasharray':'4 3'},s);
    LBL(gx+70,gy+20,'Glycerol','#94a3b8',7);
    // sn-1 tail box (left, going down-left)
    svgE('rect',{x:g1x-80,y:g1y+4,width:90,height:e1y-g1y+20,rx:6,fill:'none',stroke:'#64748b','stroke-width':1,'stroke-dasharray':'4 3'},s);
    LBL(g1x-36,g1y+16,'sn-1 tail','#64748b',7);
    // sn-2 tail box (right, going down-right)
    svgE('rect',{x:g2x+10,y:g2y+4,width:Math.max(e2x-g2x+40,dkx-g2x+50),height:e2y-g2y+20,rx:6,fill:'none',stroke:'#f59e0b','stroke-width':1,'stroke-dasharray':'4 3'},s);
    LBL(g2x+50,g2y+16,'sn-2 tail','#f59e0b',7);

    const descs={PC:'Most abundant membrane lipid (~50%). Zwitterionic: choline(+) and phosphate(−). Found in both leaflets.',PE:'Second most abundant. Smaller head (ethanolamine) promotes membrane curvature. Inner leaflet.',PS:'Inner leaflet only. Exposure on outer leaflet = apoptosis eat-me signal. Net negative charge.'};
    info.innerHTML=`<b style="color:${headCol}">Phosphatidyl${memLipidType==='PC'?'choline':memLipidType==='PE'?'ethanolamine':'serine'}</b> — ${descs[memLipidType]}`;

  } else if(memLipidType==='CHOL'){
    s.setAttribute('viewBox','0 0 420 460');
    // ── Cholesterol: OH → fused ring system (A-B-C-D) → isooctyl tail ──
    // Hydroxyl
    const ox=120,oy=40;
    A(ox,oy,'O','OH',10);B(ox,oy,ox+10,oy+22);

    // Ring A (cyclohexane) — chair-like flat hexagon
    const rr=24;
    function hexRing2(cx,cy,r,col){
      const pts=[];
      for(let i=0;i<6;i++){const a=(i*60-90)*Math.PI/180;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
      for(let i=0;i<6;i++){const j=(i+1)%6;B(pts[i][0],pts[i][1],pts[j][0],pts[j][1],col||'#f59e0b',2);}
      pts.forEach(p=>A(p[0],p[1],'C','',5));
      return pts;
    }
    function pentRing2(cx,cy,r,col){
      const pts=[];
      for(let i=0;i<5;i++){const a=(i*72-90)*Math.PI/180;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
      for(let i=0;i<5;i++){const j=(i+1)%5;B(pts[i][0],pts[i][1],pts[j][0],pts[j][1],col||'#f59e0b',2);}
      pts.forEach(p=>A(p[0],p[1],'C','',5));
      return pts;
    }

    const RA=hexRing2(ox+10+rr,oy+22+rr,rr,'#f59e0b');
    // Ring B fused to Ring A (share 2 atoms)
    const rbcx=RA[0][0]+(RA[1][0]-RA[0][0])/2+rr*Math.cos(30*Math.PI/180)*1.6;
    const rbcy=RA[0][1]+(RA[1][1]-RA[0][1])/2;
    const RB=hexRing2(rbcx,rbcy,rr,'#f59e0b');
    // Double bond in Ring B (C5=C6)
    DB(RB[4][0],RB[4][1],RB[5][0],RB[5][1],'#f59e0b',rbcx,rbcy);
    // Ring C fused to Ring B
    const rccx=RB[0][0]+(RB[1][0]-RB[0][0])/2+rr*Math.cos(30*Math.PI/180)*1.6;
    const rccy=RB[0][1]+(RB[1][1]-RB[0][1])/2;
    const RC=hexRing2(rccx,rccy,rr,'#f59e0b');
    // Ring D (cyclopentane) fused to Ring C
    const rdcx=RC[0][0]+(RC[1][0]-RC[0][0])/2+rr*0.9;
    const rdcy=RC[0][1]+(RC[1][1]-RC[0][1])/2;
    const RD=pentRing2(rdcx,rdcy,rr*0.8,'#f59e0b');

    // Methyl groups on ring junctions
    // C10 methyl (A-B junction, top)
    const m1x=(RA[0][0]+RB[5][0])/2, m1y=(RA[0][1]+RB[5][1])/2-20;
    B((RA[0][0]+RB[5][0])/2,(RA[0][1]+RB[5][1])/2,m1x,m1y,'#555',1.5);A(m1x,m1y,'C','',5);LBL(m1x,m1y-10,'CH₃','#64748b',6);
    // C13 methyl (C-D junction, top)
    const m2x=(RC[0][0]+RD[4][0])/2, m2y=(RC[0][1]+RD[4][1])/2-18;
    B((RC[0][0]+RD[4][0])/2,(RC[0][1]+RD[4][1])/2,m2x,m2y,'#555',1.5);A(m2x,m2y,'C','',5);LBL(m2x,m2y-10,'CH₃','#64748b',6);

    // Isooctyl tail from Ring D (going down)
    const tailStart=RD[1];// bottom-right of D ring
    const [tx,ty]=zigChain(tailStart[0],tailStart[1],6,14,20,'#555');
    // Branch at C24
    B(tx,ty,tx+18,ty-10,'#555',1.5);A(tx+18,ty-10,'C','',5);LBL(tx+18,ty-22,'CH₃','#64748b',6);
    const [tx2,ty2]=zigChain(tx,ty,2,14,20,'#555');
    LBL(tx2,ty2+14,'Isooctyl tail','#94a3b8',7);

    // Labels
    LBL(RA[3][0]-14,RA[3][1]+4,'A','#f59e0b',10);
    LBL(RB[3][0]-6,RB[3][1]+4,'B','#f59e0b',10);
    LBL(RC[3][0]-4,RC[3][1]+4,'C','#f59e0b',10);
    LBL(rdcx,rdcy+4,'D','#f59e0b',10);

    TLBL(210,20,'Cholesterol','#f59e0b',13);
    LBL(ox-20,oy+4,'3β-OH','#e05050',7);

    info.innerHTML='<b style="color:#f59e0b">Cholesterol</b> — Four fused rings (A–D), 3β-hydroxyl, one C5=C6 double bond, isooctyl tail. ~25-30% of plasma membrane lipids. Rigid ring intercalates between phospholipid tails. Broadens phase transition.';

  } else if(memLipidType==='SM'){
    s.setAttribute('viewBox','100 0 380 500');
    // ── Sphingomyelin: Choline-PO4-Sphingosine(+FA amide) ──
    // Choline head (same as PC)
    const hx=240,hy=32;
    A(hx,hy,'N','N⁺',10);
    B(hx,hy,hx-22,hy-16,'#555',1.6);A(hx-22,hy-16,'C','',6);LBL(hx-22,hy-28,'CH₃','#64748b',6);
    B(hx,hy,hx+22,hy-16,'#555',1.6);A(hx+22,hy-16,'C','',6);LBL(hx+22,hy-28,'CH₃','#64748b',6);
    B(hx,hy,hx-28,hy+8,'#555',1.6);A(hx-28,hy+8,'C','',6);LBL(hx-38,hy+8,'CH₃','#64748b',6);
    B(hx,hy,hx+8,hy+22);A(hx+8,hy+22,'C','',7);
    B(hx+8,hy+22,hx-6,hy+42);A(hx-6,hy+42,'C','',7);
    B(hx-6,hy+42,hx+6,hy+60);A(hx+6,hy+60,'O','',9);
    TLBL(350,40,'Choline','#60a5fa',11);

    // Phosphate
    const ppx=hx+6,ppy=hy+60;
    B(ppx,ppy,ppx-4,ppy+22);
    svgE('circle',{cx:ppx-4,cy:ppy+22,r:10,fill:'#EF9F27',stroke:'#b07010','stroke-width':1.5},s);
    svgE('text',{x:ppx-4,y:ppy+26,'text-anchor':'middle','font-size':9,fill:'#fff','font-family':'sans-serif','font-weight':'700'},s).textContent='P';
    DB(ppx-4,ppy+22,ppx-26,ppy+16,'#555',ppx,ppy+32);A(ppx-26,ppy+16,'O','',8);
    B(ppx-4,ppy+22,ppx+18,ppy+18,'#555',1.5);A(ppx+18,ppy+18,'O','',8);LBL(ppx+32,ppy+18,'⁻','#f87171',10);
    B(ppx-4,ppy+22,ppx-8,ppy+44);A(ppx-8,ppy+44,'O','',8);

    // Sphingosine backbone
    const sx=ppx-8,sy=ppy+44;
    // C1
    B(sx,sy,sx+4,sy+20);A(sx+4,sy+20,'C','',7);LBL(sx+18,sy+20,'C1','#8b5cf6',6);
    // C2 (bears NH)
    B(sx+4,sy+20,sx-6,sy+40);A(sx-6,sy+40,'C','',7);LBL(sx-20,sy+40,'C2','#8b5cf6',6);
    // NH on C2 (amide bond to FA)
    B(sx-6,sy+40,sx-28,sy+48);A(sx-28,sy+48,'N','NH',9);
    // C=O of amide
    B(sx-28,sy+48,sx-46,sy+60);A(sx-46,sy+60,'C','',7);
    DB(sx-46,sy+60,sx-66,sy+50,'#555',sx-44,sy+70);A(sx-66,sy+50,'O','',8);
    LBL(sx-50,sy+42,'Amide bond','#ec4899',6);
    // FA chain from amide C
    const [fax,fay]=zigChain(sx-46,sy+60,7,12,18,'#555');
    LBL(fax,fay+14,'Fatty acid','#94a3b8',7);LBL(fax,fay+24,'(saturated)','#64748b',6);

    // C3 (bears OH)
    B(sx-6,sy+40,sx+6,sy+60);A(sx+6,sy+60,'C','',7);
    B(sx+6,sy+60,sx+26,sy+52);A(sx+26,sy+52,'O','OH',8);
    // C4=C5 trans double bond
    B(sx+6,sy+60,sx-4,sy+80);A(sx-4,sy+80,'C','',7);
    DB(sx-4,sy+80,sx+8,sy+100,'#8b5cf6',sx-14,sy+90);A(sx+8,sy+100,'C','',7);
    LBL(sx+24,sy+90,'trans','#8b5cf6',6);LBL(sx+24,sy+100,'Δ4','#8b5cf6',6);
    // Continue sphingosine tail
    const [stx,sty]=zigChain(sx+8,sy+100,6,12,18,'#8b5cf6');
    LBL(stx,sty+14,'Sphingosine','#8b5cf6',7);LBL(stx,sty+24,'tail','#8b5cf6',6);

    TLBL(380,120,'Sphingomyelin','#8b5cf6',11);

    info.innerHTML='<b style="color:#8b5cf6">Sphingomyelin</b> — Sphingosine backbone with C4-C5 trans double bond, amide-linked saturated fatty acid, phosphocholine head. Enriched in lipid rafts and myelin sheaths.';
  }
}

function renderBilayerPanel(){
  const p=document.getElementById('right-panel');
  p.innerHTML=`
<div class="vp-header"><div class="vp-title">Membrane Architecture</div><div class="vp-desc">Cross-section of a biological membrane with the fluid mosaic model</div></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem;min-height:0;overflow:hidden;">
  <svg id="bilayer-svg" style="max-width:100%;max-height:100%;display:block;"></svg>
</div>
<div style="display:flex;gap:8px;padding:.35rem .8rem;border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;">
  <span style="display:flex;align-items:center;gap:3px;font-size:9px;color:var(--text-muted)"><span style="width:8px;height:8px;border-radius:50%;background:#60a5fa"></span>PC/PE</span>

function drawBilayer(){
  const svg=document.getElementById('bilayer-svg');if(!svg)return;svg.innerHTML='';
  svg.setAttribute('viewBox','0 0 520 340');
  const d=memSvgH(svg);

  const outerY=110, innerY=230, tailLen=40;
  // Hydrophobic interior shading
  d.rect(0,outerY+12,520,innerY-outerY-24,'rgba(148,163,184,.05)','none',0);

  // ── Outer leaflet lipids (heads at top, tails down) ──
  const outerLipids=[];
  for(let i=0;i<22;i++){
    const x=24+i*23;
    const skip=(i>=9&&i<=12);// gap for integral protein
    if(skip){outerLipids.push(null);continue;}
    const isGlyco=(i===4);
    const col=isGlyco?'#10b981':'#60a5fa';
    d.phospholipid(x,outerY,tailLen,0,col+'88',(i%3===1));
    outerLipids.push(x);
    if(isGlyco){
      // Sugar chains on glycolipid
      d.circ(x-6,outerY-18,4,'rgba(16,185,129,.4)','#10b981');
      d.circ(x+2,outerY-26,4,'rgba(16,185,129,.4)','#10b981');
      d.circ(x+8,outerY-18,4,'rgba(16,185,129,.4)','#10b981');
      d.line(x,outerY-8,x-4,outerY-14,'#10b981',1);
      d.line(x-4,outerY-14,x+2,outerY-22,'#10b981',1);
    }
  }

  // ── Inner leaflet lipids (heads at bottom, tails up) ──
  for(let i=0;i<22;i++){
    const x=24+i*23;
    const skip=(i>=9&&i<=12);
    if(skip)continue;
    const isPS=(i%5===2);
    const col=isPS?'#f87171':'#60a5fa';
    d.phospholipid(x,innerY,tailLen,180,col+'88',(i%4===0));
  }

  // ── Cholesterol molecules wedged between tails ──
  [70,160,350,420].forEach(x=>{
    d.cholesterol(x,outerY+30,0);
  });
  [90,300,400].forEach(x=>{
    d.cholesterol(x,innerY-30,180);
  });

  // ── Integral (transmembrane) protein ──
  const protX=242, protW=60;
  d.rect(protX-protW/2,outerY-20,protW,innerY-outerY+40,'rgba(139,92,246,.15)','#8b5cf6',8);
  // Alpha-helix suggestion inside
  for(let i=0;i<6;i++){
    const y=outerY-5+i*22;
    d.path(`M${protX-12},${y} Q${protX},${y-6} ${protX+12},${y}`,'none','#a78bfa',1.5);
  }
  d.txt(protX,outerY+(innerY-outerY)/2+4,'TM protein','#c4b5fd',8);
  // Extracellular domain
  d.circ(protX,outerY-34,16,'rgba(139,92,246,.12)','#8b5cf6');
  d.mono(protX,outerY-32,'EC','#a78bfa',7);
  // Cytoplasmic domain
  d.circ(protX,innerY+34,14,'rgba(139,92,246,.12)','#8b5cf6');
  d.mono(protX,innerY+36,'IC','#a78bfa',7);

  // ── Peripheral protein (inner leaflet) ──
  d.circ(400,innerY+24,14,'rgba(16,185,129,.15)','#10b981');
  d.mono(400,innerY+27,'Periph','#10b981',6);
  d.line(400,innerY+10,400,innerY+6,'#10b981',1.5,'3 2');

  // ── GPI-anchored protein (outer leaflet) ──
  d.circ(120,outerY-34,12,'rgba(245,158,11,.15)','#f59e0b');
  d.mono(120,outerY-32,'GPI','#f59e0b',6);
  d.line(120,outerY-22,120,outerY-8,'#f59e0b',1.5,'3 2');

  // ── Labels ──
  d.txt(460,outerY-42,'Extracellular','#64748b',9,null,'700');
  d.txt(460,innerY+52,'Cytoplasm','#64748b',9,null,'700');
  d.txt(460,outerY+(innerY-outerY)/2+4,'~5-8 nm','#475569',7);
  // Dimension bracket
  d.line(490,outerY+4,490,innerY-4,'#475569',1);
  d.line(486,outerY+4,494,outerY+4,'#475569',1);
  d.line(486,innerY-4,494,innerY-4,'#475569',1);

  // Leaflet labels
  d.mono(30,outerY+(innerY-outerY)/4,'Outer','#64748b',7);d.mono(30,outerY+(innerY-outerY)/4+10,'leaflet','#64748b',7);
  d.mono(30,innerY-(innerY-outerY)/4,'Inner','#64748b',7);d.mono(30,innerY-(innerY-outerY)/4+10,'leaflet','#64748b',7);
}

function renderTransportStep(){
  const st=TRANSPORT_STEPS[memTransStep];if(!st)return;
  document.getElementById('mt-num').textContent=st.num;
  document.getElementById('mt-name').textContent=st.name;
  document.getElementById('mt-enz').textContent=st.enzyme;
  document.getElementById('mt-desc').textContent=st.desc;
  document.getElementById('mt-prog-fill').style.width=`${(memTransStep+1)/TRANSPORT_STEPS.length*100}%`;
  document.getElementById('mt-counter').textContent=`${memTransStep+1}/${TRANSPORT_STEPS.length}`;
  document.getElementById('mt-prev').disabled=memTransStep===0;
  document.getElementById('mt-next').disabled=memTransStep===TRANSPORT_STEPS.length-1;
  const area=document.getElementById('mt-mol-area');area.innerHTML='';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  area.appendChild(svg);st.draw(svg);
}
function memTransNav(dir){memTransStep=Math.max(0,Math.min(TRANSPORT_STEPS.length-1,memTransStep+dir));renderTransportStep();}
function toggleMemTrans(){
  if(memTransPlaying){clearInterval(memTransTimer);memTransPlaying=false;document.getElementById('mt-play').textContent='▶';}
  else{memTransPlaying=true;document.getElementById('mt-play').textContent='⏸';
    memTransTimer=setInterval(()=>{if(memTransStep<TRANSPORT_STEPS.length-1){memTransStep++;renderTransportStep();}else{clearInterval(memTransTimer);memTransPlaying=false;document.getElementById('mt-play').textContent='▶';}},2500);}
}

function sigH(s){
  const NS2='http://www.w3.org/2000/svg';
  function el(tag,attrs){const n=document.createElementNS(NS2,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));s.appendChild(n);return n;}
  function ln(x1,y1,x2,y2,c,w,da){const a={x1,y1,x2,y2,stroke:c||'#586e85','stroke-width':w||1.8,'stroke-linecap':'round'};if(da)a['stroke-dasharray']=da;el('line',a);}
  function txt(x,y,str,c,fs,anc,fw){const t=el('text',{x,y,'text-anchor':anc||'middle','font-size':fs||9,fill:c||'#94a3b8','font-family':'DM Sans,sans-serif','font-weight':fw||'600'});t.textContent=str;}
  function mono(x,y,str,c,fs){const t=el('text',{x,y,'text-anchor':'middle','font-size':fs||8,fill:c||'#64748b','font-family':'DM Mono,monospace','font-weight':'500'});t.textContent=str;}
  function rect(x,y,w,h,fill,stroke,rx){el('rect',{x,y,width:w,height:h,fill:fill||'none',stroke:stroke||'none',rx:rx||4,'stroke-width':1.5});}
  function rrect(x,y,w,h,fill,stroke,rx){el('rect',{x,y,width:w,height:h,fill,stroke:stroke||'none',rx:rx||6,'stroke-width':1.5});}
  function circ(cx,cy,r,fill,stroke){el('circle',{cx,cy,r,fill:fill||'#334155',stroke:stroke||'none','stroke-width':1.5});}
  function arrow(x1,y1,x2,y2,c){
    const id='sa'+Math.round(Math.random()*9999);
    const d=el('defs',{});const mk=document.createElementNS(NS2,'marker');
    Object.entries({id,markerWidth:'7',markerHeight:'7',refX:'5',refY:'3.5',orient:'auto'}).forEach(([k,v])=>mk.setAttribute(k,v));
    const p=document.createElementNS(NS2,'path');p.setAttribute('d','M0,0 L0,7 L7,3.5 z');p.setAttribute('fill',c||'#94a3b8');
    mk.appendChild(p);d.appendChild(mk);s.appendChild(d);
    el('line',{x1,y1,x2,y2,stroke:c||'#94a3b8','stroke-width':1.8,'marker-end':`url(#${id})`});
  }
  // ── Enhanced membrane with phospholipid glyphs ──
  function membrane(y,w){
    w=w||480;
    // Lipid bilayer background
    rrect(0,y-2,w,18,'rgba(148,163,184,.05)','none',0);
    ln(0,y,w,y,'#475569',1.5);ln(0,y+14,w,y+14,'#475569',1.5);
    // Phospholipid head/tail glyphs
    for(let i=12;i<w;i+=18){
      el('circle',{cx:i,cy:y+1,r:2.5,fill:'#60a5fa',opacity:'0.35'});
      ln(i,y+4,i,y+7,'#94a3b8',0.8);
      el('circle',{cx:i,cy:y+13,r:2.5,fill:'#60a5fa',opacity:'0.35'});
      ln(i,y+10,i,y+7,'#94a3b8',0.8);
    }
  }
  // ── Enhanced 7-TM GPCR with helical bundle detail ──
  function gpcr(cx,my,active,ligand){
    const h=54;
    const col=active?'#8b5cf6':'#586e85';
    const fill=active?'rgba(139,92,246,.25)':'rgba(100,116,139,.1)';
    // Outer shape (rounded blob)
    el('ellipse',{cx,cy:my,rx:22,ry:h/2,fill:fill,stroke:col,'stroke-width':1.8});
    // 7 TM helices as lines
    for(let i=0;i<7;i++){
      const x=cx-15+i*5;
      const yOff=Math.sin(i*0.9)*2;
      ln(x,my-h/2+8+yOff,x,my+h/2-8+yOff,col,2.2);
      // Helix dots
      for(let j=0;j<4;j++){
        el('circle',{cx:x+Math.sin(j*2.2)*1.5,cy:my-h/2+12+j*10+yOff,r:1.2,fill:col,opacity:'0.5'});
      }
    }
    // Extracellular loops (arcs)
    for(let i=0;i<3;i++){
      const x=cx-12+i*10;
      el('path',{d:`M${x},${my-h/2+7} Q${x+5},${my-h/2-4} ${x+10},${my-h/2+7}`,fill:'none',stroke:col,'stroke-width':1.3});
    }
    if(ligand){
      el('circle',{cx,cy:my-h/2-10,r:9,fill:active?'rgba(236,72,153,.35)':'rgba(236,72,153,.15)',stroke:'#ec4899','stroke-width':1.5});
      el('circle',{cx:cx-3,cy:my-h/2-13,r:2.5,fill:'rgba(255,255,255,0.15)'});
      mono(cx,my-h/2-7,'L','#ec4899',7);
    }
    mono(cx,my+h/2+14,'GPCR','#94a3b8',7);
  }
  // ── Enhanced G protein trimer with subunit detail ──
  function gprotein(cx,cy,active,dissociated){
    const ac=active?'#10b981':'#586e85';
    if(!dissociated){
      // Gα subunit (larger, with GDP/GTP pocket)
      el('ellipse',{cx,cy,rx:16,ry:14,fill:active?'rgba(16,185,129,.2)':'rgba(100,116,139,.1)',stroke:ac,'stroke-width':1.8});
      el('ellipse',{cx:cx-4,cy:cy-3,rx:6,ry:4,fill:'rgba(255,255,255,0.05)'});
      mono(cx,cy+3,'Gα',ac,8);
      // Gβγ (paired circles)
      el('ellipse',{cx:cx+18,cy:cy+6,rx:9,ry:8,fill:'rgba(59,130,246,.12)',stroke:'#3b82f6','stroke-width':1.3});
      mono(cx+18,cy+9,'βγ','#3b82f6',6);
      // GDP/GTP label
      const nl=active?'GTP':'GDP';const nc=active?'#34d399':'#64748b';
      rrect(cx-14,cy+10,28,11,nc+'15',nc,3);mono(cx,cy+18,nl,nc,6);
    } else {
      // Dissociated: Gα-GTP
      el('ellipse',{cx:cx-16,cy,rx:16,ry:14,fill:'rgba(16,185,129,.25)',stroke:'#10b981','stroke-width':1.8});
      el('ellipse',{cx:cx-20,cy:cy-3,rx:6,ry:4,fill:'rgba(255,255,255,0.05)'});
      mono(cx-16,cy+3,'Gα','#10b981',8);
      rrect(cx-30,cy+10,28,11,'#34d39915','#34d399',3);mono(cx-16,cy+18,'GTP','#34d399',6);
      // Gβγ separate
      el('ellipse',{cx:cx+22,cy,rx:9,ry:8,fill:'rgba(59,130,246,.12)',stroke:'#3b82f6','stroke-width':1.3});
      mono(cx+22,cy+3,'βγ','#3b82f6',6);
    }
  }
  // ── Enhanced enzyme blob ──
  function enzyme(cx,cy,label,c,active){
    c=c||'#f59e0b';
    const fill=active?c+'28':c+'10';
    const sc=active?c:'#586e85';
    el('ellipse',{cx,cy,rx:26,ry:15,fill,stroke:sc,'stroke-width':1.8});
    if(active)el('ellipse',{cx:cx-6,cy:cy-4,rx:10,ry:6,fill:'rgba(255,255,255,0.04)'});
    mono(cx,cy+3,label,active?c:'#94a3b8',8);
  }
  // ── Enhanced small molecule ──
  function mol(cx,cy,label,c){
    c=c||'#f59e0b';
    el('circle',{cx,cy,r:11,fill:c+'18',stroke:c,'stroke-width':1.5});
    el('circle',{cx:cx-3,cy:cy-3,r:3,fill:'rgba(255,255,255,0.08)'});
    mono(cx,cy+3,label,c,6);
  }
  return {el,ln,txt,mono,rect,rrect,circ,arrow,membrane,gpcr,gprotein,enzyme,mol};
}

function renderSignalingPanel(key){
  curSigKey=key||curSigKey;sigStep=0;
  if(sigPlaying){clearInterval(sigTimer);sigPlaying=false;}
  const anim=SIG_ANIMS[curSigKey];
  const p=document.getElementById('right-panel');
  p.innerHTML=`<div class="vp-header"><div class="vp-title">${anim.name} Pathway</div><div class="vp-desc">Step through the signaling cascade</div></div>
<div class="vp-controls">${Object.keys(SIG_ANIMS).map(k=>`<button class="vp-btn${curSigKey===k?' active':''}" onclick="renderSignalingPanel('${k}')">${SIG_ANIMS[k].name}</button>`).join('')}<button class="vp-btn accent" id="sig-play" onclick="toggleSig()" aria-label="Play animation">&#9654;</button></div>
<div style="padding:.4rem .9rem;flex-shrink:0;">
  <div class="pathway-step-num" id="sig-num"></div>
  <div class="pathway-step-name" id="sig-name"></div>
  <div class="pathway-enzyme" id="sig-enz"></div>
</div>
<div class="pathway-mol-area" id="sig-mol-area"></div>
<div class="pathway-desc" id="sig-desc"></div>
<div class="pathway-nav">
  <button class="nav-arr" id="sig-prev" onclick="sigNav(-1)" aria-label="Previous step">&#8592;</button>
  <div class="pathway-prog"><div class="pathway-prog-fill" id="sig-prog-fill"></div></div>
  <button class="nav-arr" id="sig-next" onclick="sigNav(1)" aria-label="Next step">&#8594;</button>
  <span style="font-size:.6rem;color:var(--text-muted);margin-left:4px" id="sig-counter"></span>
</div>`;
  renderSigStep();
}
function renderSigStep(){
  const anim=SIG_ANIMS[curSigKey];const st=anim.steps[sigStep];if(!st)return;
  document.getElementById('sig-num').textContent=st.num;
  document.getElementById('sig-name').textContent=st.name;
  document.getElementById('sig-enz').textContent=st.enzyme;
  document.getElementById('sig-desc').textContent=st.desc;
  const progEl=document.getElementById('sig-prog-fill');
  progEl.style.width=`${(sigStep+1)/anim.steps.length*100}%`;
  progEl.parentElement.setAttribute('aria-valuenow',sigStep+1);
  progEl.parentElement.setAttribute('aria-valuemin','1');
  progEl.parentElement.setAttribute('aria-valuemax',anim.steps.length);
  document.getElementById('sig-counter').textContent=`${sigStep+1}/${anim.steps.length}`;
  document.getElementById('sig-prev').disabled=sigStep===0;
  document.getElementById('sig-next').disabled=sigStep===anim.steps.length-1;
  const area=document.getElementById('sig-mol-area');area.innerHTML='';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('role','img');svg.setAttribute('aria-label',`${anim.name}: ${st.name} — ${st.enzyme}`);
  const svgTitle=document.createElementNS('http://www.w3.org/2000/svg','title');
  svgTitle.textContent=`${anim.name} pathway step ${sigStep+1}: ${st.name}`;svg.appendChild(svgTitle);
  area.appendChild(svg);st.draw(svg);
}
function sigNav(dir){const anim=SIG_ANIMS[curSigKey];sigStep=Math.max(0,Math.min(anim.steps.length-1,sigStep+dir));renderSigStep();}
function toggleSig(){
  if(sigPlaying){clearInterval(sigTimer);sigPlaying=false;document.getElementById('sig-play').textContent='▶';}
  else{sigPlaying=true;document.getElementById('sig-play').textContent='⏸';
    sigTimer=setInterval(()=>{const anim=SIG_ANIMS[curSigKey];if(sigStep<anim.steps.length-1){sigStep++;renderSigStep();}else{clearInterval(sigTimer);sigPlaying=false;document.getElementById('sig-play').textContent='▶';}},2800);}
}

// Shared drawing helpers for DNA process animations
function dnaAnimHelpers(s){
  const NS2='http://www.w3.org/2000/svg';
  function el(tag,attrs){const n=document.createElementNS(NS2,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));s.appendChild(n);return n;}
  function line(x1,y1,x2,y2,c,w,da){const a={x1,y1,x2,y2,stroke:c||'#586e85','stroke-width':w||1.8,'stroke-linecap':'round'};if(da)a['stroke-dasharray']=da;el('line',a);}
  function txt(x,y,str,c,fs,anc,fw){const t=el('text',{x,y,'text-anchor':anc||'middle','font-size':fs||9,fill:c||'#94a3b8','font-family':'DM Sans,sans-serif','font-weight':fw||'600'});t.textContent=str;}
  function mono(x,y,str,c,fs){txt(x,y,str,c||'#64748b',fs||8,'middle','500');}
  function monoEl(x,y,str,c,fs){const t=el('text',{x,y,'text-anchor':'middle','font-size':fs||8,fill:c||'#64748b','font-family':'DM Mono,monospace','font-weight':'500'});t.textContent=str;}
  function rect(x,y,w,h,fill,stroke,rx){el('rect',{x,y,width:w,height:h,fill:fill||'none',stroke:stroke||'none',rx:rx||4,'stroke-width':1.5});}
  function rrect(x,y,w,h,fill,stroke,rx){el('rect',{x,y,width:w,height:h,fill,stroke:'none',rx:rx||6});if(stroke)el('rect',{x,y,width:w,height:h,fill:'none',stroke,'stroke-width':1.5,rx:rx||6});}
  function circ(cx,cy,r,fill,stroke){el('circle',{cx,cy,r,fill:fill||'#334155',stroke:stroke||'none','stroke-width':1.5});}
  function arrow(x1,y1,x2,y2,c){
    const id='da'+Math.round(x1+y1*7+x2*13+Math.random()*100);
    const d=el('defs',{});
    const mk=document.createElementNS(NS2,'marker');
    Object.entries({id,markerWidth:'7',markerHeight:'7',refX:'5',refY:'3.5',orient:'auto'}).forEach(([k,v])=>mk.setAttribute(k,v));
    const p=document.createElementNS(NS2,'path');p.setAttribute('d','M0,0 L0,7 L7,3.5 z');p.setAttribute('fill',c||'#94a3b8');
    mk.appendChild(p);d.appendChild(mk);s.appendChild(d);
    el('line',{x1,y1,x2,y2,stroke:c||'#94a3b8','stroke-width':1.8,'marker-end':`url(#${id})`});
  }
  // ── Enhanced DNA double strand with base-pair colors and backbone dots ──
  function dsDNA(x1,x2,y,sep,c1,c2,baseCount){
    const y1=y-sep/2, y2=y+sep/2;
    c1=c1||'#3b82f6';c2=c2||'#ef4444';
    let pts1='',pts2='';
    const n=baseCount||Math.round((x2-x1)/8);
    for(let i=0;i<=n;i++){
      const t=i/n,x=x1+(x2-x1)*t;
      const w1=Math.sin(t*n*0.8)*1.8, w2=Math.sin(t*n*0.8+Math.PI)*1.8;
      pts1+=`${x},${y1+w1} `;pts2+=`${x},${y2+w2} `;
    }
    el('polyline',{points:pts1.trim(),fill:'none',stroke:c1,'stroke-width':3,'stroke-linecap':'round'});
    el('polyline',{points:pts2.trim(),fill:'none',stroke:c2,'stroke-width':3,'stroke-linecap':'round'});
    // Color-coded base pair rungs (alternating AT/GC)
    const bpCols=['#6366f1','#8b5cf6','#a78bfa','#7c3aed'];
    for(let i=1;i<n;i+=2){
      const t=i/n,x=x1+(x2-x1)*t;
      el('line',{x1:x,y1:y1+3,x2:x,y2:y2-3,stroke:bpCols[i%4],'stroke-width':1.8,'stroke-linecap':'round',opacity:'0.6'});
    }
    // Sugar-phosphate backbone dots
    for(let i=0;i<n;i+=3){
      const t=i/n,x=x1+(x2-x1)*t;
      const w1=Math.sin(t*n*0.8)*1.8, w2=Math.sin(t*n*0.8+Math.PI)*1.8;
      el('circle',{cx:x,cy:y1+w1,r:1.8,fill:c1,opacity:'0.5'});
      el('circle',{cx:x,cy:y2+w2,r:1.8,fill:c2,opacity:'0.5'});
    }
  }
  // ── Enhanced single strand with backbone detail ──
  function ssDNA(x1,x2,y,c,w){
    c=c||'#3b82f6';
    let pts='';const n=Math.round((x2-x1)/6);
    for(let i=0;i<=n;i++){
      const t=i/n,x=x1+(x2-x1)*t;
      pts+=`${x},${y+Math.sin(t*n*0.6)*3.5} `;
    }
    el('polyline',{points:pts.trim(),fill:'none',stroke:c,'stroke-width':w||2.8,'stroke-linecap':'round'});
    // Backbone dots
    for(let i=0;i<n;i+=4){
      const t=i/n,x=x1+(x2-x1)*t;
      el('circle',{cx:x,cy:y+Math.sin(t*n*0.6)*3.5,r:1.5,fill:c,opacity:'0.4'});
    }
  }
  function mRNA(x1,x2,y,c){ssDNA(x1,x2,y,c||'#f59e0b',2.8);}
  // ── Enhanced protein/enzyme blob with organic shape and inner detail ──
  function blob(cx,cy,rx,ry,fill,label,labelCol){
    const fc=fill||'rgba(139,92,246,.2)';
    const sc=fill?fill.replace(/,[\d.]+\)$/,',0.6)'):'rgba(139,92,246,.6)';
    // Soft outer glow
    el('ellipse',{cx,cy,rx:rx+3,ry:ry+3,fill:fc.replace(/,[\d.]+\)$/,',0.08)'),stroke:'none'});
    // Main shape
    el('ellipse',{cx,cy,rx,ry,fill:fc,stroke:sc,'stroke-width':2});
    // Inner detail: subtle highlight arc
    const hx=cx-rx*0.2,hy=cy-ry*0.3;
    el('ellipse',{cx:hx,cy:hy,rx:rx*0.5,ry:ry*0.4,fill:'rgba(255,255,255,0.06)',stroke:'none'});
    if(label)txt(cx,cy+4,label,labelCol||'#c4b5fd',10);
  }
  function dirLabel(x,y,str,c){monoEl(x,y,str,c||'#64748b',7);}
  // ── Enhanced nucleotide base with colored background ──
  function base(x,y,letter,c){
    const cols={A:'#3b82f6',T:'#10b981',G:'#8b5cf6',C:'#f59e0b',U:'#ef4444'};
    const bc=c||cols[letter]||'#1e293b';
    el('rect',{x:x-7,y:y-8,width:14,height:16,rx:3,fill:bc+'33',stroke:bc,'stroke-width':1.2});
    txt(x,y+4,letter,'#fff',9);
  }
  // ── Enhanced tRNA shape with L-structure ──
  function tRNA(cx,cy,codon,aa,c){
    c=c||'#10b981';
    // Acceptor stem (top)
    el('path',{d:`M${cx-6},${cy-10} L${cx-6},${cy-30} Q${cx},${cy-36} ${cx+6},${cy-30} L${cx+6},${cy-10}`,fill:c+'15',stroke:c,'stroke-width':1.5});
    // Anticodon stem+loop (bottom)
    el('path',{d:`M${cx-4},${cy+2} L${cx-8},${cy+16} Q${cx},${cy+26} ${cx+8},${cy+16} L${cx+4},${cy+2}`,fill:c+'15',stroke:c,'stroke-width':1.5});
    // Body
    el('ellipse',{cx,cy:cy-2,rx:10,ry:10,fill:c+'22',stroke:c,'stroke-width':1.2});
    // Anticodon text
    if(codon)monoEl(cx,cy+22,codon,c,6);
    // Amino acid at top
    if(aa){
      el('circle',{cx,cy:cy-38,r:10,fill:c+'33',stroke:c,'stroke-width':1.5});
      el('circle',{cx:cx-3,cy:cy-41,r:3,fill:'rgba(255,255,255,0.15)'});
      txt(cx,cy-35,aa,'#fff',7);
    }
  }
  return {el,line,txt,mono:monoEl,rect,rrect,circ,arrow,dsDNA,ssDNA,mRNA,blob,dirLabel,base,tRNA};
}
