function renderDnaAnimStep(){
  const anim=DNA_ANIMS[curDnaAnimKey];const st=anim.steps[dnaAnimStep];if(!st)return;
  document.getElementById('da-num').textContent=st.num;
  document.getElementById('da-name').textContent=st.name;
  document.getElementById('da-enz').textContent=st.enzyme;
  document.getElementById('da-desc').textContent=st.desc;
  const progEl=document.getElementById('da-prog-fill');
  progEl.style.width=`${(dnaAnimStep+1)/anim.steps.length*100}%`;
  progEl.parentElement.setAttribute('aria-valuenow',dnaAnimStep+1);
  progEl.parentElement.setAttribute('aria-valuemin','1');
  progEl.parentElement.setAttribute('aria-valuemax',anim.steps.length);
  document.getElementById('da-counter').textContent=`${dnaAnimStep+1}/${anim.steps.length}`;
  document.getElementById('da-prev').disabled=dnaAnimStep===0;
  document.getElementById('da-next').disabled=dnaAnimStep===anim.steps.length-1;
  const area=document.getElementById('da-mol-area');area.innerHTML='';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('role','img');svg.setAttribute('aria-label',anim.name+': '+st.name+' — '+st.enzyme);
  const svgT=document.createElementNS('http://www.w3.org/2000/svg','title');
  svgT.textContent=anim.name+' step '+(dnaAnimStep+1)+': '+st.name;svg.appendChild(svgT);
  area.appendChild(svg);st.draw(svg);
}
function dnaAnimNav(dir){const anim=DNA_ANIMS[curDnaAnimKey];dnaAnimStep=Math.max(0,Math.min(anim.steps.length-1,dnaAnimStep+dir));renderDnaAnimStep();}
function toggleDnaAnim(){
  if(dnaAnimPlaying){clearInterval(dnaAnimTimer);dnaAnimPlaying=false;const b=document.getElementById('dna-anim-play');if(b)b.textContent='▶';}
  else{dnaAnimPlaying=true;const b=document.getElementById('dna-anim-play');if(b)b.textContent='⏸';
    dnaAnimTimer=setInterval(()=>{const anim=DNA_ANIMS[curDnaAnimKey];if(dnaAnimStep<anim.steps.length-1){dnaAnimStep++;renderDnaAnimStep();}else{clearInterval(dnaAnimTimer);dnaAnimPlaying=false;const b2=document.getElementById('dna-anim-play');if(b2)b2.textContent='▶';}},2500);}
}

  buildCodonTableGrid();
  updateCodonDisplay();
}

function buildCodonTableGrid(){
  const svg=document.getElementById('codon-wheel-svg');if(!svg)return;
  svg.innerHTML='';
  const size=380, cx=size/2, cy=size/2;
  svg.setAttribute('viewBox',`0 0 ${size} ${size}`);
  svg.setAttribute('width',size);svg.setAttribute('height',size);
  const NS2='http://www.w3.org/2000/svg';
  function el(tag,attrs,parent){const n=document.createElementNS(NS2,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));(parent||svg).appendChild(n);return n;}

  const bases=['U','C','A','G'];
  // Base colors for the rings (matching reference image style)
  const baseCol={U:'#f0c674',C:'#81c784',A:'#64b5f6',G:'#e57373'};
  const baseColBg={U:'#f9e4a0',C:'#a8dda8',A:'#90caf9',G:'#ef9a9a'};

  // Ring radii: inner(1st base) → middle(2nd) → outer(3rd) → amino acid label ring
  const r0=28, r1=62, r2=104, r3=142, r4=174;

  // ── Center label: 5' ──
  el('circle',{cx,cy,r:r0-2,fill:'rgba(139,92,246,.15)',stroke:'#8b5cf6','stroke-width':1.5});
  const ct=el('text',{x:cx,y:cy+5,'text-anchor':'middle','font-size':14,fill:'#a78bfa','font-family':'DM Mono,monospace','font-weight':'700'});ct.textContent="5'";

  // Helper: arc path for a wedge (annular sector)
  function arcPath(cx,cy,rInner,rOuter,startAngle,endAngle){
    const s1=startAngle*Math.PI/180, e1=endAngle*Math.PI/180;
    const x1=cx+rOuter*Math.cos(s1), y1=cy+rOuter*Math.sin(s1);
    const x2=cx+rOuter*Math.cos(e1), y2=cy+rOuter*Math.sin(e1);
    const x3=cx+rInner*Math.cos(e1), y3=cy+rInner*Math.sin(e1);
    const x4=cx+rInner*Math.cos(s1), y4=cy+rInner*Math.sin(s1);
    const large=(endAngle-startAngle)>180?1:0;
    return `M${x1},${y1} A${rOuter},${rOuter} 0 ${large},1 ${x2},${y2} L${x3},${y3} A${rInner},${rInner} 0 ${large},0 ${x4},${y4} Z`;
  }

  // Helper: text along arc (place at midpoint of arc, rotated)
  function arcText(cx,cy,r,startAngle,endAngle,text,fontSize,fill,fw){
    const midA=((startAngle+endAngle)/2)*Math.PI/180;
    const tx=cx+r*Math.cos(midA), ty=cy+r*Math.sin(midA);
    let rot=(startAngle+endAngle)/2+90;
    // Flip text if it would be upside down
    if(rot>180&&rot<360)rot-=180;
    if(rot>180)rot-=180;
    const t=el('text',{x:tx,y:ty,'text-anchor':'middle','dominant-baseline':'central','font-size':fontSize||10,fill:fill||'#1a1a2e','font-family':'DM Mono,monospace','font-weight':fw||'700',transform:`rotate(${rot},${tx},${ty})`});
    t.textContent=text;
    return t;
  }

  // ── Ring 1: First base (inner, 4 sectors of 90°) ──
  // Layout: starting from top (-90°), going clockwise: U, C, A, G
  const startOffset=-90;
  bases.forEach((b,i)=>{
    const a0=startOffset+i*90, a1=a0+90;
    const p=el('path',{d:arcPath(cx,cy,r0,r1,a0,a1),fill:baseColBg[b],stroke:'#1a1a2e','stroke-width':1.2,opacity:0.9});
    p.id='cw1-'+b;
    arcText(cx,cy,(r0+r1)/2,a0,a1,b,18,'#1a1a2e','800');
  });

  // ── Ring 2: Second base (16 sectors of 22.5°) ──
  bases.forEach((b1,i)=>{
    bases.forEach((b2,j)=>{
      const a0=startOffset+i*90+j*22.5, a1=a0+22.5;
      const p=el('path',{d:arcPath(cx,cy,r1,r2,a0,a1),fill:baseColBg[b2],stroke:'#1a1a2e','stroke-width':0.8,opacity:0.85});
      p.id='cw2-'+b1+b2;
      arcText(cx,cy,(r1+r2)/2,a0,a1,b2,11,'#1a1a2e','700');
    });
  });

  // ── Ring 3: Third base (64 sectors of 5.625°) — each is one codon ──
  bases.forEach((b1,i)=>{
    bases.forEach((b2,j)=>{
      bases.forEach((b3,k)=>{
        const idx=i*16+j*4+k;
        const a0=startOffset+idx*5.625, a1=a0+5.625;
        const codon=b1+b2+b3;
        const path=el('path',{d:arcPath(cx,cy,r2,r3,a0,a1),fill:baseColBg[b3],stroke:'#1a1a2e','stroke-width':0.5,opacity:0.8,cursor:'pointer'});
        path.id='cw-'+codon;
        path.onclick=()=>highlightCodon(codon);
        // Third base letter
        arcText(cx,cy,(r2+r3)/2,a0,a1,b3,7,'#1a1a2e','600');
      });
    });
  });

  // ── Ring 4: Amino acid labels (outermost) ──
  // Group consecutive codons that map to the same AA
  const aaGroups=[];
  let cur=null;
  for(let i=0;i<64;i++){
    const b1i=Math.floor(i/16),b2i=Math.floor((i%16)/4),b3i=i%4;
    const codon=bases[b1i]+bases[b2i]+bases[b3i];
    const aa=CODON_TABLE[codon];
    const c1=AA3TO1[aa];
    if(!cur||cur.aa!==aa||cur.b1i!==b1i||(cur.b2i!==b2i)){
      cur={aa,c1,start:i,count:1,b1i,b2i};aaGroups.push(cur);
    } else {
      cur.count++;
    }
  }

  const aaWedgeColors={
    Phe:'#e8d44d',Leu:'#a8d8a8',Ile:'#a8d8a8',Met:'#a8d8a8',Val:'#a8d8a8',
    Ser:'#f9c784',Pro:'#f9c784',Thr:'#f9c784',Ala:'#f9c784',
    Tyr:'#aed6f1',His:'#aed6f1',Gln:'#aed6f1',Asn:'#aed6f1',Lys:'#aed6f1',Asp:'#f1a9a9',Glu:'#f1a9a9',
    Cys:'#e8d44d',Trp:'#e8d44d',Arg:'#c5b3e6',Gly:'#e8d44d',
    Stop:'#666'
  };

  aaGroups.forEach(g=>{
    const a0=startOffset+g.start*5.625, a1=a0+g.count*5.625;
    const col=aaWedgeColors[g.aa]||'#ccc';
    el('path',{d:arcPath(cx,cy,r3+1,r4,a0,a1),fill:col,stroke:'#1a1a2e','stroke-width':0.8,opacity:0.9,cursor:'pointer'});
    // AA label
    if(g.count>=2||g.aa==='Trp'||g.aa==='Met'){
      const label=g.aa==='Stop'?'■':g.c1;
      arcText(cx,cy,(r3+r4)/2+2,a0,a1,label,g.count>=3?10:8,'#1a1a2e','800');
    }
  });

  // ── Outer AA name labels (outside the wheel) ──
  // Place full names for multi-codon AAs
  const labelR=r4+14;
  aaGroups.forEach(g=>{
    if(g.count<2&&g.aa!=='Trp'&&g.aa!=='Met')return;
    const midIdx=g.start+g.count/2;
    const midA=(startOffset+midIdx*5.625)*Math.PI/180;
    const lx=cx+labelR*Math.cos(midA), ly=cy+labelR*Math.sin(midA);
    let rot=(startOffset+midIdx*5.625)+90;
    if(rot>180&&rot<360)rot-=180;if(rot>180)rot-=180;
    const name=g.aa==='Stop'?'Stop':`${g.aa} (${g.c1})`;
    const t=el('text',{x:lx,y:ly,'text-anchor':'middle','dominant-baseline':'central','font-size':7,fill:'#c8cdd3','font-family':'DM Sans,sans-serif','font-weight':'600',transform:`rotate(${rot},${lx},${ly})`});
    t.textContent=name;
  });

  // ── 3' labels at cardinal points ──
  [[cx,8],[cx,size-8]].forEach(([x,y])=>{
    const t=el('text',{x,y,'text-anchor':'middle','dominant-baseline':'central','font-size':10,fill:'#ef4444','font-family':'DM Mono,monospace','font-weight':'700'});t.textContent="3'";
  });

  // Ring divider circles (cleaner look)
  [r0,r1,r2,r3,r4].forEach(r=>{
    el('circle',{cx,cy,r,fill:'none',stroke:'#1a1a2e','stroke-width':r===r3?1.5:0.8});
  });
}

function highlightCodon(codon){
  // Clear all highlights on all three rings
  document.querySelectorAll('[id^="cw-"],[id^="cw1-"],[id^="cw2-"]').forEach(el=>{el.removeAttribute('filter');el.setAttribute('stroke-width',el.id.startsWith('cw1-')?'1.2':el.id.startsWith('cw2-')?'0.8':'0.5');el.setAttribute('stroke','#1a1a2e');el.style.opacity=el.id.startsWith('cw1-')?'0.9':el.id.startsWith('cw2-')?'0.85':'0.8';});
  if(!codon||codon.length!==3)return;
  const b1=codon[0],b2=codon[1],b3=codon[2];
  // Highlight ring 1 (1st base)
  const r1el=document.getElementById('cw1-'+b1);
  if(r1el){r1el.setAttribute('stroke','#fff');r1el.setAttribute('stroke-width','2.5');r1el.style.opacity='1';r1el.parentNode.appendChild(r1el);}
  // Highlight ring 2 (2nd base)
  const r2el=document.getElementById('cw2-'+b1+b2);
  if(r2el){r2el.setAttribute('stroke','#fff');r2el.setAttribute('stroke-width','2.5');r2el.style.opacity='1';r2el.parentNode.appendChild(r2el);}
  // Highlight ring 3 (3rd base / codon)
  const r3el=document.getElementById('cw-'+codon);
  if(r3el){r3el.setAttribute('stroke','#fff');r3el.setAttribute('stroke-width','2.5');r3el.style.opacity='1';r3el.parentNode.appendChild(r3el);}
  const aa=CODON_TABLE[codon]||'?';
  const info=document.getElementById('codon-info');
  if(info)info.innerHTML=`<b style="color:var(--accent)">${codon}</b> → <b style="color:${AA_COLORS[AA3TO1[aa]]||'#94a3b8'}">${aa}</b> (${AA3TO1[aa]}) ${aa==='Stop'?'— Release factor binds, translation terminates':'— '+getAADesc(aa)}`;
}

function getAADesc(aa){
  const descs={Phe:'Aromatic, hydrophobic',Leu:'Aliphatic, hydrophobic',Ile:'Branched-chain, hydrophobic',Met:'Start codon / sulfur-containing',Val:'Branched-chain, hydrophobic',Ser:'Polar, hydroxyl',Pro:'Cyclic imino acid, helix breaker',Thr:'Polar, hydroxyl, branched',Ala:'Small, hydrophobic, helix-favoring',Tyr:'Aromatic, polar hydroxyl',His:'Imidazole, pKa ~6.0, acid-base catalysis',Gln:'Polar amide',Asn:'Polar amide',Lys:'Positive charge at pH 7',Asp:'Negative charge at pH 7',Glu:'Negative charge at pH 7',Cys:'Thiol, disulfide bonds',Trp:'Largest AA, aromatic, only 1 codon',Arg:'Positive charge, guanidinium',Gly:'Smallest AA, no side chain, flexible'};
  return descs[aa]||'';
}

function updateCodonDisplay(){
  const mrnaEl=document.getElementById('codon-mrna-display');
  const protEl=document.getElementById('codon-protein-display');
  const counterEl=document.getElementById('codon-counter');
  const infoEl=document.getElementById('codon-info');
  if(!mrnaEl||!protEl)return;

  const seq=codonSeq.replace(/[^AUGC]/g,'');
  // Find first AUG
  let startIdx=-1;
  for(let i=0;i<=seq.length-3;i++){if(seq.substring(i,i+3)==='AUG'){startIdx=i;break;}}

  // Build codon-colored mRNA display
  let html='';
  const codons=[];
  if(startIdx>=0){
    // 5' UTR
    if(startIdx>0)html+=`<span style="color:#475569">${seq.substring(0,startIdx)}</span>`;
    // Reading frame codons
    for(let i=startIdx;i<=seq.length-3;i+=3){
      const codon=seq.substring(i,i+3);
      const aa=CODON_TABLE[codon]||'?';
      const c1=AA3TO1[aa]||'?';
      const col=AA_COLORS[c1]||'#94a3b8';
      const idx=codons.length;
      const isCurrent=(idx===codonPos);
      const isPast=(idx<codonPos);
      const isFuture=(idx>codonPos);
      codons.push({codon,aa,c1,col});
      if(isCurrent){
        html+=`<span style="background:${col}33;color:${col};border-radius:3px;padding:0 2px;font-weight:700;outline:2px solid ${col};outline-offset:1px">${codon}</span>`;
      } else if(isPast&&codonPos>=0){
        html+=`<span style="color:${col};font-weight:600">${codon}</span>`;
      } else {
        html+=`<span style="color:#64748b">${codon}</span>`;
      }
      html+=' ';
      if(aa==='Stop')break;
    }
  } else {
    html=`<span style="color:#475569">${seq}</span>`;
    if(seq.length>0)html+=`<br><span style="color:#f87171;font-size:.65rem">No AUG start codon found</span>`;
  }
  mrnaEl.innerHTML=html;

  // Build protein display
  protEl.innerHTML='';
  const translatedAAs=[];
  const limit=codonPos>=0?codonPos+1:0;
  codons.forEach((c,i)=>{
    if(c.aa==='Stop'&&i<limit){
      const el=document.createElement('span');
      el.style.cssText=`font-family:'DM Mono',monospace;font-size:.7rem;color:#f87171;padding:2px 4px;background:rgba(248,113,113,.1);border-radius:3px;border:1px solid rgba(248,113,113,.3);`;
      el.textContent='STOP';
      protEl.appendChild(el);
      return;
    }
    if(c.aa==='Stop')return;
    if(i<limit){
      translatedAAs.push(c);
      const el=document.createElement('span');
      el.style.cssText=`display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:${c.col}22;border:1.5px solid ${c.col};font-family:'DM Mono',monospace;font-size:.65rem;color:${c.col};font-weight:700;`;
      el.textContent=c.c1;
      el.title=`${c.aa} (${c.c1}) — codon: ${c.codon}`;
      protEl.appendChild(el);
    }
  });

  // Counter
  if(counterEl){
    const totalCodons=codons.filter(c=>c.aa!=='Stop').length;
    if(codonPos>=0){
      counterEl.textContent=`Codon ${codonPos+1}/${codons.length} · ${translatedAAs.length} AA`;
    } else {
      counterEl.textContent=codons.length>0?`${codons.length} codons · ready`:'Enter sequence';
    }
  }

  // Info
  if(infoEl&&translatedAAs.length>0){
    const seq1=translatedAAs.map(c=>c.c1).join('');
    const seq3=translatedAAs.map(c=>c.aa).join('-');
    const mw=translatedAAs.reduce((s,c)=>s+(AA_MW[c.c1]||110),18.02);// +H2O for termini
    const charge=translatedAAs.reduce((s,c)=>{if(c.c1==='K'||c.c1==='R')return s+1;if(c.c1==='H')return s+0.1;if(c.c1==='D'||c.c1==='E')return s-1;return s;},0);
    infoEl.innerHTML=`<b>1-letter:</b> ${seq1}<br><b>3-letter:</b> ${seq3}<br><b>MW:</b> ~${mw.toFixed(0)} Da · <b>Charge (pH 7):</b> ${charge>=0?'+':''}${charge.toFixed(1)} · <b>Length:</b> ${translatedAAs.length} aa`;
  } else if(infoEl){
    infoEl.innerHTML='Click <b>Step</b> or <b>Play</b> to translate codon-by-codon, or <b>Translate All</b> for the full protein.';
  }
}

function codonStep(){
  const seq=codonSeq.replace(/[^AUGC]/g,'');
  let startIdx=-1;
  for(let i=0;i<=seq.length-3;i++){if(seq.substring(i,i+3)==='AUG'){startIdx=i;break;}}
  if(startIdx<0)return;
  const maxCodons=Math.floor((seq.length-startIdx)/3);
  if(codonPos<maxCodons-1){
    codonPos++;
    // Check if we hit a stop codon
    const codon=seq.substring(startIdx+codonPos*3,startIdx+codonPos*3+3);
    if(CODON_TABLE[codon]==='Stop'){
      // Stay at stop, don't advance further
      updateCodonDisplay();
      highlightCodon(codon);
      return;
    }
    updateCodonDisplay();
    highlightCodon(codon);
  }
}

function translateAll(){
  const seq=codonSeq.replace(/[^AUGC]/g,'');
  let startIdx=-1;
  for(let i=0;i<=seq.length-3;i++){if(seq.substring(i,i+3)==='AUG'){startIdx=i;break;}}
  if(startIdx<0)return;
  const maxCodons=Math.floor((seq.length-startIdx)/3);
  // Set codonPos to last codon or stop
  for(let i=0;i<maxCodons;i++){
    const codon=seq.substring(startIdx+i*3,startIdx+i*3+3);
    codonPos=i;
    if(CODON_TABLE[codon]==='Stop')break;
  }
  updateCodonDisplay();
}

function toggleCodonPlay(){
  if(codonPlaying){
    clearInterval(codonTimer);codonPlaying=false;
    const b=document.getElementById('codon-play-btn');if(b)b.textContent='▶ Play';
  } else {
    codonPlaying=true;
    const b=document.getElementById('codon-play-btn');if(b)b.textContent='⏸ Pause';
    codonTimer=setInterval(()=>{
      const seq=codonSeq.replace(/[^AUGC]/g,'');
      let startIdx=-1;
      for(let i=0;i<=seq.length-3;i++){if(seq.substring(i,i+3)==='AUG'){startIdx=i;break;}}
      if(startIdx<0){clearInterval(codonTimer);codonPlaying=false;return;}
      const maxCodons=Math.floor((seq.length-startIdx)/3);
      if(codonPos<maxCodons-1){
        codonPos++;
        const codon=seq.substring(startIdx+codonPos*3,startIdx+codonPos*3+3);
        updateCodonDisplay();
        highlightCodon(codon);
        if(CODON_TABLE[codon]==='Stop'){
          clearInterval(codonTimer);codonPlaying=false;
          const b2=document.getElementById('codon-play-btn');if(b2)b2.textContent='▶ Play';
        }
      } else {
        clearInterval(codonTimer);codonPlaying=false;
        const b2=document.getElementById('codon-play-btn');if(b2)b2.textContent='▶ Play';
      }
    },600);
  }
}

function drawKinPlot(){
  const canvas=document.getElementById('kin-canvas');
  const info=document.getElementById('kin-info');
  if(!canvas||!info)return;
  const parent=canvas.parentElement;
  const dpr=window.devicePixelRatio||1;
  const w=parent.clientWidth-16, h=parent.clientHeight-16;
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  // Plot area with margins
  const ml=56,mr=16,mt=24,mb=42;
  const pw=w-ml-mr, ph=h-mt-mb;

  // ── Background ──
  ctx.fillStyle='rgba(17,24,39,.6)';
  ctx.beginPath();ctx.roundRect(0,0,w,h,6);ctx.fill();

  // ── Grid ──
  ctx.strokeStyle='rgba(100,116,139,.12)';ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const y=mt+ph*i/5;
    ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(ml+pw,y);ctx.stroke();
    const x=ml+pw*i/5;
    ctx.beginPath();ctx.moveTo(x,mt);ctx.lineTo(x,mt+ph);ctx.stroke();
  }

  // Kinetic parameters
  const Ki=20; // inhibitor dissociation constant
  const alpha=kinInhType==='competitive'?1+kinInhConc/Ki:kinInhType==='noncompetitive'?1+kinInhConc/Ki:1;
  const alphaPrime=kinInhType==='uncompetitive'?1+kinInhConc/Ki:kinInhType==='noncompetitive'?1+kinInhConc/Ki:1;
  const appKm=kinKm*alpha/alphaPrime;
  const appVmax=kinVmax/alphaPrime;
  const n=kinHill;

  if(kinPlotType==='mm'){
    // ── Michaelis-Menten: v vs [S] ──
    const maxS=kinKm*5;
    const maxV=kinVmax*1.15;

    // Velocity function
    function vel(S,vm,km,hill){return vm*Math.pow(S,hill)/(Math.pow(km,hill)+Math.pow(S,hill));}

    // Draw uninhibited reference curve (if inhibitor active)
    if(kinInhConc>0&&kinInhType!=='none'){
      ctx.strokeStyle='rgba(148,163,184,.25)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
      ctx.beginPath();
      for(let i=0;i<=200;i++){
        const S=maxS*i/200;
        const v=vel(S,kinVmax,kinKm,n);
        const x=ml+S/maxS*pw, y=mt+ph-v/maxV*ph;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();ctx.setLineDash([]);
    }

    // Draw main curve
    const grad=ctx.createLinearGradient(ml,0,ml+pw,0);
    grad.addColorStop(0,'#3b82f6');grad.addColorStop(1,'#8b5cf6');
    ctx.strokeStyle=grad;ctx.lineWidth=2.5;
    ctx.beginPath();
    for(let i=0;i<=200;i++){
      const S=maxS*i/200;
      const v=vel(S,appVmax,appKm,n);
      const x=ml+S/maxS*pw, y=mt+ph-v/maxV*ph;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();

    // Vmax dashed line
    ctx.strokeStyle='rgba(59,130,246,.35)';ctx.lineWidth=1;ctx.setLineDash([4,3]);
    const vmaxY=mt+ph-appVmax/maxV*ph;
    ctx.beginPath();ctx.moveTo(ml,vmaxY);ctx.lineTo(ml+pw,vmaxY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#60a5fa';ctx.font='bold 9px DM Mono,monospace';ctx.textAlign='right';
    ctx.fillText(kinInhConc>0&&kinInhType!=='none'?'app Vmax':'Vmax',ml-6,vmaxY+3);

    // Km marker
    const kmX=ml+appKm/maxS*pw;
    const kmV=vel(appKm,appVmax,appKm,n);
    const kmY=mt+ph-kmV/maxV*ph;
    ctx.strokeStyle='rgba(6,182,212,.35)';ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(kmX,mt+ph);ctx.lineTo(kmX,kmY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ml,kmY);ctx.lineTo(kmX,kmY);ctx.stroke();
    ctx.setLineDash([]);
    // Km label
    ctx.fillStyle='#22d3ee';ctx.textAlign='center';
    ctx.fillText(kinInhConc>0&&kinInhType!=='none'?'app Km':'Km',kmX,mt+ph+14);
    // Km dot
    ctx.fillStyle='#06b6d4';ctx.beginPath();ctx.arc(kmX,kmY,4,0,Math.PI*2);ctx.fill();

    // ½Vmax label
    ctx.fillStyle='#94a3b8';ctx.textAlign='right';ctx.font='8px DM Mono,monospace';
    ctx.fillText('½Vmax',ml-6,kmY+3);

    // Axes labels
    const U=KIN_UNITS[kinUnits];
    ctx.fillStyle='#94a3b8';ctx.font='bold 10px DM Sans,sans-serif';
    ctx.textAlign='center';ctx.fillText(U.sLabel,ml+pw/2,h-4);
    ctx.save();ctx.translate(12,mt+ph/2);ctx.rotate(-Math.PI/2);
    ctx.fillText(U.vLabel,0,0);ctx.restore();

    // Axis tick values
    ctx.font='8px DM Mono,monospace';ctx.fillStyle='#64748b';ctx.textAlign='center';
    for(let i=0;i<=5;i++){
      const raw=maxS*i/5;
      ctx.fillText(kinUnits==='dimless'?(raw/kinKm).toFixed(1):Math.round(raw),ml+pw*i/5,mt+ph+24);
    }
    ctx.textAlign='right';
    for(let i=0;i<=5;i++){
      const raw=maxV*i/5;
      ctx.fillText(kinUnits==='dimless'?(raw/kinVmax).toFixed(2):Math.round(raw),ml-8,mt+ph-ph*i/5+3);
    }

  } else {
    // ── Lineweaver-Burk: 1/v vs 1/[S] ──
    const minInvS=-0.08, maxInvS=0.5;
    function invV(invS,vm,km,hill){
      if(hill!==1){// Hill eq LB not standard; show regular MM-based
        return km/(vm)*invS+1/vm;
      }
      return km/vm*invS+1/vm;
    }
    const maxInvV_unin=Math.max(invV(maxInvS,kinVmax,kinKm,1),invV(maxInvS,appVmax,appKm,1))*1.15;
    const minInvV=-maxInvV_unin*0.08;

    function toX(invS){return ml+(invS-minInvS)/(maxInvS-minInvS)*pw;}
    function toY(invV2){return mt+ph-(invV2-minInvV)/(maxInvV_unin-minInvV)*ph;}

    // Y-axis (at 1/[S]=0)
    const zeroX=toX(0);
    ctx.strokeStyle='rgba(148,163,184,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(zeroX,mt);ctx.lineTo(zeroX,mt+ph);ctx.stroke();
    // X-axis (at 1/v=0)
    const zeroY=toY(0);
    ctx.beginPath();ctx.moveTo(ml,zeroY);ctx.lineTo(ml+pw,zeroY);ctx.stroke();

    // Draw uninhibited reference line (if inhibitor active)
    if(kinInhConc>0&&kinInhType!=='none'){
      ctx.strokeStyle='rgba(148,163,184,.25)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
      ctx.beginPath();
      for(let i=0;i<=200;i++){
        const invS=minInvS+(maxInvS-minInvS)*i/200;
        const iv=invV(invS,kinVmax,kinKm,1);
        ctx.lineTo(toX(invS),toY(iv));
      }
      ctx.stroke();ctx.setLineDash([]);
    }

    // Main LB line
    const grad=ctx.createLinearGradient(ml,0,ml+pw,0);
    grad.addColorStop(0,'#3b82f6');grad.addColorStop(1,'#8b5cf6');
    ctx.strokeStyle=grad;ctx.lineWidth=2.5;
    ctx.beginPath();
    for(let i=0;i<=200;i++){
      const invS=minInvS+(maxInvS-minInvS)*i/200;
      const iv=invV(invS,appVmax,appKm,1);
      const x=toX(invS),y=toY(iv);
      if(y<mt-20||y>mt+ph+20)continue;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();

    // Y-intercept = 1/Vmax
    const yIntY=toY(1/appVmax);
    ctx.fillStyle='#60a5fa';ctx.beginPath();ctx.arc(zeroX,yIntY,4,0,Math.PI*2);ctx.fill();
    ctx.font='bold 8px DM Mono,monospace';ctx.textAlign='left';
    ctx.fillText('1/Vmax',zeroX+6,yIntY-6);

    // X-intercept = -1/Km
    const xIntX=toX(-1/appKm);
    if(xIntX>=ml&&xIntX<=ml+pw){
      ctx.fillStyle='#22d3ee';ctx.beginPath();ctx.arc(xIntX,zeroY,4,0,Math.PI*2);ctx.fill();
      ctx.textAlign='center';
      ctx.fillText('-1/Km',xIntX,zeroY+14);
    }

    // Axes labels
    const U=KIN_UNITS[kinUnits];
    ctx.fillStyle='#94a3b8';ctx.font='bold 10px DM Sans,sans-serif';
    ctx.textAlign='center';ctx.fillText(U.inv_sLabel,ml+pw/2,h-4);
    ctx.save();ctx.translate(12,mt+ph/2);ctx.rotate(-Math.PI/2);
    ctx.fillText(U.inv_vLabel,0,0);ctx.restore();
  }

  // ── Info text ──
  const U=KIN_UNITS[kinUnits];
  const sU=U.sUnit?(' '+U.sUnit):'';
  const vU=U.vUnit?(' '+U.vUnit):'';
  let infoHtml=`<span style="color:#60a5fa">V<sub>max</sub></span> = ${kinVmax}${vU} · <span style="color:#22d3ee">K<sub>m</sub></span> = ${kinKm}${sU}`;
  if(kinHill!==1) infoHtml+=` · <span style="color:#ec4899">n</span> = ${kinHill.toFixed(1)}`;
  if(kinInhConc>0&&kinInhType!=='none'){
    infoHtml+=` · <span style="color:#f87171">[I]</span> = ${kinInhConc}${sU} · K<sub>i</sub> = ${Ki}${sU}`;
    infoHtml+=`<br><span style="color:#f87171">${kinInhType}</span>: app K<sub>m</sub> = ${appKm.toFixed(1)}${sU}, app V<sub>max</sub> = ${appVmax.toFixed(1)}${vU}`;
    if(kinInhType==='competitive') infoHtml+=' — increased Km, Vmax unchanged';
    else if(kinInhType==='uncompetitive') infoHtml+=' — both decreased by same factor';
    else infoHtml+=' — Km unchanged, Vmax decreased';
  }
  if(kinHill!==1){
    infoHtml+=`<br>Hill equation: v = V<sub>max</sub>·[S]<sup>n</sup> / (K<sub>0.5</sub><sup>n</sup> + [S]<sup>n</sup>)`;
    if(kinHill>1) infoHtml+=' — <span style="color:#34d399">positive cooperativity</span> (sigmoidal)';
    else infoHtml+=' — <span style="color:#f59e0b">negative cooperativity</span>';
  }
  info.innerHTML=infoHtml;
}

function drawBpCtx(pair){
  const svg=document.getElementById('bpctx-svg');
  const info=document.getElementById('bpctx-info');
  if(!svg||!info)return;
  svg.innerHTML='';
  const s=svg;
  s.setAttribute('viewBox','0 0 680 420');

  // ── tiny primitives ──
  function ln(x1,y1,x2,y2,c,w,da){
    const a={x1,y1,x2,y2,stroke:c||'#586e85','stroke-width':w||1.8,'stroke-linecap':'round'};
    if(da)a['stroke-dasharray']=da;
    svgE('line',a,s);
  }
  function dbl2(x1,y1,x2,y2,c,ix,iy){
    ln(x1,y1,x2,y2,c,1.8);
    const dx=x2-x1,dy=y2-y1,mx=(x1+x2)/2,my=(y1+y2)/2;
    const tdx=(ix||mx+.1)-mx,tdy=(iy||my+.1)-my,tl=Math.sqrt(tdx*tdx+tdy*tdy)||1;
    const ox=tdx/tl*4,oy=tdy/tl*4,t=.18;
    ln(x1+dx*t+ox,y1+dy*t+oy,x2-dx*t+ox,y2-dy*t+oy,c,1.4);
  }
  function nAtm(x,y,lbl,r){
    r=r||8;
    svgE('circle',{cx:x,cy:y,r,fill:'#4a90d9',stroke:'#1a5090','stroke-width':1.2},s);
    if(lbl){const t=svgE('text',{x,y:y+3,'text-anchor':'middle','font-size':r>6?7.5:6,fill:'#fff','font-family':'sans-serif','font-weight':'700'},s);t.textContent=lbl;}
  }
  function oAtm(x,y,r){
    r=r||8;
    svgE('circle',{cx:x,cy:y,r,fill:'#e05050',stroke:'#a01010','stroke-width':1.2},s);
    const t=svgE('text',{x,y:y+3,'text-anchor':'middle','font-size':r>6?7.5:6,fill:'#fff','font-family':'sans-serif','font-weight':'700'},s);t.textContent='O';
  }
  function hAtm(x,y){
    svgE('circle',{cx:x,cy:y,r:5,fill:'#ccc',stroke:'#888','stroke-width':.8},s);
    const t=svgE('text',{x,y:y+2.5,'text-anchor':'middle','font-size':5.5,fill:'#333','font-family':'sans-serif','font-weight':'700'},s);t.textContent='H';
  }
  function cDot(x,y){svgE('circle',{cx:x,cy:y,r:3,fill:'#556'},s);}
  function pAtm2(x,y){
    svgE('circle',{cx:x,cy:y,r:9,fill:'#EF9F27',stroke:'#b07010','stroke-width':1.2},s);
    const t=svgE('text',{x,y:y+3,'text-anchor':'middle','font-size':7,fill:'#fff','font-family':'sans-serif','font-weight':'700'},s);t.textContent='P';
  }
  function txt(x,y,str,c,fs,anc,fw){
    const t=svgE('text',{x,y,'text-anchor':anc||'middle','font-size':fs||8,fill:c||'#94a3b8','font-family':'DM Mono,monospace','font-weight':fw||'600'},s);
    t.textContent=str;
  }
  // Groove / annotation labels
  function grooveLbl(x,y,str,c){
    svgE('rect',{x:x-32,y:y-10,width:64,height:16,rx:3,fill:c||'rgba(59,130,246,.15)',stroke:c?c.replace('.15','.4'):'rgba(59,130,246,.4)','stroke-width':1},s);
    txt(x,y+1,str,'#93c5fd',7.5);
  }
  // D/A badge
  function badge2(x,y,type){
    if(type==='A'){
      svgE('circle',{cx:x,cy:y,r:7,fill:'#34d399',stroke:'#0a7c54','stroke-width':1},s);
      txt(x,y+3,'A','#fff',7);
    } else if(type==='D'){
      svgE('rect',{x:x-6,y:y-6,width:12,height:12,rx:2,fill:'#c084fc',stroke:'#7c3aed','stroke-width':1},s);
      txt(x,y+3,'D','#fff',7);
    } else if(type==='M'){
      svgE('circle',{cx:x,cy:y,r:7,fill:'#f59e0b',stroke:'#b45309','stroke-width':1},s);
      txt(x,y+3,'M','#fff',7);
    } else if(type==='H'){
      svgE('circle',{cx:x,cy:y,r:7,fill:'#f59e0b',stroke:'#b45309','stroke-width':1},s);
      txt(x,y+3,'H','#fff',7);
    }
  }
  // H-bond dashes
  function hbDash(x1,y,x2){
    ln(x1,y,x2,y,'#f59e0b',2,'5 3.5');
  }

  // ── Deoxyribose sugar (5-membered ring, pentagonal) ──
  // cx,cy = ring centre, flip = 1 (left/purine) or -1 (right/pyrimidine)
  function drawSugar(cx,cy,flip){
    const r=20, pts=[];
    for(let i=0;i<5;i++){
      const a=(i*72-90)*Math.PI/180;
      pts.push([cx+flip*r*Math.cos(a), cy+r*Math.sin(a)]);
    }
    for(let i=0;i<5;i++){const j=(i+1)%5;ln(pts[i][0],pts[i][1],pts[j][0],pts[j][1],'#586e85',1.5);}
    // O in ring between C4' and C1'
    const ox=(pts[0][0]+pts[4][0])/2, oy=(pts[0][1]+pts[4][1])/2;
    oAtm(ox,oy,6);
    // Carbon labels: C1'=top, C2'=upper-right(flipped), C3'=lower-right, C4'=lower-left, [O between C4'-C1']
    // Simpler: just put small positional labels
    const labels=["1'","2'","3'","4'","5'"];
    // C1' at top
    txt(pts[0][0]+flip*8, pts[0][1]-6, labels[0], '#64748b', 6);
    txt(pts[1][0]+flip*10, pts[1][1], labels[1], '#64748b', 6);
    txt(pts[2][0]+flip*10, pts[2][1]+4, labels[2], '#64748b', 6);
    txt(pts[3][0]+flip*(-6), pts[3][1]+8, labels[3], '#64748b', 6);
    // C5' arm extending from C4' downward
    const c5x=pts[3][0]+flip*(-18), c5y=pts[3][1]+16;
    ln(pts[3][0],pts[3][1],c5x,c5y,'#586e85',1.5);
    txt(c5x+flip*(-8), c5y+4, labels[4], '#64748b', 6);
    // 3'-OH at C3'
    const oh3x=pts[2][0]+flip*18, oh3y=pts[2][1]+10;
    ln(pts[2][0],pts[2][1],oh3x,oh3y,'#586e85',1.3);
    oAtm(oh3x,oh3y,5);
    return {pts, c5x, c5y, c3x:pts[2][0], c3y:pts[2][1], c1x:pts[0][0], c1y:pts[0][1]};
  }

  // ── Phosphate group extending from C5' ──
  function drawPhosphate(sx,sy,flip){
    const px=sx+flip*(-14), py=sy+20;
    ln(sx,sy,px,py,'#586e85',1.5);
    oAtm(px-flip*4,py-14,5);// bridging O
    pAtm2(px,py);
    // =O and -O(-)
    dbl2(px,py,px+flip*(-16),py+4,'#586e85',px+flip*8,py);
    oAtm(px+flip*(-16),py+4,5);
    ln(px,py,px,py+16,'#586e85',1.3);
    oAtm(px,py+16,5);
    // negative charge
    txt(px+flip*(-16),py+16,'\u2296','#e05050',8);
    // wavy continuation line
    const wy=py+28;
    ln(px,py+16,px,wy,'#475569',1,'3 2');
    txt(px,wy+8,'\u223C','#475569',10);
    return {px,py};
  }

  // ══════════════════════════════════════════════════
  // PURINE (left side) base ring — centre at bx, by
  // ══════════════════════════════════════════════════
  const bxL=200, byL=200; // purine base centre
  const bxR=480, byR=200; // pyrimidine base centre
  const hexR=30;

  function hexPts(cx,cy,r,flip){
    // flip=1: N1 at right; flip=-1: N1 at left
    return {
      N1:[cx+flip*r, cy],
      C2:[cx+flip*r*Math.cos(Math.PI/3), cy+r*Math.sin(Math.PI/3)],
      N3:[cx+flip*r*Math.cos(2*Math.PI/3), cy+r*Math.sin(2*Math.PI/3)],
      C4:[cx-flip*r, cy],
      C5:[cx+flip*r*Math.cos(4*Math.PI/3), cy+r*Math.sin(4*Math.PI/3)],
      C6:[cx+flip*r*Math.cos(5*Math.PI/3), cy+r*Math.sin(5*Math.PI/3)]
    };
  }

  // Draw purine (left base)
  function drawPurineCtx(col,isG){
    const h=hexPts(bxL,byL,hexR,1);
    // Hex bonds
    Object.values(h).forEach((p,i,a)=>{const j=(i+1)%6;ln(p[0],p[1],a[j][0],a[j][1],col,1.8);});
    dbl2(h.C4[0],h.C4[1],h.C5[0],h.C5[1],col,bxL,byL);
    dbl2(h.C2[0],h.C2[1],h.N3[0],h.N3[1],col,bxL,byL);
    // Pentagon: N7, C8, N9 extending left from C4-C5
    const n7=[h.C5[0]-20,h.C5[1]-16], c8=[h.C4[0]-24,(h.C4[1]+h.C5[1])/2-3], n9=[h.C4[0]-18,h.C4[1]+12];
    ln(h.C5[0],h.C5[1],n7[0],n7[1],col,1.8);
    ln(n7[0],n7[1],c8[0],c8[1],col,1.8);
    ln(c8[0],c8[1],n9[0],n9[1],col,1.8);
    ln(n9[0],n9[1],h.C4[0],h.C4[1],col,1.8);
    dbl2(n7[0],n7[1],c8[0],c8[1],col,(n7[0]+n9[0])/2,(n7[1]+n9[1])/2);
    // Atoms
    cDot(h.C2[0],h.C2[1]); cDot(h.C4[0],h.C4[1]); cDot(h.C5[0],h.C5[1]); cDot(h.C6[0],h.C6[1]); cDot(c8[0],c8[1]);
    nAtm(h.N1[0],h.N1[1],'N'); nAtm(h.N3[0],h.N3[1],'N'); nAtm(n7[0],n7[1],'N'); nAtm(n9[0],n9[1],'N');
    // Glycosidic bond: N9 to sugar C1'
    const sugar=drawSugar(n9[0]-36, n9[1]+32, 1);
    ln(n9[0],n9[1],sugar.c1x,sugar.c1y,'#586e85',1.5);
    // Phosphate
    drawPhosphate(sugar.c5x, sugar.c5y, 1);

    if(isG){
      // G: O6 upper-right, N1-H right, N2-NH2 lower-right
      dbl2(h.C6[0],h.C6[1],h.C6[0]+18,h.C6[1]-18,'#555',h.C6[0]-5,h.C6[1]);
      oAtm(h.C6[0]+18,h.C6[1]-18,7);
      badge2(h.C6[0]+30,h.C6[1]-28,'A');
      ln(h.N1[0],h.N1[1],h.N1[0]+15,h.N1[1],'#555',1.3);hAtm(h.N1[0]+15,h.N1[1]);
      badge2(h.N1[0]+6,h.N1[1]-12,'D');
      ln(h.C2[0],h.C2[1],h.C2[0]+20,h.C2[1]+16,'#555',1.3);
      nAtm(h.C2[0]+20,h.C2[1]+16,'N',7);
      ln(h.C2[0]+20,h.C2[1]+16,h.C2[0]+36,h.C2[1]+8,'#555',1);hAtm(h.C2[0]+36,h.C2[1]+8);
      ln(h.C2[0]+20,h.C2[1]+16,h.C2[0]+36,h.C2[1]+28,'#555',1);hAtm(h.C2[0]+36,h.C2[1]+28);
      badge2(h.C2[0]+6,h.C2[1]+32,'D');
      // N7 acceptor badge
      badge2(n7[0]-12,n7[1]-10,'A');
      // N3 acceptor
      badge2(h.N3[0]-12,h.N3[1]+8,'A');
      txt(bxL-50,byL+150,'Guanine (G)','#8b5cf6',11,null,'700');
    } else {
      // A: N6-NH2 upper-right, C2-H lower-right
      ln(h.C6[0],h.C6[1],h.C6[0]+18,h.C6[1]-18,'#555',1.3);
      nAtm(h.C6[0]+18,h.C6[1]-18,'N',7);
      ln(h.C6[0]+18,h.C6[1]-18,h.C6[0]+34,h.C6[1]-10,'#555',1);hAtm(h.C6[0]+34,h.C6[1]-10);
      ln(h.C6[0]+18,h.C6[1]-18,h.C6[0]+34,h.C6[1]-30,'#555',1);hAtm(h.C6[0]+34,h.C6[1]-30);
      badge2(h.C6[0]+6,h.C6[1]-32,'D');
      ln(h.C2[0],h.C2[1],h.C2[0]+18,h.C2[1]+14,'#555',1);hAtm(h.C2[0]+18,h.C2[1]+14);
      // N1 acceptor
      badge2(h.N1[0]+4,h.N1[1]-12,'A');
      // N7 acceptor
      badge2(n7[0]-12,n7[1]-10,'A');
      // N3 acceptor
      badge2(h.N3[0]-12,h.N3[1]+8,'A');
      txt(bxL-50,byL+150,'Adenine (A)','#3b82f6',11,null,'700');
    }
    return h;
  }

  // Draw pyrimidine (right base)
  function drawPyrimidineCtx(col,isC){
    const h=hexPts(bxR,byR,hexR,-1);
    Object.values(h).forEach((p,i,a)=>{const j=(i+1)%6;ln(p[0],p[1],a[j][0],a[j][1],col,1.8);});
    dbl2(h.C4[0],h.C4[1],h.C5[0],h.C5[1],col,bxR,byR);
    dbl2(h.C6[0],h.C6[1],h.N1[0],h.N1[1],col,bxR,byR);
    cDot(h.C2[0],h.C2[1]); cDot(h.C4[0],h.C4[1]); cDot(h.C5[0],h.C5[1]); cDot(h.C6[0],h.C6[1]);
    nAtm(h.N1[0],h.N1[1],'N'); nAtm(h.N3[0],h.N3[1],'N');
    // Glycosidic bond: N1 to sugar C1'
    const sugar=drawSugar(h.N1[0]+36, h.N1[1]+32, -1);
    ln(h.N1[0],h.N1[1],sugar.c1x,sugar.c1y,'#586e85',1.5);
    drawPhosphate(sugar.c5x, sugar.c5y, -1);

    if(isC){
      // C: O2 lower-left, N4-NH2 upper-left, C5-H, C6-H
      dbl2(h.C2[0],h.C2[1],h.C2[0]-18,h.C2[1]+18,'#555',h.C2[0]+5,h.C2[1]);
      oAtm(h.C2[0]-18,h.C2[1]+18,7);
      badge2(h.C2[0]-28,h.C2[1]+28,'A');
      // N4 above C4
      ln(h.C4[0],h.C4[1],h.C4[0]+4,h.C4[1]-24,'#555',1.3);
      nAtm(h.C4[0]+4,h.C4[1]-24,'N',7);
      ln(h.C4[0]+4,h.C4[1]-24,h.C4[0]-12,h.C4[1]-36,'#555',1);hAtm(h.C4[0]-12,h.C4[1]-36);
      ln(h.C4[0]+4,h.C4[1]-24,h.C4[0]+18,h.C4[1]-38,'#555',1);hAtm(h.C4[0]+18,h.C4[1]-38);
      badge2(h.C4[0]-4,h.C4[1]-42,'D');
      ln(h.C5[0],h.C5[1],h.C5[0]+18,h.C5[1]-14,'#555',1);hAtm(h.C5[0]+18,h.C5[1]-14);
      ln(h.C6[0],h.C6[1],h.C6[0]-16,h.C6[1]-16,'#555',1);hAtm(h.C6[0]-16,h.C6[1]-16);
      // N3 acceptor
      badge2(h.N3[0]+4,h.N3[1]+14,'A');
      txt(bxR+50,byR+150,'Cytosine (C)','#06b6d4',11,null,'700');
    } else {
      // T: O2 lower-left, O4 upper-left, N3-H left, CH3 at C5
      dbl2(h.C2[0],h.C2[1],h.C2[0]-18,h.C2[1]+18,'#555',h.C2[0]+5,h.C2[1]);
      oAtm(h.C2[0]-18,h.C2[1]+18,7);
      badge2(h.C2[0]-28,h.C2[1]+28,'A');
      dbl2(h.C4[0],h.C4[1],h.C4[0]-18,h.C4[1]-18,'#555',h.C4[0]+5,h.C4[1]);
      oAtm(h.C4[0]-18,h.C4[1]-18,7);
      badge2(h.C4[0]-28,h.C4[1]-28,'A');
      ln(h.N3[0],h.N3[1],h.N3[0]-16,h.N3[1],'#555',1.3);hAtm(h.N3[0]-16,h.N3[1]);
      badge2(h.N3[0]-8,h.N3[1]+14,'D');
      // CH3 on C5
      ln(h.C5[0],h.C5[1],h.C5[0]+20,h.C5[1]-14,'#10b981',1.5);cDot(h.C5[0]+20,h.C5[1]-14);
      txt(h.C5[0]+36,h.C5[1]-12,'CH\u2083','#10b981',7);
      badge2(h.C5[0]+20,h.C5[1]-28,'M');
      ln(h.C6[0],h.C6[1],h.C6[0]-16,h.C6[1]-16,'#555',1);hAtm(h.C6[0]-16,h.C6[1]-16);
      txt(bxR+50,byR+150,'Thymine (T)','#10b981',11,null,'700');
    }
    return h;
  }

  // ══════════════════ DRAW THE PAIR ══════════════════
  const isGC=(pair==='GC');
  const purH=drawPurineCtx(isGC?'#8b5cf6':'#3b82f6', isGC);
  const pyrH=drawPyrimidineCtx(isGC?'#06b6d4':'#10b981', isGC);

  // ── H-bonds between bases ──
  const hx1=purH.N1[0]+14, hx2=pyrH.N1[0]-14;
  function hb2(y,label){
    hbDash(hx1,y,hx2);
    txt((hx1+hx2)/2,y-8,label,'#f59e0b',7);
  }
  if(isGC){
    // 3 H-bonds
    const y1=(purH.C6[1]-18 + pyrH.C4[1]-18)/2;
    hb2(y1,'O···H–N');
    const y2=(purH.N1[1]+pyrH.N3[1])/2;
    hb2(y2,'N–H···N');
    const y3=(purH.C2[1]+16+pyrH.C2[1]+18)/2;
    hb2(y3,'N–H···O');
    // Bond count badge (above groove region)
    svgE('rect',{x:(hx1+hx2)/2-30,y:byL-104,width:60,height:16,rx:3,fill:'rgba(20,30,50,.9)',stroke:'#334155','stroke-width':1},s);
    txt((hx1+hx2)/2,byL-94,'3 H-bonds','#94a3b8',7.5);
  } else {
    const y1=(purH.C6[1]-18 + pyrH.C4[1]-18)/2;
    hb2(y1,'N–H···O');
    const y2=(purH.N1[1]+pyrH.N3[1])/2;
    hb2(y2,'N···H–N');
    svgE('rect',{x:(hx1+hx2)/2-30,y:byL-104,width:60,height:16,rx:3,fill:'rgba(20,30,50,.9)',stroke:'#334155','stroke-width':1},s);
    txt((hx1+hx2)/2,byL-94,'2 H-bonds','#94a3b8',7.5);
  }

  // ── Groove labels ──
  // Major groove = above (between C6 substituents)
  grooveLbl((bxL+bxR)/2, byL-66, 'Major groove','rgba(59,130,246,.15)');
  // Minor groove = below (between C2/N3 substituents)
  grooveLbl((bxL+bxR)/2, byL+74, 'Minor groove','rgba(245,158,11,.15)');

  // ── Shaded groove regions ──
  // Major groove region (top)
  svgE('rect',{x:hx1-10,y:byL-60,width:hx2-hx1+20,height:40,rx:6,fill:'rgba(59,130,246,.06)',stroke:'rgba(59,130,246,.15)','stroke-width':1,'stroke-dasharray':'4 3'},s);
  // Minor groove region (bottom)
  svgE('rect',{x:hx1-10,y:byL+42,width:hx2-hx1+20,height:40,rx:6,fill:'rgba(245,158,11,.06)',stroke:'rgba(245,158,11,.15)','stroke-width':1,'stroke-dasharray':'4 3'},s);

  // ── Info text ──
  if(isGC){
    info.innerHTML='<b style="color:#8b5cf6">G</b>–<b style="color:#06b6d4">C</b> base pair with full nucleoside context. <b>3 H-bonds</b> make this the strongest Watson-Crick pair. Major groove: acceptor(O6), acceptor(N7), donor(N4-H). Minor groove: donor(N2-H), acceptor(N3), acceptor(O2).';
  } else {
    info.innerHTML='<b style="color:#3b82f6">A</b>–<b style="color:#10b981">T</b> base pair with full nucleoside context. <b>2 H-bonds</b>. Major groove: donor(N6-H), acceptor(N7), acceptor(O4). Minor groove: acceptor(N3), hydrophobic(C2-H). The 5-methyl group (M) is a major groove marker.';
  }
}

function drawBase(code){
  const svg=document.getElementById('base-svg');
  const info=document.getElementById('base-info');
  if(!svg||!info)return;
  svg.innerHTML='';
  const cols={A:'#3b82f6',G:'#8b5cf6',C:'#06b6d4',T:'#10b981',U:'#f59e0b'};
  const col=cols[code]||'#94a3b8';
  const s=svg;
  // Each base drawn as proper ring structure with H-bond donors/acceptors labelled
  if(code==='A'){// Adenine: purine, 6-aminopurine
    s.setAttribute('viewBox','0 0 300 240');
    // pyrimidine ring (6-membered): N1-C2-N3-C4-C5-C6
    const r6pts=[[80,140],[108,168],[148,168],[170,140],[148,112],[108,112]];
    for(let i=0;i<6;i++){const j=(i+1)%6;bnd(s,r6pts[i][0],r6pts[i][1],r6pts[j][0],r6pts[j][1],col,2.5);}
    // imidazole ring fused at C4-C5: N7-C8-N9-C4-C5
    const r5pts=[[170,140],[200,152],[200,128],[170,112]];// N7,C8,N9 new; C4,C5 shared
    bnd(s,r6pts[4][0],r6pts[4][1],r5pts[0][0],r5pts[0][1],col,2.5);// C5-N7 (wait – correct connectivity)
    // Purine connectivity: pyrimidine N1(80,140),C2(108,168),N3(148,168),C4(170,140),C5(148,112),C6(108,112)
    // imidazole: C4(170,140)-N9(200,152)-C8(220,140)-N7(200,128)-C5(148,112)
    const N9=[200,155],C8=[228,140],N7=[200,125];
    bnd(s,r6pts[3][0],r6pts[3][1],N9[0],N9[1],col,2.5);// C4-N9
    bnd(s,N9[0],N9[1],C8[0],C8[1],col,2.5);// N9-C8
    dblB(s,C8[0],C8[1],N7[0],N7[1],220,140);// C8=N7 double
    bnd(s,N7[0],N7[1],r6pts[4][0],r6pts[4][1],col,2.5);// N7-C5
    // C2=N (no substituent, just C-H), N3, double bonds
    dblB(s,r6pts[1][0],r6pts[1][1],r6pts[0][0],r6pts[0][1],124,168);// C2=N1
    dblB(s,r6pts[4][0],r6pts[4][1],r6pts[5][0],r6pts[5][1],128,112);// C5=C6 (actually C4-C5 double)
    // Atoms
    atm(s,r6pts[0][0],r6pts[0][1],'N','',12);// N1 – H-bond acceptor
    atm(s,r6pts[1][0],r6pts[1][1],'C','',10);// C2
    atm(s,r6pts[2][0],r6pts[2][1],'N','',12);// N3 – H-bond acceptor
    atm(s,r6pts[3][0],r6pts[3][1],'C','',10);// C4
    atm(s,r6pts[4][0],r6pts[4][1],'C','',10);// C5
    atm(s,r6pts[5][0],r6pts[5][1],'C','',10);// C6
    atm(s,N9[0],N9[1],'N','',12);// N9 – glycosidic bond site
    atm(s,C8[0],C8[1],'C','',10);// C8
    atm(s,N7[0],N7[1],'N','',12);// N7 – H-bond acceptor
    // NH2 at C6
    bnd(s,r6pts[5][0],r6pts[5][1],r6pts[5][0]-28,r6pts[5][1]-28);atm(s,r6pts[5][0]-28,r6pts[5][1]-28,'N','',12);
    bnd(s,r6pts[5][0]-28,r6pts[5][1]-28,r6pts[5][0]-52,r6pts[5][1]-16,'#444',2);atm(s,r6pts[5][0]-52,r6pts[5][1]-16,'H','',8);
    bnd(s,r6pts[5][0]-28,r6pts[5][1]-28,r6pts[5][0]-16,r6pts[5][1]-52,'#444',2);atm(s,r6pts[5][0]-16,r6pts[5][1]-52,'H','',8);
    // H on C2, C8, and N9 sugar label
    bnd(s,r6pts[1][0],r6pts[1][1],r6pts[1][0],r6pts[1][1]+26,'#444',2);atm(s,r6pts[1][0],r6pts[1][1]+26,'H','',8);
    bnd(s,C8[0],C8[1],C8[0]+24,C8[1],'#444',2);atm(s,C8[0]+24,C8[1],'H','',8);
    bnd(s,N9[0],N9[1],N9[0]+14,N9[1]+24,'#444',2);
    const st=svgE('text',{x:N9[0]+28,y:N9[1]+34,'font-size':8,fill:'#64748b','font-family':'DM Mono,monospace'},s);st.textContent='sugar';
    // H-bond annotations
    const ha=svgE('text',{x:55,y:144,'font-size':8,fill:'#34d399','font-family':'DM Mono,monospace'},s);ha.textContent='acc';
    const hb=svgE('text',{x:148,y:188,'font-size':8,fill:'#34d399','font-family':'DM Mono,monospace'},s);hb.textContent='acc';
    info.innerHTML=`<span style="font-family:DM Mono,monospace;font-size:.75rem;color:${col};font-weight:600">Adenine (A)</span><span style="font-size:.65rem;color:var(--text-muted);margin-left:.5rem">Purine &middot; pairs with T (DNA) or U (RNA) &middot; 2 H-bonds</span><br><span style="font-size:.65rem;color:var(--text-muted)">H-bond acceptors: N1 (minor groove), N3 and N7 (major groove). Amino donor: N6-H.</span>`;
  } else if(code==='G'){// Guanine: 2-amino-6-oxopurine
    s.setAttribute('viewBox','0 0 300 240');
    const r6=[[ 80,140],[108,168],[148,168],[170,140],[148,112],[108,112]];
    for(let i=0;i<6;i++){const j=(i+1)%6;bnd(s,r6[i][0],r6[i][1],r6[j][0],r6[j][1],col,2.5);}
    const N9=[200,155],C8=[228,140],N7=[200,125];
    bnd(s,r6[3][0],r6[3][1],N9[0],N9[1],col,2.5);bnd(s,N9[0],N9[1],C8[0],C8[1],col,2.5);
    dblB(s,C8[0],C8[1],N7[0],N7[1],220,140);bnd(s,N7[0],N7[1],r6[4][0],r6[4][1],col,2.5);
    dblB(s,r6[4][0],r6[4][1],r6[5][0],r6[5][1],128,112);
    r6.forEach((p,i)=>atm(s,p[0],p[1],i===0||i===2?'N':'C','',i===0||i===2?12:10));
    atm(s,N9[0],N9[1],'N','',12);atm(s,C8[0],C8[1],'C','',10);atm(s,N7[0],N7[1],'N','',12);
    // C6=O (carbonyl, H-bond acceptor, major groove)
    dblB(s,r6[5][0],r6[5][1],r6[5][0]-32,r6[5][1]-22,r6[5][0]+4,r6[5][1]);atm(s,r6[5][0]-32,r6[5][1]-22,'O');
    // N1-H (H-bond donor, minor groove)
    bnd(s,r6[0][0],r6[0][1],r6[0][0]-28,r6[0][1],'#444',2);atm(s,r6[0][0]-28,r6[0][1],'H','',8);
    // C2-NH2 (H-bond donor, minor groove)
    bnd(s,r6[1][0],r6[1][1],r6[1][0]-28,r6[1][1]+22);atm(s,r6[1][0]-28,r6[1][1]+22,'N','',12);
    bnd(s,r6[1][0]-28,r6[1][1]+22,r6[1][0]-52,r6[1][1]+12,'#444',2);atm(s,r6[1][0]-52,r6[1][1]+12,'H','',8);
    bnd(s,r6[1][0]-28,r6[1][1]+22,r6[1][0]-18,r6[1][1]+46,'#444',2);atm(s,r6[1][0]-18,r6[1][1]+46,'H','',8);
    bnd(s,C8[0],C8[1],C8[0]+24,C8[1],'#444',2);atm(s,C8[0]+24,C8[1],'H','',8);
    bnd(s,N9[0],N9[1],N9[0]+14,N9[1]+24,'#444',2);
    const st=svgE('text',{x:N9[0]+28,y:N9[1]+34,'font-size':8,fill:'#64748b','font-family':'DM Mono,monospace'},s);st.textContent='sugar';
    info.innerHTML=`<span style="font-family:DM Mono,monospace;font-size:.75rem;color:${col};font-weight:600">Guanine (G)</span><span style="font-size:.65rem;color:var(--text-muted);margin-left:.5rem">Purine &middot; pairs with C &middot; 3 H-bonds</span><br><span style="font-size:.65rem;color:var(--text-muted)">Acceptors: N3 (minor), N7 and O6 (major groove). Donors: N1-H (minor), N2-H (minor).</span>`;
  } else if(code==='C'){// Cytosine: 4-aminopyrimidin-2(1H)-one
    s.setAttribute('viewBox','0 0 260 220');
    const r6=[[80,130],[110,158],[150,158],[170,130],[150,102],[110,102]];
    for(let i=0;i<6;i++){const j=(i+1)%6;bnd(s,r6[i][0],r6[i][1],r6[j][0],r6[j][1],col,2.5);}
    dblB(s,r6[0][0],r6[0][1],r6[1][0],r6[1][1],94,130);// C2=N1-like (actually C2=O: N1-C2=O)
    dblB(s,r6[3][0],r6[3][1],r6[4][0],r6[4][1],160,102);// C4=C5
    r6.forEach((p,i)=>atm(s,p[0],p[1],i===0||i===2?'N':'C','',i===0||i===2?12:10));
    // C2=O
    dblB(s,r6[1][0],r6[1][1],r6[1][0]-32,r6[1][1]+18,r6[1][0]+4,r6[1][1]);atm(s,r6[1][0]-32,r6[1][1]+18,'O');
    // N1-H
    bnd(s,r6[0][0],r6[0][1],r6[0][0]-28,r6[0][1],'#444',2);atm(s,r6[0][0]-28,r6[0][1],'H','',8);
    // C4-NH2 (H-bond donor, major groove)
    bnd(s,r6[5][0],r6[5][1],r6[5][0]-22,r6[5][1]-28);atm(s,r6[5][0]-22,r6[5][1]-28,'N','',12);
    bnd(s,r6[5][0]-22,r6[5][1]-28,r6[5][0]-46,r6[5][1]-18,'#444',2);atm(s,r6[5][0]-46,r6[5][1]-18,'H','',8);
    bnd(s,r6[5][0]-22,r6[5][1]-28,r6[5][0]-10,r6[5][1]-52,'#444',2);atm(s,r6[5][0]-10,r6[5][1]-52,'H','',8);
    // C5-H, C6-H
    bnd(s,r6[4][0],r6[4][1],r6[4][0]+26,r6[4][1]-10,'#444',2);atm(s,r6[4][0]+26,r6[4][1]-10,'H','',8);
    bnd(s,r6[3][0],r6[3][1],r6[3][0]+28,r6[3][1],'#444',2);atm(s,r6[3][0]+28,r6[3][1],'H','',8);
    // N1 sugar
    bnd(s,r6[0][0],r6[0][1],r6[0][0],r6[0][1]+26,'#444',2);
    const st=svgE('text',{x:r6[0][0],y:r6[0][1]+38,'font-size':8,fill:'#64748b','font-family':'DM Mono,monospace','text-anchor':'middle'},s);st.textContent='sugar';
    info.innerHTML=`<span style="font-family:DM Mono,monospace;font-size:.75rem;color:${col};font-weight:600">Cytosine (C)</span><span style="font-size:.65rem;color:var(--text-muted);margin-left:.5rem">Pyrimidine &middot; pairs with G &middot; 3 H-bonds</span><br><span style="font-size:.65rem;color:var(--text-muted)">Acceptors: N3, O2 (minor groove). Donor: N4-H (major groove). Found in both DNA and RNA.</span>`;
  } else if(code==='T'){// Thymine: 5-methyluracil
    s.setAttribute('viewBox','0 0 260 220');
    const r6=[[80,130],[110,158],[150,158],[170,130],[150,102],[110,102]];
    for(let i=0;i<6;i++){const j=(i+1)%6;bnd(s,r6[i][0],r6[i][1],r6[j][0],r6[j][1],col,2.5);}
    dblB(s,r6[3][0],r6[3][1],r6[4][0],r6[4][1],160,102);
    r6.forEach((p,i)=>atm(s,p[0],p[1],i===0||i===2?'N':'C','',i===0||i===2?12:10));
    // C2=O (minor groove acceptor)
    dblB(s,r6[1][0],r6[1][1],r6[1][0]-32,r6[1][1]+18,r6[1][0]+4,r6[1][1]);atm(s,r6[1][0]-32,r6[1][1]+18,'O');
    // C4=O (major groove acceptor)
    dblB(s,r6[5][0],r6[5][1],r6[5][0]-32,r6[5][1]-18,r6[5][0]+4,r6[5][1]);atm(s,r6[5][0]-32,r6[5][1]-18,'O');
    // N1-H, N3-H (H-bond donors)
    bnd(s,r6[0][0],r6[0][1],r6[0][0]-28,r6[0][1],'#444',2);atm(s,r6[0][0]-28,r6[0][1],'H','',8);
    bnd(s,r6[2][0],r6[2][1],r6[2][0]+14,r6[2][1]+26,'#444',2);atm(s,r6[2][0]+14,r6[2][1]+26,'H','',8);
    // C5-CH3 (thymine distinguishing feature)
    bnd(s,r6[4][0],r6[4][1],r6[4][0]+32,r6[4][1]-16);atm(s,r6[4][0]+32,r6[4][1]-16,'C','',10);
    const mt=svgE('text',{x:r6[4][0]+56,y:r6[4][1]-12,'font-size':8,fill:col,'font-family':'DM Mono,monospace'},s);mt.textContent='CH3';
    // N1 sugar
    bnd(s,r6[0][0],r6[0][1],r6[0][0],r6[0][1]+26,'#444',2);
    const st=svgE('text',{x:r6[0][0],y:r6[0][1]+38,'font-size':8,fill:'#64748b','font-family':'DM Mono,monospace','text-anchor':'middle'},s);st.textContent='sugar';
    info.innerHTML=`<span style="font-family:DM Mono,monospace;font-size:.75rem;color:${col};font-weight:600">Thymine (T)</span><span style="font-size:.65rem;color:var(--text-muted);margin-left:.5rem">Pyrimidine &middot; DNA only &middot; pairs with A &middot; 2 H-bonds</span><br><span style="font-size:.65rem;color:var(--text-muted)">The 5-methyl group distinguishes thymine from uracil. Acceptors: O2, O4. Donors: N3-H. The methyl group is a major-groove marker read by DNA-binding proteins.</span>`;
  } else if(code==='U'){// Uracil: 2,4-dioxopyrimidine (thymine without 5-methyl)
    s.setAttribute('viewBox','0 0 260 220');
    const r6=[[80,130],[110,158],[150,158],[170,130],[150,102],[110,102]];
    for(let i=0;i<6;i++){const j=(i+1)%6;bnd(s,r6[i][0],r6[i][1],r6[j][0],r6[j][1],col,2.5);}
    dblB(s,r6[3][0],r6[3][1],r6[4][0],r6[4][1],160,102);
    r6.forEach((p,i)=>atm(s,p[0],p[1],i===0||i===2?'N':'C','',i===0||i===2?12:10));
    // C2=O
    dblB(s,r6[1][0],r6[1][1],r6[1][0]-32,r6[1][1]+18,r6[1][0]+4,r6[1][1]);atm(s,r6[1][0]-32,r6[1][1]+18,'O');
    // C4=O
    dblB(s,r6[5][0],r6[5][1],r6[5][0]-32,r6[5][1]-18,r6[5][0]+4,r6[5][1]);atm(s,r6[5][0]-32,r6[5][1]-18,'O');
    // N1-H, N3-H
    bnd(s,r6[0][0],r6[0][1],r6[0][0]-28,r6[0][1],'#444',2);atm(s,r6[0][0]-28,r6[0][1],'H','',8);
    bnd(s,r6[2][0],r6[2][1],r6[2][0]+14,r6[2][1]+26,'#444',2);atm(s,r6[2][0]+14,r6[2][1]+26,'H','',8);
    // C5-H (no methyl — compare with T)
    bnd(s,r6[4][0],r6[4][1],r6[4][0]+28,r6[4][1]-14,'#444',2);atm(s,r6[4][0]+28,r6[4][1]-14,'H','',8);
    // N1 sugar
    bnd(s,r6[0][0],r6[0][1],r6[0][0],r6[0][1]+26,'#444',2);
    const st=svgE('text',{x:r6[0][0],y:r6[0][1]+38,'font-size':8,fill:'#64748b','font-family':'DM Mono,monospace','text-anchor':'middle'},s);st.textContent='sugar';
    // RNA label
    const rl=svgE('text',{x:200,y:80,'font-size':9,fill:col,'font-family':'DM Mono,monospace','font-weight':'600'},s);rl.textContent='RNA only';
    info.innerHTML=`<span style="font-family:DM Mono,monospace;font-size:.75rem;color:${col};font-weight:600">Uracil (U)</span><span style="font-size:.65rem;color:var(--text-muted);margin-left:.5rem">Pyrimidine &middot; RNA only &middot; pairs with A &middot; 2 H-bonds</span><br><span style="font-size:.65rem;color:var(--text-muted)">Identical to thymine but lacks the 5-methyl group. Deamination of cytosine produces uracil -- why DNA uses thymine instead, so deamination events can be detected and repaired.</span>`;
  }
}

// ── Base pair diagrams with H-bond dashes ────────────────
function drawBasePair(pair){
  const svg=document.getElementById('base-svg');
  const info=document.getElementById('base-info');
  if(!svg||!info)return;
  svg.innerHTML='';
  const s=svg;
  // Wider canvas with more separation between bases
  s.setAttribute('viewBox','0 0 520 280');

  // ── Drawing primitives (smaller atoms for clarity) ──────────
  function bl(x1,y1,x2,y2,col,w){
    svgE('line',{x1,y1,x2,y2,stroke:col||'#94a3b8','stroke-width':w||2,'stroke-linecap':'round'},s);
  }
  function dbl(x1,y1,x2,y2,col,ix,iy){
    bl(x1,y1,x2,y2,col,2);
    const dx=x2-x1,dy=y2-y1;
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    const tdx=(ix===undefined?mx+0.1:ix)-mx,tdy=(iy===undefined?my+0.1:iy)-my;
    const tl=Math.sqrt(tdx*tdx+tdy*tdy)||1;
    const ox=tdx/tl*4.5,oy=tdy/tl*4.5;
    const t=0.18;
    bl(x1+dx*t+ox,y1+dy*t+oy,x2-dx*t+ox,y2-dy*t+oy,col,1.5);
  }
  // Smaller atom radii: N=9, O=9, H=6, C=3.5
  function N_(x,y,lbl){
    svgE('circle',{cx:x,cy:y,r:9,fill:'#4a90d9',stroke:'#1a5090','stroke-width':1.2},s);
    svgE('circle',{cx:x-3,cy:y-3,r:2.5,fill:'rgba(255,255,255,0.25)'},s);
    const t=svgE('text',{x,y:y+3.5,'text-anchor':'middle','font-size':8.5,fill:'#fff',
      'font-family':'sans-serif','font-weight':'700'},s);t.textContent=lbl||'N';
  }
  function O_(x,y){
    svgE('circle',{cx:x,cy:y,r:9,fill:'#e05050',stroke:'#a01010','stroke-width':1.2},s);
    svgE('circle',{cx:x-3,cy:y-3,r:2.5,fill:'rgba(255,255,255,0.25)'},s);
    const t=svgE('text',{x,y:y+3.5,'text-anchor':'middle','font-size':8.5,fill:'#fff',
      'font-family':'sans-serif','font-weight':'700'},s);t.textContent='O';
  }
  function H_(x,y){
    svgE('circle',{cx:x,cy:y,r:6,fill:'#cccccc',stroke:'#888','stroke-width':1},s);
    const t=svgE('text',{x,y:y+3,'text-anchor':'middle','font-size':7,fill:'#333',
      'font-family':'sans-serif','font-weight':'700'},s);t.textContent='H';
  }
  function C_(x,y){
    svgE('circle',{cx:x,cy:y,r:3.5,fill:'#555f6e'},s);
  }
  function hbond(y,x1,x2){
    svgE('line',{x1,y1:y,x2,y2:y,stroke:'#4a9d9f','stroke-width':1.6,
      'stroke-dasharray':'6 4','stroke-linecap':'round'},s);
  }
  function hbLabel(x,y,txt){
    const t=svgE('text',{x,y,'text-anchor':'middle','font-size':8,fill:'#4a9d9f',
      'font-family':'DM Mono,monospace'},s);t.textContent=txt;
  }
  function bondBadge(n){
    svgE('rect',{x:226,y:8,width:68,height:18,rx:4,
      fill:'rgba(20,30,50,.9)',stroke:'#334155','stroke-width':1},s);
    const t=svgE('text',{x:260,y:21,'text-anchor':'middle',
      'font-size':9,fill:'#94a3b8','font-family':'DM Mono,monospace','font-weight':'600'},s);
    t.textContent=n+' H-bond'+(n>1?'s':'');
  }
  function baseLbl(x,y,txt,col){
    const t=svgE('text',{x,y,'text-anchor':'middle','font-size':11.5,fill:col,
      'font-family':'DM Mono,monospace','font-weight':'700'},s);t.textContent=txt;
  }

  // ── Purine hex centre at (100,140), r=34 ──────────────────
  // Hex: N1 at right (interface side), going CW in screen coords (y-down)
  // 0°=N1, 60°=C2(lower-right), 120°=N3(lower-left), 180°=C4(left), 240°=C5(upper-left), 300°=C6(upper-right)
  const pR=34;
  const pHex = {
    N1:[100+pR,140], C2:[100+pR*Math.cos(Math.PI/3),140+pR*Math.sin(Math.PI/3)],
    N3:[100+pR*Math.cos(2*Math.PI/3),140+pR*Math.sin(2*Math.PI/3)],
    C4:[100-pR,140], C5:[100+pR*Math.cos(4*Math.PI/3),140+pR*Math.sin(4*Math.PI/3)],
    C6:[100+pR*Math.cos(5*Math.PI/3),140+pR*Math.sin(5*Math.PI/3)]
  };
  // Pentagon fused at C4-C5, extending leftward
  // C5 is upper-left, C4 is left — pentagon goes further left
  const pMidX=(pHex.C4[0]+pHex.C5[0])/2, pMidY=(pHex.C4[1]+pHex.C5[1])/2;
  const pPenR=22;
  // Pentagon vertices: C5, N7 (upper-far-left), C8 (far-left), N9 (lower-far-left), C4
  const pPen = {
    N7:[pHex.C5[0]-24, pHex.C5[1]-18],
    C8:[pHex.C4[0]-28, (pHex.C4[1]+pHex.C5[1])/2-4],
    N9:[pHex.C4[0]-20, pHex.C4[1]+14]
  };

  // PYRIMIDINE hex centre at (420,140), r=34, mirrored (N1 at left = interface)
  const qR=34;
  const qHex = {
    N1:[420-qR,140], C2:[420-qR*Math.cos(Math.PI/3),140+qR*Math.sin(Math.PI/3)],
    N3:[420-qR*Math.cos(2*Math.PI/3),140+qR*Math.sin(2*Math.PI/3)],
    C4:[420+qR,140], C5:[420-qR*Math.cos(4*Math.PI/3),140+qR*Math.sin(4*Math.PI/3)],
    C6:[420-qR*Math.cos(5*Math.PI/3),140+qR*Math.sin(5*Math.PI/3)]
  };

  const cA='#3b82f6', cG='#8b5cf6', cC='#06b6d4', cT='#10b981', cU='#f59e0b';

  // ════════════════════════════════════════════════════════════
  function drawPurine(col, isG){
    const {N1,C2,N3,C4,C5,C6}=pHex;
    const {N7,C8,N9}=pPen;
    // Hex ring bonds
    bl(N1[0],N1[1],C2[0],C2[1],col);
    bl(C2[0],C2[1],N3[0],N3[1],col);
    bl(N3[0],N3[1],C4[0],C4[1],col);
    bl(C4[0],C4[1],C5[0],C5[1],col);
    bl(C5[0],C5[1],C6[0],C6[1],col);
    bl(C6[0],C6[1],N1[0],N1[1],col);
    dbl(C4[0],C4[1],C5[0],C5[1],col,100,140);
    dbl(C2[0],C2[1],N3[0],N3[1],col,100,140);
    // Pentagon bonds
    bl(C5[0],C5[1],N7[0],N7[1],col);
    bl(N7[0],N7[1],C8[0],C8[1],col);
    bl(C8[0],C8[1],N9[0],N9[1],col);
    bl(N9[0],N9[1],C4[0],C4[1],col);
    dbl(N7[0],N7[1],C8[0],C8[1],col,(N7[0]+N9[0])/2,(N7[1]+N9[1])/2);
    // Atom labels
    C_(C2[0],C2[1]); C_(C4[0],C4[1]); C_(C5[0],C5[1]); C_(C6[0],C6[1]); C_(C8[0],C8[1]);
    N_(N1[0],N1[1],'N'); N_(N3[0],N3[1],'N'); N_(N7[0],N7[1],'N'); N_(N9[0],N9[1],'N');
    // N9-sugar label
    bl(N9[0],N9[1],N9[0]-16,N9[1]+20,'#555',1.5);
    const st=svgE('text',{x:N9[0]-22,y:N9[1]+34,'text-anchor':'middle',
      'font-size':7.5,fill:'#475569','font-family':'DM Mono,monospace'},s);st.textContent='sugar';
    if(isG){
      // Guanine substituents — extending RIGHT toward interface
      // N1-H: rightward
      bl(N1[0],N1[1],N1[0]+18,N1[1],'#555',1.5); H_(N1[0]+18,N1[1]);
      // C6=O: upper-right from C6
      dbl(C6[0],C6[1],C6[0]+22,C6[1]-20,'#555',C6[0]-6,C6[1]); O_(C6[0]+22,C6[1]-20);
      // C2-NH2: lower-right from C2
      bl(C2[0],C2[1],C2[0]+24,C2[1]+18,'#555',1.5);
      N_(C2[0]+24,C2[1]+18,'N');
      bl(C2[0]+24,C2[1]+18,C2[0]+42,C2[1]+8,'#555',1.3); H_(C2[0]+42,C2[1]+8);
      bl(C2[0]+24,C2[1]+18,C2[0]+40,C2[1]+32,'#555',1.3); H_(C2[0]+40,C2[1]+32);
      baseLbl(60,262,'Guanine (G)',cG);
    } else {
      // Adenine substituents
      // C6-NH2: upper-right
      bl(C6[0],C6[1],C6[0]+22,C6[1]-20,'#555',1.5);
      N_(C6[0]+22,C6[1]-20,'N');
      bl(C6[0]+22,C6[1]-20,C6[0]+40,C6[1]-10,'#555',1.3); H_(C6[0]+40,C6[1]-10);
      bl(C6[0]+22,C6[1]-20,C6[0]+40,C6[1]-34,'#555',1.3); H_(C6[0]+40,C6[1]-34);
      // C2-H
      bl(C2[0],C2[1],C2[0]+22,C2[1]+16,'#555',1.3); H_(C2[0]+22,C2[1]+16);
      baseLbl(60,262,'Adenine (A)',cA);
    }
  }

  function drawPyrimidine(col, isC){
    const {N1,C2,N3,C4,C5,C6}=qHex;
    bl(N1[0],N1[1],C2[0],C2[1],col);
    bl(C2[0],C2[1],N3[0],N3[1],col);
    bl(N3[0],N3[1],C4[0],C4[1],col);
    bl(C4[0],C4[1],C5[0],C5[1],col);
    bl(C5[0],C5[1],C6[0],C6[1],col);
    bl(C6[0],C6[1],N1[0],N1[1],col);
    dbl(C4[0],C4[1],C5[0],C5[1],col,420,140);
    dbl(C6[0],C6[1],N1[0],N1[1],col,420,140);
    C_(C2[0],C2[1]); C_(C4[0],C4[1]); C_(C5[0],C5[1]); C_(C6[0],C6[1]);
    N_(N1[0],N1[1],'N'); N_(N3[0],N3[1],'N');
    // N1-sugar: rightward-down
    bl(N1[0],N1[1],N1[0]+18,N1[1]+20,'#555',1.5);
    const st=svgE('text',{x:N1[0]+28,y:N1[1]+34,'text-anchor':'middle',
      'font-size':7.5,fill:'#475569','font-family':'DM Mono,monospace'},s);st.textContent='sugar';
    if(isC){
      // Cytosine substituents — extending LEFT toward interface
      // C2=O: lower-left
      dbl(C2[0],C2[1],C2[0]-24,C2[1]+20,'#555',C2[0]+6,C2[1]); O_(C2[0]-24,C2[1]+20);
      // C4-NH2: upward above ring
      bl(C4[0],C4[1],C4[0]-6,C4[1]-28,'#555',1.5);
      N_(C4[0]-6,C4[1]-28,'N');
      bl(C4[0]-6,C4[1]-28,C4[0]-22,C4[1]-40,'#555',1.3); H_(C4[0]-22,C4[1]-40);
      bl(C4[0]-6,C4[1]-28,C4[0]+12,C4[1]-42,'#555',1.3); H_(C4[0]+12,C4[1]-42);
      // C5-H, C6-H (pointing away from interface)
      bl(C5[0],C5[1],C5[0]+22,C5[1]-16,'#555',1.3); H_(C5[0]+22,C5[1]-16);
      bl(C6[0],C6[1],C6[0]-20,C6[1]-18,'#555',1.3); H_(C6[0]-20,C6[1]-18);
      baseLbl(460,262,'Cytosine (C)',cC);
    } else {
      // Thymine/Uracil substituents — extending LEFT toward interface
      // C2=O: lower-left
      dbl(C2[0],C2[1],C2[0]-24,C2[1]+20,'#555',C2[0]+6,C2[1]); O_(C2[0]-24,C2[1]+20);
      // C4=O: upper-left
      dbl(C4[0],C4[1],C4[0]-24,C4[1]-20,'#555',C4[0]+6,C4[1]); O_(C4[0]-24,C4[1]-20);
      // N3-H: leftward (donor toward purine)
      bl(N3[0],N3[1],N3[0]-20,N3[1],'#555',1.5); H_(N3[0]-20,N3[1]);
      // C5 substituent
      if(col===cT){
        bl(C5[0],C5[1],C5[0]+24,C5[1]-16,col,1.5); C_(C5[0]+24,C5[1]-16);
        const ml=svgE('text',{x:C5[0]+42,y:C5[1]-12,'font-size':7.5,fill:col,
          'font-family':'DM Mono,monospace'},s);ml.textContent='CH₃';
      } else {
        bl(C5[0],C5[1],C5[0]+20,C5[1]-18,'#555',1.3); H_(C5[0]+20,C5[1]-18);
      }
      bl(C6[0],C6[1],C6[0]-20,C6[1]-18,'#555',1.3); H_(C6[0]-20,C6[1]-18);
      baseLbl(460,262,col===cU?'Uracil (U)':'Thymine (T)',col);
    }
  }

  // ── H-bond helpers ──
  // Purine N1 rightmost x ~134, pyrimidine N1 leftmost x ~386
  // Interface zone: ~155 to ~370
  const hx1=160, hx2=365;
  function hb(y,label){
    hbond(y,hx1,hx2);
    hbLabel(262,y-9,label);
  }

  if(pair==='AT'||pair==='AU'){
    const isAU=(pair==='AU');
    const cP=isAU?cU:cT;
    drawPurine(cA,false);
    drawPyrimidine(cP,false);
    bondBadge(2);
    // H-bonds at averaged Y positions of donor/acceptor atoms
    // Bond 1: A-N6·H···O4=T — N6 upper-right of C6, O4 upper-left of C4
    const y1=(pHex.C6[1]-20 + qHex.C4[1]-20)/2;
    hb(y1,'N6–H···O4');
    // Bond 2: A-N1···H–N3 — N1 of purine, N3 of pyrimidine
    const y2=(pHex.N1[1] + qHex.N3[1])/2;
    hb(y2,'N1···H–N3');
    info.innerHTML=`<b style="color:${cA}">A</b>–<b style="color:${cP}">${isAU?'U':'T'}</b>&ensp;<span style="color:var(--text-muted)"><b style="color:#e2e8f0">2 H-bonds</b></span><br>
<span><b>N6–H···O4</b> amino donor (A) → carbonyl acceptor (${isAU?'U':'T'}), major groove</span><br>
<span><b>N1···H–N3</b> imine acceptor (A) ← N3 donor (${isAU?'U':'T'}), minor groove</span>${isAU?'<br><span style="color:'+cU+'">Uracil: same as thymine but without C5-CH₃; found only in RNA</span>':''}`;
  } else {
    drawPurine(cG,true);
    drawPyrimidine(cC,true);
    bondBadge(3);
    // Bond 1: G-O6···H–N4(C) — O6 upper-right of C6, N4 upper-left of C4
    const y1=(pHex.C6[1]-20 + qHex.C4[1]-20)/2;
    hb(y1,'O6···H–N4');
    // Bond 2: G-N1–H···N3(C)
    const y2=(pHex.N1[1] + qHex.N3[1])/2;
    hb(y2,'N1–H···N3');
    // Bond 3: G-N2–H···O2(C)
    const y3=(pHex.C2[1]+18 + qHex.C2[1]+20)/2;
    hb(y3,'N2–H···O2');
    info.innerHTML=`<b style="color:${cG}">G</b>–<b style="color:${cC}">C</b>&ensp;<span style="color:var(--text-muted)"><b style="color:#e2e8f0">3 H-bonds</b> — strongest Watson-Crick pair</span><br>
<span><b>O6···H–N4</b> carbonyl acc. (G) ← amino donor (C), major groove</span><br>
<span><b>N1–H···N3</b> imine donor (G) → imine acc. (C), minor groove</span><br>
<span><b>N2–H···O2</b> amino donor (G) → carbonyl acc. (C), minor groove</span>`;
  }
}

// ── 1. URL HASH ROUTING ──────────────────────────────────────
function navigateToLesson(key){
  if(!LESSONS[key])return;
  trackEvent('lesson_view',{module:key,title:LESSONS[key].title});
  // Restore viewer panel and splitter if hidden by home page
  const rp=document.getElementById('right-panel');
  const sp=document.getElementById('v-splitter');
  const lp=document.getElementById('lesson-panel');
  if(rp)rp.style.display='';
  if(sp)sp.style.display='';
  if(lp){lp.style.gridColumn='';lp.style.gridRow='';}
  // Restore drag-handle and grid rows (may have been hidden by home page)
  const dh=document.getElementById('drag-handle');
  const appEl=document.querySelector('.app');
  if(dh)dh.style.display='';
  if(appEl)appEl.style.gridTemplateRows='';
  // Restore sidebar (may have been hidden by home page)
  const sb=document.querySelector('.sidebar');
  if(sb)sb.style.display='';
  // Mole reacts to navigation
  if(typeof moleReact==='function')moleReact('navigate');
  // Update hash without triggering hashchange loop
  try{history.replaceState(null,null,'#'+key);}catch(e){/* sandboxed iframe */}
  markVisited(key);
  // Activate correct sidebar buttons
  const topicPrefix=key.split('_')[0];
  // Find and activate the topic button
  document.querySelectorAll('.topic-btn').forEach(btn=>{
    const onclickAttr=btn.getAttribute('onclick')||'';
    const match=onclickAttr.match(/selectTopic\(this,'([^']+)'\)/);
    if(match){
      const isMatch=key.startsWith(match[1]+'_');
      btn.classList.toggle('active',isMatch);
    }
  });
  // Find and activate the subtopic button
  document.querySelectorAll('.subtopic-btn').forEach(btn=>{
    const onclickAttr=btn.getAttribute('onclick')||'';
    const isMatch=onclickAttr.includes("'"+key+"'");
    btn.classList.toggle('active',isMatch);
  });
  renderLesson(key);
  // Close mobile sidebar if open
  if(window.innerWidth<=900){
    document.querySelector('.sidebar')?.classList.remove('sidebar-open');
    document.querySelector('.sidebar-overlay')?.classList.remove('show');
  }
}

// Handle browser back/forward
window.addEventListener('hashchange',()=>{
  try{const key=location.hash.slice(1);
  if(key==='cheatsheet'){showCheatSheet();return;}
  if(key&&LESSONS[key])navigateToLesson(key);}catch(e){}
});

// ── Drag handle to resize panels ──
document.addEventListener('DOMContentLoaded',function(){
  let dragging=false,startY=0,startLessonH=0;
  const handle=document.getElementById('drag-handle');
  if(!handle)return;

  // Make handle visible if we're in stacked/mobile layout
  function checkLayout(){
    const app=document.querySelector('.app');
    if(!app)return;
    const cols=getComputedStyle(app).gridTemplateColumns;
    // If single column (mobile/stacked), show the handle
    const isSingleCol=!cols.includes(' ');// single column has no space separator between values
    handle.style.display=isSingleCol?'block':'none';
  }
  checkLayout();
  window.addEventListener('resize',checkLayout);

  function onStart(e){
    if(handle.style.display==='none')return;
    const app=document.querySelector('.app');
    if(app&&(app.classList.contains('view-lesson')||app.classList.contains('view-viewer')))return;
    e.preventDefault();
    dragging=true;
    startY=e.touches?e.touches[0].clientY:e.clientY;
    const lesson=document.querySelector('.lesson-panel');
    if(lesson)startLessonH=lesson.getBoundingClientRect().height;
    document.body.style.userSelect='none';
    document.body.style.cursor='row-resize';
    handle.style.background='var(--accent)';
  }
  function onMove(e){
    if(!dragging)return;
    e.preventDefault();
    const y=e.touches?e.touches[0].clientY:e.clientY;
    const dy=y-startY;
    const newH=Math.max(60,startLessonH+dy);
    const app=document.querySelector('.app');
    const totalH=app?app.getBoundingClientRect().height:600;
    const handleH=handle.getBoundingClientRect().height||12;
    const availH=totalH-handleH;
    const lessonPx=Math.max(60,Math.min(availH-60,newH));
    const viewerPx=availH-lessonPx;
    if(app)app.style.gridTemplateRows=lessonPx+'px '+handleH+'px '+viewerPx+'px';
  }
  function onEnd(){
    if(!dragging)return;
    dragging=false;
    document.body.style.userSelect='';
    document.body.style.cursor='';
    handle.style.background='';
  }
  handle.addEventListener('mousedown',onStart);
  handle.addEventListener('touchstart',onStart,{passive:false});
  document.addEventListener('mousemove',onMove);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('mouseup',onEnd);
  document.addEventListener('touchend',onEnd);
});

    if(!dragging)return;
    dragging=false;
    document.body.style.userSelect='';
    document.body.style.cursor='';
    splitter.style.background='';
  }
  splitter.addEventListener('mousedown',onStart);
  splitter.addEventListener('touchstart',onStart,{passive:false});
  document.addEventListener('mousemove',onMove);

  document.addEventListener('mouseup',onEnd);

});

// ── 3. QUIZ MODE ─────────────────────────────────────────────
// Quiz data is generated from lesson content on-the-fly
const QUIZ_DATA={};

// Pre-built quiz questions per topic area (curated for quality)
function getQuizForLesson(key){
  if(QUIZ_DATA[key])return QUIZ_DATA[key];
  // Generate quiz from lesson content
  const lesson=LESSONS[key];
  if(!lesson)return[];
  const questions=[];

  // Shuffle helper
  const shuf=arr=>[...arr].sort(()=>Math.random()-.5);

  // Generate questions from concepts
  if(lesson.concepts&&lesson.concepts.length>=2){
    // Q1: Match concept to description
    const c=lesson.concepts[Math.floor(Math.random()*lesson.concepts.length)];
    const wrong=lesson.concepts.filter(x=>x!==c).slice(0,3);
    if(wrong.length>=2){
      questions.push({
        q:`Which concept is described as: "${c.desc.substring(0,80)}${c.desc.length>80?'...':''}"?`,
        options:shuf([c.title,...wrong.map(w=>w.title)]),
        answer:c.title
      });
    }
    // Q1b: Reverse — given title, identify description
    if(lesson.concepts.length>=3){
      const c2=lesson.concepts[(Math.floor(Math.random()*lesson.concepts.length)+1)%lesson.concepts.length];
      const wrong2=lesson.concepts.filter(x=>x!==c2).slice(0,3);
      questions.push({
        q:`"${c2.title}" refers to:`,
        options:shuf([c2.desc.substring(0,80)+(c2.desc.length>80?'...':''),...wrong2.map(w=>w.desc.substring(0,80)+(w.desc.length>80?'...':''))]),
        answer:c2.desc.substring(0,80)+(c2.desc.length>80?'...':'')
      });
    }
  }

  // Q2: From key points — use distractors from OTHER lessons' key points for plausibility
  if(lesson.points&&lesson.points.length>=2){
    const ptIdx=Math.floor(Math.random()*Math.min(lesson.points.length,3));
    const pt=lesson.points[ptIdx];
    // Gather plausible distractors from other lessons' key points
    const otherPoints=[];
    const allKeys=Object.keys(LESSONS);
    for(let i=0;i<allKeys.length&&otherPoints.length<12;i++){
      const oKey=allKeys[(i+Math.floor(Math.random()*allKeys.length))%allKeys.length];
      if(oKey===key)continue;
      const oL=LESSONS[oKey];
      if(oL.points)oL.points.forEach(op=>{if(op!==pt)otherPoints.push(op.substring(0,90)+(op.length>90?'...':''));});
    }
    const decoys=shuf(otherPoints).slice(0,3);
    if(decoys.length>=3){
      questions.push({
        q:`Which of the following is true about ${lesson.title.toLowerCase()}?`,
        options:shuf([pt.substring(0,90)+(pt.length>90?'...':''),...decoys]),
        answer:pt.substring(0,90)+(pt.length>90?'...':'')
      });
    }
  }

  // Q3: From highlight box — use other lessons' highlights as distractors
  if(lesson.highlight){
    const otherHighlights=[];
    Object.entries(LESSONS).forEach(([k,l])=>{
      if(k!==key&&l.highlight)otherHighlights.push(l.highlight.text.substring(0,70)+'...');
    });
    const hDecoys=shuf(otherHighlights).slice(0,3);
    if(hDecoys.length>=3){
      questions.push({
        q:`The "${lesson.highlight.label}" section of this module discusses:`,
        options:shuf([lesson.highlight.text.substring(0,70)+'...',...hDecoys]),
        answer:lesson.highlight.text.substring(0,70)+'...'
      });
    }
  }

  // Q4: Concept label identification
  if(lesson.concepts&&lesson.concepts.length>=4){
    const c3=lesson.concepts[Math.floor(Math.random()*lesson.concepts.length)];
    questions.push({
      q:`In the context of ${lesson.title.toLowerCase()}, what does "${c3.label}" refer to?`,
      options:shuf([c3.title,...lesson.concepts.filter(x=>x!==c3).slice(0,3).map(w=>w.title)]),
      answer:c3.title
    });
  }

  QUIZ_DATA[key]=questions;
  return questions;
}

let quizActive=false, quizLesson='', quizIdx=0, quizScore=0, quizAnswered=false;

function toggleQuiz(){
  quizActive=!quizActive;
  const btn=document.getElementById('quiz-toggle');
  if(btn)btn.classList.toggle('active',quizActive);
  if(quizActive){
    // Determine current lesson from hash
    quizLesson=location.hash.slice(1)||'intro_macromolecules';
    quizIdx=0;quizScore=0;quizAnswered=false;
    showQuiz();
  } else {
    hideQuiz();
  }
}

function getQuestions(key){
  return CURATED_QUIZZES[key]||getQuizForLesson(key);
}

function showQuiz(){
  const questions=getQuestions(quizLesson);
  if(!questions||questions.length===0){
    const panel=document.getElementById('quiz-panel');
    if(panel){
      const lesson=LESSONS[quizLesson];
      const title=lesson?lesson.title:'this module';
      panel.innerHTML=`<div style="padding:1rem;text-align:center;">
        <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.6rem;">Practice questions for <strong style="color:var(--text)">${title}</strong> are being developed.</div>
        <div style="font-size:.72rem;color:var(--text-muted);margin-bottom:.6rem;">Try the spaced repetition system for modules that have questions!</div>
        <button class="vp-btn" onclick="toggleQuiz()" style="font-size:.62rem;">Close</button>
      </div>`;
    }
    const qp=document.getElementById('quiz-panel');
    if(qp)qp.style.display='block';
    return;
  }
  const qp=document.getElementById('quiz-panel');
  if(!qp)return;
  qp.style.display='block';
  renderQuizQuestion();
}

function hideQuiz(){
  const qp=document.getElementById('quiz-panel');
  if(qp)qp.style.display='none';
}

function renderQuizQuestion(){
  const questions=getQuestions(quizLesson);
  const qp=document.getElementById('quiz-panel');
  if(!qp||!questions||quizIdx>=questions.length){
    // Save score and show final result
    if(questions&&questions.length>0)saveQuizScore(quizLesson,quizScore,questions.length);
    if(qp)qp.innerHTML=`<div style="padding:.8rem;text-align:center;">
      <div style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--text);margin-bottom:.3rem;">Practice Complete!</div>
      <div style="font-size:.85rem;color:var(--accent2);font-weight:600;margin-bottom:.5rem;">${quizScore}/${questions?questions.length:0} correct</div>
      <button class="vp-btn" onclick="quizIdx=0;quizScore=0;quizAnswered=false;renderQuizQuestion()">Retry</button>
      <button class="vp-btn" onclick="toggleQuiz()">Close</button>
    </div>`;
    return;
  }
  const q=questions[quizIdx];
  quizAnswered=false;
  qp.innerHTML=`<div style="padding:.6rem .8rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;">
      <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-muted)">Q${quizIdx+1}/${questions.length}</span>
      <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--accent2)">Score: ${quizScore}/${quizIdx}</span>
    </div>
    <div style="font-size:.78rem;color:var(--text);line-height:1.5;margin-bottom:.5rem;">${q.q}</div>
    <div style="display:flex;flex-direction:column;gap:.3rem;" id="quiz-options">
      ${q.options.map((opt,i)=>`<button class="quiz-opt" data-opt="${i}" onclick="answerQuiz(this,'${opt.replace(/'/g,"\\'")}')" style="text-align:left;padding:.4rem .6rem;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text-dim);font-size:.72rem;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;line-height:1.4;">${opt}</button>`).join('')}
    </div>
    <div id="quiz-feedback" style="margin-top:.4rem;font-size:.72rem;min-height:1.2rem;" aria-live="assertive"></div>
  </div>`;
}

function answerQuiz(btn,selected){
  if(quizAnswered)return;
  quizAnswered=true;
  const questions=getQuestions(quizLesson);
  const q=questions[quizIdx];
  const correct=(selected===q.answer);
  if(correct)quizScore++;
  // Mole reacts to quiz answers
  if(typeof moleReact==='function')moleReact(correct?'correct':'wrong');

  // Highlight correct/wrong
  document.querySelectorAll('.quiz-opt').forEach(b=>{
    const opt=q.options[+b.dataset.opt];
    if(opt===q.answer){
      b.style.background='rgba(16,185,129,.15)';b.style.borderColor='#10b981';b.style.color='#34d399';
    } else if(b===btn&&!correct){
      b.style.background='rgba(239,68,68,.15)';b.style.borderColor='#ef4444';b.style.color='#f87171';
    }
    b.style.cursor='default';
  });

  const fb=document.getElementById('quiz-feedback');
  if(fb){
    fb.innerHTML=correct
      ?'<span style="color:#34d399">✓ Correct!</span>'
      :`<span style="color:#f87171">✗ Incorrect.</span> <span style="color:var(--text-dim)">Answer: ${q.answer}</span>`;
    fb.innerHTML+=` <button class="vp-btn" style="margin-left:.5rem;font-size:.62rem;" onclick="quizIdx++;renderQuizQuestion()">${quizIdx<questions.length-1?'Next →':'See Score'}</button>`;
  }
}
