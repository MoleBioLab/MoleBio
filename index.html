function initTour(){
  // Check if user has seen the tour
  (async()=>{
    let seen=false;
    try{const r=await _store.get('molebio-tour-seen');if(r&&r.value==='1')seen=true;}catch(e){}
    if(!seen)setTimeout(startTour,800);
  })();
}

function startTour(){
  tourStep=0;
  showTourStep();
}

function showTourStep(){
  // Remove existing tooltip
  document.getElementById('tour-overlay')?.remove();
  document.getElementById('tour-tooltip')?.remove();

  if(tourStep>=TOUR_STEPS.length){
    // Tour complete — mark as seen
    try{_store.set('molebio-tour-seen','1');}catch(e){}
    return;
  }

  const step=TOUR_STEPS[tourStep];
  const target=document.querySelector(step.target);

  // Semi-transparent overlay
  const overlay=document.createElement('div');
  overlay.id='tour-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;';
  overlay.onclick=()=>skipTour();
  document.body.appendChild(overlay);

  // Highlight target
  if(target){
    const rect=target.getBoundingClientRect();
    const highlight=document.createElement('div');
    highlight.style.cssText=`position:fixed;left:${rect.left-3}px;top:${rect.top-3}px;width:${rect.width+6}px;height:${rect.height+6}px;border:2px solid var(--accent);border-radius:8px;z-index:51;pointer-events:none;box-shadow:0 0 0 3000px rgba(0,0,0,.3);`;
    highlight.id='tour-highlight';
    document.body.appendChild(highlight);
  }

  // Tooltip
  const tooltip=document.createElement('div');
  tooltip.id='tour-tooltip';
  tooltip.style.cssText=`position:fixed;z-index:52;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:.8rem 1rem;max-width:280px;box-shadow:0 8px 32px rgba(0,0,0,.5);`;

  // Position tooltip relative to target
  if(target){
    const rect=target.getBoundingClientRect();
    if(step.pos==='right'){tooltip.style.left=(rect.right+12)+'px';tooltip.style.top=(rect.top+rect.height/2-60)+'px';}
    else if(step.pos==='left'){tooltip.style.right=(window.innerWidth-rect.left+12)+'px';tooltip.style.top=(rect.top+rect.height/2-60)+'px';}
    else if(step.pos==='below'){tooltip.style.left=Math.max(8,rect.left)+'px';tooltip.style.top=(rect.bottom+12)+'px';}
    else{tooltip.style.left='50%';tooltip.style.top='50%';tooltip.style.transform='translate(-50%,-50%)';}
  } else {
    tooltip.style.left='50%';tooltip.style.top='50%';tooltip.style.transform='translate(-50%,-50%)';
  }

  tooltip.innerHTML=`
    <div style="font-family:'DM Serif Display',serif;font-size:.95rem;color:var(--text);margin-bottom:.3rem;">${step.title}</div>
    <div style="font-size:.75rem;color:var(--text-dim);line-height:1.5;margin-bottom:.6rem;">${step.desc}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--text-muted);">${tourStep+1}/${TOUR_STEPS.length}</span>
      <div style="display:flex;gap:.3rem;">
        <button onclick="skipTour()" style="background:none;border:1px solid var(--border);border-radius:4px;padding:.2rem .5rem;font-size:.65rem;color:var(--text-muted);cursor:pointer;">Skip</button>
        <button onclick="nextTourStep()" style="background:var(--accent);border:none;border-radius:4px;padding:.2rem .6rem;font-size:.65rem;color:#fff;cursor:pointer;font-weight:600;">${tourStep<TOUR_STEPS.length-1?'Next →':'Done!'}</button>
      </div>
    </div>`;
  document.body.appendChild(tooltip);
}

function nextTourStep(){
  document.getElementById('tour-highlight')?.remove();
  tourStep++;
  showTourStep();
}

function skipTour(){
  document.getElementById('tour-overlay')?.remove();
  document.getElementById('tour-tooltip')?.remove();
  document.getElementById('tour-highlight')?.remove();
  try{_store.set('molebio-tour-seen','1');}catch(e){}
}

function toggleTheme(){
  if(currentTheme==='dark'){
    currentTheme='light';
    document.body.classList.add('light-theme');
  } else {
    currentTheme='dark';
    document.body.classList.remove('light-theme');
  }
  try{_store.set('molebio-theme',currentTheme);}catch(e){}
}

function filterSidebar(query){
  const q=query.toLowerCase().trim();
  const sidebar=document.querySelector('.sidebar');if(!sidebar)return;
  const topics=sidebar.querySelectorAll('.topic-btn');
  const subtopicGroups=sidebar.querySelectorAll('.subtopics');
  const labels=sidebar.querySelectorAll('.sidebar-label');
  if(!q){
    // Reset: show everything, restore normal expand/collapse
    topics.forEach(btn=>{btn.style.display='';});
    subtopicGroups.forEach(grp=>{grp.style.display='';});
    labels.forEach(l=>{l.style.display='';});
    sidebar.querySelectorAll('.subtopic-btn').forEach(btn=>{btn.style.display='';});
    return;
  }
  // Search through LESSONS — title, eyebrow, intro, body, concepts, and key points
  const matchKeys=new Set();
  Object.entries(LESSONS).forEach(([key,lesson])=>{
    const hay=(lesson.title+' '+lesson.eyebrow+' '+lesson.intro+' '+(lesson.body||'')+' '+(lesson.points||[]).join(' ')+' '+(lesson.concepts||[]).map(c=>c.title+' '+c.desc).join(' ')).toLowerCase();
    if(hay.includes(q))matchKeys.add(key);
  });
  // For each topic/subtopic, show/hide
  topics.forEach((btn,i)=>{
    const onclick=btn.getAttribute('onclick')||'';
    const topicMatch=onclick.match(/selectTopic\(this,'([^']+)'\)/);
    const prefix=topicMatch?topicMatch[1]+'_':'';
    const grp=btn.nextElementSibling;
    const subtopics=grp?grp.querySelectorAll('.subtopic-btn'):[];
    let anyMatch=false;
    subtopics.forEach(sub=>{
      const subOnclick=sub.getAttribute('onclick')||'';
      const keyMatch=subOnclick.match(/'([^']+)'/);
      const key=keyMatch?keyMatch[1]:'';
      if(matchKeys.has(key)){sub.style.display='';anyMatch=true;}
      else{sub.style.display='none';}
    });
    btn.style.display=anyMatch?'':'none';
    if(grp){grp.style.display=anyMatch?'flex':'none';}
  });
  labels.forEach(l=>{
    // Show label if its next sibling topic is visible
    const next=l.nextElementSibling;
    if(next&&next.classList.contains('topic-btn')){
      l.style.display=next.style.display;
    } else {
      // Check if any following topic before next label is visible
      let sib=l.nextElementSibling;
      let anyVis=false;
      while(sib&&!sib.classList.contains('sidebar-label')){
        if(sib.classList.contains('topic-btn')&&sib.style.display!=='none')anyVis=true;
        sib=sib.nextElementSibling;
      }
      l.style.display=anyVis?'':'none';
    }
  });
}

function drawOxPhosSummary(){

  svg.innerHTML='';
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  svg.setAttribute('viewBox','0 0 460 700');
  const NS2='http://www.w3.org/2000/svg';
  function el(tag,attrs){const n=document.createElementNS(NS2,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));svg.appendChild(n);return n;}
  function txt(x,y,str,c,fs,anc,fw){const t=el('text',{x,y,'text-anchor':anc||'middle','font-size':fs||9,fill:c||'#94a3b8','font-family':'DM Sans,sans-serif','font-weight':fw||'600'});t.textContent=str;}
  function mono(x,y,str,c,fs,anc){const t=el('text',{x,y,'text-anchor':anc||'middle','font-size':fs||8,fill:c||'#64748b','font-family':'DM Mono,monospace','font-weight':'500'});t.textContent=str;}
  function rrect(x,y,w,h,fill,stroke,rx){el('rect',{x,y,width:w,height:h,fill:fill||'none',stroke:stroke||'none',rx:rx||6,'stroke-width':1.5});}
  function arrow(x1,y1,x2,y2,c){
    const id='ox'+Math.round(Math.random()*9999);
    const d=el('defs',{});const mk=document.createElementNS(NS2,'marker');
    Object.entries({id,markerWidth:'7',markerHeight:'7',refX:'5',refY:'3.5',orient:'auto'}).forEach(([k,v])=>mk.setAttribute(k,v));
    const pa=document.createElementNS(NS2,'path');pa.setAttribute('d','M0,0 L0,7 L7,3.5 z');pa.setAttribute('fill',c||'#475569');
    mk.appendChild(pa);d.appendChild(mk);svg.appendChild(d);
    el('line',{x1,y1,x2,y2,stroke:c||'#475569','stroke-width':1.8,'marker-end':`url(#${id})`});
  }
  function badge(x,y,str,c){
    const w=str.length*5.5+14;
    rrect(x-w/2,y-9,w,18,c+'18',c,4);
    mono(x,y+3,str,c,7);
  }

  const cx=210,boxW=200;
  // Each stage: y, height, content — with generous spacing
  const stages=[
    {y:32,h:82,label:'Glycolysis',sub:'Cytoplasm',col:'#10b981',
     yields:['2 ATP (substrate-level)','2 NADH','2 Pyruvate'],atp:'+2 ATP',
     detail:'Glucose → 2 pyruvate. Net 2 ATP + 2 NADH produced in the cytoplasm.'},
    {y:138,h:78,label:'Pyruvate Dehydrogenase',sub:'Mito Matrix',col:'#f59e0b',
     yields:['2 NADH','2 Acetyl-CoA','2 CO₂'],atp:'',
     detail:'2 pyruvate → 2 acetyl-CoA + 2 CO₂ + 2 NADH. Irreversible, links glycolysis to TCA.'},
    {y:240,h:95,label:'TCA Cycle (×2 turns)',sub:'Mito Matrix',col:'#8b5cf6',
     yields:['6 NADH','2 FADH₂','2 GTP','4 CO₂'],atp:'+2 GTP',
     detail:'Each turn: 3 NADH + 1 FADH₂ + 1 GTP + 2 CO₂. Two turns per glucose.'},
    {y:360,h:75,label:'Electron Transport Chain',sub:'Inner Membrane',col:'#3b82f6',
     yields:['10 NADH → ~25 ATP','2 FADH₂ → ~3 ATP'],atp:'+~28 ATP',
     detail:'NADH × 2.5 ATP + FADH₂ × 1.5 ATP. Pumps H⁺ to drive ATP synthase.'},
    {y:460,h:58,label:'ATP Synthase (Complex V)',sub:'Inner Membrane',col:'#06b6d4',
     yields:['H⁺ gradient → rotary ATP synthesis'],atp:'',
     detail:'Rotary motor: ~2.7 H⁺ per ATP. Converts proton-motive force into chemical energy.'},
  ];

  // Title
  txt(cx,18,'COMPLETE GLUCOSE OXIDATION','#94a3b8',10,'middle','700');

  stages.forEach((st,i)=>{
    // Main box
    rrect(cx-boxW/2,st.y,boxW,st.h,st.col+'0c',st.col,8);
    // Stage label
    txt(cx,st.y+17,st.label,st.col,11,'middle','700');
    mono(cx,st.y+29,st.sub,'#64748b',7);
    // Yield items — start below sub, 13px line spacing
    st.yields.forEach((yld,j)=>{
      mono(cx,st.y+43+j*13,yld,st.col+'cc',8);
    });

    // Arrow to next stage
    if(i<stages.length-1){
      const ny=stages[i+1].y;
      arrow(cx,st.y+st.h+2,cx,ny-4,'#475569');
    }

    // ATP badge on right side
    if(st.atp){
      badge(cx+boxW/2+42,st.y+st.h/2,st.atp,'#34d399');
    }

    // Click handler
    const hitBox=el('rect',{x:cx-boxW/2,y:st.y,width:boxW,height:st.h,fill:'transparent',cursor:'pointer'});
    hitBox.addEventListener('click',()=>{
      const info=document.getElementById('oxphos-info');

    {label:'FADH₂ (TCA)',n:'×2',atp:'= 3'},
    {label:'ATP/GTP (substr.)',n:'×4',atp:'= 4'},
  ];
  carriers.forEach((c,i)=>{
    const yy=bottomY+16+i*13;
    mono(lx,yy,c.label,'#94a3b8',6.5,'start');

  mono(rx,bottomY+42,'Efficiency ≈ 34%','#34d399',8,'start');

  <button class="vp-btn" data-ssa onclick="ssAnimStep=1;drawSSAnim();document.querySelectorAll('[data-ssa]').forEach(b=>b.classList.remove('active'));this.classList.add('active')" style="color:#f59e0b">β-Sheet</button>
  <button class="vp-btn" data-ssa onclick="ssAnimStep=2;drawSSAnim();document.querySelectorAll('[data-ssa]').forEach(b=>b.classList.remove('active'));this.classList.add('active')" style="color:#ec4899">β-Turn</button>

</div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem;min-height:0;overflow:hidden;" id="ssa-area"></div>
<div id="ssa-info" style="padding:.5rem .8rem;border-top:1px solid var(--border);flex-shrink:0;font-size:.7rem;line-height:1.6;color:var(--text-muted);"></div>`;
  drawSSAnim();
}
function drawSSAnim(){
  const area=document.getElementById('ssa-area');if(!area)return;
  area.innerHTML='';
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.style.cssText='width:100%;height:auto;display:block;';
  area.appendChild(s);
  const NS2='http://www.w3.org/2000/svg';
  function el(tag,a){const n=document.createElementNS(NS2,tag);if(a)Object.entries(a).forEach(([k,v])=>n.setAttribute(k,String(v)));s.appendChild(n);return n;}
  function txt(x,y,str,c,fs,fw){const t=el('text',{x:x,y:y,'text-anchor':'middle','font-size':fs||9,fill:c||'#94a3b8','font-family':'DM Sans,sans-serif','font-weight':fw||'600'});t.textContent=str;}
  const info=document.getElementById('ssa-info');

  if(ssAnimStep===0){
    // ALPHA HELIX
    s.setAttribute('viewBox','0 0 400 280');
    let pts='';for(let i=0;i<=60;i++){const t=i/60,x=80+t*240,y=140+Math.sin(t*Math.PI*5)*50;pts+=x+','+y+' ';}
    el('polyline',{points:pts,fill:'none',stroke:'#3b82f6','stroke-width':4,'stroke-linecap':'round',opacity:'0.8'});
    for(let i=0;i<4;i++){const t1=i*0.16+0.08,t2=t1+0.32,x1=80+t1*240,y1=140+Math.sin(t1*Math.PI*5)*50,x2=80+t2*240,y2=140+Math.sin(t2*Math.PI*5)*50;el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:'#f59e0b','stroke-width':1.5,'stroke-dasharray':'4 2'});txt((x1+x2)/2,(y1+y2)/2-8,'H-bond','#f59e0b',7);}
    for(let i=0;i<=12;i++){const t=i/12,x=80+t*240,y=140+Math.sin(t*Math.PI*5)*50;el('circle',{cx:x,cy:y,r:5,fill:'#3b82f6',stroke:'#1e40af','stroke-width':1.5});txt(x,y+3,''+(i+1),'#fff',7);}
    txt(200,30,'Alpha-Helix','#3b82f6',14,'700');
    txt(200,50,'Right-handed, 3.6 residues/turn, pitch 5.4 Å','#64748b',9);
    txt(60,240,'N','#10b981',11,'700');txt(340,240,'C','#ef4444',11,'700');
    el('line',{x1:70,y1:237,x2:330,y2:237,stroke:'#334155','stroke-width':1.5});
    txt(200,260,'Side chains project outward · i→i+4 backbone H-bonds','#64748b',8);
    if(info)info.innerHTML='<b style="color:#3b82f6">α-Helix</b> — 3.6 residues per turn, 1.5 Å rise/residue, 5.4 Å pitch. Stabilized by H-bonds from C=O of residue i to N-H of residue i+4. Ala, Glu, Leu, Met have high helix propensity.';

  } else if(ssAnimStep===1){
    // BETA SHEET
    s.setAttribute('viewBox','0 0 400 300');
    txt(200,22,'Beta-Sheet','#f59e0b',14,'700');
    // Antiparallel side
    txt(105,42,'Antiparallel','#f59e0b',10,'700');
    for(let i=0;i<3;i++){const y=70+i*60,dir=i%2===0?1:-1;
      el('line',{x1:30,y1:y,x2:180,y2:y,stroke:'#f59e0b','stroke-width':3,'stroke-linecap':'round'});
      const ax=dir>0?168:42;el('polygon',{points:(ax)+','+(y-5)+' '+(ax+dir*10)+','+y+' '+ax+','+(y+5),fill:'#f59e0b'});
      for(let j=0;j<4;j++){el('circle',{cx:50+j*38,cy:y,r:4,fill:'#f59e0b55',stroke:'#f59e0b','stroke-width':1});}
    }

      el('line',{x1:cx,y1:76,x2:cx,y2:124,stroke:'#60a5fa','stroke-width':1.2,'stroke-dasharray':'3 2'});

    // Parallel side
    txt(300,42,'Parallel','#f59e0b',10,'700');
    for(let i=0;i<3;i++){const y=70+i*60;
      el('line',{x1:220,y1:y,x2:380,y2:y,stroke:'#f59e0b','stroke-width':3,'stroke-linecap':'round'});

      for(let j=0;j<4;j++){el('circle',{cx:240+j*38,cy:y,r:4,fill:'#f59e0b55',stroke:'#f59e0b','stroke-width':1});}

    for(let j=0;j<4;j++){const cx=240+j*38;
      el('line',{x1:cx,y1:76,x2:cx+6,y2:124,stroke:'#60a5fa','stroke-width':1.2,'stroke-dasharray':'3 2'});

    el('line',{x1:200,y1:55,x2:200,y2:200,stroke:'#334155','stroke-width':1,'stroke-dasharray':'4 3'});
    txt(200,240,'Antiparallel: alternating N→C direction, stronger H-bonds','#64748b',8);

    if(info)info.innerHTML='<b style="color:#f59e0b">β-Sheet</b> — Extended strands connected by backbone H-bonds between adjacent strands. Val, Ile, Tyr, Phe have high sheet propensity. Forms the core of many protein domains (immunoglobulin fold, TIM barrel).';

  } else if(ssAnimStep===2){

    txt(200,172,'C=O···H-N','#f59e0b',11,'700');txt(200,187,'i → i+3 hydrogen bond','#f59e0b',8);

    // Draw multiple faded conformations (ensemble)

    // Solid "current" conformation on top
    el('path',{d:'M60,152 C85,95 115,210 155,130 S195,80 230,155 S265,200 300,125 S340,170 370,148',fill:'none',stroke:'#06b6d4','stroke-width':3.5,'stroke-linecap':'round',opacity:'0.8'});
    // Residue dots on the solid path

    // Info boxes

    txt(108,242,'~30% of eukaryotic','#06b6d4',8);txt(108,254,'proteins have IDRs','#06b6d4',8);txt(108,266,'>50 residues long','#06b6d4',8);
    el('rect',{x:215,y:225,width:155,height:55,rx:6,fill:'rgba(6,182,212,.06)',stroke:'rgba(6,182,212,.15)','stroke-width':1});

    if(info)info.innerHTML='<b style="color:#06b6d4">Intrinsically Disordered Regions</b> — Unlike loops, IDRs never fold into a stable structure under physiological conditions. They exist as dynamic ensembles of rapidly interconverting conformations. Enriched in charged and polar residues (Lys, Arg, Glu, Ser, Pro) and depleted in hydrophobic residues. Critical for phase separation (membraneless organelles like stress granules, P-bodies) and multivalent signaling interactions. Examples: p53 transactivation domain, FUS low-complexity domain, nucleoporin FG repeats.';
  }
  setTimeout(initViewerZoom,50);
}

let pipVol=10,pipType='P20';
function renderPipettePanel(){
  pipVol=10;pipType='P20';
  const p=document.getElementById('right-panel');
  p.innerHTML=`<div class="vp-header"><div class="vp-title">Micropipette Viewer</div><div class="vp-desc">Set a volume and see the pipette window</div></div>
<div class="vp-controls">
  <button class="vp-btn" id="pip-p2" onclick="setPipType('P2')">P2</button>
  <button class="vp-btn active" id="pip-p20" onclick="setPipType('P20')">P20</button>
  <button class="vp-btn" id="pip-p200" onclick="setPipType('P200')">P200</button>
  <button class="vp-btn" id="pip-p1000" onclick="setPipType('P1000')">P1000</button>
</div>
<div style="padding:.5rem .8rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--border);flex-shrink:0;">
  <label style="font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text-muted);">Volume (µL):</label>
  <input type="number" id="pip-vol" value="10" min="0" step="0.1" style="width:70px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:.2rem .4rem;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text);outline:none;" oninput="pipVol=Math.max(0,+this.value||0);drawPipette()">
  <span id="pip-range" style="font-family:'DM Mono',monospace;font-size:.55rem;color:var(--text-muted);"></span>
</div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem;min-height:0;overflow:hidden;" id="pip-area"></div>
<div id="pip-info" style="padding:.4rem .8rem;border-top:1px solid var(--border);flex-shrink:0;font-size:.66rem;line-height:1.55;color:var(--text-muted);"></div>`;
  drawPipette();
}
function setPipType(t){pipType=t;const ranges={P2:{max:2},P20:{max:20},P200:{max:200},P1000:{max:1000}};pipVol=Math.min(pipVol,ranges[t].max);document.getElementById('pip-vol').value=pipVol;document.querySelectorAll('[id^=pip-p]').forEach(function(b){b.classList.remove('active');});var btn=document.getElementById('pip-'+t.toLowerCase());if(btn)btn.classList.add('active');drawPipette();}
function drawPipette(){
  var area=document.getElementById('pip-area');if(!area)return;area.innerHTML='';
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 260 430');s.style.cssText='max-width:100%;max-height:100%;display:block;';area.appendChild(s);
  var NS2='http://www.w3.org/2000/svg';
  function el(tag,a){var n=document.createElementNS(NS2,tag);if(a)Object.entries(a).forEach(function(e){n.setAttribute(e[0],String(e[1]));});s.appendChild(n);return n;}
  function txt(x,y,str,c,fs,fw){var t=el('text',{x:x,y:y,'text-anchor':'middle','font-size':fs||9,fill:c||'#94a3b8','font-family':'DM Mono,monospace','font-weight':fw||'600'});t.textContent=str;}
  var ranges={P2:{min:0.2,max:2},P20:{min:2,max:20},P200:{min:20,max:200},P1000:{min:100,max:1000}};
  var r=ranges[pipType],vol=Math.max(0,Math.min(r.max,pipVol)),outOfRange=pipVol<r.min||pipVol>r.max;
  var rangeEl=document.getElementById('pip-range');if(rangeEl)rangeEl.textContent='Range: '+r.min+'–'+r.max+' µL';
  var d1,d2,d3,dialFrac;
  if(pipType==='P2'){d1=Math.floor(vol);d2=Math.floor((vol*10)%10);d3=Math.floor((vol*100)%10);dialFrac=(vol*1000)%10/10;}
  else if(pipType==='P20'){d1=Math.floor(vol/10);d2=Math.floor(vol%10);d3=Math.floor((vol*10)%10);dialFrac=(vol*100)%10/10;}
  else if(pipType==='P200'){d1=Math.floor(vol/100);d2=Math.floor((vol%100)/10);d3=Math.floor(vol%10);dialFrac=(vol*10)%10/10;}
  else{d1=Math.floor(vol/1000);d2=Math.floor((vol%1000)/100);d3=Math.floor((vol%100)/10);dialFrac=(vol%10)/10;}
  var cx=130,bw=64;
  // Plunger button
  el('rect',{x:cx-16,y:8,width:32,height:42,rx:7,fill:'#334155',stroke:'#475569','stroke-width':1.5});
  // Shaft
  el('rect',{x:cx-12,y:50,width:24,height:75,rx:4,fill:'#1e293b',stroke:'#334155','stroke-width':1.5});
  // Body
  el('rect',{x:cx-bw/2,y:125,width:bw,height:175,rx:10,fill:'#1e293b',stroke:outOfRange?'#ef4444':'#475569','stroke-width':2});
  txt(cx,143,pipType,'#94a3b8',11,'700');
  // Tip ejector button
  el('rect',{x:cx+bw/2-2,y:178,width:14,height:6,rx:2,fill:'#475569'});

  // ── VOLUME WINDOW (3 digits) ──
  var wy=152,ww=50,wh=95;
  el('rect',{x:cx-ww/2,y:wy,width:ww,height:wh,rx:5,fill:'#f8fafc',stroke:'#cbd5e1','stroke-width':1.5});
  [[d1,wy+20],[d2,wy+46],[d3,wy+72]].forEach(function(pair,idx){
    el('rect',{x:cx-20,y:pair[1]-15,width:40,height:22,rx:3,fill:idx===2?'#fee2e2':'#f1f5f9',stroke:'#e2e8f0','stroke-width':0.5});
    txt(cx,pair[1]+2,String(pair[0]),'#1e293b',20,'700');
  });
  var d3prev=(d3+9)%10,d3next=(d3+1)%10;
  if(pipType==='P2'){el('circle',{cx:cx+18,cy:wy+14,r:2,fill:'#ef4444'});}
  else if(pipType==='P20'){el('circle',{cx:cx+18,cy:wy+60,r:2,fill:'#ef4444'});}

  // ── HORIZONTAL TICK DIAL (below window, centered ±half scale) ──
  var dialY=wy+wh+14,dialW=56,dialH=22;
  el('rect',{x:cx-dialW/2-3,y:dialY-3,width:dialW+6,height:dialH+6,rx:4,fill:'#0f172a',stroke:'#475569','stroke-width':1});
  el('rect',{x:cx-dialW/2,y:dialY,width:dialW,height:dialH,rx:2,fill:'#1e293b'});
  // The dial has 10 divisions: 5 left of center, 5 right.
  // Layout: 4 short ticks, 1 long (labeled), center long (0), 1 long (labeled), 4 short ticks
  // Total 11 tick positions (indices 0–10), center at 5
  var halfLabels={P2:'0.005',P20:'0.05',P200:'0.5',P1000:'5'};
  var halfLabel=halfLabels[pipType];
  // dialFrac is 0–1 representing position within the sub-digit (0.0 = exactly on digit, 0.5 = halfway)
  // Map dialFrac to position: frac 0 → center, frac 0.5 → right edge, frac ~1.0 → approaches center from left
  // Actually dialFrac maps linearly 0–9 across 10 ticks. Remap: dial value 0 = center, 5 = right edge, wrapping
  var dialDigit=Math.round(dialFrac*10)%10;
  // Pointer position: dialFrac 0→center, 0.5→right end, 1.0→center (wraps). Convert to -5..+5 range
  var rawDial=dialFrac*10; // 0 to ~10
  var dialOffset=rawDial<=5?rawDial:rawDial-10; // -5 to +5, 0=center
  for(var t=0;t<=10;t++){
    var tx=cx-dialW/2+3+((t)/10)*(dialW-6);
    var isCenter=(t===5);
    var isHalf=(t===0||t===10);
    var isMajor=isCenter||isHalf;
    var tickLen=isMajor?14:8;
    var tickCol=isCenter?'#94a3b8':isMajor?'#94a3b8':'#586e85';
    el('line',{x1:tx,y1:dialY+2,x2:tx,y2:dialY+2+tickLen,stroke:tickCol,'stroke-width':isMajor?1:0.7});
  }
  // Labels: left half-label, center 0, right half-label
  var txLeft=cx-dialW/2+3;
  var txCenter=cx-dialW/2+3+(5/10)*(dialW-6);
  var txRight=cx-dialW/2+3+(10/10)*(dialW-6);
  txt(txLeft,dialY+dialH+11,halfLabel,'#64748b',6,'500');
  txt(txRight,dialY+dialH+11,halfLabel,'#64748b',6,'500');
  // Red pointer triangle — position mapped from dialOffset (-5 to +5) → tick positions 0–10
  var pointerPos=(dialOffset+5)/10; // 0 to 1
  var pointerX=cx-dialW/2+3+pointerPos*(dialW-6);
  el('polygon',{points:(pointerX-3)+','+(dialY+dialH+1)+' '+(pointerX+3)+','+(dialY+dialH+1)+' '+pointerX+','+(dialY+dialH-4),fill:'#ef4444'});

  // Digit meaning labels
  var meanings={P2:['µL','0.1 µL','0.01 µL'],P20:['10 µL','1 µL','0.1 µL'],P200:['100 µL','10 µL','1 µL'],P1000:['1000 µL','100 µL','10 µL']};
  var m=meanings[pipType];
  [[wy+22,m[0]],[wy+48,m[1]],[wy+74,m[2]]].forEach(function(pair){txt(cx-43,pair[0],pair[1],'#64748b',6);});

  // Nose cone
  el('rect',{x:cx-10,y:300,width:20,height:55,rx:4,fill:'#334155',stroke:'#475569','stroke-width':1});
  // Tip
  el('path',{d:'M'+(cx-8)+',355 L'+(cx+8)+',355 L'+(cx+3)+',420 L'+(cx-3)+',420 Z',fill:'#e2e8f0',stroke:'#94a3b8','stroke-width':1});

  if(outOfRange){el('rect',{x:cx-55,y:360,width:110,height:20,rx:4,fill:'rgba(239,68,68,.12)',stroke:'#ef4444','stroke-width':1});txt(cx,373,'⚠ Out of range!','#ef4444',9,'700');}

  var info=document.getElementById('pip-info');
  if(info){
    var readout=d1+''+d2+(pipType==='P2'||pipType==='P20'?'.':'')+d3;
    var dialUnits={P2:'0.001',P20:'0.01',P200:'0.1',P1000:'1'};
    var dialShow=dialOffset>0?'+'+dialOffset:dialOffset<0?String(dialOffset):'0';
    if(outOfRange)info.innerHTML='<b style="color:#ef4444">⚠ '+pipVol+' µL is outside the '+pipType+' range ('+r.min+'–'+r.max+' µL).</b> Use a different pipette.';
    else info.innerHTML='<b style="color:var(--accent2)">'+pipType+' set to '+pipVol+' µL</b> — Window: <b>'+readout+'</b>, dial: <b>'+dialShow+'</b> (each tick = '+dialUnits[pipType]+' µL)';
  }
}

<div class="vp-controls">

const LESSON_KEYS=['intro_macromolecules','intro_units','intro_aminoacids','intro_peptide','intro_nucleotides','intro_basepairs_ctx','intro_dna_rna','lab_pipettes','lab_gels','lab_western','protein_levels','protein_ss_anim','protein_ss_builder','protein_ramachandran','protein_folding','protein_chaperones','protein_misfolding','kinetics_mm','kinetics_inhibition','kinetics_allostery','membrane_lipids','membrane_bilayer','membrane_transport','metabolism_glycolysis','metabolism_gluconeogenesis','metabolism_ppp','metabolism_tca','metabolism_aa_catabolism','metabolism_urea','metabolism_fa_oxidation','metabolism_fa_synthesis','metabolism_nucleotide_synth','metabolism_atpsynthase','metabolism_etc','metabolism_oxphos','dna_helicase','dna_polymerase','dna_rnapol','dna_rna_processing','dna_ribosome','dna_codontable','dna_crispr','dna_genereg','dna_epigenetics','signaling_gpcr','signaling_rtk','signaling_jakstat','signaling_nfkb','tools_tm','tools_mwpi','tools_dogma','tools_seqconv','tools_mmfit'];

function getCurrentLessonKey(){
  let key='';try{key=location.hash.slice(1);}catch(e){}
  return key||'intro_macromolecules';
}

function initKeyboardShortcuts(){
  document.addEventListener('keydown',e=>{
    // Don't trigger shortcuts when typing in inputs
    const tag=document.activeElement?.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;

    if(e.key==='/'){
      e.preventDefault();
      toggleMoleSearch();
    }
    else if(e.key==='n'&&!e.ctrlKey&&!e.metaKey){
      e.preventDefault();
      const cur=getCurrentLessonKey();
      const idx=LESSON_KEYS.indexOf(cur);
      if(idx<LESSON_KEYS.length-1)navigateToLesson(LESSON_KEYS[idx+1]);
    }
    else if(e.key==='p'&&!e.ctrlKey&&!e.metaKey){
      e.preventDefault();
      const cur=getCurrentLessonKey();
      const idx=LESSON_KEYS.indexOf(cur);
      if(idx>0)navigateToLesson(LESSON_KEYS[idx-1]);
    }
    else if(e.key==='q'&&!e.ctrlKey&&!e.metaKey){
      e.preventDefault();
      toggleQuiz();
    }
    else if(e.key==='?'&&!e.ctrlKey){
      e.preventDefault();
      showShortcutsModal();
    }
    else if(e.key==='Escape'){
      // Close everything
      document.getElementById('about-modal')?.remove();
      document.getElementById('shortcuts-modal')?.remove();
      document.querySelector('.sidebar')?.classList.remove('sidebar-open');
      document.querySelector('.sidebar-overlay')?.classList.remove('show');
      if(moleSearchOpen)toggleMoleSearch();
      if(settingsOpen)toggleSettingsMenu();
      if(toolSwitcherOpen)toggleToolSwitcher();
      if(quizActive)toggleQuiz();
    }
    else if(e.key==='t'&&!e.ctrlKey&&!e.metaKey){
      e.preventDefault();
      toggleTheme();
    }
    else if(e.key==='h'&&!e.ctrlKey&&!e.metaKey){
      e.preventDefault();
      showHomePage();
    }

function exportAnkiDeck(){
  // Generate Anki-compatible CSV (tab-separated: front\tback\ttags)
  let csv='#separator:tab\n#html:true\n#tags column:3\n';
  Object.entries(LESSONS).forEach(([key,lesson])=>{
    // Card 1: Title → intro
    csv+=`What is ${lesson.title}?\t${lesson.intro.replace(/\t/g,' ').replace(/\n/g,'<br>')}\tMoleBio::${lesson.eyebrow.replace(/[& ]/g,'_')}\n`;
    // Cards from concepts
    lesson.concepts.forEach(c=>{
      csv+=`${lesson.title}: What is ${c.title}?\t${c.desc.replace(/\t/g,' ').replace(/\n/g,'<br>')}\tMoleBio::${lesson.eyebrow.replace(/[& ]/g,'_')}\n`;
    });
    // Cards from key points
    lesson.points.forEach((pt,i)=>{
      csv+=`${lesson.title} — Key fact #${i+1}\t${pt.replace(/\t/g,' ').replace(/\n/g,'<br>')}\tMoleBio::${lesson.eyebrow.replace(/[& ]/g,'_')}\n`;
    });
    // Card from highlight
    if(lesson.highlight){
      csv+=`${lesson.title} — ${lesson.highlight.label}\t${lesson.highlight.text.replace(/\t/g,' ').replace(/\n/g,'<br>')}\tMoleBio::${lesson.eyebrow.replace(/[& ]/g,'_')}\n`;
    }
    // Curated quiz questions
    const quizQs=CURATED_QUIZZES[key];
    if(quizQs){
      quizQs.forEach(q=>{
        csv+=`${q.q}\t${q.answer}\tMoleBio::${lesson.eyebrow.replace(/[& ]/g,'_')}::Practice\n`;
      });
    }
  });

  // Download as file
  const blob=new Blob([csv],{type:'text/tab-separated-values'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='MoleBio_Anki_Deck.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  else{
    showHomePage();
    showLandingPage();
  }
  // Only show tour if no landing page (returning user with hash)
  if(hashKey)initTour();

  // PWA: Register service worker for offline support (if available)
  if('serviceWorker' in navigator){
    try{
      // Inline service worker via blob URL for single-file deployment
      const swCode=`
        const CACHE='molebio-v1';
        const ASSETS=[self.location.href.replace(/sw\\.js.*/,'')];
        self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
        self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
        self.addEventListener('fetch',e=>{
          if(e.request.method!=='GET')return;
          e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{
            if(resp.ok&&resp.type==='basic'){const c=resp.clone();caches.open(CACHE).then(cache=>cache.put(e.request,c));}
            return resp;
          }).catch(()=>caches.match(e.request))));
        });
      `;
      const blob=new Blob([swCode],{type:'application/javascript'});
      const swUrl=URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl,{scope:'.'}).catch(()=>{});
    }catch(e){/* SW not critical */}
  }
});
