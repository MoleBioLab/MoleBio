protein_misfolding:{eyebrow:'Protein Structure & Folding',title:'Protein Misfolding & Disease',intro:'When proteins fail to fold correctly, they can form toxic aggregates. Amyloidoses result from deposition of misfolded proteins into highly ordered fibrillar aggregates called amyloid.',concepts:[{label:'Amyloid',title:'Cross-beta Architecture',desc:'Beta-strands perpendicular to the fibril axis form tightly interdigitated steric zipper structures of remarkable thermodynamic stability.'},{label:'Prions',title:'Infectious Misfolding',desc:"PrPSc acts as a conformational template, converting native PrPC into the pathological beta-rich form. A protein-only infectious agent."},{label:"Alzheimer's",title:'Abeta & Tau',desc:"Amyloid-beta plaques and tau neurofibrillary tangles are the two cardinal histological hallmarks."},{label:"Parkinson's",title:'alpha-Synuclein',desc:'Lewy body inclusions of fibrillar alpha-synuclein disrupt dopaminergic neurons.'}],body:"Amyloid formation follows nucleation-elongation kinetics with a lag phase followed by rapid fiber extension. Soluble oligomeric intermediates -- not mature fibrils -- are now considered the primary toxic species.\n\nCryo-EM has transformed amyloid biology by revealing atomic structures of patient-derived fibrils. Tau fibrils from different tauopathies adopt distinct folds despite identical primary sequences.",points:['Amyloid fibrils from unrelated proteins share a common cross-beta architecture','Soluble oligomers are more acutely toxic than mature amyloid fibrils','Patient-derived cryo-EM structures revealed distinct tau fibril folds across tauopathy subtypes','Lecanemab received traditional (non-accelerated) FDA approval in 2023 as the first anti-amyloid antibody to earn full approval for Alzheimer disease'],highlight:{label:'Research Frontier',text:'The structural diversity of amyloid strains has transformed understanding of neurodegenerative disease heterogeneity. Different tau fold structures correlate with distinct clinical phenotypes, opening the door to structure-based disease subtyping and personalized diagnosis.'},viewerType:'3d_viewer',structures:[{pdb:'1HJN',name:'Prion Protein (PrP)',desc:'Human prion with helices and beta-sheet',color:'#ef4444'},{pdb:'1UBQ',name:'Ubiquitin (native)',desc:'Stable native fold for contrast',color:'#f59e0b'}]},
dna_helicase:{eyebrow:'DNA Replication & Transcription',title:'DNA Helicase',intro:'Before DNA can be replicated or transcribed, its two strands must be separated. DNA helicases are ATP-driven motor proteins that unwind the double helix, generating single-stranded templates for polymerases.',concepts:[{label:'Mechanism',title:'ATP-driven Translocation',desc:'ATP binding and hydrolysis drive conformational changes that translocate helicase along DNA, breaking hydrogen bonds.'},{label:'Directionality',title:"3' to 5' or 5' to 3'",desc:"Helicases are unidirectional. E. coli DnaB moves 5' to 3' on the lagging-strand template."},{label:'Architecture',title:'Hexameric Ring',desc:'Most replicative helicases form toroidal hexamers that encircle and thread single-stranded DNA through their central pore.'},{label:'SSB',title:'Strand Stabilization',desc:'Single-strand binding proteins coat separated strands, preventing reannealing and protecting from nucleases.'}],body:"E. coli DnaB forms a hexameric ring and translocates along ssDNA advancing ~1 bp per ATP hydrolysis and unwinding ~1000 bp/sec at 37C.\n\nIn eukaryotes, the MCM2-7 heterohexamer is the replicative helicase, activated as part of the CMG complex. Origin licensing ensures each locus is replicated exactly once per cell cycle.",points:['DnaB unwinds ~1000 bp/sec in E. coli; eukaryotic CMG ~500-700 bp/sec','Topoisomerases relieve supercoiling tension ahead of the replication fork','MCM2-7 is loaded as an inactive double hexamer; activated in S phase by Cdc45 and GINS','Helicase loading and activation are deliberately separated to prevent re-replication'],highlight:{label:'Cancer Connection',text:'MCM proteins are among the most reliable markers of proliferating cells in pathology. Cancer cells often over-license origins, creating an MCM dependency that may be therapeutically exploitable.'},pdbStructures:[{pdb:'4ESV',name:'DnaB Helicase',desc:'Hexameric replicative helicase',color:'#3b82f6'}],viewerType:'dna_animator',dnaAnimKey:'replication'},
dna_polymerase:{eyebrow:'DNA Replication & Transcription',title:'DNA Polymerase',intro:"DNA polymerases synthesize new DNA strands with extraordinary fidelity -- below one error per billion bases. They extend a primer in the 5' to 3' direction via two-metal-ion phosphoryl transfer chemistry.",concepts:[{label:'Active Site',title:'Palm, Fingers, Thumb',desc:'The right-hand-shaped fold grips the template/primer duplex, positions incoming dNTPs, and catalyzes nucleotidyl transfer.'},{label:'Fidelity',title:'Induced Fit',desc:'Correct Watson-Crick pairing triggers finger-domain closure; mismatches are geometrically excluded. ~10^7 selectivity.'},{label:"3' Exo",title:'Proofreading',desc:'A separate active site excises misincorporated nucleotides, reducing errors ~100-fold.'},{label:'Clamp',title:'Sliding Clamp',desc:'The beta-clamp (PCNA in eukaryotes) encircles DNA and tethers polymerase for high processivity (>50,000 nt).'}],body:"The catalytic mechanism uses two Mg2+ ions to coordinate the alpha-phosphate of the incoming dNTP and the 3'-OH of the primer, lowering activation energy for nucleophilic attack.\n\nThe sliding clamp increases processivity from ~10 nt to >50,000 nt per binding event. The right-hand palm-fingers-thumb fold is conserved across all known DNA polymerase families.",points:['DNA Pol III: ~1 error per 10^7 bases before proofreading; ~1 per 10^9 after','Leading strand synthesized continuously; lagging strand produces ~1-2 kb Okazaki fragments','TLS polymerases have open active sites to replicate past DNA damage at the cost of fidelity','Nucleoside analogs (AZT, acyclovir, gemcitabine) lack the 3\'-OH for chain extension -- chain terminators'],highlight:{label:'Chemotherapy Target',text:"Nucleoside analog drugs (cytarabine, gemcitabine, acyclovir) are incorporated by DNA polymerase but lack the 3'-OH for chain extension, causing termination. This selectivity for replicating cells or viruses underlies their therapeutic utility."},pdbStructures:[{pdb:'1AXC',name:'PCNA',desc:'Sliding clamp — processivity factor',color:'#3b82f6'}],viewerType:'dna_animator',dnaAnimKey:'replication'},
dna_rnapol:{eyebrow:'DNA Replication & Transcription',title:'RNA Polymerase',intro:'RNA polymerase transcribes DNA into RNA -- the critical first step of gene expression. Unlike DNA polymerase, RNAP requires no primer and can melt the DNA duplex at promoters to initiate synthesis.',concepts:[{label:'Initiation',title:'Promoter Recognition',desc:'sigma factor (bacteria) or general transcription factors (eukaryotes) direct RNAP to the promoter and facilitate open complex formation.'},{label:'Elongation',title:'Transcription Bubble',desc:"RNAP maintains a ~14 bp melted bubble, synthesizing RNA in the 5' to 3' direction."},{label:'Termination',title:'Two Mechanisms',desc:'Intrinsic termination uses RNA hairpin formation; Rho-dependent termination requires the Rho translocase helicase.'},{label:'Eukaryotes',title:'Three Polymerases',desc:'Pol I transcribes rRNA; Pol II mRNA and most ncRNA; Pol III tRNA, 5S rRNA, and other small RNAs.'}],body:"E. coli RNAP holoenzyme recognizes -10 (TATAAT) and -35 (TTGACA) elements via sigma-70. Open complex formation melts ~14 bp around the transcription start site.\n\nEukaryotic RNAP II has a CTD with 52 heptapeptide repeats. Ser5 phosphorylation marks initiation; Ser2 marks elongation, recruiting co-transcriptional capping, splicing, and polyadenylation machinery.",points:['E. coli RNAP synthesizes ~50 nt/sec; human RNAP II ~25-30 nt/sec in vivo','CTD Ser2/Ser5 phosphorylation code coordinates all stages of mRNA biogenesis','TFIID containing TBP recognizes the TATA box and nucleates PIC assembly','Rifampicin blocks bacterial RNAP by occupying the RNA exit channel -- basis of its antibiotic selectivity'],highlight:{label:'Antibiotic Target',text:"Rifampicin blocks bacterial RNAP by occupying the RNA exit channel, preventing synthesis beyond 2-3 nt. Eukaryotic RNAP II has a structurally distinct channel -- the basis of rifampicin's selective toxicity against bacteria."},pdbStructures:[{pdb:'1I6H',name:'RNA Pol II',desc:'Yeast RNA polymerase II',color:'#3b82f6'},{pdb:'4G7H',name:'Bacterial RNAP',desc:'T. thermophilus RNA polymerase',color:'#10b981'}],viewerType:'dna_animator',dnaAnimKey:'transcription'},
dna_rna_processing:{eyebrow:'DNA, RNA & Gene Expression',title:'RNA Processing & Splicing',intro:'In eukaryotes, the primary transcript (pre-mRNA) undergoes extensive processing before export as mature mRNA: 5\u2032 capping, splicing to remove introns, and 3\u2032 polyadenylation. These steps are coupled to transcription via the RNAP II CTD and are essential for mRNA stability, export, and translation.',concepts:[{label:'5\u2032 Cap',title:'7-methylguanosine',desc:'A 5\u2032-5\u2032 triphosphate-linked m7G cap is added co-transcriptionally. It protects from 5\u2032 exonucleases, recruits eIF4E for translation initiation, and promotes splicing of the first intron.'},{label:'Splicing',title:'Spliceosome (U snRNPs)',desc:'The spliceosome (U1, U2, U4/U6, U5 snRNPs + ~150 proteins) removes introns via two transesterification reactions, joining exons precisely. Alternative splicing generates protein diversity.'},{label:'3\u2032 Poly-A',title:'Cleavage + Polyadenylation',desc:'CPSF recognizes the AAUAAA signal, CstF binds the downstream GU-rich element. Cleavage occurs ~20 nt downstream, then poly(A) polymerase adds 200-250 adenines.'},{label:'Alternative Splicing',title:'Proteome Expansion',desc:'~95% of multi-exon human genes undergo alternative splicing. Exon skipping, alternative 5\u2032/3\u2032 splice sites, and intron retention generate multiple mRNAs from one gene.'}],body:"The three processing steps are co-transcriptional: they occur while RNAP II is still elongating, recruited by phosphorylation marks on the CTD. Ser5-P recruits capping enzymes; Ser2-P recruits splicing and polyadenylation factors.\n\nThe spliceosome is an RNA enzyme (ribozyme). U6 snRNA catalyzes both transesterification reactions. The two-step mechanism: (1) the 2\u2032-OH of a branch-point adenosine attacks the 5\u2032 splice site, forming a lariat intermediate; (2) the free 3\u2032-OH of the upstream exon attacks the 3\u2032 splice site, joining the exons and releasing the lariat intron.\n\nSplicing mutations account for ~15% of all disease-causing mutations in humans. Drugs targeting splicing include nusinersen (Spinraza) for spinal muscular atrophy, which redirects SMN2 splicing to include exon 7.",points:['The spliceosome contains 5 snRNPs (U1, U2, U4, U5, U6) and ~150 associated proteins','Branch point: conserved adenosine (typically 20-50 nt upstream of the 3\u2032 splice site)','GT-AG rule: ~99% of introns begin with GU and end with AG (U2-type introns)','~95% of human multi-exon genes are alternatively spliced; brain has the most alternative splicing','Nusinersen (Spinraza): antisense oligonucleotide that modifies SMN2 splicing for SMA treatment'],highlight:{label:'Clinical Impact',text:'Splicing defects cause numerous diseases: beta-thalassemia (beta-globin splice site mutations), retinitis pigmentosa (PRPF mutations), and familial dysautonomia (IKBKAP exon 20 skipping). Antisense oligonucleotides (ASOs) and small molecules that correct aberrant splicing represent a growing class of precision therapeutics. The Drosophila DSCAM gene can produce 38,016 mRNA variants through alternative splicing -- more than twice the number of genes in the fly genome.'},pdbStructures:[{pdb:'6EXN',name:'Spliceosome',desc:'Activated spliceosome complex',color:'#8b5cf6'}],viewerType:'signaling_animator',signalingKey:'rna_processing'},
dna_ribosome:{eyebrow:'DNA Replication & Transcription',title:'The Ribosome',intro:'The ribosome is the universal molecular machine for protein synthesis -- a massive RNA-protein complex that decodes mRNA into polypeptide chains. Its active site is composed entirely of RNA, establishing it as a ribozyme.',concepts:[{label:'Architecture',title:'Small & Large Subunits',desc:'70S (bacteria) or 80S (eukaryotes). The small subunit (30S/40S) handles decoding; the large subunit (50S/60S) catalyzes peptide bond formation.'},{label:'tRNA Sites',title:'A, P, E Sites',desc:'Aminoacyl-tRNA enters at A; peptidyl-tRNA is at P (site of peptide bond formation); deacylated tRNA exits at E.'},{label:'Peptide Bond',title:'Ribozyme Active Site',desc:'The peptidyl transferase center (PTC) is composed entirely of rRNA -- the ribosome is a ribozyme.'},{label:'Elongation',title:'EF-Tu & EF-G',desc:'EF-Tu delivers aa-tRNA (GTP-dependent); EF-G drives translocation. Each elongation cycle takes ~50 ms at 37C.'}],body:"The ribosome is a massive molecular machine: the bacterial 70S ribosome contains ~4,500 nucleotides of rRNA and ~55 proteins, totaling ~2.5 MDa. The small subunit (30S) is responsible for decoding — matching each mRNA codon to the correct aminoacyl-tRNA anticodon. The large subunit (50S) catalyzes peptide bond formation at the peptidyl transferase center (PTC), which is composed entirely of rRNA, establishing the ribosome as a ribozyme.\n\nTranslation elongation is a three-step cycle repeated for every amino acid added: (1) Accommodation — EF-Tu delivers aminoacyl-tRNA to the A-site in a GTP-dependent step with kinetic proofreading, (2) Peptidyl transfer — the alpha-amino group of the A-site amino acid attacks the ester bond of the P-site peptidyl-tRNA, and (3) Translocation — EF-G hydrolyzes GTP to shift the ribosome one codon downstream, moving tRNAs from A→P and P→E sites.",points:['The PTC is a ribozyme: rRNA alone catalyzes peptide bond formation','Kinetic proofreading by EF-Tu achieves ~10^-4 misincorporation rate per codon','The large subunit exit tunnel (~100 A long) actively responds to nascent peptide sequences','Antibiotics targeting the ribosome: erythromycin (exit tunnel), tetracycline (A-site), linezolid (PTC)'],highlight:{label:'Structural Insights',text:'Atomic-resolution crystal structures of both ribosomal subunits revealed how the ribosome achieves accurate decoding, catalyzes peptide bond formation through its rRNA active site, and is targeted by clinically important antibiotics. These structures showed definitively that the ribosome is a ribozyme — protein synthesis is fundamentally an RNA-catalyzed process.'},pdbStructures:[{pdb:'4YBB',name:'30S Subunit',desc:'Small ribosomal subunit',color:'#3b82f6'},{pdb:'4V9D',name:'50S Subunit',desc:'Large ribosomal subunit',color:'#10b981'}],viewerType:'dna_animator',dnaAnimKey:'translation'},
dna_codontable:{eyebrow:'DNA Replication & Transcription',title:'Codon Table & Translator',intro:'The genetic code maps each of the 64 possible three-nucleotide codons to one of 20 amino acids or a stop signal. It is nearly universal, degenerate (redundant), and non-overlapping. Use the interactive translator to decode any mRNA sequence.',concepts:[{label:'Degeneracy',title:'Multiple Codons per AA',desc:'Most amino acids are encoded by 2-6 codons. Wobble pairing at the 3rd position allows a single tRNA to read multiple synonymous codons.'},{label:'Start Codon',title:'AUG = Methionine',desc:'AUG serves as both the start codon (initiating translation) and the internal Met codon. In bacteria, the first AUG is formyl-methionine.'},{label:'Stop Codons',title:'UAA, UAG, UGA',desc:'Stop codons are recognized by release factors (RF1/RF2), not tRNAs. UAA (ochre), UAG (amber), UGA (opal). UGA also encodes selenocysteine in specific contexts.'},{label:'Wobble',title:'3rd Position Flexibility',desc:"Crick's wobble hypothesis: non-standard base pairing at the 3rd codon position allows inosine in the anticodon to pair with U, C, or A."}],body:"The genetic code was cracked in the 1960s using synthetic polynucleotides in cell-free translation systems. The first codon assignment — UUU = phenylalanine — came from translating poly-U RNA and finding that it produced only polyphenylalanine. Subsequent experiments with mixed-composition polynucleotides and triplet-binding assays systematically assigned all 64 codons.\n\nThe code is nearly universal but exceptions exist: mitochondria use UGA for Trp instead of stop; some organisms use UAG or UGA for pyrrolysine or selenocysteine. These reassignments evolved in small genomes where codon usage was already biased.",points:['64 codons: 61 sense codons + 3 stop codons','The code is degenerate: 18 of 20 amino acids have more than one codon (Met and Trp are the exceptions)','Third-position wobble reduces the minimum number of tRNAs needed from 61 to ~45','Codon usage bias affects translation speed and protein folding -- rare codons can slow ribosomes at specific positions'],highlight:{label:'Synthetic Biology',text:'Genetic code expansion enables incorporation of non-natural amino acids via engineered tRNA/synthetase pairs that read reassigned stop codons (typically UAG). Over 200 non-natural amino acids have been site-specifically incorporated into proteins for research and therapeutic applications.'},viewerType:'codon_translator'},
dna_crispr:{eyebrow:'DNA Replication & Transcription',title:'CRISPR-Cas9 Mechanism',intro:'CRISPR-Cas9 is an adaptive immune system from bacteria repurposed as a revolutionary genome editing tool. A guide RNA (sgRNA) directs the Cas9 endonuclease to a specific DNA sequence, where it creates a double-strand break that can be repaired by NHEJ (creating knockouts) or HDR (inserting specific changes).',concepts:[{label:'Cas9',title:'RNA-guided Endonuclease',desc:'Cas9 has two nuclease domains: RuvC (cuts non-target strand) and HNH (cuts target strand complementary to sgRNA). Both must be active for DSB.'},{label:'sgRNA',title:'Single Guide RNA',desc:'Engineered fusion of crRNA (20-nt target-specific) + tracrRNA (Cas9-binding scaffold). The 20-nt spacer determines target specificity.'},{label:'PAM',title:'Protospacer Adjacent Motif',desc:'5\'-NGG-3\' (for SpCas9) immediately downstream of the target on the non-target strand. Required for Cas9 binding — distinguishes self from non-self.'},{label:'DSB Repair',title:'NHEJ vs HDR',desc:'NHEJ: error-prone, creates indels → frameshifts → gene knockout. HDR: precise, uses a donor template → specific mutations or insertions. HDR only in S/G2 phase.'}],body:"Cas9 first binds DNA at PAM sites and tests for complementarity by unwinding ~12 bp. If the seed region (8-12 nt proximal to PAM) matches, R-loop formation proceeds through the full 20-nt spacer. Both nuclease domains then cleave their respective strands, creating a blunt-ended DSB 3 bp upstream of the PAM.\n\nBase editors (BE3, ABE) fuse catalytically dead dCas9 or nickase nCas9 to deaminases, enabling C→T or A→G conversions without DSBs. Prime editors (PE) fuse nCas9 to reverse transcriptase for precise insertions, deletions, and all 12 point mutations without DSBs or donor DNA.",points:['SpCas9 (S. pyogenes) recognizes 5\'-NGG-3\' PAM; SaCas9 uses 5\'-NNGRRT-3\'','Off-target effects: mismatches in the PAM-distal region (positions 1-8) are more tolerated than PAM-proximal','Cas12a (Cpf1) creates staggered cuts with 5\' overhangs and uses a shorter crRNA without tracrRNA','CRISPR-Cas9 was adapted from a natural bacterial immune system into a programmable genome editing tool by Doudna and Charpentier'],highlight:{label:'Clinical Applications',text:'The first CRISPR therapy (exagamglogene autotemcel / Casgevy) was approved in 2023 for sickle cell disease and transfusion-dependent beta-thalassemia. It edits BCL11A enhancer in patient HSCs ex vivo to reactivate fetal hemoglobin. In vivo CRISPR therapies targeting liver (transthyretin amyloidosis) and eye (Leber congenital amaurosis) are in clinical trials.'},pdbStructures:[{pdb:'4UN3',name:'Cas9',desc:'SpCas9 with sgRNA and DNA',color:'#f59e0b'},{pdb:'5B43',name:'Cas12a (Cpf1)',desc:'Cas12a endonuclease',color:'#06b6d4'}],viewerType:'dna_animator',dnaAnimKey:'crispr'},
dna_genereg:{eyebrow:'DNA Replication & Transcription',title:'Gene Regulation',intro:'Gene expression is controlled at multiple levels, from chromatin accessibility to mRNA stability. Transcription factor binding at promoters and enhancers, combined with epigenetic modifications of DNA and histones, determines which genes are expressed in each cell type.',concepts:[{label:'Promoters',title:'Core + Proximal Elements',desc:'Core promoter (~TATA box, Inr) positions RNAP II. Proximal promoter elements (GC box, CAAT box) bind ubiquitous TFs to modulate basal transcription levels.'},{label:'Enhancers',title:'Long-range Activation',desc:'Enhancers can act over >1 Mb via DNA looping mediated by cohesin and the Mediator complex. Enhancer activity is cell-type-specific.'},{label:'Epigenetics',title:'Heritable Modifications',desc:'DNA methylation (5mC at CpG) silences genes. Histone acetylation (H3K27ac) activates; H3K27me3 represses. These marks are maintained through cell division.'},{label:'Chromatin',title:'Open vs Closed',desc:'Euchromatin is transcriptionally active (loose, acetylated). Heterochromatin is silenced (condensed, methylated). Pioneer factors can open closed chromatin.'}],body:"The combinatorial control model explains how a limited number of transcription factors (~1,600 in humans) can generate thousands of distinct gene expression patterns. Each gene responds to a unique combination of activators and repressors binding its regulatory regions.\n\nEnhancer-promoter communication occurs through DNA looping, forming topologically associating domains (TADs). CTCF and cohesin establish TAD boundaries. Disruption of TAD boundaries can cause enhancer hijacking, activating oncogenes in cancer.",points:['Humans have ~1,600 transcription factors controlling ~20,000 protein-coding genes','The histone code: H3K4me3 marks active promoters, H3K27ac marks active enhancers, H3K27me3 marks Polycomb-repressed genes','CpG island methylation silences tumor suppressor genes in many cancers','Super-enhancers are clusters of enhancers that drive high-level expression of cell identity genes and oncogenes'],highlight:{label:'Therapeutic Frontier',text:'Epigenetic drugs are FDA-approved for cancer: DNMT inhibitors (azacitidine, decitabine for MDS/AML) and HDAC inhibitors (vorinostat for CTCL). BET inhibitors targeting bromodomain readers of acetylated histones are in clinical trials. These drugs reprogram aberrant gene expression without altering the DNA sequence.'},pdbStructures:[{pdb:'1TSR',name:'p53 DNA-binding',desc:'p53 tumor suppressor on DNA',color:'#ef4444'},{pdb:'1R4O',name:'Glucocorticoid Receptor',desc:'GR DNA-binding domain',color:'#3b82f6'}],viewerType:'gene_reg_viewer'},
dna_epigenetics:{eyebrow:'DNA, RNA & Gene Expression',title:'Epigenetics',intro:'Epigenetics refers to heritable changes in gene expression that do not involve alterations to the DNA sequence itself. DNA methylation, histone modifications, chromatin remodeling, and non-coding RNAs establish and maintain cell-type-specific gene expression programs that persist through cell division.',concepts:[{label:'DNA Methylation',title:'5-methylcytosine (5mC)',desc:'DNMTs add methyl groups to cytosine at CpG dinucleotides. CpG island methylation at promoters silences gene expression. DNMT1 maintains methylation after replication; DNMT3A/B establish new marks.'},{label:'Histone Code',title:'Writers, Readers, Erasers',desc:'Histone modifications (acetylation, methylation, phosphorylation, ubiquitination) are written by enzymes (HATs, HMTs), read by effector proteins (bromodomains, chromodomains), and erased by demethylases/deacetylases.'},{label:'Chromatin Remodeling',title:'SWI/SNF, ISWI, CHD, INO80',desc:'ATP-dependent chromatin remodelers slide, eject, or restructure nucleosomes to expose or occlude regulatory DNA. SWI/SNF (BAF) complex mutations occur in ~20% of all cancers.'},{label:'Non-coding RNA',title:'lncRNA, miRNA, piRNA',desc:'Long non-coding RNAs (lncRNAs) scaffold chromatin complexes (e.g., XIST for X-inactivation). miRNAs guide RISC to degrade or translationally repress target mRNAs.'}],body:"The epigenetic landscape is maintained by a balance of writers, readers, and erasers. DNA methylation is established by DNMT3A/B (de novo) and maintained by DNMT1 (recognizes hemimethylated CpG after replication). TET enzymes oxidize 5mC to 5hmC, 5fC, and 5caC, initiating active demethylation via base excision repair.\n\nHistone H3K4me3 marks active promoters; H3K27ac marks active enhancers; H3K27me3 marks Polycomb-repressed genes; H3K9me3 marks constitutive heterochromatin. Bivalent domains (H3K4me3 + H3K27me3) mark poised genes in stem cells that resolve to active or repressed upon differentiation.\n\nX-chromosome inactivation demonstrates all epigenetic mechanisms working together: XIST lncRNA coats one X chromosome, recruits Polycomb complexes (PRC2 \u2192 H3K27me3), followed by DNA methylation and chromatin compaction, silencing ~1,000 genes on the inactive X.",points:['CpG islands (~60% of human gene promoters) are normally unmethylated; aberrant methylation silences tumor suppressors','DNMT1 maintains methylation patterns after replication; DNMT3A/B establish new marks','Bivalent chromatin (H3K4me3 + H3K27me3) maintains developmental plasticity in stem cells','SWI/SNF (BAF) complex is mutated in ~20% of all cancers (SMARCB1, SMARCA4, ARID1A)','TET enzymes (TET1/2/3) oxidize 5mC to 5hmC, initiating active DNA demethylation'],highlight:{label:'Epigenetic Therapy',text:'Epigenetic drugs are transforming cancer treatment. DNMT inhibitors (azacitidine, decitabine) reactivate silenced tumor suppressors in MDS/AML. HDAC inhibitors (vorinostat, romidepsin) restore normal acetylation. EZH2 inhibitors (tazemetostat) target H3K27me3 in lymphoma. IDH inhibitors (ivosidenib, enasidenib) block the oncometabolite 2-HG that disrupts epigenetic regulation. The field is moving toward combination epigenetic therapy and epigenetic biomarkers for early cancer detection (e.g., cell-free DNA methylation patterns).'},pdbStructures:[{pdb:'4U7T',name:'DNMT3A',desc:'DNA methyltransferase 3A',color:'#8b5cf6'},{pdb:'1AOI',name:'Nucleosome',desc:'Nucleosome core particle',color:'#3b82f6'}],viewerType:'signaling_animator',signalingKey:'epigenetics'},
metabolism_glycolysis:{eyebrow:'Metabolic Pathways',title:'Glycolysis',intro:'Glycolysis is the universal pathway of glucose catabolism -- converting one glucose into two pyruvates while generating net 2 ATP and 2 NADH. Use the animator to step through each enzyme-catalyzed reaction.',concepts:[{label:'Investment phase',title:'Steps 1-5',desc:'Two ATPs consumed to phosphorylate glucose and generate two G3P molecules.'},{label:'Payoff phase',title:'Steps 6-10',desc:'Two G3P oxidized, generating 4 ATP and 2 NADH for a net gain of 2 ATP and 2 NADH per glucose.'},{label:'Regulation',title:'PFK-1 committed step',desc:'Phosphofructokinase-1 is the committed, rate-limiting step. Allosterically regulated by ATP, AMP, citrate, and F-2,6-BP.'},{label:'Warburg effect',title:'Aerobic glycolysis in cancer',desc:'Cancer cells preferentially use glycolysis even with O2 -- supporting rapid biosynthesis of nucleotides, amino acids, and lipids.'}],body:"Phosphofructokinase-1 (PFK-1) catalyzes the first committed (irreversible) step of glycolysis: the phosphorylation of fructose-6-phosphate to fructose-1,6-bisphosphate. This is the primary regulatory point of the pathway. PFK-1 is allosterically inhibited by ATP (high energy charge signals no need for more glycolysis) and citrate (abundant TCA cycle intermediates signal sufficient fuel). It is activated by AMP and ADP (low energy charge) and especially by fructose-2,6-bisphosphate (F-2,6-BP), the most potent allosteric activator. F-2,6-BP is produced by PFK-2, which is itself regulated by insulin (activates) and glucagon (inhibits via PKA phosphorylation).\n\nThe Warburg effect is not simply inefficient ATP production -- it supports rapid biosynthesis. Glycolytic intermediates feed nucleotide synthesis, amino acid synthesis, and lipid synthesis required for proliferating cells.",points:['Net yield: 2 ATP + 2 NADH + 2 pyruvate per glucose','PFK-1 is the rate-limiting committed step and primary site of glycolytic regulation','Hexokinase is product-inhibited by glucose-6-phosphate, providing local feedback control','The Warburg effect is exploited clinically: 18F-FDG PET imaging detects glucose-avid tumors'],highlight:{label:'Clinical Note',text:'Hexokinase deficiency causes non-spherocytic hemolytic anemia. Red blood cells, which lack mitochondria, are entirely dependent on glycolysis for ATP. Even partial loss of hexokinase activity impairs RBC survival.'},pdbStructures:[{pdb:'1HKG',name:'Hexokinase',desc:'Hexokinase with glucose',color:'#3b82f6'},{pdb:'4PFK',name:'PFK-1',desc:'Phosphofructokinase — committed step',color:'#ef4444'},{pdb:'1TIM',name:'TPI',desc:'Triose phosphate isomerase',color:'#10b981'}],viewerType:'pathway_animator',pathwayKey:'glycolysis'},
metabolism_pdh:{eyebrow:'Metabolic Pathways',title:'Pyruvate Dehydrogenase Complex',intro:'The pyruvate dehydrogenase complex (PDH) is a massive multi-enzyme machine that links glycolysis to the TCA cycle by oxidatively decarboxylating pyruvate to acetyl-CoA. It requires five coenzymes, is irreversibly committed, and is tightly regulated by phosphorylation.',concepts:[{label:'Reaction',title:'Pyruvate → Acetyl-CoA',desc:'Pyruvate + CoA + NAD⁺ → Acetyl-CoA + CO₂ + NADH. Irreversible oxidative decarboxylation. This is the committed step linking glycolysis to the TCA cycle.'},{label:'5 Coenzymes',title:'TPP, Lipoamide, CoA, FAD, NAD⁺',desc:'Thiamine pyrophosphate (B1), lipoic acid, coenzyme A (pantothenate/B5), FAD (riboflavin/B2), NAD⁺ (niacin/B3). A classic exam topic — remember the mnemonic: "The Lovely Coenzymes For Nerds."'},{label:'3 Enzymes',title:'E1, E2, E3',desc:'E1 (pyruvate dehydrogenase) decarboxylates pyruvate using TPP. E2 (dihydrolipoyl transacetylase) transfers the acetyl group to CoA via lipoamide. E3 (dihydrolipoyl dehydrogenase) reoxidizes lipoamide using FAD → FADH₂, then NAD⁺ → NADH.'},{label:'Regulation',title:'Phosphorylation / Dephosphorylation',desc:'PDH kinase inactivates E1 by phosphorylation (stimulated by ATP, acetyl-CoA, NADH). PDH phosphatase reactivates it (stimulated by Ca²⁺, insulin). Inhibited by products, activated by substrates.'}],body:"The PDH complex is one of the largest known multi-enzyme assemblies (~10 MDa in mammals, ~4.6 MDa in E. coli). In mammals, it contains 20-30 copies of E1, 60 copies of E2 forming an icosahedral core, and 6-12 copies of E3. The E2 core acts as a swinging-arm assembly line — the lipoamide arm swings between the active sites of all three enzymes.\n\nRegulation is critical because the reaction is irreversible: animals cannot convert acetyl-CoA back to pyruvate, so once carbon enters acetyl-CoA it cannot be used for net glucose synthesis. PDH kinase phosphorylates E1 (inactivation) when energy charge is high (ATP, acetyl-CoA, NADH all elevated). PDH phosphatase removes the phosphate (activation) in response to Ca²⁺ (muscle contraction) and insulin (fed state). Dichloroacetate (DCA) inhibits PDH kinase and has been investigated as a cancer therapeutic to force tumor cells into oxidative metabolism.\n\nB1 (thiamine) deficiency impairs PDH, α-ketoglutarate dehydrogenase, and branched-chain α-keto acid dehydrogenase — all TPP-dependent. This causes Wernicke encephalopathy (confusion, ataxia, ophthalmoplegia) and beriberi. Always give thiamine before glucose in malnourished or alcoholic patients.",points:['PDH is the irreversible link between glycolysis (cytosol) and TCA cycle (mitochondrial matrix)','5 coenzymes: TPP (B1), lipoamide, CoA (B5), FAD (B2), NAD⁺ (B3) — all vitamin-derived','PDH kinase inhibits the complex by phosphorylation; PDH phosphatase activates it','Products acetyl-CoA and NADH stimulate PDH kinase → feedback inhibition','Arsenic poisoning inhibits PDH (binds lipoamide thiol groups), blocking aerobic metabolism','Pyruvate dehydrogenase deficiency is the most common cause of congenital lactic acidosis'],highlight:{label:'Clinical Pearl',text:'In alcoholic or malnourished patients presenting with confusion, always administer IV thiamine (vitamin B1) BEFORE giving glucose. Glucose loading increases pyruvate flux through PDH, depleting already-marginal thiamine stores and precipitating acute Wernicke encephalopathy — a medical emergency that can cause permanent brain damage if untreated.'},pdbStructures:[{pdb:'3EXE',name:'PDH E1',desc:'Pyruvate dehydrogenase E1 component',color:'#3b82f6'},{pdb:'1EAA',name:'E2 core',desc:'Dihydrolipoyl transacetylase domain',color:'#10b981'}],viewerType:'signaling_animator',signalingKey:'pdh'},
metabolism_gluconeogenesis:{eyebrow:'Metabolic Pathways',title:'Gluconeogenesis',intro:'Gluconeogenesis synthesizes glucose from non-carbohydrate precursors (pyruvate, lactate, glycerol, glucogenic amino acids). It occurs primarily in the liver and kidney cortex, using four bypass reactions to circumvent the three irreversible steps of glycolysis.',concepts:[{label:'Bypass Reactions',title:'4 Unique Enzymes',desc:'Pyruvate carboxylase, PEPCK, fructose-1,6-bisphosphatase, and glucose-6-phosphatase replace the irreversible glycolytic enzymes (pyruvate kinase, PFK-1, hexokinase).'},{label:'Precursors',title:'Lactate, Amino Acids, Glycerol',desc:'Lactate (Cori cycle from muscle), alanine (glucose-alanine cycle), and glycerol (from TAG lipolysis in adipose) are the major gluconeogenic substrates.'},{label:'Regulation',title:'Reciprocal with Glycolysis',desc:'F-2,6-BP activates PFK-1 (glycolysis) and inhibits F-1,6-BPase (gluconeogenesis). Glucagon lowers F-2,6-BP via PKA phosphorylation of PFK-2/FBPase-2.'},{label:'Energetics',title:'Costs 6 ATP equivalents',desc:'2 GTP (PEPCK) + 2 ATP (pyruvate carboxylase) + 2 NADH = 6 high-energy equivalents per glucose synthesized from 2 pyruvate.'}],body:"Gluconeogenesis is not simply glycolysis in reverse. Three glycolytic reactions are thermodynamically irreversible and must be bypassed: (1) pyruvate kinase is bypassed by pyruvate carboxylase + PEPCK, (2) PFK-1 is bypassed by fructose-1,6-bisphosphatase, and (3) hexokinase/glucokinase is bypassed by glucose-6-phosphatase.\n\nThe Cori cycle (muscle lactate \u2192 liver glucose) and the glucose-alanine cycle (muscle alanine \u2192 liver glucose) are critical interorgan shuttles. During fasting and exercise, hepatic gluconeogenesis maintains blood glucose for the brain, which consumes ~120 g glucose/day.\n\nPyruvate carboxylase requires biotin and is allosterically activated by acetyl-CoA. This ensures that gluconeogenesis is stimulated when fatty acid oxidation provides abundant acetyl-CoA (e.g., during fasting), linking fat and carbohydrate metabolism.",points:['Gluconeogenesis occurs mainly in liver (~90%) and kidney cortex (~10%)','Pyruvate carboxylase is a mitochondrial enzyme; PEPCK is cytosolic (in humans)','F-2,6-BP is the master switch: high = glycolysis on, gluconeogenesis off','Metformin inhibits hepatic gluconeogenesis (Complex I inhibition \u2192 AMPK activation)','Glucose-6-phosphatase is ER-membrane-bound; its absence causes von Gierke disease (GSD I)'],highlight:{label:'Diabetes Connection',text:'Uncontrolled hepatic gluconeogenesis is a major driver of fasting hyperglycemia in type 2 diabetes. Metformin, the most prescribed diabetes drug, works in part by inhibiting Complex I, activating AMPK, and suppressing gluconeogenic gene expression. Understanding this pathway is key to understanding diabetes pharmacology.'},pdbStructures:[{pdb:'1KHB',name:'PEPCK',desc:'Phosphoenolpyruvate carboxykinase',color:'#3b82f6'},{pdb:'1FBP',name:'FBPase',desc:'Fructose-1,6-bisphosphatase',color:'#10b981'}],viewerType:'signaling_animator',signalingKey:'gluconeogenesis'},
metabolism_ppp:{eyebrow:'Metabolic Pathways',title:'Pentose Phosphate Pathway',intro:'The pentose phosphate pathway (PPP) branches from glycolysis at glucose-6-phosphate and serves two critical functions: producing NADPH for reductive biosynthesis and generating ribose-5-phosphate for nucleotide synthesis.',concepts:[{label:'Oxidative Phase',title:'NADPH Production',desc:'G6P \u2192 6-phosphogluconate \u2192 ribulose-5-phosphate, producing 2 NADPH per glucose-6-phosphate. Irreversible, committed step: glucose-6-phosphate dehydrogenase (G6PD).'},{label:'Non-oxidative Phase',title:'Sugar Interconversions',desc:'Reversible reactions (transketolase, transaldolase) interconvert C3, C4, C5, C6, and C7 sugars. Connects PPP to glycolysis via fructose-6-phosphate and glyceraldehyde-3-phosphate.'},{label:'NADPH Uses',title:'Biosynthesis & Defense',desc:'NADPH powers fatty acid synthesis, cholesterol synthesis, steroid hydroxylation, and the glutathione/thioredoxin antioxidant systems.'},{label:'G6PD Deficiency',title:'Most Common Enzymopathy',desc:'X-linked G6PD deficiency affects ~400 million people worldwide. Causes hemolytic anemia upon oxidative stress (fava beans, sulfa drugs, antimalarials) due to inability to regenerate NADPH \u2192 reduced glutathione.'}],body:"The PPP operates in two phases. The oxidative phase is irreversible and generates 2 NADPH + 1 ribulose-5-phosphate per G6P. The non-oxidative phase is reversible and interconverts sugar phosphates depending on cellular needs.\n\nCellular mode determines pathway flux: (1) Need NADPH + ribose-5-P: both phases active. (2) Need NADPH only: oxidative phase + non-oxidative phase recycles carbons back to glycolysis. (3) Need ribose-5-P only: non-oxidative phase runs in reverse from glycolytic intermediates. (4) Need NADPH + ATP: oxidative phase + G3P/F6P re-enter glycolysis.\n\nG6PD deficiency provides resistance to Plasmodium falciparum malaria, explaining its high prevalence in malaria-endemic regions -- a classic example of balanced polymorphism (similar to sickle cell trait).",points:['G6PD is the committed step of the oxidative phase; inhibited by NADPH (product inhibition)','Transketolase requires thiamine pyrophosphate (TPP / vitamin B1); deficiency causes Wernicke encephalopathy','RBCs depend entirely on the PPP for NADPH since they lack mitochondria','NADPH maintains glutathione in reduced form (GSH) via glutathione reductase','G6PD deficiency: X-linked, ~400 million affected, protective against malaria'],highlight:{label:'Clinical Pearl',text:'Before prescribing primaquine (antimalarial), dapsone, or sulfonamides, check G6PD status. These drugs generate oxidative stress that overwhelms the diminished NADPH supply in G6PD-deficient RBCs, triggering acute hemolytic anemia with Heinz bodies (denatured hemoglobin) and bite cells on peripheral smear.'},pdbStructures:[{pdb:'2BH9',name:'G6PD',desc:'Glucose-6-phosphate dehydrogenase',color:'#3b82f6'}],viewerType:'signaling_animator',signalingKey:'ppp'},
metabolism_tca:{eyebrow:'Metabolic Pathways',title:'TCA Cycle',intro:'The tricarboxylic acid (TCA) cycle is the central hub of aerobic metabolism. It oxidizes acetyl-CoA into CO2 while generating the NADH and FADH2 that power the electron transport chain.',concepts:[{label:'Entry',title:'Acetyl-CoA + OAA',desc:'Citrate synthase condenses acetyl-CoA with oxaloacetate to form citrate.'},{label:'Yield per turn',title:'3 NADH, 1 FADH2, 1 GTP',desc:'Plus 2 CO2 released; oxaloacetate regenerated for the next turn.'},{label:'Regulation',title:'Energy-sensing feedback',desc:'Citrate synthase, isocitrate DH, and alpha-KG DH are inhibited by high NADH and ATP.'},{label:'Amphibolic',title:'Biosynthesis hub',desc:'TCA intermediates feed amino acid, heme, fatty acid, and nucleotide biosynthesis (anaplerosis).'}],body:"The TCA cycle is amphibolic -- serving both catabolic and anabolic functions. Key biosynthetic branches: OAA to aspartate; alpha-KG to glutamate; succinyl-CoA to heme.\n\nIDH1/IDH2 mutations confer neomorphic activity producing R-2-hydroxyglutarate (2-HG), an oncometabolite that inhibits alpha-KG-dependent dioxygenases, driving epigenetic reprogramming.",points:['Two TCA turns per glucose give 6 NADH + 2 FADH2 + 2 GTP','All TCA reactions occur in the mitochondrial matrix','IDH1/IDH2 mutations occur in ~70-80% of lower-grade gliomas and ~20% of AML','2-HG inhibits TET2, JMJD2, and other alpha-KG-dependent enzymes, reprogramming the epigenome'],highlight:{label:'Cancer Metabolism',text:'Glutamine is the major anaplerotic substrate in most cancer cells, replenishing alpha-KG to sustain TCA flux. This glutamine addiction is a recognized therapeutic vulnerability, and glutaminase inhibitors remain an active area of clinical investigation across multiple tumor types.'},pdbStructures:[{pdb:'1CTS',name:'Citrate Synthase',desc:'Citrate synthase — first TCA enzyme',color:'#3b82f6'},{pdb:'1T0L',name:'IDH',desc:'Isocitrate dehydrogenase',color:'#f59e0b'}],viewerType:'pathway_animator',pathwayKey:'tca'},
metabolism_aa_catabolism:{eyebrow:'Metabolic Pathways',title:'Amino Acid Catabolism',intro:'When amino acids are degraded for energy or during protein turnover, their nitrogen must be removed and their carbon skeletons channeled into central metabolic pathways. This lesson covers transamination, oxidative deamination, and the fates of the 20 carbon skeletons.',concepts:[{label:'Transamination',title:'ALT & AST',desc:'Aminotransferases (transaminases) transfer the alpha-amino group to alpha-ketoglutarate, forming glutamate and a new alpha-keto acid. PLP (vitamin B6) is the essential cofactor.'},{label:'Oxidative Deamination',title:'Glutamate Dehydrogenase',desc:'Glutamate dehydrogenase in the mitochondrial matrix removes NH4+ from glutamate, regenerating alpha-KG. This is the major route for funneling nitrogen toward excretion.'},{label:'Carbon Skeletons',title:'Glucogenic vs Ketogenic',desc:'Carbon skeletons enter central metabolism at 7 points: pyruvate, acetyl-CoA, acetoacetyl-CoA, alpha-KG, succinyl-CoA, fumarate, or oxaloacetate. Leucine and lysine are purely ketogenic.'},{label:'Nitrogen Transport',title:'Glutamine & Alanine',desc:'Peripheral tissues export nitrogen to the liver via the glucose-alanine cycle (muscle → liver) and as glutamine (most tissues). The liver is the primary site of ureagenesis.'}],body:"Amino acid catabolism begins with removal of the alpha-amino group. Transamination is reversible and collects amino groups onto alpha-ketoglutarate to form glutamate -- the central nitrogen carrier. Glutamate dehydrogenase then releases free NH4+ in the mitochondrial matrix, feeding the urea cycle.\n\nThe glucose-alanine cycle is an elegant interorgan shuttle: muscle transaminates pyruvate to alanine, which travels to the liver, is transaminated back to pyruvate (for gluconeogenesis), and the nitrogen enters the urea cycle. This simultaneously exports nitrogen from muscle and recycles glucose carbon.\n\nElevated serum ALT and AST are classic clinical markers of hepatocellular damage because these aminotransferases are abundant in hepatocytes. The AST/ALT ratio (De Ritis ratio) helps distinguish different liver pathologies: ratio >2 suggests alcoholic liver disease, <1 suggests viral hepatitis.",points:['All 20 amino acids funnel nitrogen through glutamate via PLP-dependent transamination','ALT (GPT) and AST (GOT) are the two most clinically important aminotransferases','Purely ketogenic: Leu, Lys. Purely glucogenic: 14 amino acids. Both: Ile, Phe, Trp, Thr, Tyr','Branched-chain amino acids (Val, Leu, Ile) are catabolized primarily in skeletal muscle, not liver','Maple syrup urine disease results from deficiency of branched-chain alpha-keto acid dehydrogenase'],highlight:{label:'Clinical Correlation',text:'Serum aminotransferases are among the most commonly ordered lab tests in medicine. ALT is more liver-specific than AST (which is also in heart, muscle, and RBCs). A markedly elevated ALT (>1000 U/L) suggests acute hepatocellular injury from viral hepatitis, toxins (acetaminophen overdose), or ischemia.'},pdbStructures:[{pdb:'3IHJ',name:'ALT',desc:'Alanine aminotransferase',color:'#3b82f6'},{pdb:'1NR7',name:'Glutamate DH',desc:'Glutamate dehydrogenase hexamer',color:'#10b981'}],viewerType:'signaling_animator',signalingKey:'aa_catabolism'},
metabolism_urea:{eyebrow:'Metabolic Pathways',title:'Urea Cycle',intro:'The urea cycle converts toxic ammonia into urea for renal excretion. It is the only pathway for disposing of excess nitrogen in mammals. The cycle spans both the mitochondrial matrix and the cytosol, consuming 3 ATP molecules (4 high-energy phosphate bonds) per urea molecule produced.',concepts:[{label:'CPS I',title:'Rate-Limiting Step',desc:'Carbamoyl phosphate synthetase I in the mitochondrial matrix condenses NH4+ + CO2 + 2 ATP into carbamoyl phosphate. Allosterically activated by N-acetylglutamate (NAG).'},{label:'Ornithine Cycle',title:'5-Step Pathway',desc:'Carbamoyl phosphate + ornithine → citrulline → argininosuccinate → arginine → urea + ornithine. Ornithine is regenerated each turn.'},{label:'TCA Connection',title:'Aspartate-Argininosuccinate Shunt',desc:'Fumarate released from argininosuccinate re-enters the TCA cycle. Aspartate (from OAA transamination) donates the second nitrogen. The two cycles are linked.'},{label:'Energetics',title:'4 Phosphoanhydride Bonds',desc:'CPS I uses 2 ATP, argininosuccinate synthetase uses 1 ATP (cleaved to AMP + PPi, equivalent to 2 phosphoanhydride bonds). Net cost: 3 ATP molecules consumed, 4 high-energy phosphate bonds spent per urea.'}],body:"The urea cycle was the first cyclic metabolic pathway discovered (Hans Krebs and Kurt Henseleit, 1932 -- before the TCA cycle). Each urea molecule contains two nitrogen atoms: one from free NH4+ (via carbamoyl phosphate) and one from aspartate.\n\nThe urea cycle and TCA cycle are linked through the aspartate-argininosuccinate shunt. Fumarate produced by argininosuccinate lyase enters the TCA cycle, is hydrated to malate, oxidized to OAA, and then transaminated back to aspartate -- completing the connection. This means the two cycles share intermediates and are coordinately regulated.\n\nN-acetylglutamate (NAG) synthase is the master regulator: arginine activates NAG synthase, producing NAG, which allosterically activates CPS I. This feedforward mechanism ensures that urea cycle flux increases when amino acid catabolism is high.",points:['CPS I (mitochondrial, uses NH4+) is distinct from CPS II (cytosolic, uses glutamine, pyrimidine synthesis)','Urea has two nitrogens: one from NH4+ and one from aspartate','Fumarate from the urea cycle links to TCA via the aspartate-argininosuccinate shunt','Hyperammonemia from urea cycle defects causes cerebral edema and encephalopathy','OTC (ornithine transcarbamylase) deficiency is the most common urea cycle disorder (X-linked)'],highlight:{label:'Clinical Significance',text:'Urea cycle defects present with hyperammonemia, which is neurotoxic because ammonia depletes alpha-KG (via glutamate dehydrogenase reversal), starving the brain TCA cycle of this critical intermediate. Treatment includes protein restriction, nitrogen scavengers (sodium benzoate, sodium phenylbutyrate), and in severe cases liver transplantation. Newborn screening can detect several urea cycle disorders.'},pdbStructures:[{pdb:'1RLA',name:'Arginase',desc:'Arginase — final urea cycle step',color:'#8b5cf6'},{pdb:'1OTH',name:'OTC',desc:'Ornithine transcarbamylase',color:'#3b82f6'}],viewerType:'signaling_animator',signalingKey:'urea_cycle'},
metabolism_fa_oxidation:{eyebrow:'Metabolic Pathways',title:'\u03b2-Oxidation of Fatty Acids',intro:'Beta-oxidation is the catabolic pathway that breaks down fatty acids into acetyl-CoA units in the mitochondrial matrix. Each cycle removes 2 carbons, generating 1 FADH2, 1 NADH, and 1 acetyl-CoA. A single palmitate (C16) yields 106 ATP.',concepts:[{label:'Activation',title:'Acyl-CoA Synthetase',desc:'Fatty acids are activated to acyl-CoA on the outer mitochondrial membrane, consuming 2 ATP equivalents (ATP \u2192 AMP + PPi).'},{label:'Carnitine Shuttle',title:'CPT I / CPT II',desc:'Long-chain acyl-CoAs cannot cross the inner membrane directly. CPT I (outer membrane) transfers acyl to carnitine; CPT II (inner membrane) regenerates acyl-CoA inside the matrix.'},{label:'\u03b2-Oxidation Spiral',title:'4-Step Cycle',desc:'Each cycle: oxidation (FAD), hydration, oxidation (NAD+), thiolysis. Removes 2C as acetyl-CoA per turn.'},{label:'Yield',title:'~106 ATP per Palmitate',desc:'7 FADH2 + 7 NADH + 8 acetyl-CoA (each \u2192 10 ATP via TCA+ETC) = 108 ATP minus 2 for activation = 106 net.'}],body:"\u03b2-Oxidation occurs in the mitochondrial matrix and involves a repeating 4-step cycle: (1) FAD-dependent oxidation (acyl-CoA dehydrogenase), (2) hydration (enoyl-CoA hydratase), (3) NAD+-dependent oxidation (L-3-hydroxyacyl-CoA dehydrogenase), (4) thiolytic cleavage (thiolase) releasing acetyl-CoA.\n\nCPT I is the rate-limiting step and is inhibited by malonyl-CoA (the first committed intermediate of fatty acid synthesis). This ensures that synthesis and degradation do not occur simultaneously.\n\nMCAD (medium-chain acyl-CoA dehydrogenase) deficiency is the most common fatty acid oxidation disorder, affecting ~1:15,000 births.",points:['Palmitoyl-CoA (C16:0) yields 8 acetyl-CoA, 7 FADH2, 7 NADH \u2192 ~106 net ATP','CPT I is inhibited by malonyl-CoA -- the key reciprocal regulatory switch','Odd-chain fatty acids yield propionyl-CoA in the final turn \u2192 succinyl-CoA (requires B12)','MCAD deficiency: most common FAO disorder, hypoketotic hypoglycemia, newborn screening','Peroxisomal \u03b2-oxidation handles very-long-chain fatty acids (>C20); defective in X-linked adrenoleukodystrophy'],highlight:{label:'Energy Comparison',text:'Fat stores ~9 kcal/g compared to ~4 kcal/g for carbohydrate. A 70 kg person carries ~135,000 kcal as fat but only ~1,600 kcal as glycogen. This explains why \u03b2-oxidation dominates during fasting and sustained exercise.'},pdbStructures:[{pdb:'1EGC',name:'MCAD',desc:'Medium-chain acyl-CoA dehydrogenase',color:'#f59e0b'},{pdb:'2H4T',name:'CPT-II',desc:'Carnitine palmitoyltransferase II',color:'#3b82f6'}],viewerType:'signaling_animator',signalingKey:'fa_oxidation'},
metabolism_fa_synthesis:{eyebrow:'Metabolic Pathways',title:'Fatty Acid Synthesis',intro:'Fatty acid synthesis (lipogenesis) builds long-chain fatty acids from acetyl-CoA in the cytosol using NADPH as the reductant and malonyl-CoA as the 2-carbon donor, catalyzed by the multifunctional enzyme fatty acid synthase (FAS).',concepts:[{label:'ACC',title:'Committed Step',desc:'Acetyl-CoA carboxylase (ACC) converts acetyl-CoA to malonyl-CoA using biotin and CO2. Activated by citrate and insulin; inhibited by palmitoyl-CoA and AMPK.'},{label:'Citrate Shuttle',title:'Acetyl-CoA Export',desc:'Mitochondrial acetyl-CoA cannot cross the inner membrane. Citrate is exported, then cleaved by ATP-citrate lyase to regenerate cytosolic acetyl-CoA and OAA.'},{label:'FAS',title:'Fatty Acid Synthase',desc:'A homodimeric multifunctional enzyme with 7 catalytic activities + ACP domain. Builds palmitate (C16) by iterative 2-carbon additions from malonyl-CoA.'},{label:'Elongation',title:'Beyond C16',desc:'ER-bound elongases and desaturases modify palmitate. Humans cannot introduce double bonds beyond \u0394-9, making omega-3 and omega-6 essential.'}],body:"Fatty acid synthesis uses different enzymes, a different compartment (cytosol), and different chemistry (NADPH) compared to \u03b2-oxidation. The committed step is ACC.\n\nInsulin stimulates lipogenesis by activating ACC (via PP2A dephosphorylation) and inducing SREBP-1c transcription factor. Glucagon and epinephrine inhibit ACC via AMPK phosphorylation.\n\nDe novo lipogenesis is particularly active in liver and adipose tissue in the fed state, converting excess carbohydrate into fat.",points:['Palmitate synthesis: 8 acetyl-CoA + 14 NADPH + 7 ATP \u2192 1 palmitate (C16)','ACC (acetyl-CoA carboxylase) is the rate-limiting, committed step','Malonyl-CoA inhibits CPT I, preventing simultaneous synthesis and \u03b2-oxidation','SREBP-1c (insulin-activated) transcriptionally upregulates all lipogenic genes','Essential fatty acids: linoleic (18:2, \u03c9-6) and \u03b1-linolenic (18:3, \u03c9-3) must be dietary'],highlight:{label:'Drug Targets',text:'AMPK activators (metformin, exercise) inhibit ACC and reduce lipogenesis. Bempedoic acid (Nexletol), an ATP-citrate lyase inhibitor, is FDA-approved for cholesterol lowering. FAS inhibitors are in clinical trials for cancer and NASH.'},pdbStructures:[{pdb:'2VZ8',name:'FAS',desc:'Fatty acid synthase',color:'#10b981'},{pdb:'3FF8',name:'ACC',desc:'Acetyl-CoA carboxylase',color:'#f59e0b'}],viewerType:'signaling_animator',signalingKey:'fa_synthesis'},
metabolism_nucleotide_synth:{eyebrow:'Metabolic Pathways',title:'Nucleotide Synthesis',intro:'Nucleotide biosynthesis supplies the building blocks for DNA replication, RNA transcription, signaling (cAMP, cGMP), and energy transfer (ATP, GTP). Purines are built on ribose; pyrimidines are assembled as free bases first.',concepts:[{label:'De Novo Purine',title:'Built on PRPP',desc:'IMP is assembled from scratch on ribose-5-phosphate through 10 steps, using glycine, glutamine, aspartate, N10-formyl-THF, and CO2.'},{label:'De Novo Pyrimidine',title:'Ring First, Then Ribose',desc:'The pyrimidine ring (orotate) is assembled first from carbamoyl phosphate + aspartate. UMP is formed when orotate is attached to PRPP.'},{label:'Salvage Pathways',title:'Recycling Bases',desc:'HGPRT (purines) and thymidine kinase (pyrimidines) recycle free bases. HGPRT deficiency causes Lesch-Nyhan syndrome.'},{label:'Regulation',title:'Feedback Inhibition',desc:'End products (AMP, GMP, UMP, CTP) feedback-inhibit their own synthesis. IMP \u2192 AMP requires GTP; IMP \u2192 GMP requires ATP (reciprocal balance).'}],body:"Purine synthesis builds the base directly on ribose-5-phosphate (from the PPP). The 10-step pathway uses atoms from glycine (C4, C5, N7), glutamine (N3, N9), aspartate (N1), CO2 (C6), and N10-formyl-THF (C2, C8).\n\nPyrimidine synthesis differs: the ring is built first (carbamoyl phosphate + aspartate \u2192 orotate), then attached to ribose. CPS II (cytosolic, uses glutamine) provides carbamoyl phosphate.\n\nDeoxyribonucleotides are made by ribonucleotide reductase (RNR). Thymidylate synthase converts dUMP to dTMP using N5,N10-methylene-THF.",points:['Purine ring atoms: N from Gln (x2), Asp, Gly; C from CO2, Gly, N10-formyl-THF (x2)','IMP \u2192 AMP requires GTP; IMP \u2192 GMP requires ATP (reciprocal balance)','CPS II (pyrimidines, cytosol, Gln) is distinct from CPS I (urea cycle, mitochondria, NH4+)','Ribonucleotide reductase (RNR) is the sole source of deoxyribonucleotides','HGPRT deficiency \u2192 Lesch-Nyhan syndrome: hyperuricemia, self-injury, neurological dysfunction'],highlight:{label:'Chemotherapy Targets',text:'Nucleotide synthesis is the most drugged pathway in cancer therapy. Methotrexate inhibits DHFR (blocks THF). 5-FU inhibits thymidylate synthase. 6-Mercaptopurine inhibits purine synthesis. Hydroxyurea inhibits RNR. Mycophenolate inhibits IMPDH (blocks GMP, used for immunosuppression).'},pdbStructures:[{pdb:'1RX3',name:'DHFR',desc:'Dihydrofolate reductase — methotrexate target',color:'#ef4444'},{pdb:'1HZW',name:'Thymidylate Synthase',desc:'dUMP to dTMP — 5-FU target',color:'#3b82f6'}],viewerType:'signaling_animator',signalingKey:'nucleotide_synth'},
metabolism_atpsynthase:{eyebrow:'Metabolic Pathways',title:'ATP Synthase',intro:'ATP synthase (Complex V) is the molecular turbine of cellular respiration. It harnesses the proton-motive force from the electron transport chain to synthesize ATP via a rotary catalytic mechanism.',concepts:[{label:'Architecture',title:'F0F1 Assembly',desc:'F1 (soluble alpha3 beta3 gamma delta epsilon) sits atop membrane-embedded F0 (a-subunit + c-ring + b2 subunits).'},{label:'Mechanism',title:'Rotary Catalysis',desc:'Proton flow drives c-ring and gamma-subunit rotation, inducing conformational cycling in F1 beta-subunits.'},{label:'Binding Change',title:'Boyer Mechanism',desc:'Three beta-subunits cycle through Open, Loose, Tight conformations. ATP forms spontaneously in Tight conformation.'},{label:'Efficiency',title:'c-ring Stoichiometry',desc:'Human c8 ring: 8 protons per full rotation yield 3 ATP, ~2.7 H+/ATP.'}],body:"The binding change mechanism explains how gamma-subunit rotation drives ATP synthesis. As protons flow through the Fo channel down their electrochemical gradient, the c-ring rotates. The asymmetric gamma-subunit, which extends into the F1 head, forces each of the three beta-subunits through a cycle of conformational states: Open (empty, releases ATP), Loose (binds ADP + Pi loosely), and Tight (catalyzes ATP formation spontaneously). The key insight is that the energy input is not used to form the phosphoanhydride bond itself — that happens spontaneously in the Tight state — but rather to release the tightly bound ATP product.\n\nSingle-molecule experiments by Noji et al. (1997) directly visualized F1 rotation by attaching a fluorescent actin filament to the gamma-subunit -- rotating at ~100 rpm.",points:['Gamma-subunit rotates at ~100-150 revolutions/second under physiological conditions','ATP synthesis is spontaneous in the Tight conformation; energy is consumed for product release','Oligomycin blocks F0 proton channel; used in Seahorse respirometry assays','UCP1 in brown adipose tissue uncouples the proton gradient to generate heat'],highlight:{label:'Thermogenesis',text:'Brown adipose tissue expresses uncoupling protein 1 (UCP1), which dissipates the proton gradient as heat rather than driving ATP synthesis. This non-shivering thermogenesis is critical for cold adaptation in newborns and hibernating mammals.'},viewerType:'3d_viewer',structures:[{pdb:'1BMF',name:'F1-ATPase',desc:'Bovine F1 with asymmetric beta subunits',color:'#10b981'},{pdb:'5ARA',name:'F1-Fo ATP Synthase',desc:'Complete yeast mitochondrial ATP synthase',color:'#06b6d4'}]},
metabolism_etc:{eyebrow:'Metabolic Pathways',title:'Electron Transport Chain',intro:'The ETC is a series of protein complexes in the inner mitochondrial membrane that transfer electrons from NADH and FADH2 to O2, pumping protons to power ATP synthesis.',concepts:[{label:'Complex I',title:'NADH dehydrogenase',desc:'Accepts electrons from NADH, reduces ubiquinone (CoQ), pumps 4H+ per NADH. Largest ETC complex (~45 subunits).'},{label:'Complex III',title:'Cytochrome bc1',desc:'Accepts electrons from CoQH2 via the Q cycle, transfers to cytochrome c. Pumps 4H+ per 2 electrons.'},{label:'Complex IV',title:'Cytochrome c oxidase',desc:'Terminal oxidase: reduces O2 to H2O. Pumps 2H+. Target of cyanide, azide, and CO.'},{label:'Supercomplexes',title:'Respirasomes',desc:'Complexes I+III+IV assemble into respirasomes that enhance electron channeling and reduce ROS production.'}],body:"The proton-motive force (pmf) across the inner mitochondrial membrane (~-180 mV) drives ATP synthesis via Complex V. Total free energy change for glucose oxidation (~-2870 kJ/mol) supports synthesis of ~30-32 ATP.\n\nROS are unavoidable byproducts at Complexes I and III. During ischemia-reperfusion, Complex I reverse electron transport generates a burst of superoxide upon reperfusion, damaging cardiomyocytes.",points:['Total oxidative phosphorylation yield: ~30-32 ATP per glucose','Cytochrome c released from mitochondria triggers the intrinsic apoptotic pathway','Cyanide, azide, and CO inhibit Complex IV by binding the CuB-heme a3 active site','Metformin mildly inhibits Complex I, reducing ATP output and activating AMPK'],highlight:{label:'Ischemia-Reperfusion',text:'Paradoxically, blood flow restoration after a heart attack causes a burst of mitochondrial ROS via Complex I reverse electron transport. Mitochondria-targeted antioxidants (MitoQ, MitoSNO) protect cardiac tissue in experimental models.'},pdbStructures:[{pdb:'1PPJ',name:'Cytochrome bc1',desc:'Complex III — Q cycle',color:'#8b5cf6'},{pdb:'1OCC',name:'Cytochrome c Oxidase',desc:'Complex IV — terminal oxidase',color:'#06b6d4'}],viewerType:'pathway_animator',pathwayKey:'etc'},
metabolism_oxphos:{eyebrow:'Metabolic Pathways',title:'Oxidative Phosphorylation Summary',intro:'This capstone lesson traces the complete oxidation of one glucose molecule from glycolysis through pyruvate dehydrogenase, the TCA cycle, the electron transport chain, and ATP synthase. Follow the ATP accounting to understand why textbooks report ~30-32 ATP per glucose.',concepts:[{label:'Glycolysis',title:'Cytoplasm: 2 ATP + 2 NADH',desc:'Glucose → 2 pyruvate. Net 2 ATP by substrate-level phosphorylation. 2 NADH produced (worth ~3-5 ATP via shuttle).'},{label:'PDH + TCA',title:'Matrix: 2 NADH + 6 NADH + 2 FADH2 + 2 GTP',desc:'Pyruvate dehydrogenase: 2 NADH. Each TCA turn yields 3 NADH + 1 FADH2 + 1 GTP (x2 turns per glucose).'},{label:'ETC + ATP Synthase',title:'~26-28 ATP from carriers',desc:'Each NADH yields ~2.5 ATP; each FADH2 yields ~1.5 ATP. 10 NADH × 2.5 + 2 FADH2 × 1.5 = 28 ATP.'},{label:'Grand Total',title:'~30-32 ATP per glucose',desc:'2 (glycolysis) + 2 GTP (TCA) + 28 (oxidative) = 32. Glycolytic NADH shuttle cost may reduce this to 30.'}],body:"The P/O ratio (ATP per oxygen atom reduced) is a key concept: NADH enters at Complex I, yielding a P/O of ~2.5 (10 H+ pumped / ~4 H+ per ATP). FADH2 enters at Complex II, yielding P/O of ~1.5 (6 H+ pumped).\n\nThe glycolytic NADH shuttle matters: in liver and heart, the malate-aspartate shuttle transfers electrons to mitochondrial NADH (2.5 ATP). In skeletal muscle and brain, the glycerol-3-phosphate shuttle transfers to FADH2 (1.5 ATP), reducing the yield by 2 ATP per glucose.",points:['Total from 1 glucose: 10 NADH + 2 FADH2 + 4 ATP/GTP by substrate-level phosphorylation','P/O ratio: ~2.5 for NADH (via Complex I), ~1.5 for FADH2 (via Complex II)','Malate-aspartate shuttle (liver, heart): full 2.5 ATP per glycolytic NADH','Glycerol-3-phosphate shuttle (muscle, brain): only 1.5 ATP per glycolytic NADH, reducing total to ~30','Actual in vivo yield may be lower due to proton leak across the inner membrane (~20% of basal metabolic rate)'],highlight:{label:'Why ~30-32?',text:'The range 30-32 ATP reflects two biological variables: (1) which NADH shuttle is used for glycolytic NADH, and (2) the exact H+/ATP stoichiometry of ATP synthase (which depends on c-ring size — 8 subunits in humans gives ~2.7 H+ per ATP). The important point is the extraordinary efficiency: ~34% of the free energy of glucose oxidation is captured as ATP.'},pdbStructures:[{pdb:'1BMF',name:'F1-ATPase',desc:'Bovine F1 with asymmetric beta subunits',color:'#10b981'},{pdb:'1OCC',name:'Cytochrome c Oxidase',desc:'Complex IV',color:'#06b6d4'}],viewerType:'oxphos_summary'},
kinetics_mm:{eyebrow:'Enzyme Kinetics',title:'Michaelis-Menten Explorer',intro:'The Michaelis-Menten model is the foundational framework for understanding enzyme-catalyzed reactions. It describes how reaction velocity depends on substrate concentration through two key parameters: Vmax and Km.',concepts:[{label:'Vmax',title:'Maximum Velocity',desc:'The theoretical maximum rate when all enzyme active sites are saturated with substrate. Proportional to total enzyme concentration: Vmax = kcat × [E]total.'},{label:'Km',title:'Michaelis Constant',desc:'The substrate concentration at which v = Vmax/2. A measure of substrate affinity: low Km = high affinity (enzyme reaches half-max velocity at low [S]).'},{label:'kcat',title:'Turnover Number',desc:'The number of substrate molecules converted to product per enzyme molecule per second at saturation. kcat = Vmax / [E]total.'},{label:'kcat/Km',title:'Catalytic Efficiency',desc:'The second-order rate constant for the enzyme-substrate encounter. The upper limit (~10⁸–10⁹ M⁻¹s⁻¹) is set by diffusion -- the catalytic perfection limit.'}],body:"The Michaelis-Menten equation v = Vmax·[S]/(Km + [S]) is derived under the steady-state assumption: d[ES]/dt ≈ 0. This assumes [S] >> [E] and that the ES complex forms and breaks down at equal rates.\n\nThe Lineweaver-Burk double-reciprocal plot (1/v vs 1/[S]) linearizes the equation: 1/v = (Km/Vmax)·(1/[S]) + 1/Vmax. While useful for visualizing inhibition patterns, it distorts errors at low [S] and has been superseded by nonlinear regression in modern enzymology.",points:['At [S] << Km, the reaction is first-order in [S]: v ≈ (Vmax/Km)·[S]','At [S] >> Km, the reaction is zero-order: v ≈ Vmax (enzyme saturated)','Triose phosphate isomerase (TPI) operates near the diffusion limit: kcat/Km ≈ 2×10⁸ M⁻¹s⁻¹','Km is NOT a dissociation constant unless k2 << k-1 (rapid equilibrium assumption)'],highlight:{label:'Key Distinction',text:'Km = (k-1 + kcat)/k1, not simply Kd. Km equals the dissociation constant Kd only when kcat << k-1 (the rapid equilibrium assumption). For many enzymes, kcat is significant and Km overestimates Kd. This distinction matters when interpreting drug-target binding.'},pdbStructures:[{pdb:'1TIM',name:'TPI',desc:'Triose phosphate isomerase — near-perfect enzyme',color:'#3b82f6'},{pdb:'1HKG',name:'Hexokinase',desc:'Hexokinase with glucose bound',color:'#10b981'}],viewerType:'kinetics_explorer'},
kinetics_inhibition:{eyebrow:'Enzyme Kinetics',title:'Enzyme Inhibition',intro:'Inhibitors reduce enzyme activity through distinct mechanisms that produce characteristic changes in Km and Vmax. Understanding these patterns is essential for pharmacology and drug design.',concepts:[{label:'Competitive',title:'Competes for Active Site',desc:'Binds the free enzyme active site, competing with substrate. Increases apparent Km but Vmax is unchanged (can be overcome by excess substrate).'},{label:'Uncompetitive',title:'Binds ES Complex Only',desc:'Binds only the enzyme-substrate complex, not free enzyme. Decreases both apparent Km and Vmax by the same factor.'},{label:'Noncompetitive',title:'Binds E and ES Equally',desc:'Binds an allosteric site on both free enzyme and ES complex with equal affinity. Decreases Vmax but Km is unchanged.'},{label:'Mixed',title:'Binds E and ES Differently',desc:'Binds both E and ES but with different affinities. Changes both Km and Vmax. Most real inhibitors show mixed inhibition.'}],body:"On a Lineweaver-Burk plot, each inhibition type produces a diagnostic pattern: competitive inhibitors change the slope but share the y-intercept; uncompetitive inhibitors produce parallel lines; noncompetitive inhibitors share the x-intercept.\n\nMost clinically important enzyme inhibitors are competitive. Statins competitively inhibit HMG-CoA reductase (Km for HMG-CoA ~4 μM; atorvastatin Ki ~8 nM). Methotrexate is a competitive inhibitor of dihydrofolate reductase with Ki ~5 pM.",points:['Competitive: apparent Km increases by factor (1 + [I]/Ki); Vmax unchanged','Uncompetitive: both apparent Km and Vmax decrease by factor (1 + [I]/Ki\')','Noncompetitive: Vmax decreases by (1 + [I]/Ki); Km unchanged','Statins (competitive HMG-CoA reductase inhibitors) are the most prescribed drug class worldwide'],highlight:{label:'Drug Design',text:'Transition-state analogs are among the most potent competitive inhibitors. They mimic the geometry of the reaction transition state, binding 10³–10⁶ times tighter than substrate. Examples: oseltamivir (Tamiflu) for neuraminidase, protease inhibitors for HIV.'},pdbStructures:[{pdb:'1HW9',name:'HMG-CoA Reductase',desc:'Statin bound to HMG-CoA reductase',color:'#3b82f6'},{pdb:'1RX3',name:'DHFR + Methotrexate',desc:'Dihydrofolate reductase with methotrexate',color:'#ef4444'}],viewerType:'kinetics_explorer'},
kinetics_allostery:{eyebrow:'Enzyme Kinetics',title:'Allostery & Cooperativity',intro:'Many enzymes do not follow simple Michaelis-Menten kinetics. Allosteric enzymes have multiple subunits where substrate binding at one site influences binding at other sites, producing sigmoidal kinetics.',concepts:[{label:'Cooperativity',title:'Sigmoidal Curves',desc:'Positive cooperativity produces a sigmoidal v vs [S] curve. The Hill coefficient (n) measures cooperativity: n > 1 positive, n = 1 none, n < 1 negative.'},{label:'Hill Equation',title:'v = Vmax·[S]ⁿ/(K₀.₅ⁿ+[S]ⁿ)',desc:'The Hill equation models cooperative binding. K₀.₅ replaces Km as the [S] at half-maximal velocity. n is the Hill coefficient.'},{label:'T and R States',title:'MWC Model',desc:'The Monod-Wyman-Changeux model: enzyme exists in tense (T, low affinity) and relaxed (R, high affinity) conformational states in equilibrium.'},{label:'Effectors',title:'Allosteric Regulators',desc:'Allosteric activators stabilize the R state; inhibitors stabilize the T state. This enables ultrasensitive switch-like regulation.'}],body:"The MWC (concerted) model proposes that all subunits switch conformations simultaneously between T and R states. The KNF (sequential) model allows individual subunits to change independently. Reality is usually somewhere between.\n\nThe sigmoidal response curve of allosteric enzymes enables ultrasensitive regulation. PFK-1 is a classic example: its sigmoidal response to fructose-6-phosphate, combined with allosteric activation by AMP and inhibition by ATP, creates a metabolic switch at the committed step of glycolysis.",points:['Hemoglobin (Hill coefficient n ≈ 2.8) is the classic example of positive cooperativity','ATCase (aspartate transcarbamoylase) is the textbook allosteric enzyme: CTP inhibits, ATP activates','The Hill coefficient indicates cooperativity but does NOT equal the number of binding sites','PFK-1 integrates energy charge, citrate, and hormonal signals via allosteric regulation'],highlight:{label:'Systems Biology',text:'Ultrasensitivity from cooperative enzymes is a building block of biological switches. Combined with positive feedback loops, sigmoidal enzyme responses generate bistability -- enabling cell fate decisions like apoptosis commitment and cell cycle entry that must be all-or-nothing.'},pdbStructures:[{pdb:'1D09',name:'ATCase',desc:'Aspartate transcarbamoylase — classic allosteric enzyme',color:'#8b5cf6'},{pdb:'4HHB',name:'Hemoglobin',desc:'Deoxy hemoglobin tetramer',color:'#3b82f6'}],viewerType:'kinetics_explorer'},
membrane_lipids:{eyebrow:'Lipids & Membranes',title:'Lipid Structures',intro:'Membrane lipids are amphipathic molecules with a hydrophilic head group and hydrophobic fatty acid tails. The three major classes — glycerophospholipids, sphingolipids, and cholesterol — each contribute distinct properties to biological membranes.',concepts:[{label:'Phospholipids',title:'Glycerophospholipids',desc:'Glycerol backbone esterified with two fatty acids and a phosphorylated head group (PC, PE, PS, PI). The most abundant membrane lipids.'},{label:'Sphingolipids',title:'Ceramide-based',desc:'Sphingosine backbone with one fatty acid (ceramide). Sphingomyelin has a phosphocholine head; glycosphingolipids have sugar heads. Enriched in lipid rafts.'},{label:'Cholesterol',title:'Sterol Ring System',desc:'Rigid planar steroid ring intercalates between fatty acid tails, modulating fluidity: reduces it at high temperature, prevents crystallization at low temperature.'},{label:'Fatty Acids',title:'Saturated vs Unsaturated',desc:'Saturated tails pack tightly (higher Tm). cis-Unsaturated tails introduce kinks that reduce packing and lower Tm. Most membrane lipids have one saturated + one unsaturated tail.'}],body:"Glycerophospholipids are named by their head group: phosphatidylcholine (PC, ~50% of most membranes), phosphatidylethanolamine (PE), phosphatidylserine (PS, inner leaflet — its exposure on the outer leaflet signals apoptosis), and phosphatidylinositol (PI, signaling via PIP2/PIP3).\n\nCholesterol constitutes ~25-30% of animal plasma membrane lipids. Its OH group hydrogen-bonds with the ester carbonyl of phospholipids, while its rigid ring system restricts the first few carbons of the fatty acid tails, creating the liquid-ordered phase characteristic of lipid rafts.",points:['PC is the most abundant membrane phospholipid in mammalian cells (~50%)','PS exposure on the outer leaflet is an eat-me signal recognized by macrophages during apoptosis','Cholesterol is absent from bacterial membranes — basis for polyene antifungal selectivity (amphotericin B)','Lipid rafts enriched in cholesterol and sphingolipids serve as signaling platforms'],highlight:{label:'Clinical Relevance',text:'Statins inhibit HMG-CoA reductase, the rate-limiting enzyme of cholesterol biosynthesis. Niemann-Pick disease (sphingomyelin accumulation) and Gaucher disease (glucocerebroside accumulation) are sphingolipid storage diseases caused by lysosomal enzyme deficiencies.'},viewerType:'membrane_viewer',membraneKey:'lipids'},
membrane_bilayer:{eyebrow:'Lipids & Membranes',title:'Membrane Architecture',intro:'The fluid mosaic model describes biological membranes as a two-dimensional fluid of lipids in which proteins are embedded. Lipid asymmetry, lateral heterogeneity (rafts), and protein crowding create a far more complex structure than a simple lipid sea.',concepts:[{label:'Fluid Mosaic',title:'Singer-Nicolson Model',desc:'Integral proteins span the bilayer; peripheral proteins associate with the surface. Lipids and most proteins diffuse laterally but rarely flip between leaflets.'},{label:'Asymmetry',title:'Leaflet Composition',desc:'Outer leaflet: PC, sphingomyelin, glycolipids. Inner leaflet: PE, PS, PI. Maintained by flippases (ATP-dependent) and scramblases.'},{label:'Lipid Rafts',title:'Liquid-ordered Domains',desc:'Cholesterol + sphingolipid-enriched microdomains that concentrate signaling proteins (GPI-anchored proteins, Src kinases).'},{label:'Protein Crowding',title:'~50% Protein by Mass',desc:'Membranes are far more crowded with protein than textbook diagrams suggest. Typical plasma membrane: ~50% protein, ~50% lipid by mass.'}],body:"The lipid bilayer is approximately 5-8 nm thick. Integral membrane proteins contain transmembrane alpha-helices (single-pass or multi-pass) or beta-barrels (porins). The hydrophobic effect drives their insertion and retention.\n\nFRAP experiments demonstrated lateral diffusion of lipids (~1-2 um/s) and proteins (~0.01-0.1 um/s). Transverse diffusion (flip-flop) is extremely slow without enzyme assistance (half-life ~ hours to days).",points:['Bilayer thickness: ~5-8 nm depending on lipid composition and cholesterol content','Lateral diffusion of lipids: ~10^7 movements per second; flip-flop: once per hours without flippases','GPI-anchored proteins are attached to the outer leaflet via glycosylphosphatidylinositol anchors','Caveolae and clathrin-coated pits are specialized membrane invaginations for endocytosis'],highlight:{label:'Membrane Biology',text:'The discovery that PS exposure on the outer leaflet marks apoptotic cells for phagocytosis was a landmark in cell biology. Annexin V, which binds PS, is now widely used to detect apoptosis in research and clinical flow cytometry.'},pdbStructures:[{pdb:'1J4N',name:'Aquaporin-1',desc:'Water channel — transmembrane alpha-helices',color:'#06b6d4'},{pdb:'1C3W',name:'Bacteriorhodopsin',desc:'7-TM light-driven proton pump',color:'#8b5cf6'}],viewerType:'membrane_viewer',membraneKey:'bilayer'},
membrane_transport:{eyebrow:'Lipids & Membranes',title:'Membrane Transport',intro:'Biological membranes are selectively permeable barriers. Small nonpolar molecules diffuse freely, but ions, polar molecules, and macromolecules require specialized transport proteins — channels, carriers, and pumps.',concepts:[{label:'Passive',title:'Down the Gradient',desc:'Simple diffusion (O2, CO2, steroid hormones) and facilitated diffusion (glucose via GLUT, ions via channels) require no energy input.'},{label:'Active',title:'Against the Gradient',desc:'Primary active transport uses ATP directly (Na+/K+-ATPase). Secondary active transport couples to an existing ion gradient (SGLT, Na+/glucose symporter).'},{label:'Channels',title:'Gated Pores',desc:'Ion channels provide rapid, selective, gated conductance. Voltage-gated (Na+, K+, Ca2+), ligand-gated (nAChR), and mechanosensitive channels.'},{label:'Pumps',title:'ATPase Transporters',desc:'P-type ATPases (Na+/K+, Ca2+, H+/K+) undergo conformational cycling between E1 and E2 states during each transport cycle.'}],body:"The Na+/K+-ATPase is a P-type ATPase that undergoes a conformational cycle between two major states: E1 (cytoplasm-facing, high Na+ affinity) and E2 (extracellular-facing, high K+ affinity). In each cycle, it pumps 3 Na+ out and 2 K+ in at the cost of one ATP. This electrogenic transport creates a net positive charge export, contributing to the resting membrane potential (~-70 mV). The resulting Na+ gradient powers secondary active transport of glucose (via SGLT), amino acids, and other solutes. In neurons, the Na+/K+-ATPase consumes ~25% of total cellular ATP to restore ion gradients after action potentials.\n\nGlucose enters most cells via facilitated diffusion through GLUT transporters (GLUT1-4). GLUT4 is insulin-regulated: insulin triggers GLUT4 vesicle fusion with the plasma membrane in muscle and adipose tissue.",points:['Na+/K+-ATPase: 3 Na+ out, 2 K+ in per ATP — electrogenic, creates membrane potential','GLUT4 translocation to the plasma membrane is the primary mechanism of insulin-stimulated glucose uptake','Cystic fibrosis: defective CFTR Cl- channel causes thick mucus in lungs','Cardiac glycosides (digoxin, ouabain) inhibit Na+/K+-ATPase — used to treat heart failure'],highlight:{label:'Pharmacology',text:'Ion channels are among the most important drug targets. Local anesthetics block voltage-gated Na+ channels; benzodiazepines potentiate GABA-A Cl- channels; sulfonylureas close K-ATP channels in pancreatic beta cells to stimulate insulin secretion.'},pdbStructures:[{pdb:'1BL8',name:'KcsA K+ Channel',desc:'Potassium channel with selectivity filter',color:'#3b82f6'},{pdb:'2ZXE',name:'Na+/K+ ATPase',desc:'Sodium-potassium pump',color:'#ef4444'},{pdb:'4PYP',name:'GLUT1',desc:'Glucose transporter',color:'#f59e0b'}],viewerType:'membrane_viewer',membraneKey:'transport'},
